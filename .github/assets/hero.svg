<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-label="OP13 GKI Kernel banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0f"/>
      <stop offset="0.55" stop-color="#101427"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>

    <radialGradient id="glowA" cx="25%" cy="40%" r="60%">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="70%" cy="35%" r="65%">
      <stop offset="0" stop-color="#34C759" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#34C759" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b23" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#111118" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glowA)" filter="url(#blur)"/>
  <rect width="1600" height="420" fill="url(#glowB)" filter="url(#blur)"/>

  <!-- Subtle grid -->
  <g opacity="0.12">
    <path d="M0 90 H1600" stroke="#ffffff" stroke-width="1"/>
    <path d="M0 170 H1600" stroke="#ffffff" stroke-width="1"/>
    <path d="M0 250 H1600" stroke="#ffffff" stroke-width="1"/>
    <path d="M0 330 H1600" stroke="#ffffff" stroke-width="1"/>
    <path d="M240 0 V420" stroke="#ffffff" stroke-width="1"/>
    <path d="M520 0 V420" stroke="#ffffff" stroke-width="1"/>
    <path d="M800 0 V420" stroke="#ffffff" stroke-width="1"/>
    <path d="M1080 0 V420" stroke="#ffffff" stroke-width="1"/>
    <path d="M1360 0 V420" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Foreground card -->
  <g filter="url(#shadow)">
    <rect x="80" y="64" width="1440" height="292" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)"/>
  </g>

  <!-- Title -->
  <text x="140" y="160" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="56" font-weight="700" letter-spacing="-0.8">
    OP13 GKI Kernel
  </text>

  <!-- Subtitle -->
  <text x="140" y="205" fill="rgba(255,255,255,0.78)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="20" font-weight="500">
    KernelSU-Next • SukiSU Ultra • SUSFS • LZ4 ZRAM — daily-driver stability with optional performance goodies
  </text>

  <!-- Chips -->
  <g>
    <rect x="140" y="244" width="210" height="44" rx="22" fill="url(#chip)" stroke="rgba(255,255,255,0.10)"/>
    <text x="160" y="272" fill="rgba(255,255,255,0.92)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" font-weight="600">
      OnePlus 13 (PJZ110)
    </text>

    <rect x="368" y="244" width="170" height="44" rx="22" fill="url(#chip)" stroke="rgba(255,255,255,0.10)"/>
    <text x="388" y="272" fill="rgba(255,255,255,0.92)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" font-weight="600">
      Linux 6.6 • GKI 2.0
    </text>

    <rect x="556" y="244" width="160" height="44" rx="22" fill="url(#chip)" stroke="rgba(255,255,255,0.10)"/>
    <text x="576" y="272" fill="rgba(255,255,255,0.92)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" font-weight="600">
      Android 15 / 16
    </text>

    <rect x="734" y="244" width="160" height="44" rx="22" fill="url(#chip)" stroke="rgba(255,255,255,0.10)"/>
    <text x="754" y="272" fill="rgba(255,255,255,0.92)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" font-weight="600">
      Balanced defaults
    </text>

    <rect x="912" y="244" width="205" height="44" rx="22" fill="url(#chip)" stroke="rgba(255,255,255,0.10)"/>
    <text x="932" y="272" fill="rgba(255,255,255,0.92)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="16" font-weight="600">
      Optional: ZRAM • SUSFS
    </text>
  </g>

  <!-- Accent dots -->
  <circle cx="1420" cy="134" r="9" fill="#0A84FF" opacity="0.95"/>
  <circle cx="1450" cy="134" r="9" fill="#34C759" opacity="0.95"/>
  <circle cx="1480" cy="134" r="9" fill="#ffffff" opacity="0.55"/>
</svg>
