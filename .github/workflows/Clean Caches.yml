name: Clean Caches

# Manually purge all ccache-* GitHub Actions caches for this repo and reset the
# runner scratch space. Use this when you suspect cache contamination across the
# SukiSU Ultra / ReSukiSU build lanes. (KSUN lane deprecated -- see docs/deprecated/)

on:
  workflow_dispatch:
    inputs:
      key_prefix:
        description: "Only delete caches whose key starts with this prefix."
        required: false
        type: string
        default: "ccache-"

permissions:
  actions: write
  contents: read

jobs:
  clean-caches:
    runs-on: ubuntu-latest
    steps:
      - name: "Delete matching Actions caches"
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prefix = process.env.KEY_PREFIX || 'ccache-';
            let deleted = 0;
            // Paginate through every cache so large repos are fully covered.
            const caches = await github.paginate(
              github.rest.actions.getActionsCacheList,
              { owner, repo, per_page: 100 }
            );
            for (const cache of caches) {
              if (cache.key.startsWith(prefix)) {
                core.info(`Deleting cache: ${cache.key} (id=${cache.id})`);
                await github.rest.actions.deleteActionsCacheById({
                  owner, repo, cache_id: cache.id,
                });
                deleted++;
              }
            }
            core.notice(`Deleted ${deleted} cache(s) with prefix "${prefix}".`);
        env:
          KEY_PREFIX: ${{ inputs.key_prefix }}

      - name: "Reset runner scratch space"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/.ccache"/* 2>/dev/null || true
          sudo apt-get clean || true
          sudo journalctl --vacuum-time=1s || true
          sudo rm -rf /var/log/* 2>/dev/null || true
          docker system prune -af || true
          sudo rm -rf /tmp/* 2>/dev/null || true
          echo "Runner environment reset. Free space:"
          df -h
