name: OP13 KSUN

permissions:
  contents: read
  actions: read

concurrency:
  group: op13-ksun-susfs-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVICE_MODEL: OP13
  DEVICE_CODENAME: sun
  TARGET_OS: OOS16
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  EXPECTED_UTS: "6.6.89-android15-8-g7e1f3c083cc6-abogki467167594-4k"
  STOCK_UNAME_SUFFIX: "8-g7e1f3c083cc6-abogki467167594-4k"
  DEFAULT_KSUN_REF: "551ad80473f60e052917aec08abf5323b6ab2f7c"
  DEFAULT_SUSFS_REF: "85bcfac5edc8ba7808581e8d0a3ca9c7deca78e4"
  WILD_ENGINE_REF: "14d04c1ed0753280330ccabd773e903f76c9a038"

on:
  workflow_dispatch:
    inputs:
      feature_profile:
        description: "Profile: wild_match = closest known-good KSUN release, battery_daily = safer daily, advanced_daily = battery + Droidspaces, minimal_debug = smallest test"
        type: choice
        required: true
        default: wild_match
        options:
          - wild_match
          - battery_daily
          - advanced_daily
          - minimal_debug
      ksun_ref:
        description: "KernelSU Next ref/commit. Default matches the known-good OP13/OOS16 release family."
        type: string
        required: false
        default: "551ad80473f60e052917aec08abf5323b6ab2f7c"
      susfs:
        description: "Enable SUSFS. Keep On for MS Authenticator + root hiding tests."
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      susfs_ref:
        description: "SUSFS ref/commit. Default is android15-6.6 SUSFS v2.1.0 release-family commit."
        type: string
        required: false
        default: "85bcfac5edc8ba7808581e8d0a3ca9c7deca78e4"
      optimize_level:
        description: "Compiler optimisation. O2 is safer for daily use; O3 is testing only."
        type: choice
        required: true
        default: O2
        options:
          - O2
          - O3
      BUILD_TIME:
        description: "Build timestamp. Use F for current UTC time, blank for build-engine default, or paste stock-like timestamp."
        type: string
        required: false
        default: "F"
      hmbird:
        description: "HMBIRD/Fengchi. Auto follows selected profile."
        type: choice
        required: true
        default: Auto
        options:
          - Auto
          - "On"
          - "Off"
      droidspaces:
        description: "Droidspaces. Auto follows selected profile."
        type: choice
        required: true
        default: Auto
        options:
          - Auto
          - "On"
          - "Off"
      bbr:
        description: "BBR TCP congestion control"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      bbg:
        description: "Baseband Guard"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      ttl_ipset:
        description: "TTL target + IP_SET + IPv6 NAT support"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      unicode_fix:
        description: "Unicode path bypass fix"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      ntsync:
        description: "NTSYNC support"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      clean_build:
        description: "Clean build without cache reuse"
        type: boolean
        required: true
        default: false
      debug_artifacts:
        description: "Upload build debug/artifact folders if produced"
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: OP13 KSUN v51 ${{ inputs.feature_profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # -------------------------------------------------------------------------
      # 01. Checkout the complete pinned build engine as the actual workspace
      # -------------------------------------------------------------------------
      - name: Checkout pinned KSUN/SUSFS build engine
        uses: actions/checkout@v4
        with:
          repository: WildKernels/OnePlus_KernelSU_SUSFS
          ref: ${{ env.WILD_ENGINE_REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify complete local build engine tree
        shell: bash
        run: |
          set -euo pipefail
          echo "Workspace: $GITHUB_WORKSPACE"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "${WILD_ENGINE_REF}"
          test -f .github/actions/action.yml
          test -f configs/oos16/OP13.json
          test -f manifests/oos16/oneplus_13_w.xml
          test -d kernel_patches
          test -d .github/actions
          echo "✅ Complete pinned engine tree is present."

      # -------------------------------------------------------------------------
      # 02. Preflight and runner diagnostics
      # -------------------------------------------------------------------------
      - name: Print build context
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner      : $(uname -a)"
          echo "Repository  : ${GITHUB_REPOSITORY}"
          echo "Workflow    : ${GITHUB_WORKFLOW}"
          echo "Run ID      : ${GITHUB_RUN_ID}"
          echo "Engine ref  : ${WILD_ENGINE_REF}"
          echo "Profile     : ${{ inputs.feature_profile }}"
          echo "KSUN ref    : ${{ inputs.ksun_ref }}"
          echo "SUSFS       : ${{ inputs.susfs }} / ${{ inputs.susfs_ref }}"
          echo "Expected UTS: ${EXPECTED_UTS}"
          df -hT

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl flex git \
            jq kmod libelf-dev libssl-dev lld make openssl python3 unzip zip

      # -------------------------------------------------------------------------
      # 03. Resolve profile, timestamp, and OP13 configuration
      # -------------------------------------------------------------------------
      - name: Resolve build timestamp
        id: timestamp
        shell: bash
        run: |
          set -euo pipefail
          input='${{ inputs.BUILD_TIME }}'
          if [[ -z "$input" ]]; then
            resolved=""
          elif [[ "$input" == "F" || "$input" == "f" ]]; then
            resolved="$(LC_ALL=C date -u '+%a %b %e %T UTC %Y')"
          else
            resolved="$input"
          fi
          echo "value=$resolved" >> "$GITHUB_OUTPUT"
          echo "Build timestamp resolved: ${resolved:-build-engine default}"

      - name: Resolve feature matrix and config JSON
        id: config
        shell: bash
        run: |
          set -euo pipefail

          bool_on() { [[ "$1" == "On" ]] && echo true || echo false; }

          profile='${{ inputs.feature_profile }}'
          case "$profile" in
            wild_match)
              default_hmbird=true
              default_ds=true
              ;;
            advanced_daily)
              default_hmbird=false
              default_ds=true
              ;;
            battery_daily|minimal_debug)
              default_hmbird=false
              default_ds=false
              ;;
            *)
              echo "::error::Unknown profile: $profile"
              exit 1
              ;;
          esac

          case '${{ inputs.hmbird }}' in
            Auto) hmbird="$default_hmbird" ;;
            On) hmbird=true ;;
            Off) hmbird=false ;;
          esac

          case '${{ inputs.droidspaces }}' in
            Auto) ds="$default_ds" ;;
            On) ds=true ;;
            Off) ds=false ;;
          esac

          susfs=$(bool_on '${{ inputs.susfs }}')
          bbr=$(bool_on '${{ inputs.bbr }}')
          bbg=$(bool_on '${{ inputs.bbg }}')
          ttl_ipset=$(bool_on '${{ inputs.ttl_ipset }}')
          unicode=$(bool_on '${{ inputs.unicode_fix }}')
          ntsync=$(bool_on '${{ inputs.ntsync }}')

          if [[ "$profile" == "minimal_debug" ]]; then
            hmbird=false
            ds=false
          fi

          susfs_ref='${{ inputs.susfs_ref }}'
          if [[ "$susfs" != "true" ]]; then
            susfs_ref=""
          fi

          jq -n -c \
            --arg model "OP13" \
            --arg soc "sun" \
            --arg branch "wild/sm8750" \
            --arg manifest "oneplus_13_w.xml" \
            --arg android_version "android15" \
            --arg kernel_version "6.6" \
            --arg os_version "OOS16" \
            --arg lto "thin" \
            --arg zyc_compiler "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240723-release/Clang-19.0.0git-20240723.tar.gz" \
            --arg c_compiler "kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin" \
            --arg rust_compiler "" \
            --arg bindgen "" \
            --arg uname "${STOCK_UNAME_SUFFIX}" \
            --argjson rust_build false \
            --argjson disk_cleanup false \
            --argjson hmbird "$hmbird" \
            --argjson susfs "$susfs" \
            --argjson ds "$ds" \
            --argjson bbg "$bbg" \
            --argjson bbr "$bbr" \
            --argjson ttl "$ttl_ipset" \
            --argjson ip_set "$ttl_ipset" \
            --argjson unicode "$unicode" \
            --argjson ntsync "$ntsync" \
            '{model:$model,soc:$soc,branch:$branch,manifest:$manifest,android_version:$android_version,kernel_version:$kernel_version,os_version:$os_version,lto:$lto,zyc_compiler:$zyc_compiler,c_compiler:$c_compiler,rust_compiler:$rust_compiler,bindgen:$bindgen,rust_build:$rust_build,disk_cleanup:$disk_cleanup,hmbird:$hmbird,susfs:$susfs,ds:$ds,bbg:$bbg,bbr:$bbr,ttl:$ttl,ip_set:$ip_set,unicode:$unicode,ntsync:$ntsync,uname:$uname}' \
            > /tmp/op13_config.json

          echo "Resolved OP13 config:"
          jq . /tmp/op13_config.json

          {
            echo 'json<<JSON'
            cat /tmp/op13_config.json
            echo 'JSON'
            echo "susfs_ref=$susfs_ref"
            echo "hmbird=$hmbird"
            echo "ds=$ds"
            echo "susfs=$susfs"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## OP13 KSUN SUSFS v51 Build Matrix"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Profile | $profile |"
            echo "| Engine ref | ${WILD_ENGINE_REF} |"
            echo "| KSUN ref | ${{ inputs.ksun_ref }} |"
            echo "| SUSFS | $susfs |"
            echo "| SUSFS ref | ${susfs_ref:-disabled} |"
            echo "| HMBIRD | $hmbird |"
            echo "| Droidspaces | $ds |"
            echo "| BBR | $bbr |"
            echo "| BBG | $bbg |"
            echo "| TTL/IP_SET | $ttl_ipset |"
            echo "| Unicode | $unicode |"
            echo "| NTSYNC | $ntsync |"
            echo "| Expected UTS | ${EXPECTED_UTS} |"
            echo "| Build timestamp | ${{ steps.timestamp.outputs.value || 'build-engine default' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------------------------
      # 04. Build using the pinned local composite action and its matching resources
      # -------------------------------------------------------------------------
      - name: Build OP13 KSUN SUSFS kernel
        id: build_kernel
        uses: ./.github/actions
        with:
          op_config_json: ${{ steps.config.outputs.json }}
          ksu_type: KSUN
          ksu_branch_or_hash: ${{ inputs.ksun_ref }}
          susfs_commit_hash_or_branch: ${{ steps.config.outputs.susfs_ref }}
          build_timestamp: ${{ steps.timestamp.outputs.value }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}

      # -------------------------------------------------------------------------
      # 05. Post-build discovery, summary, and artifact upload
      # -------------------------------------------------------------------------
      - name: Discover build outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated ZIP files:"
          find "$GITHUB_WORKSPACE" -maxdepth 6 -type f \( -name '*.zip' -o -name '*.sha256' -o -name '*_build_info.txt' -o -name '*_metadata.json' \) -printf '%p %s bytes\n' | sort || true
          echo "Artifacts folder preview:"
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type d -name artifacts -print -exec find {} -maxdepth 2 -type f -printf '%p %s bytes\n' \; || true

      - name: Final build summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## Build Outputs"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| Kernel version | ${{ steps.build_kernel.outputs.kernel_version || 'n/a' }} |"
            echo "| KSU type | ${{ steps.build_kernel.outputs.ksu_type || 'KSUN' }} |"
            echo "| KSU version | ${{ steps.build_kernel.outputs.ksu_version || 'n/a' }} |"
            echo "| SUSFS version | ${{ steps.build_kernel.outputs.susfs_version || 'n/a' }} |"
            echo "| ZIP name | ${{ steps.build_kernel.outputs.zip_name || 'n/a' }} |"
            echo "| ZIP SHA256 | ${{ steps.build_kernel.outputs.zip_sha256 || 'n/a' }} |"
            echo "| Image SHA256 | ${{ steps.build_kernel.outputs.image_sha256 || 'n/a' }} |"
            echo "| Warnings | ${{ steps.build_kernel.outputs.warnings || 'n/a' }} |"
            echo "| Build time | ${{ steps.build_kernel.outputs.build_time || 'n/a' }} seconds |"
            echo "| ccache hit rate | ${{ steps.build_kernel.outputs.ccache_hit_rate || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OP13 KSUN build artifacts
        if: always() && inputs.debug_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OP13_KSUN_SUSFS_v51_${{ inputs.feature_profile }}_${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            OP13/artifacts/**
            AnyKernel3/*.zip
            **/*OP13*.zip
            **/*.sha256
            **/*_metadata.json
            **/*_build_info.txt
