name: OP13 KSUN

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      feature_profile:
        description: 'Feature profile'
        required: true
        type: choice
        options:
          - wild_match
          - battery_daily
          - advanced_daily
          - minimal_debug
        default: wild_match
      ksun_ref:
        description: 'KernelSU-Next ref. First test should stay pinned to known working 33129 commit.'
        required: true
        default: '551ad80473f60e052917aec08abf5323b6ab2f7c'
      susfs:
        description: 'Enable SUSFS'
        required: true
        type: choice
        options: ['On', 'Off']
        default: 'On'
      susfs_ref:
        description: 'SUSFS ref for android15-6.6. First test should stay pinned to v2.1.0-r2 mapping.'
        required: false
        default: '85bcfac5edc8ba7808581e8d0a3ca9c7deca78e4'
      optimize_level:
        description: 'Compiler optimisation level'
        required: true
        type: choice
        options: ['O2', 'O3']
        default: 'O2'
      hmbird:
        description: 'HMBIRD/SCX scheduler'
        required: true
        type: choice
        options: ['Auto', 'On', 'Off']
        default: 'Auto'
      droidspaces:
        description: 'Droidspaces support'
        required: true
        type: choice
        options: ['Auto', 'On', 'Off']
        default: 'Auto'
      bbr:
        description: 'Enable BBR'
        required: true
        type: choice
        options: ['On', 'Off']
        default: 'On'
      bbg:
        description: 'Enable Baseband Guard'
        required: true
        type: choice
        options: ['On', 'Off']
        default: 'On'
      ttl_ipset:
        description: 'Enable TTL + IP_SET'
        required: true
        type: choice
        options: ['On', 'Off']
        default: 'On'
      unicode_fix:
        description: 'Enable Unicode fix'
        required: true
        type: choice
        options: ['On', 'Off']
        default: 'On'
      ntsync:
        description: 'Enable NTSync'
        required: true
        type: choice
        options: ['On', 'Off']
        default: 'On'
      stock_mimic:
        description: 'Use stock-like OP13 UTS suffix'
        required: true
        type: choice
        options: ['On', 'Off']
        default: 'On'
      BUILD_TIME:
        description: 'Kernel build timestamp. Use F for current UTC time.'
        required: false
        default: 'F'
      clean_build:
        description: 'Clean build without ccache'
        required: true
        type: boolean
        default: false
      debug_artifacts:
        description: 'Upload debug artifacts when available'
        required: true
        type: boolean
        default: true

concurrency:
  group: op13-ksun-susfs-v58-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVICE_MODEL: OP13
  DEVICE_CODENAME: sun
  TARGET_OS: OOS16
  ANDROID_VERSION: android15
  KERNEL_VERSION: '6.6'
  EXPECTED_UTS: '6.6.89-android15-8-g7e1f3c083cc6-abogki467167594-4k'
  STOCK_UNAME_SUFFIX: '8-g7e1f3c083cc6-abogki467167594-4k'
  WILD_ENGINE_REPO: WildKernels/OnePlus_KernelSU_SUSFS
  WILD_ENGINE_REF: '14d04c1ed0753280330ccabd773e903f76c9a038'
  # This is the missing part from previous broken wrappers:
  # old Wild action clones kernel_patches live from main, which drifted after v2.1.0-r2.
  # Pinning this restores the patchset used for KSUN 33129 + SUSFS v2.1.0.
  WILD_KERNEL_PATCHES_REF: '6ac23b65150f5f505018403361779fa7a8a728b0'
  DEFAULT_KSUN_REF: '551ad80473f60e052917aec08abf5323b6ab2f7c'
  DEFAULT_SUSFS_REF: '85bcfac5edc8ba7808581e8d0a3ca9c7deca78e4'

jobs:
  build:
    name: OP13 OOS16 KSUN SUSFS stable daily
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 01 Checkout pinned Wild engine and resources
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WILD_ENGINE_REPO }}
          ref: ${{ env.WILD_ENGINE_REF }}
          fetch-depth: 1

      - name: 02 Preflight and explain pinned stack
        shell: bash
        run: |
          set -euo pipefail
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Wild engine commit: $(git rev-parse HEAD)"
          echo "Pinned kernel_patches ref: $WILD_KERNEL_PATCHES_REF"
          test -f .github/actions/action.yml
          test -f configs/oos16/OP13.json
          test -f manifests/oos16/oneplus_13_w.xml
          echo "== Top level =="
          find . -maxdepth 2 -type d | sort | sed 's#^./#  #' | head -80

      - name: 03 Patch Wild engine to use the matching v2.1.0-r2 kernel_patches tree
        shell: bash
        run: |
          set -euo pipefail
          ACTION_FILE='.github/actions/action.yml'
          echo "Before patch, kernel_patches clone lines:"
          grep -nE 'kernel_patches|TheWildJames/kernel_patches|WildKernels/kernel_patches' "$ACTION_FILE" || true

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/actions/action.yml')
          s = p.read_text()
          old = 'retry_clone "https://github.com/TheWildJames/kernel_patches.git"'
          new = '''retry_clone "https://github.com/WildKernels/kernel_patches.git" "main" 0
                    (
                      cd kernel_patches
                      git fetch --no-tags --depth=1 origin 6ac23b65150f5f505018403361779fa7a8a728b0
                      git checkout --force 6ac23b65150f5f505018403361779fa7a8a728b0
                      echo "✅ kernel_patches pinned to $(git rev-parse HEAD)"
                    )'''
          if old not in s:
              raise SystemExit('Could not find kernel_patches clone line to patch. Action layout changed.')
          s = s.replace(old, new)
          p.write_text(s)
          PY

          echo "After patch, kernel_patches clone lines:"
          grep -nE 'kernel_patches|TheWildJames/kernel_patches|WildKernels/kernel_patches|6ac23b6' "$ACTION_FILE" || true

      - name: 04 Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev
          sudo apt-get clean

      - name: 05 Resolve build timestamp
        id: time
        shell: bash
        run: |
          set -euo pipefail
          IN='${{ inputs.BUILD_TIME }}'
          if [ -z "$IN" ]; then
            OUT=''
          elif [ "$IN" = 'F' ]; then
            OUT="$(date -u '+%a %b %d %H:%M:%S UTC %Y')"
          else
            OUT="$IN"
          fi
          echo "build_time=$OUT" >> "$GITHUB_OUTPUT"
          echo "Resolved BUILD_TIME: ${OUT:-<engine default>}"

      - name: 06 Prepare OP13 config JSON
        id: config
        shell: bash
        env:
          PROFILE: ${{ inputs.feature_profile }}
          SUSFS_IN: ${{ inputs.susfs }}
          HMBIRD_IN: ${{ inputs.hmbird }}
          DS_IN: ${{ inputs.droidspaces }}
          BBR_IN: ${{ inputs.bbr }}
          BBG_IN: ${{ inputs.bbg }}
          TTL_IN: ${{ inputs.ttl_ipset }}
          UNICODE_IN: ${{ inputs.unicode_fix }}
          NTSYNC_IN: ${{ inputs.ntsync }}
          STOCK_IN: ${{ inputs.stock_mimic }}
        run: |
          set -euo pipefail
          base='configs/oos16/OP13.json'
          test -f "$base"

          profile_hmbird=false
          profile_ds=false
          case "$PROFILE" in
            wild_match|advanced_daily) profile_hmbird=true; profile_ds=true ;;
            battery_daily|minimal_debug) profile_hmbird=false; profile_ds=false ;;
            *) echo "::error::Unknown profile: $PROFILE"; exit 1 ;;
          esac

          choose_bool() {
            local value="$1"
            local auto_default="$2"
            case "$value" in
              On) echo true ;;
              Off) echo false ;;
              Auto) echo "$auto_default" ;;
              *) echo "::error::Bad boolean choice: $value"; exit 1 ;;
            esac
          }

          hmbird_bool="$(choose_bool "$HMBIRD_IN" "$profile_hmbird")"
          ds_bool="$(choose_bool "$DS_IN" "$profile_ds")"
          susfs_bool="$(choose_bool "$SUSFS_IN" true)"
          bbr_bool="$(choose_bool "$BBR_IN" true)"
          bbg_bool="$(choose_bool "$BBG_IN" true)"
          ttl_bool="$(choose_bool "$TTL_IN" true)"
          unicode_bool="$(choose_bool "$UNICODE_IN" true)"
          ntsync_bool="$(choose_bool "$NTSYNC_IN" true)"

          if [ "$STOCK_IN" = 'On' ]; then
            uname_suffix="$STOCK_UNAME_SUFFIX"
          else
            uname_suffix='ox1d3x3-ksun'
          fi

          jq -c \
            --argjson hmbird "$hmbird_bool" \
            --argjson ds "$ds_bool" \
            --argjson susfs "$susfs_bool" \
            --argjson bbr "$bbr_bool" \
            --argjson bbg "$bbg_bool" \
            --argjson ttl "$ttl_bool" \
            --argjson ipset "$ttl_bool" \
            --argjson unicode "$unicode_bool" \
            --argjson ntsync "$ntsync_bool" \
            --arg uname "$uname_suffix" \
            '.hmbird=$hmbird | .ds=$ds | .susfs=$susfs | .bbr=$bbr | .bbg=$bbg | .ttl=$ttl | .ip_set=$ipset | .unicode=$unicode | .ntsync=$ntsync | .uname=$uname' \
            "$base" > /tmp/op13_config.json

          echo "Prepared config:"
          jq '.' /tmp/op13_config.json
          echo "config_json=$(cat /tmp/op13_config.json)" >> "$GITHUB_OUTPUT"

      - name: 07 Build OP13 KSUN + SUSFS
        id: build
        uses: ./.github/actions
        with:
          op_config_json: ${{ steps.config.outputs.config_json }}
          ksu_type: KSUN
          ksu_branch_or_hash: ${{ inputs.ksun_ref }}
          susfs_commit_hash_or_branch: ${{ inputs.susfs_ref }}
          optimize_level: ${{ inputs.optimize_level }}
          build_timestamp: ${{ steps.time.outputs.build_time }}
          clean: ${{ inputs.clean_build }}

      - name: 08 Verify output and collect artifact list
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Build outcome: ${{ steps.build.outcome }}"
          echo "Engine kernel_version output: ${{ steps.build.outputs.kernel_version }}"
          echo "KSU version output: ${{ steps.build.outputs.ksu_version }}"
          echo "SUSFS version output: ${{ steps.build.outputs.susfs_version }}"
          echo "ZIP name output: ${{ steps.build.outputs.zip_name }}"
          echo "\nArtifact tree preview:"
          find . -maxdepth 7 \( -name '*.zip' -o -name 'Image' -o -name '*.log' -o -name '*.txt' -o -name 'utsrelease.h' \) -printf '%p %s bytes\n' | sort | tail -160 || true

          # IMPORTANT:
          # The Wild composite action output named `kernel_version` is the source family
          # string such as android15-6.6.89. It is NOT the final Linux UTS_RELEASE.
          # Previous v57 incorrectly compared that output with EXPECTED_UTS and failed
          # even though the kernel and AK3 zip were created successfully.
          actual_uts=""
          uts_file=""
          candidates=(
            "OP13/kernel_platform/common/out/include/generated/utsrelease.h"
            "OP13/kernel_platform/common/out/include/generated/compile.h"
            "OP13/kernel_platform/common/include/generated/utsrelease.h"
          )
          for candidate in "${candidates[@]}"; do
            if [ -f "$candidate" ]; then
              uts_file="$candidate"
              break
            fi
          done

          if [ -z "$uts_file" ]; then
            uts_file="$(find OP13/kernel_platform/common -path '*/include/generated/utsrelease.h' -print -quit 2>/dev/null || true)"
          fi

          if [ -n "$uts_file" ] && [ -f "$uts_file" ]; then
            echo "Found UTS file: $uts_file"
            cat "$uts_file" || true
            actual_uts="$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' "$uts_file" | head -n1)"
          fi

          echo "Actual UTS_RELEASE: ${actual_uts:-<not found>}"
          echo "Expected stock UTS: $EXPECTED_UTS"

          if [ '${{ inputs.stock_mimic }}' = 'On' ] && [ '${{ steps.build.outcome }}' = 'success' ]; then
            if [ -n "$actual_uts" ]; then
              if [ "$actual_uts" != "$EXPECTED_UTS" ]; then
                echo "::warning::Actual UTS_RELEASE differs from expected stock mimic. Expected $EXPECTED_UTS but got $actual_uts"
              else
                echo "✅ UTS_RELEASE matches stock mimic target."
              fi
            else
              echo "::warning::Could not locate generated utsrelease.h. Not failing because the Wild action kernel_version output is not UTS_RELEASE."
            fi
          fi

          if [ '${{ steps.build.outcome }}' = 'success' ]; then
            zip_path="$(find OP13/artifacts -maxdepth 1 -type f -name '*.zip' -print -quit 2>/dev/null || true)"
            if [ -z "$zip_path" ]; then
              echo "::error::Build succeeded but no AK3 zip was found under OP13/artifacts."
              exit 1
            fi
            echo "✅ Flashable AK3 zip found: $zip_path"
            sha256sum "$zip_path" | tee "${zip_path}.sha256"
          fi

      - name: 09 Upload kernel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OP13_KSUN_SUSFS_STABLE_DAILY_v58_${{ github.run_number }}
          path: |
            OP13/artifacts/**
            **/*.zip
            **/kernel_build_full.log
            **/*.rej
          if-no-files-found: warn
          retention-days: 14

      - name: 10 Final build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## OP13 KSUN + SUSFS Stable Daily v58'
            echo ''
            echo '| Item | Value |'
            echo '|---|---|'
            echo "| Status | ${{ job.status }} |"
            echo "| Profile | ${{ inputs.feature_profile }} |"
            echo "| KSUN ref | ${{ inputs.ksun_ref }} |"
            echo "| SUSFS ref | ${{ inputs.susfs_ref }} |"
            echo "| Engine | $WILD_ENGINE_REPO@$WILD_ENGINE_REF |"
            echo "| kernel_patches | WildKernels/kernel_patches@$WILD_KERNEL_PATCHES_REF |"
            echo "| Engine kernel_version output | ${{ steps.build.outputs.kernel_version }} |"
            echo "| Expected UTS | $EXPECTED_UTS |"
            echo "| KSUN version | ${{ steps.build.outputs.ksu_version }} |"
            echo "| SUSFS version | ${{ steps.build.outputs.susfs_version }} |"
            echo "| ZIP | ${{ steps.build.outputs.zip_name }} |"
          } >> "$GITHUB_STEP_SUMMARY"
