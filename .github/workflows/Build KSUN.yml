name: OP13 KSUN

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Daily-driver profile. clean_daily is the safest default."
        required: true
        type: choice
        options:
          - clean_daily
          - clean_plus
          - minimal_debug
        default: clean_daily
      ksun_ref:
        description: "CCTV18-compatible KernelSU-Next ref used via pershoot/KernelSU-Next dev-susfs setup path."
        required: true
        type: string
        default: "dev-susfs"
      susfs_enable:
        description: "Enable CCTV18 susfs4oki kernel patching."
        required: true
        type: boolean
        default: true
      susfs_ref:
        description: "CCTV18 susfs4oki branch/ref. Keep oki-android15-6.6 for OP13 android15/6.6."
        required: true
        type: string
        default: "oki-android15-6.6"
      susfs_patch_mode:
        description: "strict fails on any reject; cctv18_compatible permits the known fs/proc/task_mmu.c reject exactly like CCTV18 upstream flow."
        required: true
        type: choice
        options:
          - cctv18_compatible
          - strict
        default: cctv18_compatible
      cctv18_kernel_ref:
        description: "CCTV18 OP13 6.6.89 kernel-source branch/ref."
        required: true
        type: string
        default: "oneplus/sm8750_v_16.0.0_oneplus_13_6.6.89"
      kernel_name:
        description: "LOCALVERSION suffix without leading dash. Use stock-like string if you want stock-like uname -r."
        required: true
        type: string
        default: "android15-8-g7e1f3c083cc6-abogki467167594-4k"
      optimise:
        description: "Kernel optimisation profile. O2 is daily-driver default."
        required: true
        type: choice
        options: ["O2", "O3"]
        default: "O2"
      lz4_zstd:
        description: "Apply CCTV18 lz4/zstd patch if available."
        required: true
        type: boolean
        default: true
      adios:
        description: "Enable CCTV18 ADIOS I/O scheduler patch if available."
        required: true
        type: boolean
        default: true
      baseband_guard:
        description: "Enable CCTV18 Baseband Guard patch if available."
        required: true
        type: boolean
        default: true
      better_net:
        description: "Enable extra netfilter/ipset/iptables features. Off is safest for normal daily use."
        required: true
        type: boolean
        default: false
      bbr:
        description: "Enable BBR TCP congestion controls. Off is safest for normal daily use."
        required: true
        type: boolean
        default: false
      droidspaces:
        description: "Enable Droidspaces/container-related options. Off is safest for normal daily use."
        required: true
        type: boolean
        default: false
      rekernel:
        description: "Enable Re:Kernel related config if available."
        required: true
        type: boolean
        default: false
      clean_ccache:
        description: "Start with a clean ccache directory."
        required: true
        type: boolean
        default: false
      package_ak3:
        description: "Create an AnyKernel3 flashable ZIP as well as raw Image artifact."
        required: true
        type: boolean
        default: true
      debug_artifacts:
        description: "Upload logs, .config, rejects, Image, and ZIP for troubleshooting."
        required: true
        type: boolean
        default: true

concurrency:
  group: op13-ksun-cctv18-clean-v67-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  SUB_VERSION: "89"
  DEVICE_NAME: OP13
  DEVICE_CODENAME: sun
  EXPECTED_BASE_UTS: "6.6.89"
  CCTV18_BUILD_REPO: cctv18/oppo_oplus_realme_sm8750
  CCTV18_COMMON_REPO: cctv18/android_kernel_common_oneplus_sm8750
  CCTV18_TOOLCHAIN_RELEASE: LLVM-Clang18-r510928
  CCACHE_DIR: ${{ github.workspace }}/.ccache_op13_cctv18_clean_6.6.89
  CCACHE_MAXSIZE: 3G

jobs:
  build:
    name: "${{ inputs.profile }} | KSUN=${{ inputs.ksun_ref }} | CCTV18 SUSFS=${{ inputs.susfs_enable }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 01 Checkout current repository for metadata only
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 02 Install host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            aria2 ca-certificates curl wget git unzip zip tar xz-utils zstd rsync file jq \
            build-essential gcc g++ make bc bison flex gawk python3 python-is-python3 \
            libssl-dev libelf-dev libncurses-dev zlib1g-dev liblz4-tool dwarves \
            ccache clang lld llvm patch kmod
          sudo apt-get clean
          echo "Runner: $(uname -a)"
          ccache --version || true

      - name: 03 Fetch clean CCTV18 build assets, OP13 source, Clang18 and build-tools
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kernel_workspace cctv18_assets _ox_debug artifacts
          mkdir -p kernel_workspace _ox_debug artifacts

          echo "Cloning CCTV18 build assets only: https://github.com/${CCTV18_BUILD_REPO}"
          git clone --depth=1 "https://github.com/${CCTV18_BUILD_REPO}.git" cctv18_assets
          git -C cctv18_assets rev-parse HEAD | tee _ox_debug/cctv18_build_assets_commit.txt

          cd kernel_workspace
          echo "Downloading CCTV18 OP13 common kernel source ref: ${{ inputs.cctv18_kernel_ref }}"
          aria2c -s16 -x16 -k1M \
            "https://github.com/${CCTV18_COMMON_REPO}/archive/refs/heads/${{ inputs.cctv18_kernel_ref }}.zip" \
            -o common.zip
          unzip -q common.zip
          src_dir="$(find . -maxdepth 1 -type d -name 'android_kernel_common_oneplus_sm8750-*' -print -quit)"
          if [ -z "$src_dir" ]; then
            echo "::error::Could not locate extracted CCTV18 common kernel directory."
            find . -maxdepth 2 -type d | sort
            exit 1
          fi
          mv "$src_dir" common
          rm -f common.zip

          echo "Downloading CCTV18 LLVM/Clang18 toolchain and build-tools"
          aria2c -s16 -x16 -k1M \
            "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/${CCTV18_TOOLCHAIN_RELEASE}/clang-r510928.zip" \
            -o clang.zip
          unzip -q clang.zip -d clang18
          rm -f clang.zip

          aria2c -s16 -x16 -k1M \
            "https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/${CCTV18_TOOLCHAIN_RELEASE}/build-tools.zip" \
            -o build-tools.zip
          unzip -q build-tools.zip
          rm -f build-tools.zip

          echo "Removing ABI export guard files and dirty suffix noise"
          rm -f common/android/abi_gki_protected_exports_* || true
          for f in common/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            sed -i 's/ -dirty//g' "$f"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$f" || true
          done

          echo "CCTV18 clean source layout:" | tee ../_ox_debug/source-tree.txt
          find . -maxdepth 2 -type d | sort | tee -a ../_ox_debug/source-tree.txt

      - name: 04 Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.clean_ccache }}" = "true" ]; then
            rm -rf "$CCACHE_DIR"
          fi
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -o compression=true
          ccache -z || true
          ccache -s || true

      - name: 05 Add KernelSU-Next using CCTV18-compatible dev-susfs path
        id: ksun
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace
          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang18/bin:$GITHUB_WORKSPACE/kernel_workspace/build-tools/path/linux-x86:$PATH"

          echo "Using CCTV18-compatible KernelSU-Next setup path: pershoot/KernelSU-Next dev-susfs"
          echo "Requested KSUN ref/arg: ${{ inputs.ksun_ref }}"
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/refs/heads/dev-susfs/kernel/setup.sh" | bash -s "${{ inputs.ksun_ref }}"

          if [ -d KernelSU-Next ]; then
            KSU_TREE="KernelSU-Next"
          elif [ -d common/KernelSU-Next ]; then
            KSU_TREE="common/KernelSU-Next"
          elif [ -d common/drivers/kernelsu ]; then
            KSU_TREE="common/drivers/kernelsu"
          else
            echo "::error::KernelSU-Next tree was not found after setup."
            find . -maxdepth 4 -type d | sort | sed -n '1,200p'
            exit 1
          fi
          echo "KSU_TREE=$KSU_TREE" | tee -a "$GITHUB_ENV"
          echo "ksu_tree=$KSU_TREE" >> "$GITHUB_OUTPUT"

          if [ -d "$KSU_TREE/.git" ]; then
            echo "KSUN commit: $(git -C "$KSU_TREE" rev-parse HEAD)"
            git -C "$KSU_TREE" rev-parse HEAD > ../_ox_debug/ksun_commit.txt || true
          fi

          if [ -f common/drivers/kernelsu/kernel/Kbuild ]; then
            KSU_VERSION=$(expr $(curl -sI "https://api.github.com/repos/pershoot/KernelSU-Next/commits?sha=dev-susfs&per_page=1" | grep -i "link:" | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p') "+" 30000 2>/dev/null || echo 33129)
            KSU_TAG=$(curl -sL "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | grep -o '"name": *"[^"]*"' | head -n 1 | sed 's/"name": "//;s/"//')
            [ -n "$KSU_TAG" ] || KSU_TAG="v3.2.0"
            sed -i "s/KSU_VERSION_FALLBACK := .*/KSU_VERSION_FALLBACK := $KSU_VERSION/g" common/drivers/kernelsu/kernel/Kbuild || true
            sed -i "s/KSU_VERSION_TAG_FALLBACK := .*/KSU_VERSION_TAG_FALLBACK := $KSU_TAG/g" common/drivers/kernelsu/kernel/Kbuild || true
            echo "KSUVER=$KSU_VERSION" >> "$GITHUB_ENV"
            echo "KSUTAG=$KSU_TAG" >> "$GITHUB_ENV"
            echo "ksuver=$KSU_VERSION" >> "$GITHUB_OUTPUT"
            echo "ksutag=$KSU_TAG" >> "$GITHUB_OUTPUT"
          fi

          # CCTV18's own workflow applies its local APK signature patch for KernelSU-Next manager compatibility.
          if [ -f "$GITHUB_WORKSPACE/cctv18_assets/other_patch/apk_sign.patch" ] && [ -d common/drivers/kernelsu ]; then
            echo "Applying CCTV18 apk_sign.patch from cctv18/oppo_oplus_realme_sm8750 only"
            ( cd common/drivers/kernelsu && patch -p2 -N -F 3 < "$GITHUB_WORKSPACE/cctv18_assets/other_patch/apk_sign.patch" ) || true
          fi

      - name: 06 Apply CCTV18-only SUSFS kernel integration
        if: ${{ inputs.susfs_enable == true }}
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace
          rm -rf susfs4ksu
          echo "Cloning CCTV18 SUSFS only: cctv18/susfs4oki @ ${{ inputs.susfs_ref }}"
          git clone --depth=1 --branch "${{ inputs.susfs_ref }}" https://github.com/cctv18/susfs4oki.git susfs4ksu
          git -C susfs4ksu rev-parse HEAD | tee ../_ox_debug/cctv18_susfs_commit.txt

          SUSFS_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch"
          if [ ! -f "$SUSFS_PATCH" ]; then
            echo "::error::CCTV18 SUSFS common patch not found: $SUSFS_PATCH"
            find susfs4ksu/kernel_patches -maxdepth 2 -type f | sort
            exit 1
          fi
          test -d susfs4ksu/kernel_patches/fs
          test -d susfs4ksu/kernel_patches/include/linux

          cp -af susfs4ksu/kernel_patches/fs/. common/fs/
          cp -af susfs4ksu/kernel_patches/include/linux/. common/include/linux/
          cp -f "$SUSFS_PATCH" common/

          if [ -f "$GITHUB_WORKSPACE/cctv18_assets/other_patch/69_hide_stuff.patch" ]; then
            cp -f "$GITHUB_WORKSPACE/cctv18_assets/other_patch/69_hide_stuff.patch" common/69_hide_stuff.patch
          fi

          cd common
          echo "Applying CCTV18 SUSFS kernel patch"
          set +e
          patch -p1 -N -F 3 < "50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch" 2>&1 | tee "$GITHUB_WORKSPACE/_ox_debug/cctv18-susfs-patch.log"
          susfs_patch_rc=${PIPESTATUS[0]}
          set -e

          if [ "$susfs_patch_rc" -ne 0 ]; then
            echo "CCTV18 SUSFS patch returned rc=$susfs_patch_rc. Checking reject scope..." | tee -a "$GITHUB_WORKSPACE/_ox_debug/cctv18-susfs-patch.log"
            find . -name '*.rej' -print | sort | tee "$GITHUB_WORKSPACE/_ox_debug/patch-rejects-after-susfs.txt"

            reject_count="$(wc -l < "$GITHUB_WORKSPACE/_ox_debug/patch-rejects-after-susfs.txt" | tr -d ' ')"
            only_task_mmu="false"
            if [ "$reject_count" = "1" ] && grep -qx './fs/proc/task_mmu.c.rej' "$GITHUB_WORKSPACE/_ox_debug/patch-rejects-after-susfs.txt"; then
              only_task_mmu="true"
            fi

            if [ "${{ inputs.susfs_patch_mode }}" = "cctv18_compatible" ] && [ "$only_task_mmu" = "true" ]; then
              echo "::warning::Only known CCTV18 fs/proc/task_mmu.c reject found. Continuing in cctv18_compatible mode, without importing any non-CCTV18 SUSFS patch source."
              cp -f ./fs/proc/task_mmu.c.rej "$GITHUB_WORKSPACE/_ox_debug/fs_proc_task_mmu.c.rej" || true
              rm -f ./fs/proc/task_mmu.c.rej
            else
              echo "::error::Unexpected CCTV18 SUSFS patch rejects. strict mode or non-task_mmu reject detected."
              exit 1
            fi
          fi

          if [ -f 69_hide_stuff.patch ]; then
            echo "Applying CCTV18 69_hide_stuff.patch"
            patch -p1 -N -F 3 < 69_hide_stuff.patch || true
          fi

          cd ..
          if find common -name '*.rej' -print -quit | grep -q .; then
            echo "::error::Unexpected patch rejects remain after CCTV18 SUSFS patching."
            find common -name '*.rej' -print | tee ../_ox_debug/patch-rejects.txt
            exit 1
          fi

          echo "SUSFS source check:"
          git -C susfs4ksu remote -v | tee ../_ox_debug/susfs_remote.txt

      - name: 07 Apply CCTV18 optional daily-driver patches when present
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace/common

          apply_patch_if_found() {
            local label="$1"; shift
            local enabled="$1"; shift
            if [ "$enabled" != "true" ]; then
              echo "Skipping $label: disabled"
              return 0
            fi
            local found=""
            for p in "$@"; do
              if [ -f "$p" ]; then
                found="$p"
                break
              fi
            done
            if [ -z "$found" ]; then
              echo "Optional patch not found for $label; skipping cleanly."
              return 0
            fi
            echo "Applying optional CCTV18 patch for $label: $found"
            patch -p1 -N -F 3 < "$found" || true
          }

          apply_patch_if_found "lz4/zstd" "${{ inputs.lz4_zstd }}" \
            "$GITHUB_WORKSPACE/cctv18_assets/other_patch/lz4_zstd_6.6.patch" \
            "$GITHUB_WORKSPACE/cctv18_assets/other_patch/lz4_zstd.patch" \
            "$GITHUB_WORKSPACE/cctv18_assets/zram_patch/lz4_zstd_6.6.patch"

          apply_patch_if_found "ADIOS" "${{ inputs.adios }}" \
            "$GITHUB_WORKSPACE/cctv18_assets/other_patch/adios_6.6.patch" \
            "$GITHUB_WORKSPACE/cctv18_assets/other_patch/adios.patch"

          apply_patch_if_found "Baseband Guard" "${{ inputs.baseband_guard }}" \
            "$GITHUB_WORKSPACE/cctv18_assets/other_patch/baseband_guard_6.6.patch" \
            "$GITHUB_WORKSPACE/cctv18_assets/other_patch/baseband_guard.patch"

          if find . -name '*.rej' -print -quit | grep -q .; then
            echo "::error::Patch rejects found after optional CCTV18 patching."
            find . -name '*.rej' -print | tee "$GITHUB_WORKSPACE/_ox_debug/patch-rejects.txt"
            exit 1
          fi

      - name: 08 Build OP13 clean CCTV18 KSUN kernel
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace/common

          export PATH="$GITHUB_WORKSPACE/kernel_workspace/clang18/bin:$GITHUB_WORKSPACE/kernel_workspace/build-tools/path/linux-x86:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CC="ccache clang"
          export HOSTCC=gcc
          export HOSTCXX=g++
          export KBUILD_BUILD_USER="ox1d3x3"
          export KBUILD_BUILD_HOST="cctv18-clean"
          export KBUILD_BUILD_TIMESTAMP="$(date -u '+%a %b %d %H:%M:%S UTC %Y')"
          export CCACHE_DIR="$CCACHE_DIR"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE/kernel_workspace"
          export CCACHE_NOHASHDIR=true
          export CCACHE_COMPILERCHECK=none

          echo "Toolchain check:"
          which clang || true
          clang --version | head -5 || true

          echo "Generating gki_defconfig"
          make O=out LLVM=1 LLVM_IAS=1 ARCH=arm64 gki_defconfig

          cfg="out/.config"
          if [ ! -f "$cfg" ]; then
            echo "::error::Missing generated .config"
            exit 1
          fi

          cfg_sym() { local s="$1"; echo "${s#CONFIG_}"; }
          set_cfg_y() { scripts/config --file "$cfg" -e "$(cfg_sym "$1")" || true; }
          set_cfg_n() { scripts/config --file "$cfg" -d "$(cfg_sym "$1")" || true; }
          set_cfg_str() { scripts/config --file "$cfg" --set-str "$(cfg_sym "$1")" "$2" || true; }

          echo "Applying clean daily-driver config"
          set_cfg_y CONFIG_KSU
          if [ "${{ inputs.susfs_enable }}" = "true" ]; then
            set_cfg_y CONFIG_KSU_SUSFS
            set_cfg_y CONFIG_KSU_SUSFS_SUS_PATH
            set_cfg_y CONFIG_KSU_SUSFS_SUS_MOUNT
            set_cfg_y CONFIG_KSU_SUSFS_SUS_KSTAT
            set_cfg_y CONFIG_KSU_SUSFS_SPOOF_UNAME
            set_cfg_y CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            set_cfg_y CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
            set_cfg_y CONFIG_KSU_SUSFS_OPEN_REDIRECT
            set_cfg_y CONFIG_KSU_SUSFS_SUS_MAP
            set_cfg_n CONFIG_KSU_SUSFS_ENABLE_LOG
          fi

          set_cfg_str CONFIG_LOCALVERSION "-${{ inputs.kernel_name }}"
          set_cfg_n CONFIG_LOCALVERSION_AUTO
          set_cfg_y CONFIG_LTO_CLANG_THIN
          set_cfg_n CONFIG_LTO_NONE

          case "${{ inputs.optimise }}" in
            O2)
              set_cfg_y CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE
              set_cfg_n CONFIG_CC_OPTIMIZE_FOR_SIZE
              ;;
            O3)
              set_cfg_y CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 || true
              ;;
          esac

          if [ "${{ inputs.bbr }}" = "true" ]; then
            set_cfg_y CONFIG_TCP_CONG_BBR
            set_cfg_y CONFIG_DEFAULT_BBR || true
          fi
          if [ "${{ inputs.better_net }}" = "true" ]; then
            set_cfg_y CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
            set_cfg_y CONFIG_NETFILTER_XT_MATCH_COMMENT
            set_cfg_y CONFIG_NETFILTER_XT_MATCH_CONNTRACK
            set_cfg_y CONFIG_NETFILTER_XT_TARGET_MARK
            set_cfg_y CONFIG_IP_SET
            set_cfg_y CONFIG_IP_SET_HASH_IP
            set_cfg_y CONFIG_IP_SET_HASH_NET
            set_cfg_y CONFIG_NETFILTER_XT_MATCH_SET
            set_cfg_y CONFIG_NETFILTER_XT_TARGET_TTL
            set_cfg_y CONFIG_NETFILTER_XT_MATCH_TTL
          fi
          if [ "${{ inputs.droidspaces }}" = "true" ]; then
            set_cfg_y CONFIG_NTSYNC || true
            set_cfg_y CONFIG_TMPFS_XATTR || true
            set_cfg_y CONFIG_TMPFS_POSIX_ACL || true
          fi
          if [ "${{ inputs.profile }}" = "minimal_debug" ]; then
            set_cfg_n CONFIG_TCP_CONG_BBR
            set_cfg_n CONFIG_IP_SET
            set_cfg_n CONFIG_NTSYNC
          fi

          yes "" | make O=out LLVM=1 LLVM_IAS=1 ARCH=arm64 olddefconfig
          cp -f out/.config "$GITHUB_WORKSPACE/_ox_debug/final.config"

          echo "KSU/SUSFS final config scan:"
          grep -E 'CONFIG_KSU|CONFIG_LOCALVERSION|CONFIG_TCP_CONG_BBR|CONFIG_IP_SET|CONFIG_NTSYNC|CONFIG_LTO' out/.config | tee "$GITHUB_WORKSPACE/_ox_debug/config-scan.txt" || true

          echo "Building Image"
          make -j"$(nproc --all)" O=out LLVM=1 LLVM_IAS=1 ARCH=arm64 Image

          image="out/arch/arm64/boot/Image"
          if [ ! -s "$image" ]; then
            echo "::error::Kernel Image was not produced."
            find out -maxdepth 5 -type f -name 'Image*' -printf '%p %s bytes\n' || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -f "$image" "$GITHUB_WORKSPACE/artifacts/Image_OP13_KSUN_CCTV18_clean_v67"
          sha256sum "$GITHUB_WORKSPACE/artifacts/Image_OP13_KSUN_CCTV18_clean_v67" | tee "$GITHUB_WORKSPACE/artifacts/Image_OP13_KSUN_CCTV18_clean_v67.sha256"

          uts="unknown"
          if [ -f out/include/generated/utsrelease.h ]; then
            cp -f out/include/generated/utsrelease.h "$GITHUB_WORKSPACE/_ox_debug/utsrelease.h"
            uts="$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' out/include/generated/utsrelease.h | head -n1)"
          fi
          echo "UTS_RELEASE=$uts" | tee "$GITHUB_WORKSPACE/_ox_debug/uts.txt"
          echo "uts=$uts" >> "$GITHUB_OUTPUT"

          ccache -s | tee "$GITHUB_WORKSPACE/_ox_debug/ccache-final.txt" || true

      - name: 09 Package AnyKernel3 flashable ZIP
        if: ${{ inputs.package_ak3 == true }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ak3_work
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3_work
          rm -rf ak3_work/.git ak3_work/.github ak3_work/README.md ak3_work/LICENSE || true
          cp -f artifacts/Image_OP13_KSUN_CCTV18_clean_v67 ak3_work/Image

          if [ -f ak3_work/anykernel.sh ]; then
            sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' ak3_work/anykernel.sh || true
            sed -i 's/^device.name1=.*/device.name1=sun/' ak3_work/anykernel.sh || true
            sed -i 's/^device.name2=.*/device.name2=OP13/' ak3_work/anykernel.sh || true
            sed -i 's/^device.name3=.*/device.name3=OnePlus13/' ak3_work/anykernel.sh || true
            sed -i 's/^device.name4=.*/device.name4=PJZ110/' ak3_work/anykernel.sh || true
            awk 'NR==1 {print; print "ui_print \"\""; print "ui_print \"OX1D3X3 OP13 KSUN + CCTV18 CLEAN SUSFS v67\""; print "ui_print \"SUSFS source: cctv18/susfs4oki only\""; print "ui_print \"No WildKernels SUSFS patch tree mixed\""; print "ui_print \"\""; next} {print}' ak3_work/anykernel.sh > ak3_work/anykernel.sh.new
            mv ak3_work/anykernel.sh.new ak3_work/anykernel.sh
            chmod 0755 ak3_work/anykernel.sh
          fi

          cat > ak3_work/OX_CCTV18_CLEAN_BUILD_INFO.txt <<EOF
          OX1D3X3 OP13 KSUN + CCTV18 CLEAN SUSFS v67
          Device: OnePlus 13 / sun / PJZ110
          Kernel source: cctv18/android_kernel_common_oneplus_sm8750 @ ${{ inputs.cctv18_kernel_ref }}
          Build assets: cctv18/oppo_oplus_realme_sm8750
          Root: KernelSU-Next via pershoot/KernelSU-Next dev-susfs path, ref=${{ inputs.ksun_ref }}
          SUSFS: cctv18/susfs4oki only, ref=${{ inputs.susfs_ref }}
          SUSFS patch mode: ${{ inputs.susfs_patch_mode }}
          WildKernels SUSFS patch tree: NOT USED
          Profile: ${{ inputs.profile }}
          UTS_RELEASE: ${{ steps.build.outputs.uts }}
          Built UTC: $(date -u '+%Y-%m-%d %H:%M:%S')
          EOF

          zip_name="AK3_OP13_KSUN_CCTV18_clean_v67_${{ github.run_number }}.zip"
          ( cd ak3_work && zip -r9 "../artifacts/$zip_name" . >/dev/null )
          sha256sum "artifacts/$zip_name" | tee "artifacts/$zip_name.sha256"

      - name: 10 Clean-source audit and debug collection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _ox_debug
          {
            echo "Workflow: OP13 KSUN CCTV18 Clean Daily v67"
            echo "Profile: ${{ inputs.profile }}"
            echo "KSUN ref: ${{ inputs.ksun_ref }}"
            echo "SUSFS enabled: ${{ inputs.susfs_enable }}"
            echo "SUSFS ref: ${{ inputs.susfs_ref }}"
            echo "SUSFS patch mode: ${{ inputs.susfs_patch_mode }}"
            echo "CCTV18 kernel ref: ${{ inputs.cctv18_kernel_ref }}"
            echo "Kernel name: ${{ inputs.kernel_name }}"
            echo "No WildKernels SUSFS patch tree is cloned or used by this workflow."
            echo "UTS: ${{ steps.build.outputs.uts }}"
          } | tee _ox_debug/build-summary.txt

          if [ -d kernel_workspace/susfs4ksu ]; then
            git -C kernel_workspace/susfs4ksu remote -v | tee _ox_debug/susfs_remote_final.txt || true
          fi
          if [ -d cctv18_assets ]; then
            git -C cctv18_assets remote -v | tee _ox_debug/cctv18_assets_remote.txt || true
          fi

          find kernel_workspace/common -name '*.rej' -o -name '*.orig' 2>/dev/null | sort | tee _ox_debug/rejects-orig-files.txt || true
          find artifacts _ox_debug -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null | sort | tee _ox_debug/artifact-preview.txt || true

      - name: 11 Upload artifacts
        if: always() && (inputs.debug_artifacts == true || success())
        uses: actions/upload-artifact@v7
        with:
          name: OP13-KSUN-CCTV18-CLEAN-v67-${{ github.run_number }}
          path: |
            artifacts/**
            _ox_debug/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14

      - name: 12 Final status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s artifacts/Image_OP13_KSUN_CCTV18_clean_v67 ]; then
            echo "::error::Clean CCTV18 KSUN build failed before producing Image. Download the debug artifact."
            exit 1
          fi
          echo "✅ Clean OP13 KSUN + CCTV18 SUSFS build completed."
          echo "No WildKernels SUSFS patch tree was used."
