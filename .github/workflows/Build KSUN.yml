name: OP13 KSUN

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      feature_profile:
        description: "Profile: wild_match = known Wild-style feature set; battery_daily = safer daily/battery; advanced_daily = extras on; minimal_debug = root/SUSFS minimum"
        required: true
        type: choice
        options:
          - wild_match
          - battery_daily
          - advanced_daily
          - minimal_debug
        default: wild_match

      ksun_ref:
        description: "KernelSU-Next ref. Default is the known-working OP13 Wild release family commit (KSUN 33129)."
        required: true
        type: string
        default: "551ad80473f60e052917aec08abf5323b6ab2f7c"

      susfs:
        description: "Enable SUSFS"
        required: true
        type: choice
        options: [On, Off]
        default: On

      susfs_ref:
        description: "SUSFS ref. Default is the known-working android15-6.6 v2.1.0 commit from Wild OP13 release family."
        required: false
        type: string
        default: "85bcfac5edc8ba7808581e8d0a3ca9c7deca78e4"

      optimize_level:
        description: "Compiler optimisation level"
        required: true
        type: choice
        options: [O2, O3]
        default: O2

      hmbird:
        description: "HMBIRD/FengChi: Auto follows profile"
        required: true
        type: choice
        options: [Auto, On, Off]
        default: Auto

      droidspaces:
        description: "Droidspaces: Auto follows profile"
        required: true
        type: choice
        options: [Auto, On, Off]
        default: Auto

      bbr:
        description: "Enable BBR"
        required: true
        type: choice
        options: [On, Off]
        default: On

      bbg:
        description: "Enable BBG/baseband guard"
        required: true
        type: choice
        options: [On, Off]
        default: On

      ttl_ipset:
        description: "Enable TTL + IP_SET"
        required: true
        type: choice
        options: [On, Off]
        default: On

      unicode_fix:
        description: "Enable Unicode related config"
        required: true
        type: choice
        options: [On, Off]
        default: On

      ntsync:
        description: "Enable NTSYNC"
        required: true
        type: choice
        options: [On, Off]
        default: On

      stock_mimic:
        description: "Mimic stock OP13 UTS suffix"
        required: true
        type: choice
        options: [On, Off]
        default: On

      BUILD_TIME:
        description: "Kernel build timestamp. F/f = current UTC time. Blank = build engine default."
        required: false
        type: string
        default: "F"

      clean_build:
        description: "Clean build without ccache"
        required: true
        type: boolean
        default: false

      debug_artifacts:
        description: "Upload debug logs/artifacts"
        required: true
        type: boolean
        default: true

env:
  DEVICE_MODEL: OP13
  DEVICE_CODENAME: sun
  TARGET_OS: OOS16
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  EXPECTED_UTS: "6.6.89-android15-8-g7e1f3c083cc6-abogki467167594-4k"
  STOCK_UNAME_SUFFIX: "8-g7e1f3c083cc6-abogki467167594-4k"

  # Pinned to the old WildKernels action layout that produced the known OP13 KSUN/SUSFS release family.
  # Do not use "main" here. Current Wild main uses a different modular action layout.
  WILD_ENGINE_REPO: WildKernels/OnePlus_KernelSU_SUSFS
  WILD_ENGINE_REF: 14d04c1ed0753280330ccabd773e903f76c9a038

jobs:
  build:
    name: OP13 KSUN v56 ${{ inputs.feature_profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 01 - Checkout pinned WildKernels build engine
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WILD_ENGINE_REPO }}
          ref: ${{ env.WILD_ENGINE_REF }}
          fetch-depth: 1

      - name: 02 - Verify pinned engine layout
        shell: bash
        run: |
          set -euo pipefail

          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Pinned engine: ${WILD_ENGINE_REPO}@${WILD_ENGINE_REF}"
          git rev-parse HEAD

          missing=0
          for p in \
            ".github/actions/action.yml" \
            "configs/oos16/OP13.json" \
            "manifests/oos16/oneplus_13_w.xml"
          do
            if [ -e "$p" ]; then
              echo "OK: $p"
            else
              echo "::error::MISSING: $p"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::Pinned WildKernels engine layout is not the expected old composite-action tree."
            exit 1
          fi

      - name: 03 - Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev build-essential \
            zip unzip python3 python3-pip curl jq git ccache \
            aria2 pigz xz-utils rsync file

      - name: 04 - Resolve build timestamp
        id: build_time
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ inputs.BUILD_TIME }}"
          if [ -z "$RAW" ]; then
            TS=""
          elif [ "$RAW" = "F" ] || [ "$RAW" = "f" ]; then
            TS="$(date -u '+%a %b %e %T UTC %Y')"
          else
            TS="$RAW"
          fi
          echo "timestamp=$TS" >> "$GITHUB_OUTPUT"
          echo "Build timestamp resolved: ${TS:-engine default}"

      - name: 05 - Prepare OP13 feature matrix
        id: config
        shell: bash
        run: |
          set -euo pipefail

          profile="${{ inputs.feature_profile }}"

          bool_onoff() {
            case "$1" in
              On|on|true|True|TRUE) echo true ;;
              Off|off|false|False|FALSE) echo false ;;
              *) echo "::error::Invalid On/Off value: $1" >&2; exit 1 ;;
            esac
          }

          auto_feature() {
            local val="$1"
            local feature="$2"
            if [ "$val" = "On" ]; then echo true; return; fi
            if [ "$val" = "Off" ]; then echo false; return; fi

            case "$profile:$feature" in
              wild_match:hmbird|wild_match:droidspaces) echo true ;;
              advanced_daily:hmbird|advanced_daily:droidspaces) echo true ;;
              battery_daily:hmbird|battery_daily:droidspaces) echo false ;;
              minimal_debug:hmbird|minimal_debug:droidspaces) echo false ;;
              *) echo false ;;
            esac
          }

          SUSFS_BOOL="$(bool_onoff "${{ inputs.susfs }}")"
          HMBIRD_BOOL="$(auto_feature "${{ inputs.hmbird }}" hmbird)"
          DS_BOOL="$(auto_feature "${{ inputs.droidspaces }}" droidspaces)"
          BBR_BOOL="$(bool_onoff "${{ inputs.bbr }}")"
          BBG_BOOL="$(bool_onoff "${{ inputs.bbg }}")"
          TTL_IPSET_BOOL="$(bool_onoff "${{ inputs.ttl_ipset }}")"
          UNICODE_BOOL="$(bool_onoff "${{ inputs.unicode_fix }}")"
          NTSYNC_BOOL="$(bool_onoff "${{ inputs.ntsync }}")"

          if [ "${{ inputs.stock_mimic }}" = "On" ]; then
            UNAME_SUFFIX="$STOCK_UNAME_SUFFIX"
          else
            UNAME_SUFFIX="ox1d3x3-ksun"
          fi

          # Use the pinned Wild OP13 config as the base, then override the feature choices.
          jq -c \
            --argjson hmbird "$HMBIRD_BOOL" \
            --argjson susfs "$SUSFS_BOOL" \
            --argjson ds "$DS_BOOL" \
            --argjson bbg "$BBG_BOOL" \
            --argjson bbr "$BBR_BOOL" \
            --argjson ttl "$TTL_IPSET_BOOL" \
            --argjson ip_set "$TTL_IPSET_BOOL" \
            --argjson unicode "$UNICODE_BOOL" \
            --argjson ntsync "$NTSYNC_BOOL" \
            --arg uname "$UNAME_SUFFIX" \
            '. + {
              hmbird: $hmbird,
              susfs: $susfs,
              ds: $ds,
              bbg: $bbg,
              bbr: $bbr,
              ttl: $ttl,
              ip_set: $ip_set,
              unicode: $unicode,
              ntsync: $ntsync,
              uname: $uname
            }' \
            configs/oos16/OP13.json > /tmp/op13_config.json

          echo "op_config_json=$(cat /tmp/op13_config.json)" >> "$GITHUB_OUTPUT"

          echo "## OP13 KSUN/SUSFS v56 feature matrix" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Profile | $profile |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Root backend | KernelSU-Next / KSUN |" >> "$GITHUB_STEP_SUMMARY"
          echo "| KSUN ref | ${{ inputs.ksun_ref }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SUSFS enabled | $SUSFS_BOOL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SUSFS ref | ${{ inputs.susfs_ref }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| HMBIRD | $HMBIRD_BOOL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Droidspaces | $DS_BOOL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| BBR | $BBR_BOOL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| BBG | $BBG_BOOL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TTL/IP_SET | $TTL_IPSET_BOOL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unicode | $UNICODE_BOOL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| NTSYNC | $NTSYNC_BOOL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| UTS suffix | $UNAME_SUFFIX |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Config JSON:" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          jq '.' /tmp/op13_config.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 06 - Build OP13 KSUN + SUSFS
        id: build_kernel
        uses: ./.github/actions
        with:
          op_config_json: ${{ steps.config.outputs.op_config_json }}
          ksu_type: KSUN
          ksu_branch_or_hash: ${{ inputs.ksun_ref }}
          susfs_commit_hash_or_branch: ${{ inputs.susfs_ref }}
          build_timestamp: ${{ steps.build_time.outputs.timestamp }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}

      - name: 07 - Verify build outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "## Build outputs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "Known output-like files:"
          find . -type f \( \
            -name '*.zip' -o \
            -name '*.sha256' -o \
            -name '*metadata*' -o \
            -name '*build_info*' -o \
            -name '*.log' -o \
            -name '*.txt' \
          \) | sort | sed 's#^\./##' | tee /tmp/op13_outputs.txt

          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/op13_outputs.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if find . -type f -name '*.zip' | grep -q .; then
            echo "✅ ZIP artifact found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ No ZIP artifact found" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 08 - Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OP13-KSUN-SUSFS-v56-${{ inputs.feature_profile }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            OP13/artifacts/**
            OP13/AnyKernel3/*.zip
            AnyKernel3/*.zip
            **/*OP13*.zip
            **/*.sha256
            **/*_metadata.json
            **/*_build_info.txt
            **/*.log
            **/*.txt
