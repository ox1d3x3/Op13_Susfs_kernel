name: OP13 KSUN

permissions:
  contents: read
  actions: read

concurrency:
  group: op13-ksun-susfs-v54-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVICE_MODEL: OP13
  DEVICE_CODENAME: sun
  TARGET_OS: OOS16
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  EXPECTED_UTS: "6.6.89-android15-8-g7e1f3c083cc6-abogki467167594-4k"
  STOCK_UNAME_SUFFIX: "8-g7e1f3c083cc6-abogki467167594-4k"
  DEFAULT_KSUN_REF: "dev"

on:
  workflow_dispatch:
    inputs:
      feature_profile:
        description: "Profile: wild_match = Wild OP13-style, battery_daily = safer daily, advanced_daily = Droidspaces only, minimal_debug = smallest KSUN test"
        type: choice
        required: true
        default: wild_match
        options:
          - wild_match
          - battery_daily
          - advanced_daily
          - minimal_debug
      ksun_ref:
        description: "KernelSU Next ref. Use dev first. Do not pin until dev builds successfully."
        type: string
        required: false
        default: "dev"
      susfs:
        description: "Enable SUSFS. Keep On for MS Authenticator/root-hiding tests."
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      susfs_ref:
        description: "SUSFS ref. Leave blank so current Wild engine chooses matching android15-6.6 branch."
        type: string
        required: false
        default: ""
      optimize_level:
        description: "Compiler optimisation. O2 is safer for daily use; O3 is testing only."
        type: choice
        required: true
        default: O2
        options:
          - O2
          - O3
      BUILD_TIME:
        description: "Build timestamp. Use F for current UTC time, blank for engine default, or paste stock-like timestamp."
        type: string
        required: false
        default: "F"
      stock_mimic:
        description: "Use stock-like OP13 UTS suffix. Keep On for PJZ110 daily-driver tests."
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      hmbird:
        description: "HMBIRD/Fengchi. Auto follows selected profile."
        type: choice
        required: true
        default: Auto
        options:
          - Auto
          - "On"
          - "Off"
      droidspaces:
        description: "Droidspaces. Auto follows selected profile."
        type: choice
        required: true
        default: Auto
        options:
          - Auto
          - "On"
          - "Off"
      bbr:
        description: "BBR TCP congestion control"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      bbg:
        description: "Baseband Guard"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      ttl_ipset:
        description: "TTL target + IP_SET + IPv6 NAT support"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      unicode_fix:
        description: "Unicode path bypass fix"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      ntsync:
        description: "NTSYNC support"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      clean_build:
        description: "Clean build without ccache reuse"
        type: boolean
        required: true
        default: false
      debug_artifacts:
        description: "Upload build/debug artifacts if produced"
        type: boolean
        required: true
        default: true
      engine_debug:
        description: "Enable Wild build-engine debug output"
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: OP13 KSUN v54 ${{ inputs.feature_profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # -------------------------------------------------------------------------
      # 01. Preflight only. Do not checkout old Wild tree and do not use the old
      #     root composite action. v54 calls current modular build-kernel action.
      # -------------------------------------------------------------------------
      - name: Print workflow context
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner      : $(uname -a)"
          echo "Repository  : ${GITHUB_REPOSITORY}"
          echo "Workflow    : ${GITHUB_WORKFLOW}"
          echo "Run ID      : ${GITHUB_RUN_ID}"
          echo "Profile     : ${{ inputs.feature_profile }}"
          echo "KSUN ref    : ${{ inputs.ksun_ref }}"
          echo "SUSFS       : ${{ inputs.susfs }} / ${{ inputs.susfs_ref || 'auto' }}"
          echo "Expected UTS: ${EXPECTED_UTS}"
          echo "Engine      : WildKernels/OnePlus_KernelSU_SUSFS/.github/actions/build-kernel@main"
          df -hT

      - name: Install minimal host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git jq unzip zip

      # -------------------------------------------------------------------------
      # 02. Resolve timestamp and OP13 config JSON inline.
      #     This avoids mixing old action code with mismatched local resources.
      # -------------------------------------------------------------------------
      - name: Resolve build timestamp
        id: timestamp
        shell: bash
        run: |
          set -euo pipefail
          input='${{ inputs.BUILD_TIME }}'
          if [[ -z "$input" ]]; then
            resolved=""
          elif [[ "$input" == "F" || "$input" == "f" ]]; then
            resolved="$(LC_ALL=C date -u '+%a %b %e %T UTC %Y')"
          else
            resolved="$input"
          fi
          echo "value=$resolved" >> "$GITHUB_OUTPUT"
          echo "Build timestamp resolved: ${resolved:-build-engine default}"

      - name: Resolve OP13 feature matrix
        id: config
        shell: bash
        run: |
          set -euo pipefail

          bool_on() { [[ "$1" == "On" ]] && echo true || echo false; }

          profile='${{ inputs.feature_profile }}'
          case "$profile" in
            wild_match)
              default_hmbird=true
              default_ds=true
              ;;
            advanced_daily)
              default_hmbird=false
              default_ds=true
              ;;
            battery_daily|minimal_debug)
              default_hmbird=false
              default_ds=false
              ;;
            *)
              echo "::error::Unknown profile: $profile"
              exit 1
              ;;
          esac

          case '${{ inputs.hmbird }}' in
            Auto) hmbird="$default_hmbird" ;;
            On) hmbird=true ;;
            Off) hmbird=false ;;
          esac

          case '${{ inputs.droidspaces }}' in
            Auto) ds="$default_ds" ;;
            On) ds=true ;;
            Off) ds=false ;;
          esac

          if [[ "$profile" == "minimal_debug" ]]; then
            hmbird=false
            ds=false
          fi

          susfs=$(bool_on '${{ inputs.susfs }}')
          bbr=$(bool_on '${{ inputs.bbr }}')
          bbg=$(bool_on '${{ inputs.bbg }}')
          ttl_ipset=$(bool_on '${{ inputs.ttl_ipset }}')
          unicode=$(bool_on '${{ inputs.unicode_fix }}')
          ntsync=$(bool_on '${{ inputs.ntsync }}')

          if [[ '${{ inputs.stock_mimic }}' == 'On' ]]; then
            uname_value="${STOCK_UNAME_SUFFIX}"
          else
            uname_value="OP13-KSUN"
          fi

          # OP13 OOS16 config mirrors Wild's OP13 profile, but is constructed
          # inline so the current remote build-kernel action owns all resources.
          jq -nc \
            --argjson hmbird "$hmbird" \
            --argjson susfs "$susfs" \
            --argjson ds "$ds" \
            --argjson bbg "$bbg" \
            --argjson bbr "$bbr" \
            --argjson ttl "$ttl_ipset" \
            --argjson ip_set "$ttl_ipset" \
            --argjson unicode "$unicode" \
            --argjson ntsync "$ntsync" \
            --arg uname "$uname_value" \
            '{
              model: "OP13",
              soc: "sun",
              branch: "wild/sm8750",
              manifest: "oneplus_13_w.xml",
              android_version: "android15",
              kernel_version: "6.6",
              os_version: "OOS16",
              lto: "thin",
              zyc_compiler: "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240723-release/Clang-19.0.0git-20240723.tar.gz",
              c_compiler: "kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin",
              rust_compiler: "",
              bindgen: "",
              rust_build: false,
              disk_cleanup: false,
              hmbird: $hmbird,
              susfs: $susfs,
              ds: $ds,
              bbg: $bbg,
              bbr: $bbr,
              ttl: $ttl,
              ip_set: $ip_set,
              unicode: $unicode,
              ntsync: $ntsync,
              uname: $uname
            }' > /tmp/op13_config.json

          susfs_ref='${{ inputs.susfs_ref }}'
          if [[ "$susfs" != "true" ]]; then
            susfs_ref=""
          fi

          echo "Resolved OP13 config:"
          jq . /tmp/op13_config.json

          {
            echo 'json<<JSON'
            cat /tmp/op13_config.json
            echo 'JSON'
            echo "susfs_ref=$susfs_ref"
            echo "hmbird=$hmbird"
            echo "ds=$ds"
            echo "susfs=$susfs"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## OP13 KSUN SUSFS v54 Build Matrix"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Profile | $profile |"
            echo "| Engine | current Wild modular build-kernel action |"
            echo "| KSUN ref | ${{ inputs.ksun_ref }} |"
            echo "| SUSFS | $susfs |"
            echo "| SUSFS ref | ${susfs_ref:-auto/default} |"
            echo "| HMBIRD | $hmbird |"
            echo "| Droidspaces | $ds |"
            echo "| BBR | $bbr |"
            echo "| BBG | $bbg |"
            echo "| TTL/IP_SET | $ttl_ipset |"
            echo "| Unicode | $unicode |"
            echo "| NTSYNC | $ntsync |"
            echo "| Uname suffix | $uname_value |"
            echo "| Build timestamp | ${{ steps.timestamp.outputs.value || 'build-engine default' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------------------------
      # 03. Build with current Wild modular action. This avoids the old root
      #     action, old setup.sh assumptions, and workspace resource mismatch.
      # -------------------------------------------------------------------------
      - name: Build OP13 KSUN SUSFS kernel
        id: build_kernel
        uses: WildKernels/OnePlus_KernelSU_SUSFS/.github/actions/build-kernel@main
        with:
          op_config_json: ${{ steps.config.outputs.json }}
          ksu_type: KSUN
          ksu_branch_or_hash: ${{ inputs.ksun_ref || env.DEFAULT_KSUN_REF }}
          susfs_commit_hash_or_branch: ${{ steps.config.outputs.susfs_ref }}
          build_timestamp: ${{ steps.timestamp.outputs.value }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}
          debug: ${{ inputs.engine_debug }}
          github_token: ${{ github.token }}

      # -------------------------------------------------------------------------
      # 04. Post-build discovery, summary, and artifact upload
      # -------------------------------------------------------------------------
      - name: Discover build outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Generated files:"
          find "$GITHUB_WORKSPACE" -maxdepth 8 -type f \
            \( -name '*.zip' -o -name '*.sha256' -o -name '*_build_info.txt' -o -name '*_metadata.json' -o -name '*.log' \) \
            -printf '%p %s bytes\n' | sort || true
          echo "Artifacts folder preview:"
          find "$GITHUB_WORKSPACE" -maxdepth 6 -type d -name artifacts -print -exec find {} -maxdepth 3 -type f -printf '%p %s bytes\n' \; || true
          echo "Debug artifacts preview:"
          find "$GITHUB_WORKSPACE" -maxdepth 5 -type d -name debug_artifacts -print -exec find {} -maxdepth 3 -type f -printf '%p %s bytes\n' \; || true

      - name: Final build summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo ""
            echo "## Build Outputs"
            echo ""
            echo "| Output | Value |"
            echo "|---|---|"
            echo "| Kernel version | ${{ steps.build_kernel.outputs.kernel_version || 'n/a' }} |"
            echo "| KSU type | ${{ steps.build_kernel.outputs.ksu_type || 'KSUN' }} |"
            echo "| KSU version | ${{ steps.build_kernel.outputs.ksu_version || 'n/a' }} |"
            echo "| SUSFS version | ${{ steps.build_kernel.outputs.susfs_version || 'n/a' }} |"
            echo "| ZIP name | ${{ steps.build_kernel.outputs.zip_name || 'n/a' }} |"
            echo "| ZIP SHA256 | ${{ steps.build_kernel.outputs.zip_sha256 || 'n/a' }} |"
            echo "| Image SHA256 | ${{ steps.build_kernel.outputs.image_sha256 || 'n/a' }} |"
            echo "| Warnings | ${{ steps.build_kernel.outputs.warnings || 'n/a' }} |"
            echo "| Build time | ${{ steps.build_kernel.outputs.build_time || 'n/a' }} seconds |"
            echo "| ccache hit rate | ${{ steps.build_kernel.outputs.ccache_hit_rate || 'n/a' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OP13 KSUN build artifacts
        if: always() && inputs.debug_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OP13_KSUN_SUSFS_v54_${{ inputs.feature_profile }}_${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            OP13/artifacts/**
            OP13/AnyKernel3/*.zip
            AnyKernel3/*.zip
            debug_artifacts/**
            **/*OP13*.zip
            **/*.sha256
            **/*_metadata.json
            **/*_build_info.txt
            **/*.log
