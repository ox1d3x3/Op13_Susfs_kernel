name: OP13 KSUN

permissions:
  contents: read
  actions: read

concurrency:
  group: op13-ksun-susfs-${{ github.ref }}
  cancel-in-progress: false

env:
  DEVICE_MODEL: OP13
  DEVICE_CODENAME: sun
  TARGET_OS: OOS16
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  EXPECTED_UTS: "6.6.89-android15-8-g7e1f3c083cc6-abogki467167594-4k"
  STOCK_UNAME_SUFFIX: "8-g7e1f3c083cc6-abogki467167594-4k"
  DEFAULT_KSUN_REF: "551ad80473f60e052917aec08abf5323b6ab2f7c"
  DEFAULT_SUSFS_REF: "85bcfac5edc8ba7808581e8d0a3ca9c7deca78e4"

on:
  workflow_dispatch:
    inputs:
      feature_profile:
        description: "Profile: wild_match = closest known-good KSUN release, battery_daily = safer daily, advanced_daily = battery + Droidspaces, minimal_debug = smallest test"
        type: choice
        required: true
        default: wild_match
        options:
          - wild_match
          - battery_daily
          - advanced_daily
          - minimal_debug
      ksun_ref:
        description: "KernelSU Next ref/commit. Default matches the known-good OP13/OOS16 release family."
        type: string
        required: false
        default: "551ad80473f60e052917aec08abf5323b6ab2f7c"
      susfs:
        description: "Enable SUSFS. Keep On for MS Authenticator + root hiding tests."
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      susfs_ref:
        description: "SUSFS ref/commit. Default is android15-6.6 SUSFS v2.1.0 release-family commit."
        type: string
        required: false
        default: "85bcfac5edc8ba7808581e8d0a3ca9c7deca78e4"
      optimize_level:
        description: "Compiler optimisation. O2 is safer for daily use; O3 is testing only."
        type: choice
        required: true
        default: O2
        options:
          - O2
          - O3
      BUILD_TIME:
        description: "Build timestamp. Use F for current UTC time, blank for build-engine default, or paste stock-like timestamp."
        type: string
        required: false
        default: "F"
      hmbird:
        description: "HMBIRD/Fengchi. Auto follows selected profile."
        type: choice
        required: true
        default: Auto
        options:
          - Auto
          - "On"
          - "Off"
      droidspaces:
        description: "Droidspaces. Auto follows selected profile."
        type: choice
        required: true
        default: Auto
        options:
          - Auto
          - "On"
          - "Off"
      adios:
        description: "ADIOS I/O scheduler request. Kept for menu parity; build engine applies support if available."
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      bbr:
        description: "BBR TCP congestion control"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      bbg:
        description: "Baseband Guard"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      ttl_ipset:
        description: "TTL target + IP_SET + IPv6 NAT support"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      unicode_fix:
        description: "Unicode path bypass fix"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      ntsync:
        description: "NTSYNC support"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      clean_build:
        description: "Clean build without cache reuse"
        type: boolean
        required: true
        default: false
      debug_artifacts:
        description: "Upload wrapper debug summary/log files if produced"
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: OP13 KSUN v49 ${{ inputs.feature_profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # -------------------------------------------------------------------------
      # 01. Repository checkout
      # -------------------------------------------------------------------------
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify pinned remote build engine metadata
        shell: bash
        run: |
          set -euo pipefail
          ENGINE_REF="14d04c1ed0753280330ccabd773e903f76c9a038"
          ENGINE_ACTION="https://raw.githubusercontent.com/WildKernels/OnePlus_KernelSU_SUSFS/${ENGINE_REF}/.github/actions/action.yml"
          ENGINE_CONFIG="https://raw.githubusercontent.com/WildKernels/OnePlus_KernelSU_SUSFS/${ENGINE_REF}/configs/oos16/OP13.json"
          echo "Remote build engine ref: ${ENGINE_REF}"
          echo "Remote composite action: WildKernels/OnePlus_KernelSU_SUSFS/.github/actions@${ENGINE_REF}"
          curl -fsSL "$ENGINE_ACTION" -o /tmp/wild_action.yml
          curl -fsSL "$ENGINE_CONFIG" -o /tmp/wild_op13.json
          grep -q "op_config_json" /tmp/wild_action.yml
          jq -e '.model == "OP13" and .soc == "sun" and .os_version == "OOS16" and .android_version == "android15" and .kernel_version == "6.6"' /tmp/wild_op13.json >/dev/null
          echo "✅ Remote engine action and OP13 config are reachable."

      # -------------------------------------------------------------------------
      # 02. Preflight and runner diagnostics
      # -------------------------------------------------------------------------
      - name: Print build context
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner      : $(uname -a)"
          echo "Repository  : ${GITHUB_REPOSITORY}"
          echo "Workflow    : ${GITHUB_WORKFLOW}"
          echo "Run ID      : ${GITHUB_RUN_ID}"
          echo "Profile     : ${{ inputs.feature_profile }}"
          echo "KSUN ref    : ${{ inputs.ksun_ref }}"
          echo "SUSFS       : ${{ inputs.susfs }} / ${{ inputs.susfs_ref }}"
          echo "Expected UTS: ${EXPECTED_UTS}"
          df -hT

      - name: Install host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl flex git \
            jq kmod libelf-dev libssl-dev lld make openssl python3 unzip zip

      # -------------------------------------------------------------------------
      # 03. Prepare OP13/OOS16 manifest and structured config
      # -------------------------------------------------------------------------
      - name: Prepare inline OP13/OOS16 configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "Using inline OP13 config based on the pinned remote build engine."
          echo "No local Wild checkout is used, so the previous actions/checkout short-ref failure cannot occur."
          echo "Remote action will receive op_config_json directly."

      - name: Resolve feature matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail

          profile='${{ inputs.feature_profile }}'

          hmbird=false
          ds=false
          susfs=false
          bbr=false
          bbg=false
          ttl=false
          ip_set=false
          unicode=false
          ntsync=false

          case "$profile" in
            wild_match)
              hmbird=true
              ds=true
              ;;
            battery_daily)
              hmbird=false
              ds=false
              ;;
            advanced_daily)
              hmbird=false
              ds=true
              ;;
            minimal_debug)
              hmbird=false
              ds=false
              ;;
            *)
              echo "Unsupported feature_profile: $profile" >&2
              exit 1
              ;;
          esac

          [ '${{ inputs.susfs }}' = 'On' ] && susfs=true
          [ '${{ inputs.bbr }}' = 'On' ] && bbr=true
          [ '${{ inputs.bbg }}' = 'On' ] && bbg=true
          if [ '${{ inputs.ttl_ipset }}' = 'On' ]; then
            ttl=true
            ip_set=true
          fi
          [ '${{ inputs.unicode_fix }}' = 'On' ] && unicode=true
          [ '${{ inputs.ntsync }}' = 'On' ] && ntsync=true

          case '${{ inputs.hmbird }}' in
            On) hmbird=true ;;
            Off) hmbird=false ;;
            Auto) ;;
          esac

          case '${{ inputs.droidspaces }}' in
            On) ds=true ;;
            Off) ds=false ;;
            Auto) ;;
          esac

          # ADIOS is retained as an explicit menu option for parity with your OP13 workflow.
          # The build engine applies scheduler patches/config only where that support exists.
          adios='${{ inputs.adios }}'

          cat > op13_ksun_config.json <<EOF
          {
            "model": "${DEVICE_MODEL}",
            "soc": "${DEVICE_CODENAME}",
            "branch": "wild/sm8750",
            "manifest": "oneplus_13_w.xml",
            "android_version": "${ANDROID_VERSION}",
            "kernel_version": "${KERNEL_VERSION}",
            "os_version": "${TARGET_OS}",
            "lto": "thin",
            "zyc_compiler": "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240723-release/Clang-19.0.0git-20240723.tar.gz",
            "c_compiler": "kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin",
            "rust_compiler": "",
            "bindgen": "",
            "rust_build": false,
            "disk_cleanup": false,
            "hmbird": $hmbird,
            "susfs": $susfs,
            "ds": $ds,
            "bbg": $bbg,
            "bbr": $bbr,
            "ttl": $ttl,
            "ip_set": $ip_set,
            "unicode": $unicode,
            "ntsync": $ntsync,
            "uname": "${STOCK_UNAME_SUFFIX}"
          }
          EOF

          python3 -m json.tool op13_ksun_config.json
          config_json=$(jq -c . op13_ksun_config.json)
          echo "config_json=$config_json" >> "$GITHUB_OUTPUT"
          echo "hmbird=$hmbird" >> "$GITHUB_OUTPUT"
          echo "ds=$ds" >> "$GITHUB_OUTPUT"
          echo "susfs=$susfs" >> "$GITHUB_OUTPUT"
          echo "bbr=$bbr" >> "$GITHUB_OUTPUT"
          echo "bbg=$bbg" >> "$GITHUB_OUTPUT"
          echo "ttl=$ttl" >> "$GITHUB_OUTPUT"
          echo "ip_set=$ip_set" >> "$GITHUB_OUTPUT"
          echo "unicode=$unicode" >> "$GITHUB_OUTPUT"
          echo "ntsync=$ntsync" >> "$GITHUB_OUTPUT"
          echo "adios=$adios" >> "$GITHUB_OUTPUT"

      - name: Resolve build timestamp
        id: build_time
        shell: bash
        run: |
          set -euo pipefail
          raw='${{ inputs.BUILD_TIME }}'
          if [ -z "$raw" ]; then
            resolved=''
          elif [ "$raw" = "F" ] || [ "$raw" = "f" ]; then
            resolved="$(date -u '+%a %b %e %T UTC %Y')"
          else
            resolved="$raw"
          fi
          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"
          echo "Resolved build timestamp: ${resolved:-<engine default>}"

      - name: Build plan summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## OP13 KSUN SUSFS Stable Daily v49"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Model | ${DEVICE_MODEL} / ${DEVICE_CODENAME} / ${TARGET_OS} |"
            echo "| Android/kernel | ${ANDROID_VERSION} / ${KERNEL_VERSION} |"
            echo "| Feature profile | ${{ inputs.feature_profile }} |"
            echo "| Root backend | KernelSU Next / KSUN |"
            echo "| KSUN ref | ${{ inputs.ksun_ref }} |"
            echo "| SUSFS | ${{ steps.matrix.outputs.susfs }} |"
            echo "| SUSFS ref | ${{ inputs.susfs_ref }} |"
            echo "| Expected stock UTS | ${EXPECTED_UTS} |"
            echo "| HMBIRD | ${{ steps.matrix.outputs.hmbird }} |"
            echo "| Droidspaces | ${{ steps.matrix.outputs.ds }} |"
            echo "| ADIOS menu request | ${{ steps.matrix.outputs.adios }} |"
            echo "| BBR | ${{ steps.matrix.outputs.bbr }} |"
            echo "| BBG | ${{ steps.matrix.outputs.bbg }} |"
            echo "| TTL/IP_SET | ${{ steps.matrix.outputs.ttl }} / ${{ steps.matrix.outputs.ip_set }} |"
            echo "| Unicode | ${{ steps.matrix.outputs.unicode }} |"
            echo "| NTSYNC | ${{ steps.matrix.outputs.ntsync }} |"
            echo "| Optimisation | ${{ inputs.optimize_level }} |"
            echo "| BUILD_TIME input | ${{ inputs.BUILD_TIME }} |"
            echo "| Build timestamp resolved | ${{ steps.build_time.outputs.resolved }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # -------------------------------------------------------------------------
      # 04. Kernel build
      # -------------------------------------------------------------------------
      - name: Build OP13 KSUN SUSFS kernel
        id: build_kernel
        uses: WildKernels/OnePlus_KernelSU_SUSFS/.github/actions@14d04c1ed0753280330ccabd773e903f76c9a038
        with:
          op_config_json: ${{ steps.matrix.outputs.config_json }}
          ksu_type: KSUN
          ksu_branch_or_hash: ${{ inputs.ksun_ref }}
          susfs_commit_hash_or_branch: ${{ inputs.susfs_ref }}
          build_timestamp: ${{ steps.build_time.outputs.resolved }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}

      # -------------------------------------------------------------------------
      # 05. Post-build discovery, validation and artifact mirror
      # -------------------------------------------------------------------------
      - name: Locate build outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wrapper_debug
          {
            echo "# Build output discovery"
            echo ""
            echo "## ZIP files"
            find "$GITHUB_WORKSPACE" -type f -name '*.zip' -printf '%p %s bytes\n' | sort || true
            echo ""
            echo "## Kernel Images"
            find "$GITHUB_WORKSPACE" -type f \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.lz4' \) -printf '%p %s bytes\n' | sort || true
          } | tee wrapper_debug/output_discovery.txt

      - name: Final status summary
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "## Test expectation"
            echo ""
            echo "This is the KSUN comparison lane. Use it to compare against the SukiSU Ultra + CCTV18 builds."
            echo "If this survives LSPosed + susfs4ksu + MS Authenticator after two reboots, the SukiSU runtime path is the unstable side."
            echo ""
            echo "Recommended first test: flash, boot, confirm KSUN manager, install/enable Zygisk Next + LSPosed + susfs4ksu, then reboot twice."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wrapper debug artifacts
        if: always() && inputs.debug_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OP13_KSUN_v49_wrapper_debug_${{ github.run_number }}
          path: wrapper_debug/**
          if-no-files-found: ignore
