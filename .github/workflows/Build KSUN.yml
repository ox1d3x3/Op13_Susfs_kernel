name: OP13 KSUN

permissions:
  contents: read
  actions: read

env:
  OP_EXPECTED_UTS: "6.6.89-android15-8-g7e1f3c083cc6-abogki467167594-4k"
  OP_UNAME_STOCK_MIMIC: "8-g7e1f3c083cc6-abogki467167594-4k"

on:
  workflow_dispatch:
    inputs:
      feature_profile:
        description: "Profile: battery_daily = stable/battery, wild_match = closest to known-good Wild KSUN release, advanced_daily = battery + Droidspaces, minimal_debug = minimal KSUN test"
        type: choice
        required: true
        default: wild_match
        options:
          - battery_daily
          - wild_match
          - advanced_daily
          - minimal_debug
      ksun_ref:
        description: "KernelSU Next ref. Default pins the known-good OP13/OOS16 KSUN release family. Use dev only for testing."
        type: string
        required: false
        default: "551ad80473f60e052917aec08abf5323b6ab2f7c"
      susfs:
        description: "Enable SUSFS. Keep On for the real KSUN daily-driver test."
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      susfs_ref:
        description: "simonpunk susfs4ksu ref. Default pins OP13/OOS16 android15-6.6 SUSFS v2.1.0 release-family commit."
        type: string
        required: false
        default: "85bcfac5edc8ba7808581e8d0a3ca9c7deca78e4"
      optimize_level:
        description: "Compiler optimisation. O2 is safer for daily driver; O3 is testing only."
        type: choice
        required: true
        default: O2
        options: [O2, O3]
      hmbird:
        description: "HMBIRD/Fengchi override. Auto follows profile."
        type: choice
        required: true
        default: Auto
        options: [Auto, "On", "Off"]
      droidspaces:
        description: "Droidspaces override. Auto follows profile."
        type: choice
        required: true
        default: Auto
        options: [Auto, "On", "Off"]
      bbr:
        description: "BBR TCP congestion control"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      bbg:
        description: "Baseband Guard"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      ttl_ipset:
        description: "TTL target + IP_SET + IPv6 NAT support"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      unicode_fix:
        description: "Unicode path bypass fix"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      ntsync:
        description: "NTSYNC support"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      clean_build:
        description: "Clean build without ccache"
        type: boolean
        required: true
        default: false

jobs:
  build:
    name: OP13 KSUN SUSFS v45 (${{ inputs.feature_profile }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout proven OP13 KSUN build logic
        uses: actions/checkout@v4
        with:
          repository: WildKernels/OnePlus_KernelSU_SUSFS
          ref: main
          path: wild_upstream
          fetch-depth: 1

      - name: Prepare upstream manifests for composite action
        shell: bash
        run: |
          set -euo pipefail
          rm -rf manifests
          cp -a wild_upstream/manifests ./manifests
          test -f manifests/oos16/oneplus_13_w.xml
          echo "Prepared OP13 OOS16 manifest: manifests/oos16/oneplus_13_w.xml"

      - name: Prepare OP13 config JSON
        id: config
        shell: bash
        run: |
          set -euo pipefail

          profile='${{ inputs.feature_profile }}'

          hmbird=false
          ds=false
          susfs=false
          bbr=false
          bbg=false
          ttl=false
          ip_set=false
          unicode=false
          ntsync=false

          case "$profile" in
            wild_match)
              hmbird=true
              ds=true
              ;;
            battery_daily)
              hmbird=false
              ds=false
              ;;
            advanced_daily)
              hmbird=false
              ds=true
              ;;
            minimal_debug)
              hmbird=false
              ds=false
              ;;
            *)
              echo "Unsupported profile: $profile" >&2
              exit 1
              ;;
          esac

          [ '${{ inputs.susfs }}' = 'On' ] && susfs=true
          [ '${{ inputs.bbr }}' = 'On' ] && bbr=true
          [ '${{ inputs.bbg }}' = 'On' ] && bbg=true
          [ '${{ inputs.ttl_ipset }}' = 'On' ] && ttl=true && ip_set=true
          [ '${{ inputs.unicode_fix }}' = 'On' ] && unicode=true
          [ '${{ inputs.ntsync }}' = 'On' ] && ntsync=true

          case '${{ inputs.hmbird }}' in
            On) hmbird=true ;;
            Off) hmbird=false ;;
            Auto) ;;
          esac

          case '${{ inputs.droidspaces }}' in
            On) ds=true ;;
            Off) ds=false ;;
            Auto) ;;
          esac

          cat > op13_config.json <<EOF
          {
            "model": "OP13",
            "soc": "sun",
            "branch": "wild/sm8750",
            "manifest": "oneplus_13_w.xml",
            "android_version": "android15",
            "kernel_version": "6.6",
            "os_version": "OOS16",
            "lto": "thin",
            "zyc_compiler": "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240723-release/Clang-19.0.0git-20240723.tar.gz",
            "c_compiler": "kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin",
            "rust_compiler": "",
            "bindgen": "",
            "rust_build": false,
            "disk_cleanup": false,
            "hmbird": $hmbird,
            "susfs": $susfs,
            "ds": $ds,
            "bbg": $bbg,
            "bbr": $bbr,
            "ttl": $ttl,
            "ip_set": $ip_set,
            "unicode": $unicode,
            "ntsync": $ntsync,
            "uname": "${OP_UNAME_STOCK_MIMIC}"
          }
          EOF

          python3 -m json.tool op13_config.json
          config_json=$(jq -c . op13_config.json)
          echo "config_json=$config_json" >> "$GITHUB_OUTPUT"

          {
            echo "## OP13 KSUN SUSFS v45 Build Plan"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Model | OP13 / sun / OOS16 |"
            echo "| Profile | $profile |"
            echo "| Root backend | KernelSU Next / KSUN |"
            echo "| KSUN ref | ${{ inputs.ksun_ref }} |"
            echo "| SUSFS | ${{ inputs.susfs }} |"
            echo "| SUSFS ref | ${{ inputs.susfs_ref }} |"
            echo "| Expected UTS | ${OP_EXPECTED_UTS} |"
            echo "| HMBIRD | $hmbird |"
            echo "| Droidspaces | $ds |"
            echo "| BBR | $bbr |"
            echo "| BBG | $bbg |"
            echo "| TTL/IP_SET | $ttl / $ip_set |"
            echo "| Unicode | $unicode |"
            echo "| NTSYNC | $ntsync |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build OP13 KernelSU Next SUSFS kernel
        id: build_kernel
        uses: ./wild_upstream/.github/actions
        with:
          op_config_json: ${{ steps.config.outputs.config_json }}
          ksu_type: KSUN
          ksu_branch_or_hash: ${{ inputs.ksun_ref }}
          susfs_commit_hash_or_branch: ${{ inputs.susfs_ref }}
          optimize_level: ${{ inputs.optimize_level }}
          clean: ${{ inputs.clean_build }}

      - name: Final summary
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "## v45 Final Status"
            echo ""
            echo "This workflow intentionally uses the proven OP13/OOS16 KSUN build action path instead of the custom SukiSU/CCTV18 compatibility stack."
            echo "If this boots and LSPosed + susfs4ksu survive two reboots, the SukiSU path is confirmed as the unstable side."
          } >> "$GITHUB_STEP_SUMMARY"
