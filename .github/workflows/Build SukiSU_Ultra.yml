name: Build SukiSU Ultra (Ox1d3x3)

env:
  TZ: Australia/Perth
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  # Base kernel name (suffix added later)
  KERNEL_NAME: "android15-8-g29d86c5fc9dd-abogki428889875-4k-Ox1d3x3-SUS"

on:
  workflow_dispatch:
    inputs:
      SUSFS:
        description: "📦 SUSFS Support"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"
      KPM:
        description: "🧩 KPM (KernelPatch) on Image"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "Off"
      bbg:
        description: "🛡️ Baseband-guard"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"
      ZRAM_LZ4:
        description: "🗜️ Set ZRAM default compression to LZ4 (and apply lz4k/lz4kd patches if available)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"
      kernel_suffix:
        description: "📝 Kernel suffix (no leading hyphen)"
        required: false
        type: string
        default: ""
      BUILD_TIME:
        type: string
        description: "Optional. Leave blank to mimic stock build time, or set to F to use current build time."
        required: false
        default: ""
      KSU_BRANCH:
        description: "🌿 KernelSU branch for SukiSU-Ultra setup.sh (builtin recommended for SUSFS)"
        required: true
        type: choice
        options: ["builtin", "main", "old"]
        default: "builtin"

jobs:
  build:
    name: SUSFS ${{ github.event.inputs.SUSFS }} | ZRAM_LZ4 ${{ github.event.inputs.ZRAM_LZ4 }} | KPM ${{ github.event.inputs.KPM }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G

    steps:
      - name: 🚀 Maximize Build Space
        uses: easimon/maximize-build-space@v9
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: ⚙️ Setup Cache Env
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_SukiSU" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_SukiSU"

      - name: 🔐 Configure Git
        run: |
          git config --global user.name "GitHub Actions - Ox1d3x3"
          git config --global user.email "builder@localhost"

      - name: 🌐 Default Network Optimization
        run: |
          echo "CURL_OPTS=--retry 5 --retry-all-errors --connect-timeout 20 --max-time 1200" >> "$GITHUB_ENV"

          # Make APT more resilient
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::http::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::https::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/80-retries

          # Git fetch speed + resilience
          git config --global protocol.version 2
          git config --global fetch.parallel 8
          git config --global submodule.fetchJobs 8
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global core.compression 0

      - name: 📦 Cache & Install Dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: python3 git curl ccache libelf-dev build-essential flex bison
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync
            unzip gawk dos2unix gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
            zip wget perl
          execute_install_scripts: true

      - name: 💾 Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref }}-SUSFS-${{ github.event.inputs.SUSFS }}
          restore-keys: |
            ccache-${{ runner.os }}-SUSFS-${{ github.event.inputs.SUSFS }}
            ccache-${{ runner.os }}-

      - name: ⚙️ Initialize ccache
        run: |
          ccache -M ${{ env.CCACHE_MAXSIZE }} || true
          ccache -s || true

      - name: 📥 Install Repo Tool
        run: |
          curl $CURL_OPTS -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: 📥 Install Neutron Clang Tool
        run: |
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          bash <(curl $CURL_OPTS -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S

      - name: ⬇️ Clone Kernel Source
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace

          repo init -u https://github.com/mrcxlinux/actions_oplus_sm8750.git -b refs/heads/zh -m manifest.xml --depth=1
          repo sync -c -j"$(nproc --all)" --no-tags --no-clone-bundle --force-sync

          # Remove protected exports (common in some trees)
          rm -f kernel_platform/common/android/abi_gki_protected_exports_* || true
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || true

          # Remove -dirty from setlocalversion (keeps version clean even if we patch)
          for f in \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/msm-kernel/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do
            [ -f "$f" ] || continue
            sed -i 's/ -dirty//g' "$f"
            grep -q 'sed .* -dirty' "$f" || echo 'res=$(echo "$res" | sed "s/-dirty//g")' >> "$f"
          done

      - name: ⚡ Setup Baseband-guard
        if: ${{ github.event.inputs.bbg == 'On' }}
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform/common
          curl $CURL_OPTS -fsSL https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh -o setup.sh
          bash setup.sh

      - name: ⚡ Setup SukiSU Ultra
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform

          KSU_BRANCH="${{ github.event.inputs.KSU_BRANCH }}"

          echo "🛠️ Setting up SukiSU Ultra (${KSU_BRANCH})..."
          # IMPORTANT: use /main/ script (working reference workflows do this)
          curl $CURL_OPTS -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" -o /tmp/ksu_setup.sh
          bash /tmp/ksu_setup.sh "$KSU_BRANCH"

          # Compute KSU version info locally (no curl pipelines -> avoids curl:(23) broken pipe)
          cd KernelSU
          KSU_VERSION_COUNT=$(git rev-list --count HEAD)
          echo "KSUVER=$(expr $KSU_VERSION_COUNT + 37185)" >> "$GITHUB_ENV"

          KSU_API_VERSION=$(grep -m1 "KSU_VERSION_API :=" kernel/Kbuild | cut -d'=' -f2 | tr -d '[:space:]')
          KSU_COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          KSU_VERSION_FULL="v${KSU_API_VERSION}-${KSU_COMMIT_HASH}@Ox1d3x3_SUS"

          # Rewrite version block in kernel/Kbuild
          sed -i '/define get_ksu_version_full/,/endef/d' kernel/Kbuild
          sed -i '/KSU_VERSION_API :=/d' kernel/Kbuild
          sed -i '/KSU_VERSION_FULL :=/d' kernel/Kbuild

          TMP_FILE=$(mktemp)
          while IFS= read -r line; do
            echo "$line" >> "$TMP_FILE"
            if echo "$line" | grep -q 'REPO_OWNER :='; then
              cat >> "$TMP_FILE" <<EOF
          define get_ksu_version_full
          v\\\$\\\$1-${KSU_COMMIT_HASH}@Ox1d3x3_SUS
          endef

          KSU_VERSION_API := ${KSU_API_VERSION}
          KSU_VERSION_FULL := ${KSU_VERSION_FULL}
          EOF
            fi
          done < kernel/Kbuild
          mv "$TMP_FILE" kernel/Kbuild

          echo "✅ SukiSU Ultra version metadata configured: ${KSU_VERSION_FULL}"

      - name: 🔧 Apply SUSFS + ZRAM/LZ4 patches
        run: |
          set -euo pipefail

          cd kernel_workspace

          echo "⬇️ Cloning patch repos..."
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
          fi
          # SukiSU_patch contains lz4k/lz4kd patches used by known OP13 workflows
          git clone https://github.com/ShirkNeko/SukiSU_patch.git

          # Paths
          COMMON_DIR="kernel_platform/common"
          KSU_DIR="kernel_platform/KernelSU"

          # --- SUSFS (kernel-side) ---
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            echo "📦 Copying SUSFS payload..."
            cp -r susfs4ksu/kernel_patches/fs/* "$COMMON_DIR/fs/"
            cp -r susfs4ksu/kernel_patches/include/linux/* "$COMMON_DIR/include/linux/"

            echo "📌 Applying SUSFS kernel patch..."
            (cd "$COMMON_DIR" && patch -p1 --forward -l -F 3 < "../../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch")

            # Sanity: SUSFS sources must exist after patch
            if [ ! -f "$COMMON_DIR/fs/susfs.c" ] && [ ! -f "$COMMON_DIR/fs/susfs/susfs.c" ]; then
              echo "❌ SUSFS patch applied but susfs.c not found. Listing SUSFS-like files:" >&2
              find "$COMMON_DIR/fs" -maxdepth 3 -type f -iname '*susfs*' | head -n 120 || true
              exit 1
            fi
          fi

          # --- KernelSU SUSFS symbols must exist for real SUSFS integration ---
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            echo "🔎 Verifying KernelSU SUSFS Kconfig symbols exist..."
            if ! grep -RqsE '^[[:space:]]*(menuconfig|config)[[:space:]]+KSU_SUSFS([[:space:]]|$)' "$KSU_DIR/kernel" 2>/dev/null; then
              echo "❌ KernelSU tree does not expose KSU_SUSFS Kconfig symbols. SUSFS cannot be enabled via defconfig."
              echo "   Fix: set workflow input KSU_BRANCH=builtin (recommended), or use a KernelSU branch/commit that already includes SUSFS support."
              exit 1
            fi
            echo "✅ KernelSU exposes KSU_SUSFS symbols"
          fi

          # --- ZRAM/LZ4 patches (optional) ---
          if [ "${{ github.event.inputs.ZRAM_LZ4 }}" = "On" ]; then
            echo "🗜️ Applying ZRAM/LZ4 patches (if available)..."

            # Copy lz4k sources (used by known OP13 SukiSU Ultra workflows)
            if [ -d "SukiSU_patch/other/zram/lz4k" ]; then
              cp -r SukiSU_patch/other/zram/lz4k/include/linux/* "$COMMON_DIR/include/linux/" || true
              cp -r SukiSU_patch/other/zram/lz4k/lib/* "$COMMON_DIR/lib/" || true
              cp -r SukiSU_patch/other/zram/lz4k/crypto/* "$COMMON_DIR/crypto/" || true
            fi
            if [ -d "SukiSU_patch/other/zram/lz4k_oplus" ]; then
              cp -r SukiSU_patch/other/zram/lz4k_oplus "$COMMON_DIR/lib/" || true
            fi



            # Try SukiSU_patch lz4kd/lz4k_oplus patches first (used by OP13 reference workflows)
            LZ4KD_PATCH="SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch"
            LZ4K_OPLUS_PATCH="SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4k_oplus.patch"

            if [ -f "$LZ4KD_PATCH" ]; then
              cp "$LZ4KD_PATCH" "$COMMON_DIR/" && (cd "$COMMON_DIR" && patch -p1 -F 3 --forward < lz4kd.patch || true)
            else
              echo "ℹ️ lz4kd.patch not found at $LZ4KD_PATCH (skipping)"
            fi

            if [ -f "$LZ4K_OPLUS_PATCH" ]; then
              cp "$LZ4K_OPLUS_PATCH" "$COMMON_DIR/" && (cd "$COMMON_DIR" && patch -p1 -F 3 --forward < lz4k_oplus.patch || true)
            else
              echo "ℹ️ lz4k_oplus.patch not found at $LZ4K_OPLUS_PATCH (skipping)"
            fi
          fi

      - name: ⚙️ Configure Kernel Options (defconfig)
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform

          DEFCONFIG=./common/arch/arm64/configs/gki_defconfig
          [ -f "$DEFCONFIG" ] || { echo "❌ Missing defconfig: $DEFCONFIG"; exit 1; }

          append_cfg() {
            local line="$1"
            grep -qxF "$line" "$DEFCONFIG" || echo "$line" >> "$DEFCONFIG"
          }

          # Kernel name suffix
          SUF="${{ github.event.inputs.kernel_suffix }}"
          if [ -n "$SUF" ]; then
            LOCALVER="-${{ env.KERNEL_NAME }}-$SUF"
          else
            LOCALVER="-${{ env.KERNEL_NAME }}"
          fi

          # Always keep localversion stable
          sed -i '/^CONFIG_LOCALVERSION=/d' "$DEFCONFIG"
          append_cfg "CONFIG_LOCALVERSION=\"$LOCALVER\""
          append_cfg "CONFIG_LOCALVERSION_AUTO=n"

          # KernelSU base
          append_cfg "CONFIG_KSU=y"

          # ZRAM + LZ4 family (requires SukiSU_patch lz4k/lz4kd payload when enabled)
          if [ "${{ github.event.inputs.ZRAM_LZ4 }}" = "On" ]; then
            append_cfg "CONFIG_ZRAM_DEF_COMP_LZ4=y"
            append_cfg "CONFIG_ZRAM_DEF_COMP_LZORLE=n"
            append_cfg "CONFIG_CRYPTO_LZ4HC=y"
            append_cfg "CONFIG_CRYPTO_LZ4K=y"
            append_cfg "CONFIG_CRYPTO_LZ4KD=y"
            append_cfg "CONFIG_CRYPTO_842=y"
            append_cfg "CONFIG_CRYPTO_LZ4K_OPLUS=y"
            append_cfg "CONFIG_ZRAM_WRITEBACK=y"
          fi

          # SUSFS toggles (append only if the symbol exists in KernelSU Kconfig)
          has_symbol() {
            local sym="$1"
            grep -RqsE "^(menuconfig|config)[[:space:]]+${sym}([[:space:]]|$)" ./KernelSU/kernel 2>/dev/null
          }
          append_sym() {
            local sym="$1"
            local val="$2"
            if has_symbol "$sym"; then
              append_cfg "CONFIG_${sym}=${val}"
            else
              echo "ℹ️ Skipping CONFIG_${sym}=${val} (symbol not found in KernelSU Kconfig)"
            fi
          }

          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            echo "📦 Enabling SUSFS config..."
            append_sym KSU_SUSFS y
            append_sym KSU_SUSFS_SUS_PATH y
            append_sym KSU_SUSFS_SUS_MOUNT y
            append_sym KSU_SUSFS_SUS_KSTAT y
            append_sym KSU_SUSFS_SPOOF_UNAME y
            append_sym KSU_SUSFS_ENABLE_LOG y
            append_sym KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
            append_sym KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG y
            append_sym KSU_SUSFS_OPEN_REDIRECT y
            append_sym KSU_SUSFS_SUS_MAP y
          else
            echo "📦 SUSFS=Off, enabling Manual Hook (if supported)..."
            append_sym KSU_SUSFS n
            append_sym KSU_MANUAL_HOOK y
          fi

      - name: ✅ Preflight Verify SUSFS + LZ4 are REAL
        run: |
          set -euo pipefail

          cd kernel_workspace/kernel_platform/common

          echo "🔧 Generating .config from gki_defconfig..."
          make -j"$(nproc --all)" ARCH=arm64 O=out gki_defconfig

          echo "---- Effective config (KSU/SUSFS/ZRAM) ----"
          grep -nE '^CONFIG_KSU=|^CONFIG_KSU_SUSFS=|^CONFIG_ZRAM=|^CONFIG_ZRAM_DEF_COMP|^CONFIG_CRYPTO_LZ4K=|^CONFIG_CRYPTO_LZ4KD=|^CONFIG_CRYPTO_LZ4K_OPLUS=' out/.config || true

          if ! grep -q '^CONFIG_KSU=y' out/.config; then
            echo "❌ CONFIG_KSU=y missing in out/.config" >&2
            exit 1
          fi

          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            # If the symbol doesn't exist in the Kconfig tree, Kconfig will drop it.
            if ! grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
              echo "❌ SUSFS requested but CONFIG_KSU_SUSFS is NOT enabled in out/.config" >&2
              echo "   Checking if KSU_SUSFS symbol exists in KernelSU tree..." >&2
              grep -RIn --max-count=80 -E '(^[[:space:]]*(menuconfig|config)[[:space:]]+KSU_SUSFS)|KSU_SUSFS|SUSFS' ../KernelSU/kernel 2>/dev/null || true
              exit 1
            fi
          fi

          if [ "${{ github.event.inputs.ZRAM_LZ4 }}" = "On" ]; then
            if ! grep -q '^CONFIG_ZRAM_DEF_COMP_LZ4=y' out/.config; then
              echo "❌ ZRAM_LZ4 requested but CONFIG_ZRAM_DEF_COMP_LZ4 is NOT enabled in out/.config" >&2
              exit 1
            fi
          fi

          if [ "${{ github.event.inputs.ZRAM_LZ4 }}" = "On" ]; then
            if ! grep -q '^CONFIG_CRYPTO_LZ4K=y' out/.config; then
              echo "❌ ZRAM_LZ4 requested but CONFIG_CRYPTO_LZ4K is NOT enabled in out/.config" >&2
              echo "   This usually means the lz4k payload/patches did not apply to your kernel tree." >&2
              exit 1
            fi
            if ! grep -q '^CONFIG_CRYPTO_LZ4KD=y' out/.config; then
              echo "❌ ZRAM_LZ4 requested but CONFIG_CRYPTO_LZ4KD is NOT enabled in out/.config" >&2
              exit 1
            fi
          fi

          echo "✅ Preflight checks passed"

      - name: 📅 Set up custom BUILD_TIME
        shell: bash
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='Australia/Perth' date +'%a %b %d %T %Z %Y')"
            echo "Using Perth time as fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/"
          for f in common/scripts/mkcompile_h msm-kernel/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching $f with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\\(.*?\\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              fi
            fi
          done

      - name: 🔨 Build Kernel
        run: |
          set -euo pipefail
          echo "🏗️ Starting kernel build..."

          export PATH="/usr/lib/ccache:$HOME/toolchains/neutron-clang/bin:$PATH"
          export PATH="/usr/lib/ccache:$PATH"

          cd kernel_workspace/kernel_platform/common

          set -o pipefail
          echo "---- Tool versions ----"
          clang --version || true
          ld.lld --version || true
          aarch64-linux-gnu-objcopy --version || true

          echo "---- Build (LLVM_IAS=1) ----"
          make -j"$(nproc --all)" \
            LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD=ld.lld HOSTLD=ld.lld O=out \
            KCFLAGS+=-O2 gki_defconfig all 2>&1 | tee build.log || {
              echo "❌ Build failed (LLVM_IAS=1). Retrying with LLVM_IAS=0..." >&2
              make -j"$(nproc --all)" \
                LLVM=1 LLVM_IAS=0 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
                CC="ccache clang" LD=ld.lld HOSTLD=ld.lld O=out \
                KCFLAGS+=-O2 gki_defconfig all 2>&1 | tee -a build.log
            }

          ccache -s || true
          echo "✅ Kernel build complete"

      - name: 📤 Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel_workspace/kernel_platform/common/build.log

      - name: 📦 Package Kernel
        run: |
          set -euo pipefail
          echo "📦 Preparing AnyKernel3 packaging environment..."
          git clone https://github.com/mrcxlinux/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/

          image_path=$(find "./kernel_workspace/kernel_platform/common/out/" -name "Image" | head -n 1)
          if [ -z "$image_path" ] || [ ! -f "$image_path" ]; then
            echo "❌ Image not found under common/out" >&2
            find "./kernel_workspace/kernel_platform/common/out" -maxdepth 4 -type f -name Image | head -n 20 || true
            exit 1
          fi

          echo "✅ Image found: $image_path"
          cp "$image_path" ./AnyKernel3/Image
          cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image

      - name: 🧩 Patch Kernel Image (KPM)
        if: ${{ github.event.inputs.KPM == 'On' }}
        run: |
          set -euo pipefail
          echo "🔧 Applying KPM patch..."
          cd kernel_workspace/kernel_platform/out/Final-Image-Find
          curl -LO $CURL_OPTS https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.13.0/patch_linux
          chmod +x patch_linux
          ./patch_linux

          rm -f Image
          mv oImage Image
          cp Image "$GITHUB_WORKSPACE/AnyKernel3/Image"
          echo "✅ KPM patch applied"

      - name: 🧠 Set Artifact Name
        id: set_name
        run: |
          BASE_NAME="SukiSU_Ultra_${{ env.KSUVER }}"
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            FINAL_NAME="${BASE_NAME}_SUSFS"
          else
            FINAL_NAME="${BASE_NAME}"
          fi
          if [ "${{ github.event.inputs.ZRAM_LZ4 }}" = "On" ]; then
            FINAL_NAME="${FINAL_NAME}_LZ4"
          fi
          echo "ARTIFACT_NAME=${FINAL_NAME}" >> $GITHUB_OUTPUT

      - name: 📤 Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_name.outputs.ARTIFACT_NAME }}
          path: ./AnyKernel3/*

      - name: 📝 Make ZRAM module
        run: |
          set -euo pipefail
          echo "📥 Downloading zram.zip..."
          curl -L $CURL_OPTS "https://github.com/cctv18/oppo_oplus_realme_sm8750/raw/refs/heads/main/zram.zip" -o "$GITHUB_WORKSPACE/zram.zip"

          unzip -q "$GITHUB_WORKSPACE/zram.zip" -d "$GITHUB_WORKSPACE/zram"

          echo "🔁 Replacing zram.ko..."
          find "$GITHUB_WORKSPACE/zram" -name "zram.ko" -exec cp "./kernel_workspace/kernel_platform/common/out/drivers/block/zram/zram.ko" {} \;

          rm -f "$GITHUB_WORKSPACE/zram.zip"
          cd "$GITHUB_WORKSPACE/zram"
          zip -qr "../zram.zip" .

      - name: 📤 Upload zram.zip
        uses: actions/upload-artifact@v4
        with:
          name: zram-module.zip
          path: ./zram.zip
