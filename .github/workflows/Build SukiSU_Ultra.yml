          # "latest"/"latest-tag"/empty means no checkout argument, so setup.sh selects the latest tag.
          # You can still type main, a tag, or a commit in sukisu_ref for testing.
          SETUP_ARG="${{ github.event.inputs.sukisu_ref }}"
