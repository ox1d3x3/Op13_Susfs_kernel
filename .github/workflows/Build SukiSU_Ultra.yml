name: OP13 SukiSU Ultra

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "Root backend. KSUN is known-good from WildKernels release; SukiSU is intentionally blocked in this workflow until the KSUN baseline is confirmed."
        type: choice
        required: true
        default: ksun_known_good
        options:
          - ksun_known_good
          - sukisu_builtin_blocked
      feature_set:
        description: "Feature preset"
        type: choice
        required: true
        default: daily
        options:
          - daily
          - minimal
          - wild_full
      clean_build:
        description: "Clean build without ccache"
        type: boolean
        required: true
        default: false
      build_timestamp:
        description: "Stock-like uname timestamp. Leave this default for OP13 OOS16/PJZ110 6.6.89 mimic."
        type: string
        required: false
        default: "Mon Dec  8 04:00:43 UTC 2025"
      ksun_commit:
        description: "KernelSU Next commit. Default mirrors WildKernels v2.1.0-r2 working OP13 release."
        type: string
        required: false
        default: "551ad80473f60e052917aec08abf5323b6ab2f7c"
      susfs_commit:
        description: "SUSFS android15-6.6 commit. Default mirrors WildKernels v2.1.0-r2."
        type: string
        required: false
        default: "85bcfac5edc8ba7808581e8d0a3ca9c7deca78e4"

concurrency:
  group: op13-wildbase-daily-${{ github.ref }}
  cancel-in-progress: false

env:
  OP_MODEL: OP13
  OP_SOC: sun
  OP_OS_VERSION: OOS16
  OP_ANDROID_VERSION: android15
  OP_KERNEL_VERSION: "6.6"
  OP_EXPECTED_UTS: "6.6.89-android15-8-g7e1f3c083cc6-abogki467167594-4k"
  OP_STOCK_LOCALVERSION: "-android15-8-g7e1f3c083cc6-abogki467167594-4k"
  OP_MANIFEST_FILE: oneplus_13_w.xml
  WILD_REPO: WildKernels/OnePlus_KernelSU_SUSFS
  WILD_REF: main

jobs:
  guard:
    name: Guardrails
    runs-on: ubuntu-latest
    outputs:
      hmbird: ${{ steps.preset.outputs.hmbird }}
      susfs: ${{ steps.preset.outputs.susfs }}
      ds: ${{ steps.preset.outputs.ds }}
      bbg: ${{ steps.preset.outputs.bbg }}
      bbr: ${{ steps.preset.outputs.bbr }}
      ttl: ${{ steps.preset.outputs.ttl }}
      ip_set: ${{ steps.preset.outputs.ip_set }}
      unicode: ${{ steps.preset.outputs.unicode }}
      ntsync: ${{ steps.preset.outputs.ntsync }}
    steps:
      - name: Validate backend choice
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.backend }}" = "sukisu_builtin_blocked" ]; then
            cat <<'EOF' >&2
          SukiSU builtin is intentionally blocked in this WildBase workflow.

          Reason:
          - The user-tested working OP13 OOS16 android15-6.6.89 release is:
            AK3_OP13_OOS16_android15-6.6.89_KSUN_33129_SuSFS_v2.1.0.zip
          - The previous SukiSU/SUSFS-Off tests still bootlooped.
          - For a stable daily-driver baseline, first reproduce the known-good KSUN + Wild SUSFS stack.

          After this KSUN build boots, porting SukiSU builtin should be done as a separate controlled workflow.
          EOF
            exit 1
          fi

      - name: Resolve feature preset
        id: preset
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.feature_set }}" in
            minimal)
              HMBIRD=false; SUSFS=true; DS=false; BBG=false; BBR=false; TTL=false; IP_SET=false; UNICODE=false; NTSYNC=false ;;
            daily)
              HMBIRD=true;  SUSFS=true; DS=true;  BBG=true;  BBR=true;  TTL=true;  IP_SET=true;  UNICODE=true;  NTSYNC=true ;;
            wild_full)
              HMBIRD=true;  SUSFS=true; DS=true;  BBG=true;  BBR=true;  TTL=true;  IP_SET=true;  UNICODE=true;  NTSYNC=true ;;
            *) echo "Unknown feature_set" >&2; exit 1 ;;
          esac
          {
            echo "hmbird=$HMBIRD"
            echo "susfs=$SUSFS"
            echo "ds=$DS"
            echo "bbg=$BBG"
            echo "bbr=$BBR"
            echo "ttl=$TTL"
            echo "ip_set=$IP_SET"
            echo "unicode=$UNICODE"
            echo "ntsync=$NTSYNC"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build OP13 OOS16 WildBase KSUN/SUSFS
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout WildKernels build action and manifests
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WILD_REPO }}
          ref: ${{ env.WILD_REF }}
          path: wild
          fetch-depth: 1

      - name: Prepare Wild manifest/config in current workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p manifests/oos16 configs/oos16
          cp wild/manifests/oos16/${OP_MANIFEST_FILE} manifests/oos16/${OP_MANIFEST_FILE}
          cat > configs/oos16/OP13.json <<EOF
          {
            "model": "OP13",
            "soc": "sun",
            "branch": "wild/sm8750",
            "manifest": "oneplus_13_w.xml",
            "android_version": "android15",
            "kernel_version": "6.6",
            "os_version": "OOS16",
            "lto": "thin",
            "zyc_compiler": "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240723-release/Clang-19.0.0git-20240723.tar.gz",
            "c_compiler": "kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin",
            "rust_compiler": "",
            "bindgen": "",
            "rust_build": false,
            "disk_cleanup": false,
            "hmbird": ${{ needs.guard.outputs.hmbird }},
            "susfs": ${{ needs.guard.outputs.susfs }},
            "ds": ${{ needs.guard.outputs.ds }},
            "bbg": ${{ needs.guard.outputs.bbg }},
            "bbr": ${{ needs.guard.outputs.bbr }},
            "ttl": ${{ needs.guard.outputs.ttl }},
            "ip_set": ${{ needs.guard.outputs.ip_set }},
            "unicode": ${{ needs.guard.outputs.unicode }},
            "ntsync": ${{ needs.guard.outputs.ntsync }},
            "uname": "OP-WILD"
          }
          EOF
          echo "Using OP13 config:"
          jq . configs/oos16/OP13.json
          echo "Using manifest:"
          sed -n '1,120p' manifests/oos16/${OP_MANIFEST_FILE}

      - name: Prepare op_config_json
        id: opconfig
        shell: bash
        run: |
          set -euo pipefail
          cfg="$(jq -c . configs/oos16/OP13.json)"
          echo "config_json=$cfg" >> "$GITHUB_OUTPUT"
          echo "$cfg" | jq .

      - name: Install minimal dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip zip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils
          sudo apt-get clean

      - name: Build with WildKernels action, known-good KSUN 33129 + SUSFS v2.1.0 baseline
        id: build
        uses: ./wild
        with:
          op_config_json: ${{ steps.opconfig.outputs.config_json }}
          ksu_type: KSUN
          ksu_branch_or_hash: ${{ inputs.ksun_commit }}
          susfs_commit_hash_or_branch: ${{ inputs.susfs_commit }}
          optimize_level: O2
          build_timestamp: ${{ inputs.build_timestamp }}
          clean: ${{ inputs.clean_build }}

      - name: Collect and verify outputs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out_artifacts/debug

          echo "Kernel version output: ${{ steps.build.outputs.kernel_version }}" | tee out_artifacts/debug/build_outputs.txt
          echo "KSU version output   : ${{ steps.build.outputs.ksu_version }}" | tee -a out_artifacts/debug/build_outputs.txt
          echo "SUSFS version output : ${{ steps.build.outputs.susfs_version }}" | tee -a out_artifacts/debug/build_outputs.txt
          echo "Image SHA256 output  : ${{ steps.build.outputs.image_sha256 }}" | tee -a out_artifacts/debug/build_outputs.txt

          # Locate generated flashable ZIP(s). Wild action normally creates AK3_*.zip artifacts.
          mapfile -t zips < <(find "$GITHUB_WORKSPACE" -type f -name '*.zip' \
            ! -path '*/.git/*' ! -path '*/wild/.git/*' | sort)

          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No flashable ZIP found after build. Searching workspace for clues..."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | sort | sed -n '1,300p'
            exit 1
          fi

          echo "Found ZIPs:"
          printf '%s\n' "${zips[@]}"

          for z in "${zips[@]}"; do
            cp "$z" out_artifacts/
          done
          sha256sum out_artifacts/*.zip | tee out_artifacts/SHA256SUMS.txt

          # Debug bundle: final configs, kernel release, image version string if available.
          find "$GITHUB_WORKSPACE" -path '*/out/.config' -type f -print -exec cp {} out_artifacts/debug/final.config \; || true
          find "$GITHUB_WORKSPACE" -path '*/include/generated/utsrelease.h' -type f -print -exec cp {} out_artifacts/debug/utsrelease.h \; || true
          find "$GITHUB_WORKSPACE" -path '*/out/include/generated/utsrelease.h' -type f -print -exec cp {} out_artifacts/debug/utsrelease_out.h \; || true
          find "$GITHUB_WORKSPACE" -type f -name Image -print | tee out_artifacts/debug/images_found.txt || true

          IMAGE="$(find "$GITHUB_WORKSPACE" -type f -name Image | head -n1 || true)"
          if [ -n "$IMAGE" ]; then
            strings "$IMAGE" | grep -m1 -E 'Linux version 6\.6\.89|Android clang|Ubuntu clang|clang version' | tee out_artifacts/debug/image_version_string.txt || true
          fi

          # Guardrail: final package should be for OP13/OOS16 android15-6.6.89 and KSUN/SuSFS.
          ls -lah out_artifacts
          echo "artifact_dir=out_artifacts" >> "$GITHUB_OUTPUT"

      - name: Upload flash ZIP and debug bundle
        uses: actions/upload-artifact@v4
        with:
          name: OP13-WildBase-Daily-KSUN-SuSFS-v2.1.0-${{ github.run_number }}
          path: out_artifacts/**
          if-no-files-found: error
          retention-days: 14
