name: OP13 SukiSU Ultra
env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: android15
  # Label only (major.minor). Actual release (e.g. 6.6.89) is detected at build time.
  KERNEL_VERSION: "6.6"
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "8G"
  GIT_TERMINAL_PROMPT: "0"

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Toolchain"
        type: choice
        required: true
        default: aosp_prebuilt
        options: [aosp_prebuilt, neutron_clang]

      profile:
        description: "Build profile (safe presets)"
        type: choice
        required: true
        default: balanced
        options: [battery, balanced, performance]


      lz4_zram_patch:
        description: "Apply ZRAM LZ4 perf patch (best-effort, may not apply on all trees)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      zram_module:
        description: "Build flashable zram-module.zip (replace zram.ko)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      SUSFS:
        description: "Enable SUSFS"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      susfs_mode:
        description: "SUSFS source (recommended: sukisu; external applies susfs4oki patch)"
        type: choice
        required: true
        default: external
        options: [sukisu, external]

      ksunext_multimanager:
        description: "Apply multi-manager patch (best-effort)"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      bbg:
        description: "Enable Baseband-Guard (BBG)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      bbr:
        description: "Enable BBR congestion control"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      adios:
        description: "Enable ADIOS I/O scheduler"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      rekernel:
        description: "Enable Re-Kernel support"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      proxy:
        description: "Enable proxy/network tweaks (best-effort)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      TTL:
        description: "Enable TTL target/match (netfilter)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      IP_SET:
        description: "Enable IP_SET (netfilter ipset)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      hmbird:
        description: "Dont use HMBIRD/Fengchi option/May Create instability"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      kernel_suffix:
        description: "Kernel suffix (LOCALVERSION). Leave empty to use KERNEL_NAME"
        type: string
        required: false
        default: ""

      BUILD_TIME:
        description: "Custom build time string (Enter F to use current UTC)"
        type: string
        required: false
        default: "Thu Dec 11 04:17:27 UTC 2025"

      BUILD_USER:
        description: "KBUILD_BUILD_USER"
        type: string
        required: false
        default: "OnePlus"

      BUILD_HOST:
        description: "KBUILD_BUILD_HOST"
        type: string
        required: false
        default: "ubuntu-build"

      create_release:
        description: "Create a GitHub Release (optional)"
        type: choice
        required: false
        default: "false"
        options: ["false", "true"]

jobs:
  build:
    name: "SUSFS=${{ github.event.inputs.SUSFS }} | Toolchain=${{ github.event.inputs.toolchain }}"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: "Runner disk preflight"
        id: disk
        shell: bash
        run: |
          set -euo pipefail
          echo "Memory and swap:"
          free -h || true
          echo ""
          echo "Swap devices:"
          swapon --show || true
          echo ""
          echo "Block devices:"
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS || true
          echo ""
          echo "Disk usage:"
          df -hT || true
          echo ""
          use_maximize=false
          has_mnt_disk=false

          if findmnt -n /mnt >/dev/null 2>&1; then
            SRC="$(findmnt -n -o SOURCE /mnt || true)"
            echo "/mnt is a mount point from: $SRC"
            if [[ "$SRC" == /dev/* ]]; then
              has_mnt_disk=true
              MNT_FREE_MB="$(df -Pm /mnt | awk 'NR==2 {print $4}' || true)"
              echo "/mnt free (MB): $MNT_FREE_MB"
              if [[ "$MNT_FREE_MB" =~ ^[0-9]+$ ]] && [[ "$MNT_FREE_MB" -gt 20000 ]]; then
                use_maximize=true
              else
                echo "Skipping maximize-build-space: /mnt does not have enough free space."
              fi
            fi
          else
            echo "/mnt is NOT a mount point on this runner."
          fi

          echo "has_mnt_disk=$has_mnt_disk" >> "$GITHUB_OUTPUT"
          echo "use_maximize=$use_maximize" >> "$GITHUB_OUTPUT"

      - name: "Maximize build space (only if /mnt temp disk exists)"
        if: steps.disk.outputs.use_maximize == 'true'
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: "Extra disk cleanup"
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo docker image prune -a -f || true
          sudo docker system prune -af || true
          df -hT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Git auth for non-interactive clones
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prevent any interactive prompts during git operations
          git config --global credential.helper store
          git config --global core.askPass true
          # Use the workflow token for any https://github.com/ clones (public or private where permitted)
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: "Setup ccache directory"
        shell: bash
        run: |
          set -euo pipefail
          echo "CCACHE_DIR=$HOME/.ccache_SukiSUUltra" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ccache_SukiSUUltra"

      - name: "Restore ccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-op13-sukisuultra-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.SUSFS }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-op13-sukisuultra-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.SUSFS }}-
            ccache-${{ runner.os }}-op13-sukisuultra-

      - name: "Install build dependencies"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             python3 python3-pip git curl wget ca-certificates rsync unzip zip file             build-essential flex bison bc gawk ccache             clang lld llvm dwarves             libssl-dev libncurses-dev libelf-dev libdw-dev zlib1g-dev liblz4-tool             libxml2-utils dos2unix jq
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -s

      - name: "Install repo tool"
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > /tmp/repo
          chmod a+x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo
          repo --version

      - name: "Sync kernel sources"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          # Manifest repo: only zh branch contains manifest.xml
          MANIFEST_REPO="https://github.com/mrcxlinux/actions_oplus_sm8750.git"
          MANIFEST_BRANCH="zh"
          MANIFEST_FILE="manifest.xml"
          echo "Using manifest: $MANIFEST_REPO ($MANIFEST_BRANCH/$MANIFEST_FILE)"
          curl -fsSL "https://raw.githubusercontent.com/mrcxlinux/actions_oplus_sm8750/${MANIFEST_BRANCH}/${MANIFEST_FILE}" >/dev/null
          repo init -u "$MANIFEST_REPO" -b "$MANIFEST_BRANCH" -m "$MANIFEST_FILE" --depth=1
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle --force-sync

          rm -f kernel_platform/common/android/abi_gki_protected_exports_* || true
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || true

          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion || true
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion || true
          sed -i 's/ -dirty//g' kernel_platform/external/dtc/scripts/setlocalversion || true

      - name: "Select toolchain"
        shell: bash
        run: |
          set -euo pipefail
          echo "Selected toolchain: ${{ github.event.inputs.toolchain }}"
          if [ "${{ github.event.inputs.toolchain }}" = "neutron_clang" ]; then
            mkdir -p "$HOME/toolchains"
            cd "$HOME/toolchains"
            git clone --depth=1 https://github.com/Neutron-Toolchains/antman.git antman
            cd antman
            bash antman -S
            echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          else
            cd "$GITHUB_WORKSPACE/kernel_workspace"
            CANDIDATE="$(find . -type f -path '*prebuilts/clang/host/linux-x86/*/bin/clang' | head -n 1 || true)"
            if [ -z "$CANDIDATE" ]; then
              echo "Error: clang prebuilts not found under kernel_workspace."
              exit 1
            fi
            echo "$(dirname "$CANDIDATE")" >> "$GITHUB_PATH"
          fi
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

          # Add AOSP kernel build tools (contains ld.lld, llvm-ar, etc.) to PATH
          KERNEL_PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          ADD_PATHS=()
          for p in "$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin" \
                    "$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux_musl-x86/bin"; do
            if [ -d "$p" ]; then
              echo "$p" >> "$GITHUB_PATH"
              ADD_PATHS+=("$p")
            fi
          done

          # Also export for THIS step so we can verify tools now
          if [ "${#ADD_PATHS[@]}" -gt 0 ]; then
            export PATH="$(IFS=:; echo "${ADD_PATHS[*]}"):$PATH"
          fi

          echo "Toolchain check:"
          echo "  clang:  $(command -v clang || true)"
          echo "  ld.lld: $(command -v ld.lld || true)"
          clang --version || true
          ld.lld --version || true

      - name: "Apply SUSFS"
        shell: bash
        run: |
          SUSFS_IN="${{ inputs.SUSFS }}"
          SUSFS_MODE="${{ inputs.susfs_mode }}"
          set -euo pipefail

          if [[ "${{ github.event.inputs.SUSFS }}" != "On" ]]; then
            echo "SUSFS disabled → skipping."
            exit 0
          fi

          # If SukiSU was integrated with susfs-main, DO NOT apply external susfs4oki patches again.
          if [[ "${SUKISU_HAS_SUSFS:-0}" == "1" ]]; then
            echo "SUSFS provided by SukiSU setup (susfs-main) → skipping external SUSFS patch to avoid double-patching."
            exit 0
          fi


          KERNEL_PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

          # Auto-detect kernel source root (some manifests use common/, some use common/common/)
          CANDIDATES=(
            "$KERNEL_PLATFORM/common"
            "$KERNEL_PLATFORM/common/common"
          )

          KERNEL_DIR=""
          for c in "${CANDIDATES[@]}"; do
            if [[ -f "$c/Makefile" && -d "$c/fs" ]]; then
              KERNEL_DIR="$c"
              break
            fi
          done

          if [[ -z "$KERNEL_DIR" ]]; then
            echo "::error::Could not detect kernel source root under $KERNEL_PLATFORM"
            echo "Listing kernel_platform:"
            ls -la "$KERNEL_PLATFORM" || true
            echo "Listing common candidates:"
            ls -la "$KERNEL_PLATFORM/common" || true
            ls -la "$KERNEL_PLATFORM/common/common" || true
            exit 1
          fi

                    echo "✅ Kernel root detected: $KERNEL_DIR"
          # susfs4oki patches sometimes are generated relative to kernel_platform root (paths start with common/)
          # so we dynamically choose where to apply the patch from.
          KERNEL_PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          SRC_REL="$(realpath --relative-to="$KERNEL_PLATFORM" "$KERNEL_DIR" 2>/dev/null || echo "common")"
          echo "Kernel source relpath: $SRC_REL"

          SUSFS_SRC_BRANCH="oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
          SUSFS_PATCH_TAG="gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
          echo "Using susfs4oki clone branch: $SUSFS_SRC_BRANCH"
          echo "Using SUSFS patch tag: $SUSFS_PATCH_TAG"

          SUSFS_FOLDER="$GITHUB_WORKSPACE/susfs4oki"
          rm -rf "$SUSFS_FOLDER" || true

          repo="https://github.com/cctv18/susfs4oki.git"
          echo "→ Checking susfs4oki: $repo"
          if ! git ls-remote --exit-code --heads "$repo" "$SUSFS_SRC_BRANCH" >/dev/null 2>&1; then
            echo "::error::Could not find susfs4oki branch '$SUSFS_SRC_BRANCH' on $repo"
            exit 1
          fi

          echo "→ Cloning $repo ($SUSFS_SRC_BRANCH)"
          git clone --depth 1 --no-tags -b "$SUSFS_SRC_BRANCH" "$repo" "$SUSFS_FOLDER"

          echo "::group::Copy SUSFS source/header files (if present)"
          # Some SUSFS branches ship extra files outside the main patch.
          if [[ -d "$SUSFS_FOLDER/kernel_patches/fs" ]]; then
            cp -a "$SUSFS_FOLDER/kernel_patches/fs/." "$KERNEL_DIR/fs/" || true
          fi
          if [[ -d "$SUSFS_FOLDER/kernel_patches/include/linux" ]]; then
            mkdir -p "$KERNEL_DIR/include/linux"
            cp -a "$SUSFS_FOLDER/kernel_patches/include/linux/." "$KERNEL_DIR/include/linux/" || true
          fi
          echo "::endgroup::"

          # --- Pre-adjustments (borrowed from WildKernel) to help the gki-android15-6.6 patch match ---
          fake_patched=0
          if [[ "${{ env.ANDROID_VERSION }}" == "android15" && "${{ env.KERNEL_VERSION }}" == "6.6" ]]; then
            if [[ -f "./fs/namespace.c" ]] && ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
              if grep -q '#include <trace/hooks/blk.h>' ./fs/namespace.c; then
                sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace/hooks/fs.h>' ./fs/namespace.c
              else
                # Fallback: inject near top of file
                sed -i '1i #include <trace/hooks/fs.h>' ./fs/namespace.c
              fi
            fi

            if [[ -f "./fs/proc/task_mmu.c" ]] && ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
              if grep -q 'int ret = 0, copied = 0;' ./fs/proc/task_mmu.c; then
                echo "Applying temporary context lines for task_mmu.c (for patch matching)..."
                sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;'                  -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t *res = NULL;' ./fs/proc/task_mmu.c
                fake_patched=1
              else
                echo "::warning::Anchor line not found in fs/proc/task_mmu.c; skipping temporary context insert."
              fi
            fi
          fi

          PATCH_FILE="$SUSFS_FOLDER/kernel_patches/50_add_susfs_in_${SUSFS_PATCH_TAG}.patch"
          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "::error::Missing SUSFS patch file: $PATCH_FILE"
            echo "Available patches:"
            ls -la "$SUSFS_FOLDER/kernel_patches" || true
            exit 1
          fi

          # Decide patch root based on patch file paths
          PATCH_CWD="$KERNEL_DIR"
          if grep -qE "^diff --git a/common/|^\+\+\+ b/common/" "$PATCH_FILE" >/dev/null 2>&1; then
            PATCH_CWD="$KERNEL_PLATFORM"
          elif grep -qE "^diff --git a/${SRC_REL}/|^\+\+\+ b/${SRC_REL}/" "$PATCH_FILE" >/dev/null 2>&1; then
            PATCH_CWD="$KERNEL_PLATFORM"
          fi
          echo "Patch will be applied from: $PATCH_CWD"
          cd "$PATCH_CWD"

          echo "::group::Apply SUSFS main patch"
          if patch -p1 --dry-run -R < "$PATCH_FILE" >/dev/null 2>&1; then
            echo "↪ SUSFS patch already applied"
          else
            if patch -p1 --dry-run --forward < "$PATCH_FILE" >/dev/null 2>&1; then
              patch -p1 --forward < "$PATCH_FILE"
            else
              echo "Patch does not apply cleanly → retrying with fuzz=3"
              patch -p1 --forward -F 3 < "$PATCH_FILE"
            fi
          fi
          echo "::endgroup::"
          echo "::group::Post-patch SUSFS symbol check"
          if grep -Rqs "KSU_SUSFS" "$KERNEL_DIR" 2>/dev/null; then
            echo "✅ KSU_SUSFS symbols present after SUSFS patch."
            (cd "$KERNEL_DIR" && grep -Rns "KSU_SUSFS" drivers fs include 2>/dev/null | head -n 60) || true
          else
            echo "::warning::KSU_SUSFS symbols still not found after SUSFS patch. This usually means the patch was applied to the wrong root or the branch does not match this kernel tree."
          fi
          echo "::endgroup::"

          # Hard check: SukiSU SUSFS_INLINE_HOOK needs <linux/susfs.h> present in the kernel tree
          if [[ "$SUSFS_IN" == "On" ]]; then
            if [[ -f "$KERNEL_DIR/include/linux/susfs.h" ]]; then
              echo "✅ Found header: $KERNEL_DIR/include/linux/susfs.h"
            else
              echo "::error::SUSFS requested but $KERNEL_DIR/include/linux/susfs.h is missing. SUSFS patch did not land in the real kernel source root."
              echo "::group::Find susfs.h"
              find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -path "*/include/linux/susfs.h" -o -name "susfs.h" | head -n 50 || true
              echo "::endgroup::"
              exit 1
            fi
          fi


          # Revert temporary context lines (if we injected them)
          if [[ "$fake_patched" == "1" ]]; then
            sed -i -e '/unsigned int nr_subpages = __PAGE_SIZE \/ PAGE_SIZE;/d'              -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c || true
          fi


          echo "::group::SUSFS ↔ KernelSU compat (legacy uname helpers)"
          # KernelSU/SukiSU v3.x (some forks) may still reference legacy SUSFS uname helpers that were removed/renamed in SUSFS v2.
          # If so, add small compatibility stubs into fs/susfs.c to satisfy linkage without changing runtime behavior.
          if [[ -f "./drivers/kernelsu/supercalls.c" ]] && grep -q "susfs_uname_is_active" "./drivers/kernelsu/supercalls.c"; then
            echo "KernelSU references legacy uname helpers → adding SUSFS v2 compat stubs"
            if [[ -f "./fs/susfs.c" ]] && ! grep -q "susfs_uname_is_active" "./fs/susfs.c"; then
          python3 - <<'PY'
          from pathlib import Path
          p = Path('./fs/susfs.c')
          code = r'''
          
          /* --- SUSFS v2 compatibility for older KernelSU variants (legacy uname helpers) --- */
          /* Some KernelSU forks still call these legacy helpers. SUSFS v2 uses susfs_set_uname()/susfs_spoof_uname(). */
          #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
          bool susfs_uname_is_active(void) { return true; }
          #else
          bool susfs_uname_is_active(void) { return false; }
          #endif
          
          /* Legacy no-op: SUSFS v2 persists uname spoof via susfs_set_uname() from userspace. */
          void susfs_set_uname_from_kernel(void) { }
          
          '''
          src = p.read_text(encoding='utf-8')
          if 'susfs_uname_is_active' not in src:
              p.write_text(src + code, encoding='utf-8')
          PY
            else
              echo "fs/susfs.c missing or compat stubs already present; skipping."
            fi
          else
            echo "KernelSU does not reference legacy uname helpers; no compat needed."
          fi
          echo "::endgroup::"

          echo "::group::SUSFS sanity checks"
          # These checks prevent "SUSFS=On" kernels that actually don't include SUSFS.
          if [[ ! -f "./fs/susfs.c" ]]; then
            echo "::warning::fs/susfs.c not found (patch may embed SUSFS in other files)."
          fi

          if ! grep -Rqs "KSU_SUSFS\|SUSFS" ./fs ./include/linux 2>/dev/null; then
            echo "::error::SUSFS strings not found in fs/ or include/linux after patching. Integration likely failed."
            exit 1
          fi
          echo "::endgroup::"

          echo "✅ SUSFS patching complete."

      - name: "Integrate SukiSU Ultra (builtin, official setup.sh)"
        shell: bash
        run: |
          SUSFS_IN="${{ inputs.SUSFS }}"
          SUSFS_MODE="${{ inputs.susfs_mode }}"
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          KERNEL_PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

          # Auto-detect actual kernel source root (many trees build from common/, not kernel_platform/).
          CANDIDATES=(
            "$KERNEL_PLATFORM/common"
            "$KERNEL_PLATFORM/common/common"
            "$KERNEL_PLATFORM"
          )

          KERNEL_DIR=""
          for c in "${CANDIDATES[@]}"; do
            if [[ -f "$c/Makefile" && -d "$c/drivers" && -d "$c/arch" ]]; then
              KERNEL_DIR="$c"
              break
            fi
          done

          if [[ -z "$KERNEL_DIR" ]]; then
            echo "::group::kernel_platform layout"
            ls -la "$KERNEL_PLATFORM" || true
            find "$KERNEL_PLATFORM" -maxdepth 3 -type f \( -name Makefile -o -name Kconfig \) | head -n 80 || true
            echo "::endgroup::"
            die "Could not detect kernel source root for SukiSU integration."
          fi

          echo "✅ Kernel source root: $KERNEL_DIR"
          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

          cd "$KERNEL_DIR"

          SUSFS_IN="${{ github.event.inputs.SUSFS }}"
          SUSFS_MODE="${{ github.event.inputs.susfs_mode }}"

          # Use builtin for current SukiSU integration.
          # main currently lacks the KSU_SUSFS Kconfig menu/symbols, so olddefconfig drops CONFIG_KSU_SUSFS even if
          # the external susfs patch landed correctly. builtin still carries the KSU_SUSFS config block.
          # We keep the local supercalls repair step below to fix the current builtin allow/deny-list ioctl mismatch.
          SETUP_ARG="builtin"
          echo "SUKISU_HAS_SUSFS=0" >> "$GITHUB_ENV"

          echo "→ Fetching SukiSU Ultra setup: https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh"
          echo "→ Setup arg: $SETUP_ARG"
          SETUP_URL_PRIMARY="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh"
          SETUP_URL_FALLBACK="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh"
          echo "Running: curl -fLSs $SETUP_URL_PRIMARY | bash -s \"$SETUP_ARG\" (fallback: $SETUP_URL_FALLBACK)"
          (curl -fLSs "$SETUP_URL_PRIMARY" | bash -s "$SETUP_ARG") || (curl -fLSs "$SETUP_URL_FALLBACK" | bash -s "$SETUP_ARG")
          # Detect whether this kernel tree actually contains SUSFS config symbols after SukiSU setup.
          # If not, we'll allow the external SUSFS patch step to run (avoids false "susfs-main" assumption).
          if [[ "$SUSFS_IN" == "On" ]]; then
            if grep -Rqs "KSU_SUSFS" ./drivers ./fs ./include 2>/dev/null; then
              echo "✅ Detected KSU_SUSFS symbols in kernel tree."
              echo "SUKISU_HAS_SUSFS=1" >> "$GITHUB_ENV"
            else
              echo "::warning::SUSFS requested but KSU_SUSFS symbols not found after SukiSU setup; will apply external SUSFS patch."
              echo "SUKISU_HAS_SUSFS=0" >> "$GITHUB_ENV"
            fi
          fi

          # Sanity: ensure KernelSU directory exists
          if [ ! -d "KernelSU" ]; then
            echo "::warning::KernelSU directory not found at ./KernelSU; searching..."
            found="$(find . -maxdepth 5 -type d -name KernelSU | head -n 1 || true)"
            [ -n "$found" ] || die "KernelSU directory not found after SukiSU setup."
            echo "Found KernelSU at: $found"
          fi

          # Sanity: ensure KernelSU driver landed in the kernel tree (expected: ./drivers/kernelsu)
          if [ ! -d "drivers/kernelsu" ] && [ ! -L "drivers/kernelsu" ]; then
            echo "::group::SukiSU integration debug"
            echo "pwd: $(pwd)"
            echo ""
            echo "Top-level:"
            ls -la || true
            echo ""
            echo "drivers/ listing:"
            ls -la drivers || true
            echo ""
            echo "Searching for drivers/kernelsu:"
            find . -maxdepth 8 -type d -path "*/drivers/kernelsu" | head -n 50 || true
            echo ""
            echo "Searching for any *kernelsu* directories:"
            find . -maxdepth 8 -type d -iname "*kernelsu*" | head -n 50 || true
            echo "::endgroup::"
            die "KernelSU driver not present after SukiSU setup (drivers/kernelsu missing)."
          fi

          echo "::group::Repair SukiSU supercalls mismatch (allow/deny list IOCTLs)"
          KSU_H="./drivers/kernelsu/supercalls.h"
          KSU_C="./drivers/kernelsu/supercalls.c"
          if [[ -f "$KSU_H" && -f "$KSU_C" ]]; then
            need_fix=0
            grep -q "KSU_IOCTL(KSU_IOCTL_NEW_GET_ALLOW_LIST" "$KSU_C" && need_fix=1 || true
            grep -q "KSU_IOCTL(KSU_IOCTL_NEW_GET_DENY_LIST" "$KSU_C" && need_fix=1 || true
            grep -q "#define KSU_IOCTL_GET_ALLOW_LIST" "$KSU_H" || need_fix=1
            grep -q "#define KSU_IOCTL_GET_DENY_LIST" "$KSU_H" || need_fix=1
            grep -q "struct ksu_new_get_allow_list_cmd" "$KSU_H" || need_fix=1
            grep -q "#define KSU_IOCTL_NEW_GET_ALLOW_LIST" "$KSU_H" || need_fix=1
            grep -q "#define KSU_IOCTL_NEW_GET_DENY_LIST" "$KSU_H" || need_fix=1

            if [[ "$need_fix" == "1" ]]; then
              echo "Applying compatibility repair to drivers/kernelsu/supercalls.[ch]"
              python3 - <<'PY'
              from pathlib import Path
              import re

              h = Path('./drivers/kernelsu/supercalls.h')
              c = Path('./drivers/kernelsu/supercalls.c')
              ht = h.read_text(encoding='utf-8')
              ct = c.read_text(encoding='utf-8')

              # Fix broken macro invocations seen on some builtin revisions.
              ct = ct.replace(
                  'KSU_IOCTL(KSU_IOCTL_NEW_GET_ALLOW_LIST, "NEW_GET_ALLOW_LIST", do_new_get_allow_list,',
                  'KSU_IOCTL(NEW_GET_ALLOW_LIST, "NEW_GET_ALLOW_LIST", do_new_get_allow_list,',
              )
              ct = ct.replace(
                  'KSU_IOCTL(KSU_IOCTL_NEW_GET_DENY_LIST, "NEW_GET_DENY_LIST", do_new_get_deny_list,',
                  'KSU_IOCTL(NEW_GET_DENY_LIST, "NEW_GET_DENY_LIST", do_new_get_deny_list,',
              )

              def insert_before_endif(src: str, block: str) -> str:
                  if block in src:
                      return src
                  m = re.search(r'\n#endif\s*$', src)
                  if m:
                      return src[:m.start()] + '\n' + block.rstrip() + '\n' + src[m.start():]
                  return src.rstrip() + '\n\n' + block.rstrip() + '\n'

              new_struct = """struct ksu_new_get_allow_list_cmd {
                __u16 count; // Input / Output: number of UIDs in array
                __u16 total_count; // Output: total number of UIDs in requested list
                __u32 uids[0]; // Output: array of allowed/denied UIDs
              };"""
              legacy_defs = """#define KSU_IOCTL_GET_ALLOW_LIST _IOC(_IOC_READ | _IOC_WRITE, 'K', 6, 0)
              #define KSU_IOCTL_GET_DENY_LIST _IOC(_IOC_READ | _IOC_WRITE, 'K', 7, 0)"""
              new_defs = """#define KSU_IOCTL_NEW_GET_ALLOW_LIST \
                _IOWR('K', 6, struct ksu_new_get_allow_list_cmd)
              #define KSU_IOCTL_NEW_GET_DENY_LIST \
                _IOWR('K', 7, struct ksu_new_get_allow_list_cmd)"""

              if 'struct ksu_new_get_allow_list_cmd' not in ht:
                  ht = insert_before_endif(ht, new_struct)
              if '#define KSU_IOCTL_GET_ALLOW_LIST' not in ht or '#define KSU_IOCTL_GET_DENY_LIST' not in ht:
                  ht = insert_before_endif(ht, legacy_defs)
              if '#define KSU_IOCTL_NEW_GET_ALLOW_LIST' not in ht or '#define KSU_IOCTL_NEW_GET_DENY_LIST' not in ht:
                  ht = insert_before_endif(ht, new_defs)

              h.write_text(ht, encoding='utf-8')
              c.write_text(ct, encoding='utf-8')
              print('Repaired supercalls compatibility for legacy/new allow-deny list ioctls.')
              PY
              echo "Post-repair symbol check:"
              grep -nE 'KSU_IOCTL_(GET|NEW_GET)_(ALLOW|DENY)_LIST|ksu_new_get_allow_list_cmd' "$KSU_H" || true
            else
              echo "No supercalls repair needed."
            fi
          else
            echo "drivers/kernelsu/supercalls.[ch] not found; skipping repair."
          fi
          echo "::endgroup::"
      - name: "SukiSU SUSFS kernel-r25 compat (TRY_UMOUNT)"
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event.inputs.SUSFS }}" != "On" ]]; then
            echo "SUSFS Off → skipping SUSFS r25 compat patch."
            exit 0
          fi

          KDIR="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

          # After SukiSU setup.sh, drivers/kernelsu is a symlink into $KDIR/KernelSU/kernel
          KSU_KCONFIG="$KDIR/drivers/kernelsu/Kconfig"
          KSU_SETUID="$KDIR/drivers/kernelsu/setuid_hook.c"

          if [[ ! -f "$KSU_KCONFIG" ]]; then
            echo "::error::KernelSU Kconfig not found at: $KSU_KCONFIG"
            exit 1
          fi

          if ! grep -q "config KSU_SUSFS_TRY_UMOUNT" "$KSU_KCONFIG"; then
            echo "→ Adding CONFIG_KSU_SUSFS_TRY_UMOUNT to KernelSU Kconfig (required by SUSFS module r25+)."
            python3 - "$KSU_KCONFIG" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          t = p.read_text()

          sym = 'config KSU_SUSFS_TRY_UMOUNT'
          if sym not in t:
              insert = (
                  'config KSU_SUSFS_TRY_UMOUNT\n'
                  '\tbool "Try umount at post-fs-data"\n'
                  '\tdepends on KSU_SUSFS\n'
                  '\tdefault y\n'
                  '\thelp\n'
                  '\t  SUSFS module (kernel-r25+) compatibility: enables try_umount support.\n'
                  '\n'
              )
              key = 'config KSU_SUSFS_SPOOF_UNAME'
              if key in t:
                  t = t.replace(key, insert + key, 1)
              else:
                  t = t.rstrip() + '\n\n' + insert + '\n'
              p.write_text(t)
              print('Inserted KSU_SUSFS_TRY_UMOUNT into Kconfig.')
          else:
              print('KSU_SUSFS_TRY_UMOUNT already present.')
          PY
          else
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT already present."
          fi

          if [[ -f "$KSU_SETUID" ]] && ! grep -q "susfs_try_umount(" "$KSU_SETUID"; then
            echo "→ Wiring susfs_try_umount() call after kernel umount."
            python3 - "$KSU_SETUID" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          t = p.read_text()

          if 'susfs_try_umount(' in t:
              print('susfs_try_umount already present.')
              raise SystemExit(0)

          marker = 'ksu_handle_umount(old_uid, new_uid);'
          if marker not in t:
              print('Marker not found; skipping setuid_hook patch.')
              raise SystemExit(0)

          hook = (
              marker + '\n\n'
              + '#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT\n'
              + '\t// SUSFS module (kernel-r25+) compatibility hook\n'
              + '\tsusfs_try_umount(new_uid);\n'
              + '#endif\n'
          )

          t = t.replace(marker, hook, 1)
          p.write_text(t)
          print('Patched setuid_hook.c with susfs_try_umount().')
          PY
          else
            echo "setuid_hook.c already contains susfs_try_umount() (or missing) — skipping."
          fi

          echo "✅ SukiSU SUSFS r25 compat patch applied."



      - name: "Apply optional Multi-Manager patch"

        if: ${{ github.event.inputs.ksunext_multimanager == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          if [ -f "$GITHUB_WORKSPACE/patches/kernelsu-next_multimanager.patch" ]; then
            git apply --whitespace=nowarn "$GITHUB_WORKSPACE/patches/kernelsu-next_multimanager.patch" || true
          fi


      - name: "Optional: Apply ZRAM LZ4 perf patch (best-effort)"
        if: ${{ github.event.inputs.lz4_zram_patch == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

          mkdir -p lib/lz4/lz4armv8

          P_BASE="https://raw.githubusercontent.com/mrcxlinux/kernel_patches/master/zram"
          P_MIRROR="https://cdn.jsdelivr.net/gh/mrcxlinux/kernel_patches@master/zram"

          curl -fsSL "$P_BASE/001-lz4.patch" -o 001-lz4.patch || curl -fsSL "$P_MIRROR/001-lz4.patch" -o 001-lz4.patch
          curl -fsSL "$P_BASE/lz4armv8.S" -o lib/lz4/lz4armv8.S || curl -fsSL "$P_MIRROR/lz4armv8.S" -o lib/lz4/lz4armv8.S
          cp lib/lz4/lz4armv8.S lib/lz4/lz4armv8/lz4armv8.S

          echo "📦 Applying 001-lz4.patch (best-effort)..."
          if patch -p1 --dry-run < 001-lz4.patch >/dev/null 2>&1; then
            patch -p1 < 001-lz4.patch || true
          else
            echo "Patch does not apply cleanly → retrying with fuzz=3"
            patch -p1 -F 3 < 001-lz4.patch || true
          fi

          echo "✅ LZ4 patch step finished (non-fatal if it didn't apply cleanly)."


      - name: "Enable features via defconfig"

        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"

          # Keep localversion deterministic (we set LOCALVERSION ourselves later)
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG"

          # KernelSU base
          echo "CONFIG_KSU=y" >> "$DEFCONFIG" || true

          # SUSFS vs MANUAL_HOOK (match your original logic)
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$DEFCONFIG"
          else
            echo "CONFIG_KSU_SUSFS=n" >> "$DEFCONFIG"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"
          fi

          # Support Mountify-style tmpfs xattrs (as in your base workflow)
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"


          # =========================
          # LZ4 support (for ZRAM / fs / crypto) — enable support only (no forcing)
          # =========================
          echo "CONFIG_LZ4_COMPRESS=y" >> "$DEFCONFIG" || true
          echo "CONFIG_LZ4_DECOMPRESS=y" >> "$DEFCONFIG" || true
          echo "CONFIG_CRYPTO_LZ4=y" >> "$DEFCONFIG" || true
          echo "CONFIG_CRYPTO_LZ4HC=y" >> "$DEFCONFIG" || true

          # ZRAM: if you want a flashable zram.ko module, it must be built as a module (m).
          if [ "${{ github.event.inputs.zram_module }}" = "On" ]; then
            echo "CONFIG_ZRAM=m" >> "$DEFCONFIG" || true
            echo "CONFIG_ZSMALLOC=m" >> "$DEFCONFIG" || true
            # Prefer LZ4 as the default compressor when module mode is used
            echo 'CONFIG_ZRAM_DEF_COMP="lz4"' >> "$DEFCONFIG" || true
          else
            echo "CONFIG_ZRAM=y" >> "$DEFCONFIG" || true
            echo "CONFIG_ZSMALLOC=y" >> "$DEFCONFIG" || true
          fi

          # SukiSU safety: avoid experimental modes that can destabilize OEM kernels
          echo "# CONFIG_KSU_MANUAL_SU is not set" >> "$DEFCONFIG" || true
          echo "# CONFIG_KSU_NONE_HOOK is not set" >> "$DEFCONFIG" || true
          echo "CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> "$DEFCONFIG" || true


          # Optional features (already in your workflow)
          if [ "${{ github.event.inputs.bbg }}" = "On" ]; then echo "CONFIG_BBG=y" >> "$DEFCONFIG" || true; fi
          if [ "${{ github.event.inputs.bbr }}" = "On" ]; then echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"; fi
          if [ "${{ github.event.inputs.adios }}" = "On" ]; then
            echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> "$DEFCONFIG"
            echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> "$DEFCONFIG"
          fi
          if [ "${{ github.event.inputs.rekernel }}" = "On" ]; then echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"; fi
          if [ "${{ github.event.inputs.TTL }}" = "On" ]; then
            echo "CONFIG_NETFILTER_XT_TARGET_TTL=y" >> "$DEFCONFIG"
            echo "CONFIG_NETFILTER_XT_MATCH_TTL=y" >> "$DEFCONFIG"
          fi
          if [ "${{ github.event.inputs.IP_SET }}" = "On" ]; then
            echo "CONFIG_IP_SET=y" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET_MAX=256" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET_HASH_IP=y" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET_HASH_IPPORT=y" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> "$DEFCONFIG"
          fi

          # Reduce header install work
          echo "CONFIG_HEADERS_INSTALL=n" >> "$DEFCONFIG"
          sed -i 's/check_defconfig//' ./common/build.config.gki || true
          # =========================
          # Safe profile presets (minimal, non-breaking)
          # =========================
          PROFILE_IN="${{ github.event.inputs.profile }}"
          if [ "$PROFILE_IN" = "battery" ]; then
            # Battery: strip debug info / prefer size if available (best-effort)
            echo "CONFIG_DEBUG_INFO=n" >> "$DEFCONFIG" || true
            echo "CONFIG_DEBUG_INFO_DWARF5=n" >> "$DEFCONFIG" || true
            echo "CONFIG_DEBUG_INFO_BTF=n" >> "$DEFCONFIG" || true
            echo "CONFIG_DEBUG_INFO_REDUCED=y" >> "$DEFCONFIG" || true
            echo "CONFIG_GCOV_KERNEL=n" >> "$DEFCONFIG" || true
            echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> "$DEFCONFIG" || true
            echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=n" >> "$DEFCONFIG" || true
          elif [ "$PROFILE_IN" = "performance" ]; then
            # Performance: optimize for speed if available; keep stable (no OC/UV tweaks)
            echo "CONFIG_DEBUG_INFO=n" >> "$DEFCONFIG" || true
            echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$DEFCONFIG" || true
            echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=n" >> "$DEFCONFIG" || true
          else
            # Balanced: keep upstream defaults (recommended daily driver)
            true
          fi


      - name: "Set kernel version suffix (LOCALVERSION)"
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_IN="${{ github.event.inputs.profile }}"
          case "$PROFILE_IN" in
            battery) PTAG="BAT"; PLABEL="Battery" ;;
            balanced) PTAG="BAL"; PLABEL="Balanced" ;;
            performance) PTAG="PERF"; PLABEL="Performance" ;;
            *) PTAG="BAL"; PLABEL="Balanced" ;;
          esac
          echo "PROFILE=$PROFILE_IN" >> "$GITHUB_ENV"
          echo "PROFILE_TAG=$PTAG" >> "$GITHUB_ENV"
          echo "PROFILE_LABEL=$PLABEL" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

          # Prefer explicit input, else fall back to env.KERNEL_NAME
          if [ -n "${{ github.event.inputs.kernel_suffix }}" ]; then
            SUF_RAW="${{ github.event.inputs.kernel_suffix }}"
          else
            SUF_RAW="${{ env.KERNEL_NAME }}"
          fi

          # Sanitize: remove whitespace, avoid double '-' prefix
          SUF="${SUF_RAW//[[:space:]]/}"
          SUF="${SUF#-}"
          # IMPORTANT: do NOT bake profile into LOCALVERSION.
          # Changing uname -r (vermagic) can break vendor module loading and cause bootloops.
          LOCALVER="-$SUF"

          echo "Using suffix: $SUF"
          echo "LOCALVERSION=$LOCALVER" >> "$GITHUB_ENV"
          echo "SUFFIX=$SUF" >> "$GITHUB_ENV"

          # Ensure defconfig doesn't hardcode another localversion
          DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            grep -v '^CONFIG_LOCALVERSION=' "$DEFCONFIG" > "$DEFCONFIG.tmp" || true
            mv "$DEFCONFIG.tmp" "$DEFCONFIG"
          fi
      - name: "Set KBUILD build identity and timestamp"
        shell: bash
        run: |
          set -euo pipefail
          echo "KBUILD_BUILD_USER=${{ github.event.inputs.BUILD_USER }}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=${{ github.event.inputs.BUILD_HOST }}" >> "$GITHUB_ENV"
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then DATESTR="$INPUT_TIME"; else DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"; fi
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

          # Ensure uname -v / UTS_VERSION matches our chosen BUILD_TIME (mimic stock identification)
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          for f in common/scripts/mkcompile_h msm-kernel/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching $f for UTS_VERSION time stamp"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\\(.*?\\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done

      - name: "Clone WildKernel kernel_patches (for HMBIRD etc)"
        if: ${{ github.event.inputs.hmbird == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf kernel_patches || true
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git clone --depth=1 https://github.com/TheWildJames/kernel_patches.git kernel_patches

      - name: "Apply WildKernel patches (HMBIRD/overwriter) (best-effort)"
        if: ${{ github.event.inputs.hmbird == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

          apply_best_effort() {
            local p="$1"
            if [ ! -f "$p" ]; then
              echo "⚠️ Skipped (missing): $(basename "$p")"
              return 0
            fi

            local tmp=""
            if grep -q "GIT binary patch" "$p"; then
              tmp="$p"
            else
              tmp="$(mktemp)"
              tr -d '\r' < "$p" > "$tmp"
            fi

            if patch -p1 -F 3 -N --silent < "$tmp"; then
              echo "✅ Applied: $(basename "$p")"
            elif git apply --reject --whitespace=nowarn "$tmp" >/dev/null 2>&1; then
              echo "✅ Applied (git): $(basename "$p")"
            else
              echo "⚠️ Skipped (does not apply cleanly): $(basename "$p")"
            fi

            if [ "$tmp" != "$p" ]; then rm -f "$tmp"; fi
            return 0
          }

          echo "Applying HMBIRD-related patches (best-effort)..."
          HMBIRD_DIR="$GITHUB_WORKSPACE/kernel_patches/oneplus/hmbird"

          # Pick the most likely FengChi patch (apply at most ONE)
          pick_first() { for f in "$@"; do [ -f "$f" ] && { echo "$f"; return 0; }; done; return 1; }
          FENGCHI="$(pick_first             "$HMBIRD_DIR/fengchi_PJZ110_OOS15.patch"             "$HMBIRD_DIR/fengchi_PJZ110_OOS16.patch"             "$HMBIRD_DIR/fengchi_OP13_OOS15.patch"             "$HMBIRD_DIR/fengchi_OP13_OOS16.patch"           )" || true
          if [ -n "${FENGCHI:-}" ]; then
            echo "→ FengChi: $(basename "$FENGCHI")"
            apply_best_effort "$FENGCHI"
          else
            echo "⚠️ No FengChi patch matched (skipping fengchi)"
          fi

          apply_best_effort "$HMBIRD_DIR/overwriter.patch"
          apply_best_effort "$HMBIRD_DIR/hmbird_config.patch"

          # Optional common optimizations used by WildKernel action (best-effort)
          COMMON_DIR="$GITHUB_WORKSPACE/kernel_patches/common"
          apply_best_effort "$COMMON_DIR/optimized_mem_operations.patch"
          apply_best_effort "$COMMON_DIR/file_struct_8bytes_align.patch"

      - name: "Fix permissions for overwriter scripts"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          chmod +x drivers/of/overwriter/overwrite_configs/convert_configs.sh 2>/dev/null || true
          chmod +x drivers/of/overwriter/overwrite_configs/*.sh 2>/dev/null || true
      - name: "Build kernel"
        shell: bash
        run: |
          set -euo pipefail

          cd "${KERNEL_DIR:-$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common}"

          command -v ld.lld >/dev/null 2>&1 || {
            echo "::error::ld.lld not found in PATH"
            echo "PATH=$PATH"
            ls -la "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/kernel-build-tools/linux-x86/bin" 2>/dev/null || true
            exit 1
          }

          # 1) Generate config first
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" LD=ld.lld HOSTLD=ld.lld O=out LOCALVERSION=${LOCALVERSION:-} gki_defconfig

          CFG="out/.config"
          if [[ ! -f "$CFG" ]]; then
            echo "::error::.config not found after gki_defconfig"
            exit 1
          fi

          if [[ ! -x "./scripts/config" ]]; then
            echo "::error::scripts/config not found or not executable."
            ls -la ./scripts ./scripts/config 2>/dev/null || true
            exit 1
          fi

          # 2) Align a few key options with known-working OP13 GKI builds (helps avoid bootloops due to module/BTF mismatches)
          ./scripts/config --file "$CFG" \
            -e DEBUG_INFO_BTF \
            -e DEBUG_INFO_BTF_MODULES \
            -e MODULE_ALLOW_BTF_MISMATCH \
            -e PROBE_EVENTS_BTF_ARGS \
            -d DEBUG_INFO_REDUCED || true

          # 3) Force-enable SUSFS module (kernel-r25) options if SUSFS is On
          if [[ "${{ github.event.inputs.SUSFS }}" == "On" ]]; then
            ./scripts/config --file "$CFG" \
              -e KSU \
              -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_TRY_UMOUNT || true
          fi

          # Re-resolve dependencies once
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" LD=ld.lld HOSTLD=ld.lld O=out LOCALVERSION=${LOCALVERSION:-} olddefconfig

          echo "::group::Key options in final .config"
          grep -nE '^(CONFIG_DEBUG_INFO_BTF=|CONFIG_DEBUG_INFO_BTF_MODULES=|CONFIG_MODULE_ALLOW_BTF_MISMATCH=|CONFIG_PROBE_EVENTS_BTF_ARGS=|CONFIG_CC_OPTIMIZE_FOR_)=|^# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set|^# CONFIG_DEBUG_INFO_REDUCED is not set' "$CFG" || true
          grep -nE '^(CONFIG_KSU_SUSFS|CONFIG_KSU_SUSFS_SPOOF_UNAME|CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG|CONFIG_KSU_SUSFS_TRY_UMOUNT)=' "$CFG" || true
          grep -nE '^# CONFIG_KSU_SUSFS_TRY_UMOUNT is not set' "$CFG" || true
          echo "::endgroup::"

          # 4) Build
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" LD=ld.lld HOSTLD=ld.lld O=out LOCALVERSION=${LOCALVERSION:-} all

          REL="$(cat out/include/config/kernel.release 2>/dev/null || true)"
          if [ -z "$REL" ]; then REL="$(make -s O=out LOCALVERSION=${LOCALVERSION:-} kernelrelease 2>/dev/null || true)"; fi
          echo "KERNEL_RELEASE=$REL" >> "$GITHUB_ENV"
          echo "Kernel release: $REL"


      - name: Verify final config (SukiSU Ultra / SUSFS)
        shell: bash
        run: |
          set -euo pipefail
          CFG="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/out/.config"
          if [[ ! -f "$CFG" ]]; then
            echo "::error::.config not found: $CFG"
            exit 1
          fi
          echo "Checking $CFG ..."
          echo "Profile : ${{ env.PROFILE_LABEL }} (${{ env.PROFILE_TAG }})"
          if [[ "${{ github.event.inputs.SUSFS }}" == "On" ]]; then
            if ! grep -Eq '^CONFIG_KSU_SUSFS=(y|m)$' "$CFG"; then
              echo "::error::CONFIG_KSU_SUSFS not enabled (expected y or m) in final .config"
              echo "::group::.config SUSFS lines"
              grep -n 'KSU_SUSFS' "$CFG" || true
              echo "::endgroup::"
              echo "::group::Kconfig symbol presence (kernel_platform/common)"
              (cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common" && grep -Rns "KSU_SUSFS" drivers fs include 2>/dev/null | head -n 80) || true
              echo "::endgroup::"
              echo "::group::Kconfig symbol presence (detected KERNEL_DIR)"
              (cd "$KERNEL_DIR" && grep -Rns "KSU_SUSFS" drivers fs include 2>/dev/null | head -n 80) || true
              echo "::endgroup::"
              echo "::notice::If both groups are empty, SUSFS patch likely applied to wrong root. Use v6.7 which applies patches from kernel_platform root when patch paths start with common/."
              exit 1
            fi

          # kernel-r25 SUSFS module compatibility (required by recent susfs module)
          if [[ "${{ github.event.inputs.SUSFS }}" == "On" ]]; then
            if ! grep -qE '^(CONFIG_KSU_SUSFS_TRY_UMOUNT=|# CONFIG_KSU_SUSFS_TRY_UMOUNT is not set)' "$CFG"; then
              echo "::error::CONFIG_KSU_SUSFS_TRY_UMOUNT symbol missing in final .config."
              echo "::error::KernelSU SUSFS patchset (kernel-r25 options) likely did not apply to your SukiSU builtin revision."
              echo "::group::KernelSU Kconfig scan (drivers/kernelsu)"
              (cd "${KERNEL_DIR:-$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common}" && grep -Rns "KSU_SUSFS_TRY_UMOUNT" drivers/kernelsu 2>/dev/null | head -n 80) || true
              echo "::endgroup::"
              exit 1
            fi
            if ! grep -qE '^CONFIG_KSU_SUSFS_TRY_UMOUNT=y$' "$CFG"; then
              echo "::error::CONFIG_KSU_SUSFS_TRY_UMOUNT=y expected for SUSFS module compatibility (kernel-r25+) but was not enabled."
              echo "::group::.config CONFIG_KSU_SUSFS_TRY_UMOUNT lines"
              grep -n "KSU_SUSFS_TRY_UMOUNT" "$CFG" || true
              echo "::endgroup::"
              exit 1
            fi
          fi

          fi

          # LZ4 support must be present (y or m). Accept any of these common symbols.
          if ! grep -qE '^(CONFIG_(LZ4_COMPRESS|LZ4_DECOMPRESS|CRYPTO_LZ4|CRYPTO_LZ4HC))=(y|m)' "$CFG"; then
            echo "::error::LZ4 support symbols not enabled in final .config"
            grep -n 'LZ4' "$CFG" || true
            exit 1
          fi

          # ZRAM should be enabled if we are going to ship a zram module
          if ! grep -qE '^CONFIG_ZRAM=(y|m)' "$CFG"; then
            echo "::warning::CONFIG_ZRAM not enabled — zram module may be unavailable"
          fi

          echo "✅ Config looks good."

      - name: "Package AnyKernel3 (single zip, banner, no breakage)"
        env:
          SUSFS_MODE: ${{ github.event.inputs.SUSFS }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          rm -rf AnyKernel3 || true
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git clone --depth=1 -b gki-2.0 https://github.com/TheWildJames/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git

          IMAGE_PATH="$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/out" -type f -name Image | head -n 1 || true)"
          if [ -z "$IMAGE_PATH" ]; then
            echo "❌ Image not found in out/ (build likely failed)."
            exit 1
          fi
          cp "$IMAGE_PATH" "AnyKernel3/Image"

          # Patch anykernel.sh safely: keep properties() intact; update strings + inject our info block after ak3-core is sourced.
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          
          ak = Path("AnyKernel3/anykernel.sh")
          s = ak.read_text(encoding="utf-8", errors="replace")
          
          # Clean english kernel.string (include profile label)
          profile_label = os.environ.get("PROFILE_LABEL", "Balanced")
          s = re.sub(r'^\s*kernel\.string=.*$', f'kernel.string=PJZ110 | SukiSU Ultra (builtin) [{profile_label}] (OP-OX)', s, flags=re.M)
          
          # Remove previous custom injection (idempotent)
          s = re.sub(r'\n# --- OX1D3X3 CUSTOM START ---.*?# --- OX1D3X3 CUSTOM END ---\n', '\n', s, flags=re.S)
          
          m = re.search(r'\n\.\s+tools/ak3-core\.sh\s*\n', s)
          if not m:
                  raise SystemExit("Cannot find '. tools/ak3-core.sh' marker in anykernel.sh")
          
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "")
          kernel_rel = os.environ.get("KERNEL_RELEASE", "")
          suffix = os.environ.get("SUFFIX", "OP-OX")
          susfs_mode = os.environ.get("SUSFS_MODE", "On")
          feat = "SUSFS" if susfs_mode == "On" else "MANUAL_HOOK"
          block = f"""
          # --- OX1D3X3 CUSTOM START ---
          ui_print " "
          ui_print "===================================================="
          ui_print "                   __   __  __ "
          ui_print "                  \\ \\ / //_ |"
          ui_print "                   \\ V /   | |"
          ui_print "                     > <    | |"
          ui_print "                   / . \\   | |"
          ui_print "                 /_/ \\_\\  |_|"
          ui_print "===================================================="
          ui_print " "
          ui_print "PJZ110 | SukiSU Ultra (builtin) [{os.environ.get('PROFILE_LABEL','Balanced')}] + {feat}"
          ui_print "Kernel : {kernel_rel}"
          ui_print "Build  : #{run_number} ({suffix})"
          ui_print "Builder: @Ox1d3x3"
          ui_print "Credits: @mrcxlinux, WildKernels"
          ui_print " "
          
          device="$(getprop ro.product.device 2>/dev/null || true)"
          model="$(getprop ro.product.model 2>/dev/null || true)"
          android="$(getprop ro.build.version.release 2>/dev/null || true)"
          patch="$(getprop ro.build.version.security_patch 2>/dev/null || true)"
          if [ -n "$device" ]; then ui_print "Device : $device ($model)"; fi
          if [ -n "$android" ]; then ui_print "Android: $android"; fi
          if [ -n "$patch" ]; then ui_print "Patch  : $patch"; fi
          ui_print " "
          
          # Best-effort open project page (may be ignored in recovery)
          if command -v cmd >/dev/null 2>&1; then
          (cmd activity start --user 0 -a android.intent.action.VIEW -d "https://github.com/ox1d3x3/Op13_Susfs_kernel" >/dev/null 2>&1 &) || true
          elif command -v am >/dev/null 2>&1; then
          (am start --user 0 -a android.intent.action.VIEW -d "https://github.com/ox1d3x3/Op13_Susfs_kernel" >/dev/null 2>&1 &) || true
          fi
          # --- OX1D3X3 CUSTOM END ---
          """
          
          s = s[:m.end()] + block + s[m.end():]
          ak.write_text(s, encoding="utf-8")
          PY

          # Plain-text banner shown early by update-binary (optional)
          SUSFS_MODE="${SUSFS_MODE:-On}"
          if [ "$SUSFS_MODE" = "On" ]; then
            MODE_BANNER="SUSFS"
            MODE_TAG="SUSFS"
          else
            MODE_BANNER="MANUAL_HOOK"
            MODE_TAG="NO_SUSFS"
          fi

          cat > AnyKernel3/banner <<EOF
          ====================================================
                         Ox1d3x3 Kernel
          SukiSU Ultra (builtin) [${PROFILE_LABEL}] + ${MODE_BANNER}
          ====================================================
          EOF

          OUT="OP13_${{ env.ANDROID_VERSION }}_${{ env.KERNEL_VERSION }}_${{ env.SUFFIX }}_${{ env.PROFILE_TAG }}_${{ github.run_number }}_${MODE_TAG}_FLASH_THIS.zip"
          rm -f "$OUT" || true
          (cd AnyKernel3 && zip -r9 "../$OUT" . -x "*.git*" -x "*README*" -x "*.md" >/dev/null)
          echo "OUT_ZIP=$OUT" >> "$GITHUB_ENV"

          echo "FLASH_ZIP=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: "Generate checksums"
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "${{ env.OUT_ZIP }}" | tee "${{ env.OUT_ZIP }}.sha256"


      - name: "Build flashable ZRAM module (replace zram.ko)"
        if: ${{ github.event.inputs.zram_module == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          # Find zram.ko wherever the build system placed it (GKI trees differ).
          ZRAM_KO="$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -type f -name "zram.ko" 2>/dev/null | head -n 1 || true)"
          if [ -z "$ZRAM_KO" ] || [ ! -f "$ZRAM_KO" ]; then
            echo "::warning::zram.ko not found (likely built-in, or module output path differs)."
            echo "Quick check (if config exists):"
            CFG="$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -maxdepth 6 -type f -name ".config" 2>/dev/null | head -n 1 || true)"
            if [ -n "$CFG" ]; then
              grep -E "^CONFIG_ZRAM=|^CONFIG_ZSMALLOC=" "$CFG" || true
            fi
            echo "Search results for zram.ko:"
            find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -type f -name "zram.ko" -maxdepth 10 2>/dev/null || true
            echo "Skipping zram module packaging."
            exit 0
          fi
          echo "✅ Using zram.ko: $ZRAM_KO"

          TMP_ZIP="$RUNNER_TEMP/zram_template.zip"
          rm -f "$TMP_ZIP" || true

          # Template module (known-good). Mirror fallback included.
          URLS=(
            "https://raw.githubusercontent.com/cctv18/oppo_oplus_realme_sm8750/refs/heads/main/zram.zip"
            "https://cdn.jsdelivr.net/gh/cctv18/oppo_oplus_realme_sm8750@main/zram.zip"
          )

          ok=0
          for u in "${URLS[@]}"; do
            echo "→ Fetching zram template: $u"
            if curl -fL --retry 3 --retry-delay 2 "$u" -o "$TMP_ZIP"; then
              ok=1
              break
            fi
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::Failed to download zram.zip template from all mirrors"
            exit 1
          fi

          WORK="$RUNNER_TEMP/zram_mod"
          rm -rf "$WORK" || true
          mkdir -p "$WORK"
          unzip -q "$TMP_ZIP" -d "$WORK"

          echo "Replacing zram.ko with freshly built one:"
          echo "  src: $ZRAM_KO"
          echo "  dst(s):"
          find "$WORK" -name "zram.ko" -print -exec cp "$ZRAM_KO" {} \;

          OUT_ZRAM="$GITHUB_WORKSPACE/zram-module.zip"
          rm -f "$OUT_ZRAM" || true
          (cd "$WORK" && zip -qr "$OUT_ZRAM" .)

          sha256sum "$OUT_ZRAM" | tee "$OUT_ZRAM.sha256"
          echo "ZRAM_ZIP=$OUT_ZRAM" >> "$GITHUB_ENV"

      - name: "Upload build outputs (Actions artifact)"
        uses: actions/upload-artifact@v4
        with:
          name: OP13_${{ env.SUFFIX }}_${{ env.PROFILE_TAG }}_${{ github.run_number }}
          path: |
            ${{ env.OUT_ZIP }}
            ${{ env.OUT_ZIP }}.sha256
            zram-module.zip
            zram-module.zip.sha256
          if-no-files-found: error
          retention-days: 7

      - name: "Write build summary (selected vs detected)"
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          CFG="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/out/.config"
          SRC="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          OUTDIR="$SRC/out"
          IMG="$OUTDIR/arch/arm64/boot/Image"
          UTS="$OUTDIR/include/generated/utsrelease.h"
          COMPILE_H="$OUTDIR/include/generated/compile.h"

          yn() { [ "${1:-}" = "On" ] && echo "✅ On" || echo "❌ Off"; }
          cfg1() { grep -m1 -E "^${1}=" "$CFG" 2>/dev/null || true; }
          cfgyn() {
            local key="$1"
            local line
            line="$(cfg1 "$key")"
            if [ -n "$line" ]; then
              echo "$line"
            else
              # show "not set" if present as comment
              line="$(grep -m1 -E "^# ${key} is not set" "$CFG" 2>/dev/null || true)"
              if [ -n "$line" ]; then echo "$line"; else echo "—"; fi
            fi
          }

          echo "## 🎯 Kernel Build Summary" >> "$GITHUB_STEP_SUMMARY"

          # Basic info
          KREL="(unknown)"
          if [ -f "$UTS" ]; then
            KREL="$(sed -n 's/^#define UTS_RELEASE "\(.*\)"/\1/p' "$UTS" | head -n1 || true)"
            [ -n "$KREL" ] || KREL="(unknown)"
          fi

          BUILD_USER_ACT="(unknown)"
          BUILD_HOST_ACT="(unknown)"
          if [ -f "$COMPILE_H" ]; then
            BUILD_USER_ACT="$(sed -n 's/^#define LINUX_COMPILE_BY "\(.*\)"/\1/p' "$COMPILE_H" | head -n1 || true)"
            BUILD_HOST_ACT="$(sed -n 's/^#define LINUX_COMPILE_HOST "\(.*\)"/\1/p' "$COMPILE_H" | head -n1 || true)"
          fi

          IMG_SHA="(missing)"
          if [ -f "$IMG" ]; then
            IMG_SHA="$(sha256sum "$IMG" | awk '{print $1}')"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kernel release (UTS_RELEASE) | \`$KREL\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image SHA256 | \`$IMG_SHA\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build user/host (compile.h) | \`${BUILD_USER_ACT}@${BUILD_HOST_ACT}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Toolchain | \`${{ inputs.toolchain }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Profile | \`${{ inputs.profile }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kernel suffix | \`${{ inputs.kernel_suffix }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build time input | \`${{ inputs.BUILD_TIME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Create Release | \`${{ inputs.create_release }}\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🔧 Feature Selection (Selected vs Detected)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Feature | Selected | Detected (from .config / tree) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          # ZRAM + LZ4
          echo "| ZRAM module.zip (replace zram.ko) | $(yn "${{ inputs.zram_module }}") | $(cfgyn CONFIG_ZRAM) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ZRAM default compressor | — | $(cfgyn CONFIG_ZRAM_DEF_COMP) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| LZ4 support (crypto) | — | $(cfgyn CONFIG_CRYPTO_LZ4) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Apply ZRAM LZ4 perf patch (best-effort) | $(yn "${{ inputs.lz4_zram_patch }}") | $(test -d "$SRC/lib/lz4" && echo 'present (tree)' || echo '—') |" >> "$GITHUB_STEP_SUMMARY"

          # SUSFS
          echo "| SUSFS | $(yn "${{ inputs.SUSFS }}") | $(cfgyn CONFIG_KSU_SUSFS) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SUSFS mode | \`${{ inputs.susfs_mode }}\` | $(test -f "$SRC/include/linux/susfs.h" && echo 'susfs.h present' || echo '—') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SUSFS TRY_UMOUNT (r25) | — | $(cfgyn CONFIG_KSU_SUSFS_TRY_UMOUNT) |" >> "$GITHUB_STEP_SUMMARY"

          # KernelSU Multi-manager patch (best-effort)
          echo "| Multi-manager patch (best-effort) | $(yn "${{ inputs.ksunext_multimanager }}") | $(test -d "$SRC/drivers/kernelsu" && echo 'drivers/kernelsu present' || echo '—') |" >> "$GITHUB_STEP_SUMMARY"

          # Net / I/O
          echo "| Baseband-Guard (BBG) | $(yn "${{ inputs.bbg }}") | $(grep -qE '^CONFIG_.*BBG|^CONFIG_.*BASEBAND' "$CFG" 2>/dev/null && echo 'present (config)' || echo '—') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| BBR congestion control | $(yn "${{ inputs.bbr }}") | $(cfgyn CONFIG_TCP_CONG_BBR) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ADIOS I/O scheduler | $(yn "${{ inputs.adios }}") | $(grep -qE '^CONFIG_.*ADIOS' "$CFG" 2>/dev/null && echo 'present (config)' || echo '—') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Proxy/network tweaks (best-effort) | $(yn "${{ inputs.proxy }}") | — |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TTL target/match | $(yn "${{ inputs.TTL }}") | $( { cfg1 CONFIG_NETFILTER_XT_TARGET_TTL; cfg1 CONFIG_NETFILTER_XT_MATCH_TTL; } 2>/dev/null | paste -sd ' ' - | sed 's/[[:space:]]*$//' ) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| IP_SET (ipset) | $(yn "${{ inputs.IP_SET }}") | $(cfgyn CONFIG_IP_SET) |" >> "$GITHUB_STEP_SUMMARY"

          # HMBIRD / FengChi
          DET_HMBIRD="—"
          if [ -d "$SRC/kernel/sched/hmbird" ] || [ -f "$SRC/include/linux/sched/hmbird_version.h" ]; then
            DET_HMBIRD="present (tree)"
          fi
          echo "| HMBIRD / FengChi (best-effort) | $(yn "${{ inputs.hmbird }}") | $DET_HMBIRD |" >> "$GITHUB_STEP_SUMMARY"

          # Re-kernel support
          echo "| Re-Kernel support | $(yn "${{ inputs.rekernel }}") | — |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Tip: For best-effort patches, ‘Selected ✅’ means the workflow attempted it. ‘Detected’ shows what ended up in the final \`.config\` or source tree." >> "$GITHUB_STEP_SUMMARY"

      - name: Reset PATH for cache save (system tar)
        if: always()
        shell: bash
        run: |
          echo "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> "$GITHUB_ENV"
          echo "TAR=/usr/bin/tar" >> "$GITHUB_ENV"

      - name: "Prepare GitHub Release"
        if: ${{ inputs.create_release == 'true' }}
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          # Use run_attempt so re-runs don't collide with existing tags
          TAG="v${{ github.run_number }}.${{ github.run_attempt }}-${{ env.SUFFIX }}-${{ env.PROFILE_TAG }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=OP13 SukiSUUltra [${{ env.PROFILE_TAG }}] $TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: "Publish GitHub Release (direct-download flash ZIP)"
        if: ${{ inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ env.OUT_ZIP }}
            ${{ env.OUT_ZIP }}.sha256


      - name: "Publish ZRAM module to GitHub Release (optional)"
        if: ${{ inputs.create_release == 'true' && hashFiles('zram-module.zip') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: true
          generate_release_notes: false
          files: |
            zram-module.zip
            zram-module.zip.sha256

      - name: "Summary"
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Output"
            echo ""
            echo "- Flashable ZIP: **${{ env.OUT_ZIP }}**"
            echo "- SHA256: **${{ env.OUT_ZIP }}.sha256**"
            echo "- ZRAM module: **zram-module.zip** (if generated)"
            echo "- ZRAM SHA256: **zram-module.zip.sha256** (if generated)"
            echo ""
            echo "### Note about Downloads"
            echo "• **Actions Artifact**: downloads as a wrapper ZIP. Extract it and flash **${{ env.OUT_ZIP }}**."
            if [[ "${{ inputs.create_release }}" == "true" ]]; then
              echo "• **Release asset**: direct download (no wrapper ZIP)."
            else
              echo "• **Release asset**: not created in this run (create_release=false)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"