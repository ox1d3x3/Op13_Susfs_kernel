name: OP13 SukiSU Ultra
env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: android15
  # Label only (major.minor). Actual release (e.g. 6.6.89) is detected at build time.
  KERNEL_VERSION: "6.6"
  KERNEL_NAME: android15-8-g7e1f3c083cc6-abogki467167594-4k
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "8G"
  GIT_TERMINAL_PROMPT: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Design goals for this scratch rebuild:
# - OP13 CN C.89 / Android 15 / 6.6 GKI daily-driver baseline.
# - SukiSU Ultra + CCTV18 SUSFS external patch, with old-good inline-hook default.
# - Stock-like UTS suffix by default.
# - Strict final validation, but hook-model aware: legacy NONE_HOOK and current builtin MANUAL_HOOK are both handled.
# - Advanced features compiled when safe; runtime-aggressive hooks stay Off by default.

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Toolchain"
        type: choice
        required: true
        default: aosp_prebuilt
        options: [aosp_prebuilt, neutron_clang]

      profile:
        description: "Build profile (safe presets)"
        type: choice
        required: true
        default: balanced
        options: [battery, balanced, performance]


      lz4_zram_patch:
        description: "Apply ZRAM LZ4 perf patch (Off by default for COS C.89 stability; available later)"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      zram_module:
        description: "Build flashable zram-module.zip (Off by default; do not use for first COS C.89 test)"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      SUSFS:
        description: "Enable SUSFS"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      susfs_mode:
        description: "SUSFS source (external = CCTV18/susfs4oki, old-good LSPosed lane)"
        type: choice
        required: true
        default: external
        options: [sukisu, external]

      cctv18_susfs_branch:
        description: "CCTV18/susfs4oki branch. stable is default for daily driver; dev remains selectable for testing."
        type: choice
        required: true
        default: oki-android15-6.6
        options: [oki-android15-6.6, oki-android15-6.6-dev]

      target_stock_uts:
        description: "Expected stock uname -r for OP13 CN COS 16.0.7.201/C.89"
        type: string
        required: false
        default: "6.6.89-android15-8-g7e1f3c083cc6-abogki467167594-4k"

      enforce_uts_match:
        description: "Fail build if UTS_RELEASE does not match target_stock_uts"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      susfs_r25_compat:
        description: "Enable SUSFS TRY_UMOUNT config/source hook (Off by default for C.89 first test; available later)"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      susfs_path_loop:
        description: "Enable optional SUSFS sus_path_loop trigger from kernel_umount.c (Off by default; use only after baseline boot is proven)"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      sukisu_ref:
        description: "SukiSU checkout ref. Daily-stable default pins old-good inline-hook lane; use builtin only for latest testing."
        type: string
        required: false
        default: "2aba6b8"

      ksunext_multimanager:
        description: "Apply multi-manager patch (best-effort)"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      bbg:
        description: "Enable Baseband-Guard (BBG)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      bbr:
        description: "Enable BBR congestion control support (feature-rich daily default)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      adios:
        description: "Enable ADIOS I/O scheduler support (compiled for smoothness; default scheduler is not forced)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      rekernel:
        description: "Enable Re-Kernel support"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      proxy:
        description: "Enable proxy/network tweaks (best-effort)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      TTL:
        description: "Enable TTL target/match (netfilter)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      IP_SET:
        description: "Enable IP_SET (netfilter ipset)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      hmbird:
        description: "HMBIRD/Fengchi scheduler bundle (experimental; keep Off for first daily-driver C.89 test)"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      kernel_suffix:
        description: "Kernel suffix (LOCALVERSION). Leave empty to use KERNEL_NAME"
        type: string
        required: false
        default: ""

      BUILD_TIME:
        description: "Custom build time string (Enter F to use current UTC)"
        type: string
        required: false
        default: "F"

      BUILD_USER:
        description: "KBUILD_BUILD_USER"
        type: string
        required: false
        default: "OnePlus"

      BUILD_HOST:
        description: "KBUILD_BUILD_HOST"
        type: string
        required: false
        default: "ubuntu-build"


jobs:
  build:
    name: "OP13 Advanced-Stable Daily | SukiSU=${{ github.event.inputs.sukisu_ref }} | SUSFS=${{ github.event.inputs.SUSFS }} | ${{ github.event.inputs.toolchain }}"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: "Runner disk preflight"
        id: disk
        shell: bash
        run: |
          set -euo pipefail
          echo "Memory and swap:"
          free -h || true
          echo ""
          echo "Swap devices:"
          swapon --show || true
          echo ""
          echo "Block devices:"
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS || true
          echo ""
          echo "Disk usage:"
          df -hT || true
          echo ""
          use_maximize=false
          has_mnt_disk=false

          if findmnt -n /mnt >/dev/null 2>&1; then
            SRC="$(findmnt -n -o SOURCE /mnt || true)"
            echo "/mnt is a mount point from: $SRC"
            if [[ "$SRC" == /dev/* ]]; then
              has_mnt_disk=true
              MNT_FREE_MB="$(df -Pm /mnt | awk 'NR==2 {print $4}' || true)"
              echo "/mnt free (MB): $MNT_FREE_MB"
              if [[ "$MNT_FREE_MB" =~ ^[0-9]+$ ]] && [[ "$MNT_FREE_MB" -gt 20000 ]]; then
                use_maximize=true
              else
                echo "Skipping maximize-build-space: /mnt does not have enough free space."
              fi
            fi
          else
            echo "/mnt is NOT a mount point on this runner."
          fi

          echo "has_mnt_disk=$has_mnt_disk" >> "$GITHUB_OUTPUT"
          echo "use_maximize=$use_maximize" >> "$GITHUB_OUTPUT"

      - name: "Legendary hybrid source matrix"
        shell: bash
        run: |
          set -euo pipefail
          echo "Bismillah - OP13 CN C.89 Legendary Hybrid v4"
          echo "Source blend used by this workflow:"
          echo "  - mrcxlinux/actions_oplus_sm8750: OP13 GKI manifest/build foundation"
          echo "  - CCTV18/susfs4oki: SUSFS v2 external source for OPPO/OnePlus/Realme OKI-style patches"
          echo "  - CCTV18/oppo_oplus_realme_sm8750: OPlus-specific direction: OKI/GKI split, F2FS caution, Fengchi/ADIOS/BBR/BBG feature set"
          echo "  - WildKernels: feature inspiration: BBG, BBR, TTL, IP_SET, TMPFS XATTR/POSIX ACL, scheduler/network goodies"
          echo "  - SukiSU Ultra builtin setup: latest tagged source by default, with stock-like OP13 C.89 UTS guard"
          echo "Safety rule: feature-rich does not mean blindly enabling every risky hook on first boot."

      - name: "Maximize build space (only if /mnt temp disk exists)"
        if: steps.disk.outputs.use_maximize == 'true'
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: "Extra disk cleanup"
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo docker image prune -a -f || true
          sudo docker system prune -af || true
          df -hT

      - name: Checkout
        uses: actions/checkout@v5

      - name: Git auth for non-interactive clones
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prevent any interactive prompts during git operations
          git config --global credential.helper store
          git config --global core.askPass true
          # Use the workflow token for any https://github.com/ clones (public or private where permitted)
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: "Setup ccache directory"
        shell: bash
        run: |
          set -euo pipefail
          echo "CCACHE_DIR=$HOME/.ccache_SukiSUUltra" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ccache_SukiSUUltra"

      - name: "Restore ccache"
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-op13-sukisuultra-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.SUSFS }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-op13-sukisuultra-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.SUSFS }}-
            ccache-${{ runner.os }}-op13-sukisuultra-

      - name: "Install build dependencies"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             python3 python3-pip git curl wget ca-certificates rsync unzip zip file             build-essential flex bison bc gawk ccache             clang lld llvm dwarves             libssl-dev libncurses-dev libelf-dev libdw-dev zlib1g-dev liblz4-tool             libxml2-utils dos2unix jq
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -s

      - name: "Install repo tool"
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > /tmp/repo
          chmod a+x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo
          repo --version

      - name: "Sync kernel sources"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace

          # Manifest repo: only zh branch contains manifest.xml
          MANIFEST_REPO="https://github.com/mrcxlinux/actions_oplus_sm8750.git"
          MANIFEST_BRANCH="zh"
          MANIFEST_FILE="manifest.xml"
          echo "Using manifest: $MANIFEST_REPO ($MANIFEST_BRANCH/$MANIFEST_FILE)"
          curl -fsSL "https://raw.githubusercontent.com/mrcxlinux/actions_oplus_sm8750/${MANIFEST_BRANCH}/${MANIFEST_FILE}" >/dev/null

          # Network hardening for CodeLinaro/Gitaly. These do not fix a server-side outage,
          # but they reduce flaky HTTP/2 sessions and make sync resume cleaner.
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 900
          git config --global http.postBuffer 524288000
          git config --global fetch.parallel 1
          git config --global pack.threads 1
          export GIT_HTTP_MAX_REQUESTS=2

          INIT_ARGS=( -u "$MANIFEST_REPO" -b "$MANIFEST_BRANCH" -m "$MANIFEST_FILE" --depth=1 )
          if repo init -h 2>&1 | grep -q -- '--partial-clone'; then
            INIT_ARGS+=(--partial-clone --clone-filter=blob:none)
            echo "repo init: partial clone enabled to reduce initial transfer size."
          else
            echo "repo init: partial clone not supported by this repo tool."
          fi
          repo init "${INIT_ARGS[@]}"

          repo_sync_once() {
            local jobs="$1"
            local net_jobs="$2"
            local label="$3"
            local failfast="${4:-0}"
            local sync_args=( -c --no-tags --no-clone-bundle --force-sync --optimized-fetch --prune -j"$jobs" )
            if repo sync -h 2>&1 | grep -q -- '--retry-fetches'; then sync_args+=(--retry-fetches=12); fi
            if repo sync -h 2>&1 | grep -q -- '--jobs-network'; then sync_args+=(--jobs-network="$net_jobs"); fi
            if [[ "$failfast" == "1" ]]; then sync_args+=(--fail-fast); fi

            echo "::group::repo sync attempt: $label"
            echo "repo sync ${sync_args[*]}"
            set +e
            repo sync "${sync_args[@]}"
            local rc=$?
            set -e
            echo "::endgroup::"
            return "$rc"
          }

          # CodeLinaro sometimes returns transient 502/Gitaly unavailable for clang/rust prebuilts.
          # The important part is to keep the same workspace and resume after waiting.
          attempts=(
            "8 4 balanced 0 0"
            "8 2 balanced-resume 0 45"
            "4 2 reduced 0 75"
            "2 1 gentle 0 120"
            "1 1 serial 1 180"
            "1 1 serial-resume 1 240"
          )

          ok=0
          for spec in "${attempts[@]}"; do
            set -- $spec
            jobs="$1"; net="$2"; label="$3"; failfast="$4"; wait_s="$5"
            if [[ "$wait_s" != "0" ]]; then
              echo "Waiting ${wait_s}s before retry to let CodeLinaro/Gitaly recover..."
              sleep "$wait_s"
            fi
            if repo_sync_once "$jobs" "$net" "$label" "$failfast"; then
              ok=1
              echo "✅ repo sync completed on attempt: $label"
              break
            fi
            echo "::warning::repo sync attempt '$label' failed. This is usually a transient CodeLinaro/Gitaly network issue, not a kernel source error."
          done

          if [[ "$ok" != "1" ]]; then
            echo "::error::repo sync failed after all retry/backoff attempts."
            echo "Most likely cause: CodeLinaro/Gitaly is temporarily unavailable for one or more large prebuilts, commonly clang or rust."
            echo "Failed projects summary from repo:"
            repo status 2>/dev/null || true
            echo "Tip: rerun the same workflow later. No kernel changes are needed for this class of failure."
            exit 1
          fi

          rm -f kernel_platform/common/android/abi_gki_protected_exports_* || true
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || true

          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion || true
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion || true
          sed -i 's/ -dirty//g' kernel_platform/external/dtc/scripts/setlocalversion || true

      - name: "Select toolchain"
        shell: bash
        run: |
          set -euo pipefail
          echo "Selected toolchain: ${{ github.event.inputs.toolchain }}"
          if [ "${{ github.event.inputs.toolchain }}" = "neutron_clang" ]; then
            mkdir -p "$HOME/toolchains"
            cd "$HOME/toolchains"
            git clone --depth=1 https://github.com/Neutron-Toolchains/antman.git antman
            cd antman
            bash antman -S
            echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          else
            cd "$GITHUB_WORKSPACE/kernel_workspace"
            CANDIDATE="$(find . -type f -path '*prebuilts/clang/host/linux-x86/*/bin/clang' | head -n 1 || true)"
            if [ -z "$CANDIDATE" ]; then
              echo "Error: clang prebuilts not found under kernel_workspace."
              exit 1
            fi
            echo "$(dirname "$CANDIDATE")" >> "$GITHUB_PATH"
          fi
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

          # Add AOSP kernel build tools (contains ld.lld, llvm-ar, etc.) to PATH
          KERNEL_PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          ADD_PATHS=()
          for p in "$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin" \
                    "$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux_musl-x86/bin"; do
            if [ -d "$p" ]; then
              echo "$p" >> "$GITHUB_PATH"
              ADD_PATHS+=("$p")
            fi
          done

          # Also export for THIS step so we can verify tools now
          if [ "${#ADD_PATHS[@]}" -gt 0 ]; then
            export PATH="$(IFS=:; echo "${ADD_PATHS[*]}"):$PATH"
          fi

          echo "Toolchain check:"
          echo "  clang:  $(command -v clang || true)"
          echo "  ld.lld: $(command -v ld.lld || true)"
          clang --version || true
          ld.lld --version || true

      - name: "Apply SUSFS"
        shell: bash
        run: |
          SUSFS_IN="${{ inputs.SUSFS }}"
          SUSFS_MODE="${{ inputs.susfs_mode }}"
          set -euo pipefail

          if [[ "${{ github.event.inputs.SUSFS }}" != "On" ]]; then
            echo "SUSFS disabled → skipping."
            exit 0
          fi

          # If SukiSU was integrated with susfs-main, DO NOT apply external susfs4oki patches again.
          if [[ "${SUKISU_HAS_SUSFS:-0}" == "1" ]]; then
            echo "SUSFS provided by SukiSU setup (susfs-main) → skipping external SUSFS patch to avoid double-patching."
            exit 0
          fi


          KERNEL_PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

          # Auto-detect kernel source root (some manifests use common/, some use common/common/)
          CANDIDATES=(
            "$KERNEL_PLATFORM/common"
            "$KERNEL_PLATFORM/common/common"
          )

          KERNEL_DIR=""
          for c in "${CANDIDATES[@]}"; do
            if [[ -f "$c/Makefile" && -d "$c/fs" ]]; then
              KERNEL_DIR="$c"
              break
            fi
          done

          if [[ -z "$KERNEL_DIR" ]]; then
            echo "::error::Could not detect kernel source root under $KERNEL_PLATFORM"
            echo "Listing kernel_platform:"
            ls -la "$KERNEL_PLATFORM" || true
            echo "Listing common candidates:"
            ls -la "$KERNEL_PLATFORM/common" || true
            ls -la "$KERNEL_PLATFORM/common/common" || true
            exit 1
          fi

                    echo "✅ Kernel root detected: $KERNEL_DIR"
          # susfs4oki patches sometimes are generated relative to kernel_platform root (paths start with common/)
          # so we dynamically choose where to apply the patch from.
          KERNEL_PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          SRC_REL="$(realpath --relative-to="$KERNEL_PLATFORM" "$KERNEL_DIR" 2>/dev/null || echo "common")"
          echo "Kernel source relpath: $SRC_REL"

          SUSFS_SRC_BRANCH="${{ github.event.inputs.cctv18_susfs_branch }}"
          SUSFS_PATCH_TAG="gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
          echo "Using susfs4oki clone branch: $SUSFS_SRC_BRANCH"
          echo "Using SUSFS patch tag: $SUSFS_PATCH_TAG"

          SUSFS_FOLDER="$GITHUB_WORKSPACE/susfs4oki"
          rm -rf "$SUSFS_FOLDER" || true

          repo="https://github.com/cctv18/susfs4oki.git"
          echo "→ Checking susfs4oki: $repo"
          if ! git ls-remote --exit-code --heads "$repo" "$SUSFS_SRC_BRANCH" >/dev/null 2>&1; then
            echo "::error::Could not find susfs4oki branch '$SUSFS_SRC_BRANCH' on $repo"
            exit 1
          fi

          echo "→ Cloning $repo ($SUSFS_SRC_BRANCH)"
          git clone --depth 1 --no-tags -b "$SUSFS_SRC_BRANCH" "$repo" "$SUSFS_FOLDER"
          echo "susfs4oki commit:"
          git -C "$SUSFS_FOLDER" log -1 --oneline || true

          echo "::group::Copy SUSFS source/header files (if present)"
          # Some SUSFS branches ship extra files outside the main patch.
          if [[ -d "$SUSFS_FOLDER/kernel_patches/fs" ]]; then
            cp -a "$SUSFS_FOLDER/kernel_patches/fs/." "$KERNEL_DIR/fs/" || true
          fi
          if [[ -d "$SUSFS_FOLDER/kernel_patches/include/linux" ]]; then
            mkdir -p "$KERNEL_DIR/include/linux"
            cp -a "$SUSFS_FOLDER/kernel_patches/include/linux/." "$KERNEL_DIR/include/linux/" || true
          fi
          echo "::endgroup::"

          # --- Pre-adjustments (borrowed from WildKernel) to help the gki-android15-6.6 patch match ---
          fake_patched=0
          if [[ "${{ env.ANDROID_VERSION }}" == "android15" && "${{ env.KERNEL_VERSION }}" == "6.6" ]]; then
            if [[ -f "./fs/namespace.c" ]] && ! grep -qxF '#include <trace/hooks/fs.h>' ./fs/namespace.c; then
              if grep -q '#include <trace/hooks/blk.h>' ./fs/namespace.c; then
                sed -i '/#include <trace\/hooks\/blk.h>/a #include <trace/hooks/fs.h>' ./fs/namespace.c
              else
                # Fallback: inject near top of file
                sed -i '1i #include <trace/hooks/fs.h>' ./fs/namespace.c
              fi
            fi

            if [[ -f "./fs/proc/task_mmu.c" ]] && ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
              if grep -q 'int ret = 0, copied = 0;' ./fs/proc/task_mmu.c; then
                echo "Applying temporary context lines for task_mmu.c (for patch matching)..."
                sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;'                  -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t *res = NULL;' ./fs/proc/task_mmu.c
                fake_patched=1
              else
                echo "::warning::Anchor line not found in fs/proc/task_mmu.c; skipping temporary context insert."
              fi
            fi
          fi

          PATCH_FILE="$SUSFS_FOLDER/kernel_patches/50_add_susfs_in_${SUSFS_PATCH_TAG}.patch"
          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "::error::Missing SUSFS patch file: $PATCH_FILE"
            echo "Available patches:"
            ls -la "$SUSFS_FOLDER/kernel_patches" || true
            exit 1
          fi

          # Decide patch root based on patch file paths
          PATCH_CWD="$KERNEL_DIR"
          if grep -qE "^diff --git a/common/|^\+\+\+ b/common/" "$PATCH_FILE" >/dev/null 2>&1; then
            PATCH_CWD="$KERNEL_PLATFORM"
          elif grep -qE "^diff --git a/${SRC_REL}/|^\+\+\+ b/${SRC_REL}/" "$PATCH_FILE" >/dev/null 2>&1; then
            PATCH_CWD="$KERNEL_PLATFORM"
          fi
          echo "Patch will be applied from: $PATCH_CWD"
          cd "$PATCH_CWD"

          echo "::group::Apply SUSFS main patch"
          if patch -p1 --dry-run -R < "$PATCH_FILE" >/dev/null 2>&1; then
            echo "↪ SUSFS patch already applied"
          else
            if patch -p1 --dry-run --forward < "$PATCH_FILE" >/dev/null 2>&1; then
              patch -p1 --forward < "$PATCH_FILE"
            else
              echo "Patch does not apply cleanly → retrying with fuzz=3"
              patch -p1 --forward -F 3 < "$PATCH_FILE"
            fi
          fi
          echo "::endgroup::"
          echo "::group::Post-patch SUSFS symbol check"
          if grep -Rqs "KSU_SUSFS" "$KERNEL_DIR" 2>/dev/null; then
            echo "✅ KSU_SUSFS symbols present after SUSFS patch."
            (cd "$KERNEL_DIR" && grep -Rns "KSU_SUSFS" drivers fs include 2>/dev/null | head -n 60) || true
          else
            echo "::warning::KSU_SUSFS symbols still not found after SUSFS patch. This usually means the patch was applied to the wrong root or the branch does not match this kernel tree."
          fi
          echo "::endgroup::"

          # Hard check: SukiSU SUSFS_INLINE_HOOK needs <linux/susfs.h> present in the kernel tree
          if [[ "$SUSFS_IN" == "On" ]]; then
            if [[ -f "$KERNEL_DIR/include/linux/susfs.h" ]]; then
              echo "✅ Found header: $KERNEL_DIR/include/linux/susfs.h"
            else
              echo "::error::SUSFS requested but $KERNEL_DIR/include/linux/susfs.h is missing. SUSFS patch did not land in the real kernel source root."
              echo "::group::Find susfs.h"
              find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -path "*/include/linux/susfs.h" -o -name "susfs.h" | head -n 50 || true
              echo "::endgroup::"
              exit 1
            fi
          fi


          # Revert temporary context lines (if we injected them)
          if [[ "$fake_patched" == "1" ]]; then
            sed -i -e '/unsigned int nr_subpages = __PAGE_SIZE \/ PAGE_SIZE;/d'              -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c || true
          fi


          echo "::group::SUSFS ↔ KernelSU compat (legacy uname helpers)"
          # KernelSU/SukiSU v3.x (some forks) may still reference legacy SUSFS uname helpers that were removed/renamed in SUSFS v2.
          # If so, add small compatibility stubs into fs/susfs.c to satisfy linkage without changing runtime behavior.
          if [[ -f "./drivers/kernelsu/supercalls.c" ]] && grep -q "susfs_uname_is_active" "./drivers/kernelsu/supercalls.c"; then
            echo "KernelSU references legacy uname helpers → adding SUSFS v2 compat stubs"
            if [[ -f "./fs/susfs.c" ]] && ! grep -q "susfs_uname_is_active" "./fs/susfs.c"; then
          python3 - <<'PY'
          from pathlib import Path
          p = Path('./fs/susfs.c')
          code = r'''
          
          /* --- SUSFS v2 compatibility for older KernelSU variants (legacy uname helpers) --- */
          /* Some KernelSU forks still call these legacy helpers. SUSFS v2 uses susfs_set_uname()/susfs_spoof_uname(). */
          #ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME
          bool susfs_uname_is_active(void) { return true; }
          #else
          bool susfs_uname_is_active(void) { return false; }
          #endif
          
          /* Legacy no-op: SUSFS v2 persists uname spoof via susfs_set_uname() from userspace. */
          void susfs_set_uname_from_kernel(void) { }
          
          '''
          src = p.read_text(encoding='utf-8')
          if 'susfs_uname_is_active' not in src:
              p.write_text(src + code, encoding='utf-8')
          PY
            else
              echo "fs/susfs.c missing or compat stubs already present; skipping."
            fi
          else
            echo "KernelSU does not reference legacy uname helpers; no compat needed."
          fi
          echo "::endgroup::"

          echo "::group::SUSFS sanity checks"
          # These checks prevent "SUSFS=On" kernels that actually don't include SUSFS.
          if [[ ! -f "./fs/susfs.c" ]]; then
            echo "::warning::fs/susfs.c not found (patch may embed SUSFS in other files)."
          fi

          if ! grep -Rqs "KSU_SUSFS\|SUSFS" ./fs ./include/linux 2>/dev/null; then
            echo "::error::SUSFS strings not found in fs/ or include/linux after patching. Integration likely failed."
            exit 1
          fi
          echo "::endgroup::"

          echo "✅ SUSFS patching complete."

      - name: "Integrate SukiSU Ultra (builtin, official setup.sh)"
        shell: bash
        run: |
          SUSFS_IN="${{ inputs.SUSFS }}"
          SUSFS_MODE="${{ inputs.susfs_mode }}"
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          KERNEL_PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

          # Auto-detect actual kernel source root (many trees build from common/, not kernel_platform/).
          CANDIDATES=(
            "$KERNEL_PLATFORM/common"
            "$KERNEL_PLATFORM/common/common"
            "$KERNEL_PLATFORM"
          )

          KERNEL_DIR=""
          for c in "${CANDIDATES[@]}"; do
            if [[ -f "$c/Makefile" && -d "$c/drivers" && -d "$c/arch" ]]; then
