      - name: "Repair SukiSU + CCTV18 SUSFS symbol compatibility"
        if: ${{ github.event.inputs.SUSFS == 'On' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "::group::Repair SukiSU + CCTV18 SUSFS symbol compatibility"

          KDIR="${KERNEL_DIR:-$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common}"
          SUSFS_C="$KDIR/fs/susfs.c"
          SUSFS_H="$KDIR/include/linux/susfs.h"

          # SukiSU setup layout differs between refs:
          #   old pinned lane: common/drivers/kernelsu/Kbuild
          #   builtin/latest:  common/drivers/kernelsu -> ../KernelSU/kernel
          # Latest SukiSU builtin currently uses kernel/Makefile, not Kbuild.
          # Resolve the real source dir and accept either Kbuild or Makefile.
          KSU_DIR=""
          KSU_BUILD_FILE=""
          for candidate in             "$KDIR/drivers/kernelsu"             "$KDIR/KernelSU/kernel"             "$KDIR/KernelSU-Next/kernel"; do
            real="$(readlink -f "$candidate" 2>/dev/null || true)"
            if [[ -n "$real" && -f "$real/Kbuild" ]]; then
              KSU_DIR="$real"
              KSU_BUILD_FILE="$real/Kbuild"
              break
            elif [[ -n "$real" && -f "$real/Makefile" ]]; then
              KSU_DIR="$real"
              KSU_BUILD_FILE="$real/Makefile"
              break
            fi
          done

          if [[ -z "$KSU_BUILD_FILE" ]]; then
            KSU_BUILD_FILE="$(find "$KDIR" -maxdepth 8 -type f \( \n              -path '*/drivers/kernelsu/Kbuild' -o -path '*/drivers/kernelsu/Makefile' -o \n              -path '*/KernelSU/kernel/Kbuild' -o -path '*/KernelSU/kernel/Makefile' -o \n              -path '*/KernelSU-Next/kernel/Kbuild' -o -path '*/KernelSU-Next/kernel/Makefile' \n            \) 2>/dev/null | head -n 1 || true)"
            if [[ -n "$KSU_BUILD_FILE" ]]; then
              KSU_DIR="$(dirname "$KSU_BUILD_FILE")"
            fi
          fi

          if [[ -z "$KSU_DIR" || -z "$KSU_BUILD_FILE" || ! -f "$KSU_BUILD_FILE" ]]; then
            echo "::error::KernelSU/SukiSU build file not found. Latest SukiSU may use Makefile instead of Kbuild; both were checked."
            echo "Kernel dir: $KDIR"
            echo "drivers/kernelsu listing:"
            ls -la "$KDIR/drivers/kernelsu" || true
            echo "Resolved drivers/kernelsu target:"
            readlink -f "$KDIR/drivers/kernelsu" || true
            echo "KernelSU candidates:"
            find "$KDIR" -maxdepth 8 \( -type f \( -name Kbuild -o -name Makefile \) -o -type l -name kernelsu -o -type d -iname '*KernelSU*' \) -print 2>/dev/null | head -n 120 || true
            exit 1
          fi

          echo "Kernel dir          : $KDIR"
          echo "SukiSU dir          : $KSU_DIR"
          echo "SukiSU build file   : $KSU_BUILD_FILE"

          # Build one compatibility object that works with both old pinned SukiSU
          # and latest/builtin SukiSU layouts. Latest builtin uses newer static-key
          # names (ksu_input_hook_key / ksu_init_rc_hook_key), and on some
          # static_key_interface variants references the generated *_false symbol
          # names directly. Older CCTV18
          # patches can reference ksu_is_* names. Also provide weak SELinux-hide
          # compatibility symbols so builtin SukiSU can link even when its selinuxfs
          # patch is present but the matching backend symbols are not exported.
          cat > "$KSU_DIR/manual_hook_keys_compat.c" <<'MANUALKEYS_HEAD'
          #include <linux/jump_label.h>
          #include <linux/types.h>
          #include <linux/gfp.h>
          #include <linux/errno.h>
          #include <linux/stddef.h>

          /* OP13 SukiSU + CCTV18/susfs4oki compatibility object. */
          MANUALKEYS_HEAD

          add_static_key_if_missing() {
            local sym="$1"
            if ! grep -RqsE "^[[:space:]]*DEFINE_STATIC_KEY_FALSE[[:space:]]*\\([[:space:]]*${sym}[[:space:]]*\\)" "$KSU_DIR" --exclude='manual_hook_keys_compat.c' 2>/dev/null; then
              echo "DEFINE_STATIC_KEY_FALSE(${sym});" >> "$KSU_DIR/manual_hook_keys_compat.c"
              echo "  + static key: ${sym}"
            else
              echo "  = static key already present: ${sym}"
            fi
          }

          add_static_key_if_missing ksu_is_input_hook_enabled
          add_static_key_if_missing ksu_is_init_rc_hook_enabled
          add_static_key_if_missing ksu_input_hook_key
          add_static_key_if_missing ksu_init_rc_hook_key
          # Latest builtin SukiSU's static_key_interface can reference the
          # generated *_false symbol names directly. Define those exact symbols
          # too when the tree does not provide them.
          add_static_key_if_missing ksu_input_hook_key_false
          add_static_key_if_missing ksu_init_rc_hook_key_false

          cat >> "$KSU_DIR/manual_hook_keys_compat.c" <<'MANUALKEYS_TAIL'

          /*
           * Latest SukiSU builtin can patch security/selinux/selinuxfs.c for
           * SELinux-hide query redirection. Some GKI trees do not provide the
           * matching backend exports. These weak fallbacks are link-safety only;
           * real SukiSU implementations, if present, override them.
           */
          __attribute__((weak)) bool ksu_selinux_hide_running;
          __attribute__((weak)) void *backup_sepolicy;

          __attribute__((weak)) int security_context_to_sid_with_policy(void *policy,
          　　　　const char *scontext, u32 scontext_len, u32 *sid, u32 def_sid, gfp_t gfp)
          {
          　　　　return -EINVAL;
          }

          __attribute__((weak)) int security_sid_to_context_with_policy(void *policy,
          　　　　u32 sid, char **scontext, u32 *scontext_len)
          {
          　　　　return -EINVAL;
          }

          __attribute__((weak)) int security_compute_av_user_with_policy(void *policy,
          　　　　u32 ssid, u32 tsid, u16 tclass, void *avd)
          {
          　　　　return 0;
          }
          MANUALKEYS_TAIL

          # Normalize accidental full-width whitespace introduced by copy/paste.
          python3 - "$KSU_DIR/manual_hook_keys_compat.c" <<'CLEANCOMPATPY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          t = p.read_text()
          t = t.replace('\u3000', '\t')
          p.write_text(t)
          CLEANCOMPATPY

          echo "✅ Added/updated manual_hook_keys_compat.c for old/new SukiSU symbols"

          # Link manual_hook_keys_compat.o in the least invasive way:
          # 1) Prefer kernelsu-objs / kernelsu-y so it is folded into kernelsu.o.
          # 2) Fall back to ksu_obj-y only if Kbuild still uses that live variable.
          # 3) Final fallback: obj-$(CONFIG_KSU), only when no aggregate target exists.
          # This avoids the old ignored ksu_obj-y append while staying closer to the #90 working layout.
          python3 - "$KSU_BUILD_FILE" <<'KBUILDPY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          t = p.read_text()

          # Remove prior bad/duplicate wiring. Keep one clean wiring line only.
          t = re.sub(r'^\s*ksu_obj-y\s*\+=\s*manual_hook_keys_compat\.o\s*\n', '', t, flags=re.M)
          t = re.sub(r'^\s*kernelsu-objs\s*\+=\s*manual_hook_keys_compat\.o\s*\n', '', t, flags=re.M)
          t = re.sub(r'^\s*kernelsu-y\s*\+=\s*manual_hook_keys_compat\.o\s*\n', '', t, flags=re.M)
          t = re.sub(r'^\s*obj-\$\(CONFIG_KSU\)\s*\+=\s*manual_hook_keys_compat\.o\s*\n', '', t, flags=re.M)

          def append_after(pattern: str, line: str) -> bool:
              global t
              m = re.search(pattern, t, flags=re.M)
              if not m:
                  return False
              t = t[:m.end()] + line + t[m.end():]
              return True

          if re.search(r'^\s*kernelsu-objs\s*[:+]?=', t, flags=re.M):
              append_after(r'^\s*kernelsu-objs\s*[:+]?=.*\n', 'kernelsu-objs += manual_hook_keys_compat.o\n')
              mode = 'kernelsu-objs'
          elif re.search(r'^\s*kernelsu-y\s*[:+]?=', t, flags=re.M):
              append_after(r'^\s*kernelsu-y\s*[:+]?=.*\n', 'kernelsu-y += manual_hook_keys_compat.o\n')
              mode = 'kernelsu-y'
          elif re.search(r'\$\(ksu_obj-y\)', t):
              if not append_after(r'^\s*ksu_obj-y\s*\+=\s*ksuinit\.o\s*\n', 'ksu_obj-y += manual_hook_keys_compat.o\n'):
                  append_after(r'^\s*ksu_obj-y\s*[:+]?=.*\n', 'ksu_obj-y += manual_hook_keys_compat.o\n')
              mode = 'ksu_obj-y'
          else:
              if not t.endswith('\n'):
                  t += '\n'
              t += '\n# OP13 SukiSU + CCTV18 SUSFS manual-hook static-key compatibility\n'
              t += 'obj-$(CONFIG_KSU) += manual_hook_keys_compat.o\n'
              mode = 'obj-CONFIG_KSU-fallback'

          p.write_text(t)
          print(f'Wired manual_hook_keys_compat.o via {mode}')
          KBUILDPY

          echo "manual_hook_keys_compat build-file wiring:"
          grep -n 'manual_hook_keys_compat.o' "$KSU_BUILD_FILE" || true

          if [[ -f "$SUSFS_C" ]] && ! grep -q 'susfs_set_i_state_on_external_dir' "$SUSFS_C"; then
            cat >> "$SUSFS_C" <<'SUSFSCOMPAT'
          /* OP13 compatibility for older SukiSU inline-hook supercalls. */
          #ifdef CONFIG_KSU_SUSFS_SUS_PATH
          void susfs_set_i_state_on_external_dir(void __user **user_info)
          {
          	struct st_susfs_sus_path info = {0};
          	struct path path;
          	struct inode *inode = NULL;
          	int err = 0;

          	if (!user_info || !*user_info) {
          		return;
          	}

          	if (copy_from_user(&info, (struct st_susfs_sus_path __user *)*user_info, sizeof(info))) {
          		info.err = -EFAULT;
          		goto out_copy_to_user;
          	}

          	if (info.target_pathname[0] == '\0') {
          		info.err = -EINVAL;
          		goto out_copy_to_user;
          	}

          	err = kern_path(info.target_pathname, LOOKUP_FOLLOW, &path);
          	if (err) {
          		info.err = err;
          		goto out_copy_to_user;
          	}

          	inode = d_backing_inode(path.dentry);
          	if (!inode || !inode->i_mapping) {
          		info.err = -ENOENT;
          		goto out_path_put;
          	}

          	set_bit(AS_FLAGS_SUS_PATH, &inode->i_mapping->flags);
          	info.err = 0;

          out_path_put:
          	path_put(&path);
          out_copy_to_user:
          	(void)copy_to_user(&((struct st_susfs_sus_path __user *)*user_info)->err,
          			   &info.err, sizeof(info.err));
          }
          #endif /* CONFIG_KSU_SUSFS_SUS_PATH */
          SUSFSCOMPAT
            echo "✅ Added susfs_set_i_state_on_external_dir() compatibility wrapper"
          else
            echo "✅ susfs_set_i_state_on_external_dir() already present or fs/susfs.c missing"
          fi

          if [[ -f "$SUSFS_H" ]] && ! grep -q 'susfs_set_i_state_on_external_dir' "$SUSFS_H"; then
            python3 - "$SUSFS_H" <<'SUSFSHPY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          t = p.read_text()
          proto = 'void susfs_set_i_state_on_external_dir(void __user **user_info);\n'
          if 'susfs_set_i_state_on_external_dir' not in t:
              needle = 'void susfs_add_sus_path_loop(void __user **user_info);\n'
              if needle in t:
                  t = t.replace(needle, needle + proto, 1)
              else:
                  t = t.replace('#endif', proto + '#endif', 1)
              p.write_text(t)
          SUSFSHPY
            echo "✅ Added susfs_set_i_state_on_external_dir() prototype"
          fi

          echo "SukiSU/KSU symbol scan:"
          grep -RnsE 'manual_hook_keys_compat|ksu_is_input_hook_enabled|ksu_is_init_rc_hook_enabled' "$KSU_DIR" 2>/dev/null | head -n 80 || true
          echo "SUSFS external-dir helper scan:"
          grep -Rns 'susfs_set_i_state_on_external_dir' "$SUSFS_C" "$SUSFS_H" 2>/dev/null || true

          echo "::endgroup::"


      - name: "Apply optional Multi-Manager patch"

        if: ${{ github.event.inputs.ksunext_multimanager == 'On' }}
