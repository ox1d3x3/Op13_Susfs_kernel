name: OP13 SukiSU Ultra

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  OP_MODEL: OP13
  OP_SOC: sun
  OP_OS_VERSION: OOS16
  OP_EXPECTED_UTS: "6.6.89-android15-8-g7e1f3c083cc6-abogki467167594-4k"
  OP_STOCK_LOCALVERSION: "-android15-8-g7e1f3c083cc6-abogki467167594-4k"
  OP13_MANIFEST_REPO: "https://github.com/WildKernels/OnePlus_KernelSU_SUSFS.git"  # source manifest repo
  OP13_MANIFEST_BRANCH: "main"
  OP13_MANIFEST_FILE: "manifests/oos16/oneplus_13_w.xml"
  OP13_CLANG_REL: "kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin"
  SUSFS_REPO: "https://github.com/cctv18/susfs4oki.git"
  SUSFS_DEFAULT_REF: "oki-android15-6.6"
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "5G"
  GIT_TERMINAL_PROMPT: "0"
  KBUILD_BUILD_USER: OnePlus
  KBUILD_BUILD_HOST: ubuntu-build
  KBUILD_BUILD_VERSION: "1"

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      feature_profile:
        description: "Preset: battery_daily = stable/battery daily defaults, advanced_daily = battery_daily + advanced extras, minimal_debug = root+susfs only, experimental_max = all extras"
        type: choice
        required: true
        default: battery_daily
        options: [battery_daily, advanced_daily, minimal_debug, experimental_max]
      sukisu_channel:
        description: "SukiSU Ultra channel only. No KSUN backend. builtin_latest is the safest first CCTV18 SUSFS test; main_latest is available for testing."
        type: choice
        required: true
        default: builtin_latest
        options: [builtin_latest, main_latest, custom_ref]
      sukisu_custom_ref:
        description: "Only used when sukisu_channel=custom_ref. Example: builtin, main, dev, or a SukiSU branch/tag/commit."
        type: string
        required: false
        default: ""
      susfs:
        description: "Enable SUSFS kernel integration. Keep On for the daily-driver SUSFS build; Off only for SukiSU-only debug."
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      susfs_ref:
        description: "CCTV18 susfs4oki ref/branch. Default is oki-android15-6.6 for OP13 OOS16/android15-6.6."
        type: string
        required: false
        default: "oki-android15-6.6"
      toolchain:
        description: "Toolchain. aosp_prebuilt is the only safe default for OP13 OOS16."
        type: choice
        required: true
        default: aosp_prebuilt
        options: [aosp_prebuilt]
      bbr:
        description: "Enable BBR congestion control"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      bbg:
        description: "Enable Baseband Guard if supported by tree"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      ttl_ipset:
        description: "Enable TTL/IP_SET/IPv6 NAT netfilter support"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      ntsync:
        description: "Enable NTSYNC if supported by tree"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      unicode_fix:
        description: "Enable Unicode path-hardening symbols if supported. Useful for modern Android file/path handling; keep On for this OP13 daily profile."
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      droidspaces:
        description: "Advanced extra: Droidspaces/container support if supported. Off in battery_daily; profile advanced_daily forces it On."
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]
      adios:
        description: "Enable ADIOS I/O scheduler if supported. Default On from v26; compiled successfully in the working v24 baseline."
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      zram_lz4_support:
        description: "Enable LZ4/ZRAM support. If zram_module is On, ZRAM/ZSMALLOC are built as modules for the flashable zram zip."
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      zram_module:
        description: "Build flashable zram-module.zip by replacing zram.ko in the known-good template. Default On, matching your older workflow."
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      hmbird:
        description: "Advanced scheduler extra: HMBIRD/Fengchi if supported. Off in battery_daily; profile advanced_daily can force it On for testing."
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]
      lto:
        description: "LTO mode. Thin is the recommended OP13 daily-driver setting."
        type: choice
        required: true
        default: thin
        options: [thin, none]
      BUILD_TIME:
        description: "Custom uname/build time. Enter F to use current UTC time; enter stock string to mimic stock."
        type: string
        required: false
        default: "F"
      BUILD_USER:
        description: "KBUILD_BUILD_USER"
        type: string
        required: false
        default: "OnePlus"
      BUILD_HOST:
        description: "KBUILD_BUILD_HOST"
        type: string
        required: false
        default: "ubuntu-build"
      clean_build:
        description: "Disable ccache and force a clean compile"
        type: boolean
        required: true
        default: false
      enforce_stock_suffix:
        description: "Fail if UTS_RELEASE does not match stock OP13 suffix"
        type: boolean
        required: true
        default: true
      debug_artifacts:
        description: "Upload final .config, UTS, image string and patch rejects"
        type: boolean
        required: true
        default: true

concurrency:
  group: op13-sukisu-cctv18-adv-stable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: "${{ github.event.inputs.feature_profile }} | Root=${{ github.event.inputs.sukisu_channel }} | SUSFS=${{ github.event.inputs.susfs }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-op13-sukisu-cctv18-adv-stable
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    steps:
      - name: "Runner disk preflight"
        id: disk
        shell: bash
        run: |
          set -euo pipefail
          echo "Memory and swap:"
          free -h || true
          echo ""
          echo "Swap devices:"
          swapon --show || true
          echo ""
          echo "Block devices:"
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS || true
          echo ""
          echo "Disk usage:"
          df -hT || true
          echo ""
          use_maximize=false
          if findmnt -n /mnt >/dev/null 2>&1; then
            SRC="$(findmnt -n -o SOURCE /mnt || true)"
            echo "/mnt is a mount point from: $SRC"
            MNT_FREE_MB="$(df -Pm /mnt | awk 'NR==2 {print $4}' || true)"
            echo "/mnt free MB: ${MNT_FREE_MB:-unknown}"
            if [[ "$SRC" == /dev/* && "$MNT_FREE_MB" =~ ^[0-9]+$ && "$MNT_FREE_MB" -gt 20000 ]]; then
              use_maximize=true
            fi
          else
            echo "/mnt is not a separate mount point on this runner."
          fi
          echo "use_maximize=$use_maximize" >> "$GITHUB_OUTPUT"

      - name: "Maximize build space if runner has /mnt temp disk"
        if: steps.disk.outputs.use_maximize == 'true'
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: "Extra disk cleanup"
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo docker image prune -a -f || true
          sudo docker system prune -af || true
          df -hT

      - name: "Checkout workflow repo"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Git auth and network hardening"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global credential.helper store
          git config --global core.askPass true
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global http.version HTTP/1.1
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 900
          git config --global fetch.parallel 1
          git config --global pack.threads 1

      - name: "Setup ccache directory"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"

      - name: "Restore ccache"
        if: ${{ inputs.clean_build != true }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-op13-sukisu-cctv18-adv-stable-${{ github.event.inputs.feature_profile }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-op13-sukisu-cctv18-adv-stable-${{ github.event.inputs.feature_profile }}-
            ccache-${{ runner.os }}-op13-sukisu-cctv18-adv-stable-

      - name: "Install build dependencies and repo"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3 python3-pip git curl wget ca-certificates rsync unzip zip file \
            build-essential flex bison bc gawk ccache clang lld llvm dwarves \
            libssl-dev libncurses-dev libelf-dev libdw-dev zlib1g-dev liblz4-tool \
            libxml2-utils dos2unix jq kmod elfutils patch xz-utils
          sudo apt-get clean
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > /tmp/repo
          chmod a+x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo
          repo --version
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -s || true

      - name: "Sync OP13 OOS16 source base"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          echo "Using OP13 manifest: $OP13_MANIFEST_REPO ($OP13_MANIFEST_BRANCH/$OP13_MANIFEST_FILE)"
          repo init -u "$OP13_MANIFEST_REPO" -b "$OP13_MANIFEST_BRANCH" -m "$OP13_MANIFEST_FILE" --repo-rev=v2.16 --depth=1 --no-clone-bundle --no-tags
          ok=0
          for spec in "8 4" "4 2" "2 1" "1 1"; do
            set -- $spec
            echo "repo sync attempt: -j$1 --jobs-network=$2"
            if repo sync -c --no-clone-bundle --no-tags --optimized-fetch --fail-fast -j"$1" --jobs-network="$2"; then
              ok=1
              break
            fi
            echo "repo sync failed, retrying with gentler jobs..."
            sleep 45
          done
          [ "$ok" = 1 ] || { echo "::error::repo sync failed"; exit 1; }

          rm -f kernel_platform/common/android/abi_gki_protected_exports_* || true
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || true
          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion || true
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion || true
          sed -i 's/ -dirty//g' kernel_platform/external/dtc/scripts/setlocalversion || true

      - name: "Select exact OP13/AOSP clang toolchain"
        shell: bash
        run: |
          set -euo pipefail
          KP="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          CLANG_BIN="$GITHUB_WORKSPACE/kernel_workspace/$OP13_CLANG_REL"
          if [ ! -x "$CLANG_BIN/clang" ]; then
            echo "::error::Expected OP13 clang not found: $CLANG_BIN/clang"
            find "$KP/prebuilts/clang" -path '*/bin/clang' -type f 2>/dev/null | sort || true
            exit 1
          fi
          REAL_CLANG="$CLANG_BIN/clang"
          REAL_LD_LLD="$CLANG_BIN/ld.lld"
          [ -x "$REAL_LD_LLD" ] || REAL_LD_LLD="$(command -v ld.lld || true)"
          [ -n "$REAL_LD_LLD" ] || { echo "::error::ld.lld not found"; exit 1; }

          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          for p in "$KP/prebuilts/kernel-build-tools/linux-x86/bin" "$KP/prebuilts/kernel-build-tools/linux_musl-x86/bin"; do
            [ -d "$p" ] && echo "$p" >> "$GITHUB_PATH"
          done
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          echo "REAL_CLANG=$REAL_CLANG" >> "$GITHUB_ENV"
          echo "REAL_LD_LLD=$REAL_LD_LLD" >> "$GITHUB_ENV"
          echo "Toolchain check:"
          "$REAL_CLANG" --version
          "$REAL_LD_LLD" --version || true
          if "$REAL_CLANG" --version | grep -qi 'ubuntu'; then
            echo "::error::Refusing to build OP13 boot image with Ubuntu clang. Expected Android/AOSP clang-r510928."
            exit 1
          fi

      - name: "Detect kernel source root"
        shell: bash
        run: |
          set -euo pipefail
          KP="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          for c in "$KP/common" "$KP/common/common" "$KP"; do
            if [[ -f "$c/Makefile" && -d "$c/arch" && -d "$c/drivers" && -d "$c/fs" ]]; then
              echo "KERNEL_DIR=$c" >> "$GITHUB_ENV"
              echo "Kernel source root: $c"
              exit 0
            fi
          done
          echo "::error::Could not detect kernel source root"
          find "$KP" -maxdepth 3 -type f \( -name Makefile -o -name Kconfig \) | head -n 100 || true
          exit 1

      - name: "Resolve SukiSU Ultra channel and build identity"
        shell: bash
        run: |
          set -euo pipefail

          CHANNEL="${{ inputs.sukisu_channel }}"
          CUSTOM_REF="${{ inputs.sukisu_custom_ref }}"

          ROOT_BACKEND="$CHANNEL"
          SETUP_OWNER="SukiSU-Ultra"
          SETUP_REPO="SukiSU-Ultra"
          SETUP_BRANCH="main"
          SETUP_ARG=""
          LABEL=""

          case "$CHANNEL" in
            builtin_latest)
              # SukiSU Ultra builtin channel. This is the safest first path for CCTV18 susfs4oki.
              SETUP_ARG="builtin"
              LABEL="SukiSUUltra_builtin"
              ;;
            main_latest)
              # SukiSU Ultra main channel. Useful for testing newer non-builtin integration.
              SETUP_ARG="main"
              LABEL="SukiSUUltra_main"
              ;;
            custom_ref)
              [ -n "$CUSTOM_REF" ] || { echo "::error::sukisu_custom_ref is required when sukisu_channel=custom_ref"; exit 1; }
              SETUP_ARG="$CUSTOM_REF"
              SAFE_REF="$(printf '%s' "$CUSTOM_REF" | tr -c 'A-Za-z0-9._-' '_' | sed 's/_\{2,\}/_/g')"
              LABEL="SukiSUUltra_${SAFE_REF}"
              ;;
            *)
              echo "::error::Unknown SukiSU channel: $CHANNEL"
              exit 1
              ;;
          esac

          echo "ROOT_BACKEND=$ROOT_BACKEND" >> "$GITHUB_ENV"
          echo "ROOT_SETUP_OWNER=$SETUP_OWNER" >> "$GITHUB_ENV"
          echo "ROOT_SETUP_REPO=$SETUP_REPO" >> "$GITHUB_ENV"
          echo "ROOT_SETUP_BRANCH=$SETUP_BRANCH" >> "$GITHUB_ENV"
          echo "ROOT_SETUP_ARG=$SETUP_ARG" >> "$GITHUB_ENV"
          echo "ROOT_PACKAGE_LABEL=$LABEL" >> "$GITHUB_ENV"
          # Backward-compatible names used later by package scripts.
          echo "SUKISU_SETUP_BRANCH=$SETUP_BRANCH" >> "$GITHUB_ENV"
          echo "SUKISU_SETUP_ARG=$SETUP_ARG" >> "$GITHUB_ENV"
          echo "SUKISU_PACKAGE_LABEL=$LABEL" >> "$GITHUB_ENV"

          INPUT_TIME="${{ inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then
            DATESTR="$INPUT_TIME"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
          fi
          echo "BUILD_TIME_RESOLVED=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_USER=${{ inputs.BUILD_USER }}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=${{ inputs.BUILD_HOST }}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

          echo "SukiSU channel        : SukiSU Ultra only"
          echo "SukiSU channel      : $ROOT_BACKEND"
          echo "Setup repo          : $SETUP_OWNER/$SETUP_REPO"
          echo "Setup script branch : $SETUP_BRANCH"
          echo "Setup arg/ref       : $SETUP_ARG"
          echo "SUSFS source        : CCTV18 susfs4oki"
          echo "SUSFS_ENABLED=${{ inputs.susfs }}" >> "$GITHUB_ENV"
          echo "Build timestamp     : $DATESTR"
          echo "Build user/host     : ${{ inputs.BUILD_USER }}@${{ inputs.BUILD_HOST }}"

      - name: "Patch uname build identity"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          DATESTR="${BUILD_TIME_RESOLVED:?BUILD_TIME_RESOLVED missing}"
          for f in common/scripts/mkcompile_h msm-kernel/scripts/mkcompile_h "$KERNEL_DIR/scripts/mkcompile_h"; do
            [ -f "$f" ] || continue
            echo "Patching $f for UTS_VERSION timestamp"
            if grep -q 'UTS_VERSION=' "$f"; then
              perl -pi -e "s{UTS_VERSION="\\\$\\\(.*?\\\)"}{UTS_VERSION="#1 SMP PREEMPT $DATESTR"}" "$f" || true
              perl -pi -e "s{UTS_VERSION="#1 .*?"}{UTS_VERSION="#1 SMP PREEMPT $DATESTR"}" "$f" || true
            fi
          done

      - name: "Integrate selected root backend"
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          SETUP_URL="https://raw.githubusercontent.com/${ROOT_SETUP_OWNER}/${ROOT_SETUP_REPO}/${ROOT_SETUP_BRANCH}/kernel/setup.sh"
          echo "Fetching setup.sh: $SETUP_URL"
          echo "Running setup arg: $ROOT_SETUP_ARG"
          curl -fLSs "$SETUP_URL" | bash -s "$ROOT_SETUP_ARG"

          echo "SukiSU channel layout:"
          find . -maxdepth 5 \( -path '*KernelSU*' -o -path '*kernelsu*' \) -print | head -n 160 || true
          if [ ! -e "drivers/kernelsu" ]; then
            echo "::error::drivers/kernelsu missing after root backend setup"
            exit 1
          fi

          # Compatibility for SukiSU revisions when SUSFS is disabled by a debug preset.
          if [[ -f drivers/kernelsu/supercall/dispatch.c ]] && grep -q 'ksu_mark_running_process();' drivers/kernelsu/supercall/dispatch.c; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('drivers/kernelsu/supercall/dispatch.c')
          s = p.read_text(encoding='utf-8', errors='replace')
          old = 'ksu_mark_running_process();'
          new = '#if !defined(CONFIG_KSU_SUSFS) && !defined(CONFIG_KSU_MANUAL_HOOK)\n\tksu_mark_running_process();\n#endif'
          if old in s and 'defined(CONFIG_KSU_MANUAL_HOOK)' not in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
          fi
          if [[ -f drivers/kernelsu/supercalls.c ]] && grep -q 'ksu_mark_running_process();' drivers/kernelsu/supercalls.c; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('drivers/kernelsu/supercalls.c')
          s = p.read_text(encoding='utf-8', errors='replace')
          old = 'ksu_mark_running_process();'
          new = '#if !defined(CONFIG_KSU_SUSFS) && !defined(CONFIG_KSU_MANUAL_HOOK)\n\tksu_mark_running_process();\n#endif'
          if old in s and 'defined(CONFIG_KSU_MANUAL_HOOK)' not in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
          fi

      - name: "Apply CCTV18 susfs4oki source and patches"
        if: inputs.susfs == 'On'
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          rm -rf susfs4oki
          SUS_REF="${{ inputs.susfs_ref }}"
          [ -n "$SUS_REF" ] || SUS_REF="$SUSFS_DEFAULT_REF"
          echo "Cloning CCTV18 SUSFS from $SUSFS_REPO"
          git clone --no-tags "$SUSFS_REPO" susfs4oki
          cd susfs4oki
          git checkout "$SUS_REF"
          SUSVER="$(grep '#define SUSFS_VERSION' kernel_patches/include/linux/susfs.h | awk -F'\"' '{print $2}' || true)"
          [ -n "$SUSVER" ] || SUSVER="$SUS_REF"
          echo "SUSVER=$SUSVER" >> "$GITHUB_ENV"
          echo "CCTV18 SUSFS version/ref: $SUSVER"
          cd "$KERNEL_DIR"

          mkdir -p fs include/linux
          cp -a susfs4oki/kernel_patches/fs/. "$KERNEL_DIR/fs/"
          cp -a susfs4oki/kernel_patches/include/linux/. "$KERNEL_DIR/include/linux/"

          PATCH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/susfs4oki/kernel_patches/50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch"
          if [ ! -f "$PATCH" ]; then
            PATCH="$KERNEL_DIR/susfs4oki/kernel_patches/50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch"
          fi
          [ -f "$PATCH" ] || { echo "::error::Missing CCTV18 SUSFS patch: $PATCH"; find susfs4oki/kernel_patches -maxdepth 2 -type f -print; exit 1; }

          if patch --dry-run -p1 -N < "$PATCH" >/tmp/susfs_kernel_patch_check.log 2>&1; then
            patch -p1 -N < "$PATCH"
          elif grep -qi "Reversed\|previously applied" /tmp/susfs_kernel_patch_check.log; then
            echo "CCTV18 SUSFS kernel patch already applied."
          else
            echo "Patch does not apply cleanly, retrying with fuzz=3."
            if ! patch -p1 -N --fuzz=3 < "$PATCH"; then
              echo "CCTV18 SUSFS main patch did not fully apply. Checking if this is the known OP13/OOS16 task_mmu.c context drift."
              find . -name '*.rej' -print -exec sed -n '1,160p' {} \; || true
              mapfile -t REJECTS < <(find . -name '*.rej' -print | sort)
              if [ "${#REJECTS[@]}" -eq 1 ] && [ "${REJECTS[0]}" = "./fs/proc/task_mmu.c.rej" ]; then
                echo "Only fs/proc/task_mmu.c hunk failed. Applying controlled SUS_MAP compatibility patch manually."
                python3 - <<'PYMANUAL'
          from pathlib import Path
          import re, sys

          p = Path('fs/proc/task_mmu.c')
          s = p.read_text(encoding='utf-8', errors='replace')
          needle = 'SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file))'
          if needle in s:
              print('task_mmu.c already contains SUSFS SUS_MAP guard; continuing.')
              sys.exit(0)

          pattern = re.compile(
              r'(/\*\s*Case 4 above\s*\*/\s*\n)([ \t]*)if \(vma->vm_end > last_vma_end\)\s*\n([ \t]*)smap_gather_stats\(vma, &mss, last_vma_end\);',
              re.M,
          )
          m = pattern.search(s)
          if not m:
              print('ERROR: Could not find show_smaps_rollup Case 4 smap_gather_stats pattern for manual SUS_MAP patch.', file=sys.stderr)
              sys.exit(1)

          indent_if = m.group(2)
          indent_call = m.group(3)
          replacement = (
              m.group(1) +
              f'{indent_if}if (vma->vm_end > last_vma_end) {{\n' +
              f'{indent_call}#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n' +
              f'{indent_call}if (!vma->vm_file || !(SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))) {{\n' +
              f'{indent_call}\tsmap_gather_stats(vma, &mss, last_vma_end);\n' +
              f'{indent_call}}}\n' +
              f'{indent_call}#else\n' +
              f'{indent_call}smap_gather_stats(vma, &mss, last_vma_end);\n' +
              f'{indent_call}#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n' +
              f'{indent_if}}}'
          )

          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              print(f'ERROR: Manual task_mmu patch replacement count was {n}, expected 1.', file=sys.stderr)
              sys.exit(1)
          p.write_text(s2, encoding='utf-8')
          print('Applied manual SUSFS SUS_MAP guard to fs/proc/task_mmu.c')
          PYMANUAL
                rm -f ./fs/proc/task_mmu.c.rej
              else
                echo "::error::CCTV18 SUSFS main patch failed with unexpected rejects."
                exit 1
              fi
            fi
          fi

          GLUE="$KERNEL_DIR/susfs4oki/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch"
          [ -f "$GLUE" ] || { echo "::error::Missing CCTV18 KernelSU/SukiSU glue patch: $GLUE"; exit 1; }

          echo "SukiSU path diagnostics before CCTV18 glue:"
          ls -la drivers/kernelsu || true
          readlink -f drivers/kernelsu || true
          find KernelSU drivers/kernelsu -maxdepth 3 -type f \( -name Kconfig -o -name Kbuild -o -name Makefile \) -print 2>/dev/null || true

          if ! grep -Rqs 'config KSU_SUSFS' drivers/kernelsu KernelSU 2>/dev/null; then
            echo "Applying CCTV18 SUSFS glue to SukiSU Ultra."
            if [ -d KernelSU ]; then
              cp "$GLUE" KernelSU/10_enable_susfs_for_ksu.patch
              cd KernelSU
              if patch --dry-run -p1 -N < 10_enable_susfs_for_ksu.patch >/tmp/susfs_glue_check.log 2>&1; then
                patch -p1 -N < 10_enable_susfs_for_ksu.patch
              elif grep -qi "Reversed\|previously applied" /tmp/susfs_glue_check.log; then
                echo "CCTV18 SUSFS glue already applied in KernelSU."
              else
                echo "Patch does not apply cleanly to KernelSU, retrying with fuzz=3."
                if ! patch -p1 -N --fuzz=3 < 10_enable_susfs_for_ksu.patch; then
                  echo "::error::CCTV18 SUSFS KernelSU/SukiSU glue patch failed. Reject preview:"
                  cat /tmp/susfs_glue_check.log || true
                  find . -name '*.rej' -print -exec sed -n '1,160p' {} \; || true
                  exit 1
                fi
              fi
              cd "$KERNEL_DIR"
            else
              echo "::error::KernelSU directory missing after SukiSU setup; cannot apply CCTV18 glue."
              exit 1
            fi
          else
            echo "KSU_SUSFS Kconfig symbol already present before glue patch."
          fi

          echo "Apply SukiSU Ultra + CCTV18 compatibility repairs."
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          def patch_adb_root(p: Path):
              if not p.exists():
                  return False
              s = p.read_text(encoding='utf-8', errors='replace')
              if 'susfs_starts_with' not in s and 'susfs_ends_with' not in s:
                  return False
              orig = s

              # CCTV18's susfs.h does not currently declare these string helpers, and some SukiSU Ultra
              # revisions call them from adb_root.c. Use local wrappers instead of extern declarations so
              # the build does not later fail at link time if the global helpers are absent.
              s = s.replace('susfs_starts_with(', 'ksu_susfs_starts_with(')
              s = s.replace('susfs_ends_with(', 'ksu_susfs_ends_with(')

              if 'static inline bool ksu_susfs_starts_with' not in s:
                  lines = s.splitlines()
                  idx = 0
                  has_string = any(line.strip() == '#include <linux/string.h>' for line in lines[:100])
                  for i, line in enumerate(lines[:100]):
                      if line.startswith('#include'):
                          idx = i + 1
                  if not has_string:
                      lines.insert(idx, '#include <linux/string.h>')
                      idx += 1
                  helpers = [
                      '',
                      'static inline bool ksu_susfs_starts_with(const char *str, const char *prefix)',
                      '{',
                      '\tsize_t len;',
                      '',
                      '\tif (!str || !prefix)',
                      '\t\treturn false;',
                      '\tlen = strlen(prefix);',
                      '\treturn strncmp(str, prefix, len) == 0;',
                      '}',
                      '',
                      'static inline bool ksu_susfs_ends_with(const char *str, const char *suffix)',
                      '{',
                      '\tsize_t str_len, suffix_len;',
                      '',
                      '\tif (!str || !suffix)',
                      '\t\treturn false;',
                      '\tstr_len = strlen(str);',
                      '\tsuffix_len = strlen(suffix);',
                      '\tif (suffix_len > str_len)',
                      '\t\treturn false;',
                      '\treturn strcmp(str + str_len - suffix_len, suffix) == 0;',
                      '}',
                      ''
                  ]
                  lines[idx:idx] = helpers
                  s = '\n'.join(lines) + ('\n' if orig.endswith('\n') else '')

              if s != orig:
                  p.write_text(s, encoding='utf-8')
                  print(f'Patched local SUSFS adb_root string helpers in {p}')
              return True

          def patch_sulog(p: Path):
              if not p.exists():
                  return False
              s = p.read_text(encoding='utf-8', errors='replace')
              orig = s
              # Newer SukiSU sulog signature expects struct user_arg_ptr *. USER_ARG_NULL is a struct value,
              # so replace it when used as the capture argv_user argument. This is intentionally broad
              # inside sulog/event.c because USER_ARG_NULL is only for the null argv marker there.
              s = re.sub(r',\s*USER_ARG_NULL\s*,\s*gfp\)', ', NULL, gfp)', s)
              if s != orig:
                  p.write_text(s, encoding='utf-8')
                  print(f'Patched USER_ARG_NULL pointer compatibility in {p}')
              return s != orig

          adb_paths = [Path('drivers/kernelsu/feature/adb_root.c'), Path('KernelSU/kernel/feature/adb_root.c')]
          sulog_paths = [Path('drivers/kernelsu/sulog/event.c'), Path('KernelSU/kernel/sulog/event.c')]
          patched_adb = any(patch_adb_root(p) for p in adb_paths)
          patched_sulog = any(patch_sulog(p) for p in sulog_paths)

          # Hard verification: do not let the compile stage fail again with the same preventable errors.
          for p in adb_paths:
              if p.exists():
                  s = p.read_text(encoding='utf-8', errors='replace')
                  if re.search(r'(?<!ksu_)susfs_starts_with\s*\(', s) or re.search(r'(?<!ksu_)susfs_ends_with\s*\(', s):
                      print(f'ERROR: unresolved raw susfs_starts_with/susfs_ends_with call remains in {p}', file=sys.stderr)
                      sys.exit(1)
                  if 'ksu_susfs_starts_with(' in s and 'static inline bool ksu_susfs_starts_with' not in s:
                      print(f'ERROR: ksu_susfs_starts_with wrapper missing in {p}', file=sys.stderr)
                      sys.exit(1)

          for p in sulog_paths:
              if p.exists():
                  s = p.read_text(encoding='utf-8', errors='replace')
                  if re.search(r',\s*USER_ARG_NULL\s*,\s*gfp\)', s):
                      print(f'ERROR: USER_ARG_NULL capture argument remains in {p}', file=sys.stderr)
                      sys.exit(1)

          def patch_ksud_bool_hooks(p: Path):
              if not p.exists():
                  return False
              s = p.read_text(encoding='utf-8', errors='replace')
              orig = s
              # Current SukiSU builtin can expose KSU_COMPAT_USE_STATIC_KEY while CCTV18 OKI
              # patch expects KernelSU-Next-style static-key globals. For OP13/SukiSU,
              # force ksud.c to use SukiSU's stable bool hook path instead.
              s = re.sub(
                  r'#if\s+defined\(CONFIG_KSU_SUSFS\)\s*&&\s*defined\(KSU_COMPAT_USE_STATIC_KEY\)',
                  '#if 0 /* OP13_LSPOSED_CLEAN_FIX: use bool hooks, not CCTV18/KSUN static-key stop path */',
                  s,
              )
              if s != orig:
                  p.write_text(s, encoding='utf-8')
                  print(f'Forced bool hook compatibility path in {p}')
              return s != orig

          def patch_cctv18_selinux_to_live_policy():
              """Disable CCTV18 hidden-backup-policy wrappers for SukiSU Ultra cleanly.

              The previous v34 cleanup changed the live hook tables back to stock handlers,
              but it left the unused CCTV18 wrapper function bodies in hooks.c/selinuxfs.c.
              Even unused compiled functions can still reference backup_sepolicy and
              security_*_with_policy symbols and break link-time/runtime behaviour.

              This v35 path does three things:
                1. Route live SELinux hooks back to stock handlers.
                2. Remove backup-policy arguments from simple helper calls when safe.
                3. Preprocessor-disable the unused CCTV18 wrapper functions entirely.

              SELinux stays enforcing. We are not adding permissive rules and we are not
              faking policy decisions. We are only removing the incompatible hidden-policy
              detour that SukiSU Ultra builtin does not provide cleanly on OP13/OOS16.
              """
              changed_any = False

              def wrap_function_if_present(s: str, name: str):
                  """Wrap a C function definition in #if 0 by matching braces."""
                  # Most affected functions are static int/ssize_t wrappers, but keep the
                  # return-type pattern broad enough for vendor formatting.
                  pattern = re.compile(
                      r'(^[ \t]*(?:static\s+)?[A-Za-z_][A-Za-z0-9_\s\*]*\s+' + re.escape(name) +
                      r'\s*\([^;]*?\)\s*\{)',
                      re.M | re.S,
                  )
                  m = pattern.search(s)
                  if not m:
                      return s, False
                  # If already disabled very close before the function, skip.
                  prefix = s[max(0, m.start()-120):m.start()]
                  if 'OP13_LSPOSED_CLEAN_FIX_DISABLED' in prefix or '#if 0' in prefix.splitlines()[-3:]:
                      return s, False
                  i = m.end() - 1
                  depth = 0
                  j = i
                  in_str = False
                  in_chr = False
                  esc = False
                  line_comment = False
                  block_comment = False
                  while j < len(s):
                      c = s[j]
                      n = s[j+1] if j + 1 < len(s) else ''
                      if line_comment:
                          if c == '\n':
                              line_comment = False
                          j += 1
                          continue
                      if block_comment:
                          if c == '*' and n == '/':
                              block_comment = False
                              j += 2
                          else:
                              j += 1
                          continue
                      if in_str:
                          if esc:
                              esc = False
                          elif c == '\\':
                              esc = True
                          elif c == '"':
                              in_str = False
                          j += 1
                          continue
                      if in_chr:
                          if esc:
                              esc = False
                          elif c == '\\':
                              esc = True
                          elif c == "'":
                              in_chr = False
                          j += 1
                          continue
                      if c == '/' and n == '/':
                          line_comment = True
                          j += 2
                          continue
                      if c == '/' and n == '*':
                          block_comment = True
                          j += 2
                          continue
                      if c == '"':
                          in_str = True
                          j += 1
                          continue
                      if c == "'":
                          in_chr = True
                          j += 1
                          continue
                      if c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              end = j + 1
                              disabled = (
                                  '#if 0 /* OP13_LSPOSED_CLEAN_FIX_DISABLED: incompatible CCTV18 hidden-policy wrapper */\n'
                                  + s[m.start():end]
                                  + '\n#endif /* OP13_LSPOSED_CLEAN_FIX_DISABLED */'
                              )
                              return s[:m.start()] + disabled + s[end:], True
                      j += 1
                  print(f'ERROR: could not find end of function {name}', file=sys.stderr)
                  sys.exit(1)

              targets = [Path('security/selinux/hooks.c'), Path('security/selinux/selinuxfs.c')]
              for p in targets:
                  if not p.exists():
                      continue
                  s = p.read_text(encoding='utf-8', errors='replace')
                  orig = s

                  # Route live hook tables back to stock SELinux handlers.
                  s = re.sub(r'LSM_HOOK_INIT\s*\(\s*setprocattr\s*,\s*my_setprocattr\s*\)',
                             'LSM_HOOK_INIT(setprocattr, selinux_setprocattr)', s)
                  s = re.sub(r'\[SEL_ACCESS\]\s*=\s*my_write_access\s*,',
                             '[SEL_ACCESS] = sel_write_access,', s)
                  s = re.sub(r'\[SEL_CONTEXT\]\s*=\s*my_write_context\s*,',
                             '[SEL_CONTEXT] = sel_write_context,', s)

                  # If any simple hidden-policy helper call remains outside disabled wrappers,
                  # rewrite it to the live helper call. This is harmless if the function is later
                  # #if0-disabled, but useful for formatting variants.
                  s = re.sub(r'security_context_to_sid_with_policy\s*\(\s*backup_sepolicy\s*,\s*',
                             'security_context_to_sid_default(', s)
                  s = re.sub(r'security_sid_to_context_with_policy\s*\(\s*backup_sepolicy\s*,\s*',
                             'security_sid_to_context(', s)
                  s = re.sub(r'security_compute_av_user_with_policy\s*\(\s*backup_sepolicy\s*,\s*',
                             'security_compute_av_user(', s)

                  # Disable the now-unused CCTV18 wrapper functions so their hidden-policy path
                  # cannot produce unresolved symbols or runtime policy failures.
                  for fname in ['my_setprocattr', 'my_write_access', 'my_write_context']:
                      s, did = wrap_function_if_present(s, fname)

                  if s != orig:
                      p.write_text(s, encoding='utf-8')
                      print(f'Neutralised CCTV18 hidden-policy wrappers in {p}; stock live SELinux handlers remain active')
                      changed_any = True
              return changed_any

          def create_static_key_compat_object():
              """Provide only missing static-key symbols expected by the OKI patch.

              Keep this separate from ksu.c to avoid injecting fake SELinux policy wrappers.
              """
              ksu_dir = Path('KernelSU/kernel') if Path('KernelSU/kernel').exists() else Path('drivers/kernelsu')
              if not ksu_dir.exists():
                  print('ERROR: Cannot find SukiSU kernel directory for OP13 compat object', file=sys.stderr)
                  sys.exit(1)

              defs = []
              wanted = {
                  'ksu_is_input_hook_enabled': 'TRUE',
                  'ksu_is_init_rc_hook_enabled': 'TRUE',
                  'ksu_input_hook_key_false': 'FALSE',
                  'ksu_init_rc_hook_key_false': 'FALSE',
              }
              tree_files = []
              for root in [Path('KernelSU/kernel'), Path('drivers/kernelsu')]:
                  if root.exists():
                      tree_files.extend([x for x in root.rglob('*') if x.is_file() and x.name != 'op13_cctv18_static_keys.c'])

              def symbol_defined(sym: str) -> bool:
                  pat = re.compile(r'\b(DEFINE_STATIC_KEY_(?:TRUE|FALSE)|struct\s+static_key_(?:true|false))\s*\(?\s*' + re.escape(sym) + r'\b')
                  for f in tree_files:
                      try:
                          txt = f.read_text(encoding='utf-8', errors='ignore')
                      except Exception:
                          continue
                      if pat.search(txt):
                          return True
                  return False

              for sym, kind in wanted.items():
                  if not symbol_defined(sym):
                      defs.append((sym, kind))

              c_path = ksu_dir / 'op13_cctv18_static_keys.c'
              if defs:
                  lines = [
                      '#include <linux/jump_label.h>',
                      '',
                      '/* OP13_LSPOSED_CLEAN_FIX: missing CCTV18/SukiSU static-key compatibility symbols only. */',
                  ]
                  for sym, kind in defs:
                      lines.append(f'DEFINE_STATIC_KEY_{kind}({sym});')
                  lines.append('')
                  c_path.write_text('\n'.join(lines), encoding='utf-8')
                  print(f'Created {c_path} with symbols: ' + ', '.join(sym for sym, _ in defs))
              else:
                  c_path.write_text('/* OP13_LSPOSED_CLEAN_FIX: no missing static-key symbols required. */\n', encoding='utf-8')
                  print(f'Created empty {c_path}; all static-key symbols already exist')

              mk = ksu_dir / 'Makefile'
              if not mk.exists():
                  print(f'ERROR: SukiSU Makefile missing: {mk}', file=sys.stderr)
                  sys.exit(1)
              mt = mk.read_text(encoding='utf-8', errors='replace')
              if 'op13_cctv18_static_keys.o' not in mt:
                  mt = mt.rstrip() + '\nobj-$(CONFIG_KSU) += op13_cctv18_static_keys.o\n'
                  mk.write_text(mt, encoding='utf-8')
                  print(f'Linked op13_cctv18_static_keys.o from {mk}')
              return True

          adb_paths = [Path('drivers/kernelsu/feature/adb_root.c'), Path('KernelSU/kernel/feature/adb_root.c')]
          sulog_paths = [Path('drivers/kernelsu/sulog/event.c'), Path('KernelSU/kernel/sulog/event.c')]
          ksud_paths = [Path('drivers/kernelsu/runtime/ksud.c'), Path('KernelSU/kernel/runtime/ksud.c')]

          patched_adb = any(patch_adb_root(p) for p in adb_paths)
          patched_sulog = any(patch_sulog(p) for p in sulog_paths)
          patched_ksud = any(patch_ksud_bool_hooks(p) for p in ksud_paths)
          patched_selinux = patch_cctv18_selinux_to_live_policy()
          patched_static_keys = create_static_key_compat_object()

          # Hard verification: catch the exact previous failures before wasting a full build.
          for p in adb_paths:
              if p.exists():
                  s = p.read_text(encoding='utf-8', errors='replace')
                  if re.search(r'(?<!ksu_)susfs_starts_with\s*\(', s) or re.search(r'(?<!ksu_)susfs_ends_with\s*\(', s):
                      print(f'ERROR: unresolved raw susfs string helper remains in {p}', file=sys.stderr)
                      sys.exit(1)

          for p in sulog_paths:
              if p.exists():
                  s = p.read_text(encoding='utf-8', errors='replace')
                  if re.search(r',\s*USER_ARG_NULL\s*,\s*gfp\)', s):
                      print(f'ERROR: USER_ARG_NULL capture argument remains in {p}', file=sys.stderr)
                      sys.exit(1)

          for p in [Path('security/selinux/hooks.c'), Path('security/selinux/selinuxfs.c')]:
              if p.exists():
                  s = p.read_text(encoding='utf-8', errors='replace')
                  # Verify live dispatch is not routed to the CCTV18 wrapper names. The wrapper
                  # definitions may still exist inside #if 0 disabled blocks, which is safe.
                  bad = []
                  if re.search(r'LSM_HOOK_INIT\s*\(\s*setprocattr\s*,\s*my_setprocattr\s*\)', s):
                      bad.append('live setprocattr still points to my_setprocattr')
                  if re.search(r'\[SEL_ACCESS\]\s*=\s*my_write_access\s*,', s):
                      bad.append('SEL_ACCESS still points to my_write_access')
                  if re.search(r'\[SEL_CONTEXT\]\s*=\s*my_write_context\s*,', s):
                      bad.append('SEL_CONTEXT still points to my_write_context')
                  # If hidden-policy symbols remain but no disabled wrapper marker exists, fail.
                  hidden_tokens = ['security_context_to_sid_with_policy(', 'security_sid_to_context_with_policy(',
                                   'security_compute_av_user_with_policy(', 'backup_sepolicy,']
                  if any(tok in s for tok in hidden_tokens) and 'OP13_LSPOSED_CLEAN_FIX_DISABLED' not in s:
                      bad.append('hidden-policy tokens remain outside disabled wrapper path')
                  if bad:
                      print(f'ERROR: OP13 LSPosed clean-up incomplete in {p}: {bad}', file=sys.stderr)
                      sys.exit(1)

          for p in ksud_paths:
              if p.exists():
                  s = p.read_text(encoding='utf-8', errors='replace')
                  if re.search(r'#if\s+defined\(CONFIG_KSU_SUSFS\)\s*&&\s*defined\(KSU_COMPAT_USE_STATIC_KEY\)', s):
                      print(f'ERROR: ksud static-key stop path still enabled in {p}', file=sys.stderr)
                      sys.exit(1)

          print(f'Compatibility repair summary: adb_root_patched={patched_adb}, sulog_patched={patched_sulog}, ksud_bool_hooks={patched_ksud}, selinux_live_policy={patched_selinux}, static_key_object={patched_static_keys}')
          PY

          echo "SukiSU/CCTV18 compatibility repair preview:"
          grep -Rns 'ksu_susfs_starts_with\|ksu_susfs_ends_with\|KSU_SULOG_EVENT_IOCTL_GRANT_ROOT\|OP13_LSPOSED_CLEAN_FIX\|op13_cctv18_static_keys' drivers/kernelsu KernelSU security/selinux 2>/dev/null | head -n 160 || true

          echo "Post-CCTV18 SUSFS symbol check:"
          grep -Rns 'KSU_SUSFS\|SUSFS_VERSION\|susfs_init\|susfs_starts_with\|susfs_ends_with' drivers KernelSU fs include 2>/dev/null | head -n 180 || true
          [ -f include/linux/susfs.h ] || { echo "::error::include/linux/susfs.h missing after CCTV18 SUSFS integration"; exit 1; }
          if ! grep -Rqs 'config KSU_SUSFS' drivers/kernelsu KernelSU 2>/dev/null; then
            echo "::error::KSU_SUSFS Kconfig symbol is still missing after CCTV18 glue."
            exit 1
          fi
          if ! grep -Rqs 'susfs_init' drivers/kernelsu KernelSU 2>/dev/null; then
            echo "::error::SUSFS init hook is missing from SukiSU after CCTV18 glue."
            exit 1
          fi

      - name: "Apply OP13 stable daily config"
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          [ -f "$DEFCONFIG" ] || { echo "::error::gki_defconfig not found"; exit 1; }
          PROFILE="${{ inputs.feature_profile }}"
          BBR_IN="${{ inputs.bbr }}"
          BBG_IN="${{ inputs.bbg }}"
          TTL_IPSET_IN="${{ inputs.ttl_ipset }}"
          NTSYNC_IN="${{ inputs.ntsync }}"
          UNICODE_IN="${{ inputs.unicode_fix }}"
          DS_IN="${{ inputs.droidspaces }}"
          ADIOS_IN="${{ inputs.adios }}"
          ZRAM_LZ4_IN="${{ inputs.zram_lz4_support }}"
          ZRAM_MODULE_IN="${{ inputs.zram_module }}"
          HMBIRD_IN="${{ inputs.hmbird }}"
          SUSFS_IN="${{ inputs.susfs }}"

          # Safety presets. Defaults are intentionally conservative for SukiSU Ultra + CCTV18 SUSFS on OP13.
          if [ "$PROFILE" = "minimal_debug" ]; then
            BBR_IN="Off"; BBG_IN="Off"; TTL_IPSET_IN="Off"; NTSYNC_IN="Off"; UNICODE_IN="Off"; DS_IN="Off"; ADIOS_IN="Off"; ZRAM_LZ4_IN="Off"; ZRAM_MODULE_IN="Off"; HMBIRD_IN="Off"
          elif [ "$PROFILE" = "advanced_daily" ]; then
            # Advanced daily intentionally adds the optional extras that battery_daily avoids.
            # You can still turn these Off from the menu if you want a lighter build.
            DS_IN="On"
            HMBIRD_IN="On"
          elif [ "$PROFILE" = "experimental_max" ]; then
            BBR_IN="On"; BBG_IN="On"; TTL_IPSET_IN="On"; NTSYNC_IN="On"; UNICODE_IN="On"; DS_IN="On"; ADIOS_IN="On"; ZRAM_LZ4_IN="On"; ZRAM_MODULE_IN="On"; HMBIRD_IN="On"
          fi

          cat >> "$DEFCONFIG" <<EOF
          # Stock OP13 source/defconfig may already carry CONFIG_LOCALVERSION="-4k".
          # We reset it here because LOCALVERSION env below supplies the full stock suffix.
          # Without this, UTS_RELEASE becomes 6.6.89-4k-android15-...-4k and boot-safety validation fails.
          CONFIG_LOCALVERSION=""
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_KSU=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          if [ "$SUSFS_IN" = "On" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          # CONFIG_KSU_SUSFS_ENABLE_LOG is not set
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          EOF
          else
            cat >> "$DEFCONFIG" <<'EOF'
          # CONFIG_KSU_SUSFS is not set
          EOF
          fi

          if [ "$ZRAM_LZ4_IN" = "On" ] || [ "$ZRAM_MODULE_IN" = "On" ]; then
            if [ "$ZRAM_MODULE_IN" = "On" ]; then
              cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_ZRAM=m
          CONFIG_ZSMALLOC=m
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          # CONFIG_ZRAM_DEF_COMP_LZORLE is not set
          CONFIG_ZRAM_DEF_COMP="lz4"
          CONFIG_LZ4_COMPRESS=y
          CONFIG_LZ4_DECOMPRESS=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_LZ4HC=y
          EOF
            else
              cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_ZRAM=y
          CONFIG_ZSMALLOC=y
          CONFIG_LZ4_COMPRESS=y
          CONFIG_LZ4_DECOMPRESS=y
          CONFIG_CRYPTO_LZ4=y
          CONFIG_CRYPTO_LZ4HC=y
          EOF
            fi
          fi
          if [ "$BBR_IN" = "On" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          # CONFIG_DEFAULT_CUBIC is not set
          CONFIG_DEFAULT_TCP_CONG="bbr"
          EOF
          fi
          if [ "$TTL_IPSET_IN" = "On" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_NETFILTER_XT_TARGET_TTL=y
          CONFIG_NETFILTER_XT_MATCH_TTL=y
          CONFIG_IP_SET=y
          CONFIG_IP_SET_MAX=256
          CONFIG_IP_SET_HASH_IP=y
          CONFIG_IP_SET_HASH_IPPORT=y
          CONFIG_IP_SET_HASH_NETPORTNET=y
          CONFIG_NF_NAT_IPV6=y
          EOF
          fi
          if [ "$ADIOS_IN" = "On" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_MQ_IOSCHED_ADIOS=y
          CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y
          EOF
          fi
          if [ "$NTSYNC_IN" = "On" ]; then
            echo "CONFIG_NTSYNC=y" >> "$DEFCONFIG"
          fi
          if [ "$UNICODE_IN" = "On" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_UNICODE=y
          CONFIG_UNICODE_UTF8_DATA=y
          EOF
          fi
          if [ "$DS_IN" = "On" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_DROIDSPACE=y
          CONFIG_DROIDSPACES=y
          EOF
          fi
          if [ "$BBG_IN" = "On" ]; then
            echo "CONFIG_BBG=y" >> "$DEFCONFIG"
          fi
          if [ "$HMBIRD_IN" = "On" ]; then
            # Best-effort: exact symbol depends on the synced tree.
            grep -Rqs '^config HMBIRD\|^config FENGCHI' . && {
              echo "CONFIG_HMBIRD=y" >> "$DEFCONFIG"
              echo "CONFIG_FENGCHI=y" >> "$DEFCONFIG"
            } || true
          fi
          if [ "${{ inputs.lto }}" = "thin" ]; then
            cat >> "$DEFCONFIG" <<'EOF'
          CONFIG_LTO_CLANG=y
          CONFIG_LTO_CLANG_THIN=y
          # CONFIG_LTO_CLANG_FULL is not set
          EOF
          else
            cat >> "$DEFCONFIG" <<'EOF'
          # CONFIG_LTO_CLANG is not set
          EOF
          fi

      - name: "Build kernel and validate final config"
        shell: bash
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"
          export PATH="$CLANG_BIN:$PATH"
          export KBUILD_BUILD_TIMESTAMP="${KBUILD_BUILD_TIMESTAMP:-${BUILD_TIME_RESOLVED:-}}"
          export LOCALVERSION="$OP_STOCK_LOCALVERSION"
          MAKE_ARGS=(LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache $REAL_CLANG" LD="$REAL_LD_LLD" HOSTLD="$REAL_LD_LLD" O=out LOCALVERSION="$LOCALVERSION")
          if [ "${{ inputs.clean_build }}" = "true" ]; then
            export CCACHE_DISABLE=1
          fi

          make -j"$(nproc)" "${MAKE_ARGS[@]}" gki_defconfig

          # Enforce stock suffix correctly: clear CONFIG_LOCALVERSION and let the LOCALVERSION env
          # provide OP_STOCK_LOCALVERSION exactly once. This avoids the duplicate -4k prefix.
          ./scripts/config --file out/.config --set-str LOCALVERSION "" -d LOCALVERSION_AUTO || true
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION=""/' out/.config || true

          # Enforce critical options after initial defconfig expansion.
          ./scripts/config --file out/.config -d LOCALVERSION_AUTO -e KSU -e TMPFS_XATTR -e TMPFS_POSIX_ACL || true
          if [ "${{ inputs.susfs }}" = "On" ]; then
            ./scripts/config --file out/.config -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_SPOOF_UNAME -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT -e KSU_SUSFS_SUS_MAP -d KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS || true
          else
            ./scripts/config --file out/.config -d KSU_SUSFS -d KSU_SUSFS_SUS_PATH -d KSU_SUSFS_SUS_MOUNT -d KSU_SUSFS_SUS_KSTAT \
              -d KSU_SUSFS_SPOOF_UNAME -d KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -d KSU_SUSFS_OPEN_REDIRECT \
              -d KSU_SUSFS_SUS_MAP -d KSU_SUSFS_ENABLE_LOG -d KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS || true
          fi

          # SukiSU hook model changed across refs. Old refs expose KSU_NONE_HOOK; current builtin may not.
          if grep -Rqs '^config KSU_NONE_HOOK' drivers/kernelsu KernelSU 2>/dev/null; then
            ./scripts/config --file out/.config -e KSU_NONE_HOOK -d KSU_MANUAL_HOOK -d KSU_SYSCALL_HOOK || true
          else
            ./scripts/config --file out/.config -d KSU_SYSCALL_HOOK || true
          fi

          if [ "${{ inputs.feature_profile }}" != "minimal_debug" ]; then
            if [ "${{ inputs.zram_lz4_support }}" = "On" ] || [ "${{ inputs.zram_module }}" = "On" ]; then
              if [ "${{ inputs.zram_module }}" = "On" ]; then
                ./scripts/config --file out/.config -m ZRAM -m ZSMALLOC -e ZRAM_DEF_COMP_LZ4 -d ZRAM_DEF_COMP_LZORLE --set-str ZRAM_DEF_COMP lz4 \
                  -e LZ4_COMPRESS -e LZ4_DECOMPRESS -e CRYPTO_LZ4 -e CRYPTO_LZ4HC || true
              else
                ./scripts/config --file out/.config -e ZRAM -e ZSMALLOC -e LZ4_COMPRESS -e LZ4_DECOMPRESS -e CRYPTO_LZ4 -e CRYPTO_LZ4HC || true
              fi
            fi
            if [ "${{ inputs.bbr }}" = "On" ]; then
              ./scripts/config --file out/.config -e TCP_CONG_BBR -e DEFAULT_BBR -d DEFAULT_CUBIC --set-str DEFAULT_TCP_CONG bbr || true
            fi
            if [ "${{ inputs.ttl_ipset }}" = "On" ]; then
              ./scripts/config --file out/.config -e NETFILTER_XT_TARGET_TTL -e NETFILTER_XT_MATCH_TTL -e IP_SET -e IP_SET_HASH_IP -e IP_SET_HASH_IPPORT -e IP_SET_HASH_NETPORTNET -e NF_NAT_IPV6 || true
            fi
            [ "${{ inputs.ntsync }}" = "On" ] && ./scripts/config --file out/.config -e NTSYNC || true
            [ "${{ inputs.unicode_fix }}" = "On" ] && ./scripts/config --file out/.config -e UNICODE -e UNICODE_UTF8_DATA || true
            [ "${{ inputs.droidspaces }}" = "On" ] && ./scripts/config --file out/.config -e DROIDSPACE -e DROIDSPACES || true
            [ "${{ inputs.bbg }}" = "On" ] && ./scripts/config --file out/.config -e BBG || true
            [ "${{ inputs.adios }}" = "On" ] && ./scripts/config --file out/.config -e MQ_IOSCHED_ADIOS -e MQ_IOSCHED_DEFAULT_ADIOS || true
          fi
          if [ "${{ inputs.feature_profile }}" = "experimental_max" ]; then
            ./scripts/config --file out/.config -e MQ_IOSCHED_ADIOS -e MQ_IOSCHED_DEFAULT_ADIOS -e DROIDSPACE -e DROIDSPACES || true
          fi
          if [ "${{ inputs.lto }}" = "thin" ]; then
            ./scripts/config --file out/.config -e LTO_CLANG -e LTO_CLANG_THIN -d LTO_CLANG_FULL || true
          fi

          make -j"$(nproc)" "${MAKE_ARGS[@]}" olddefconfig

          # Hard stop before the expensive full compile if CONFIG_LOCALVERSION leaked from stock defconfig.
          if grep -q '^CONFIG_LOCALVERSION="-4k"' out/.config; then
            echo "::error::CONFIG_LOCALVERSION leaked as -4k. This would duplicate the OP13 stock suffix."
            grep -n '^CONFIG_LOCALVERSION' out/.config || true
            exit 1
          fi

          echo "Final config highlights:"
          grep -nE 'CONFIG_LOCALVERSION|CONFIG_KSU|CONFIG_BBG|CONFIG_TCP_CONG_BBR|CONFIG_DEFAULT_BBR|CONFIG_DEFAULT_CUBIC|CONFIG_DEFAULT_TCP_CONG|CONFIG_IP_SET|CONFIG_NETFILTER_XT|CONFIG_NTSYNC|CONFIG_LTO|CONFIG_MQ_IOSCHED_ADIOS|CONFIG_DROID|CONFIG_UNICODE|CONFIG_ZRAM|CONFIG_ZSMALLOC|CONFIG_LZ4|CONFIG_CRYPTO_LZ4' out/.config || true

          if ! grep -q '^CONFIG_KSU=y' out/.config; then echo "::error::CONFIG_KSU=y missing"; exit 1; fi
          if [ "${{ inputs.susfs }}" = "On" ]; then
            if ! grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then echo "::error::CONFIG_KSU_SUSFS=y missing while susfs=On"; exit 1; fi
          else
            if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then echo "::error::CONFIG_KSU_SUSFS=y present while susfs=Off"; exit 1; fi
          fi
          if grep -q '^CONFIG_KSU_SYSCALL_HOOK=y' out/.config; then echo "::error::CONFIG_KSU_SYSCALL_HOOK=y detected; refusing unstable hook mode"; exit 1; fi

          make -j"$(nproc)" "${MAKE_ARGS[@]}" all
          REL="$(cat out/include/config/kernel.release 2>/dev/null || true)"
          echo "KERNEL_RELEASE=$REL" >> "$GITHUB_ENV"
          echo "Kernel release: $REL"
          if [ "${{ inputs.enforce_stock_suffix }}" = "true" ] && [ "$REL" != "$OP_EXPECTED_UTS" ]; then
            echo "::error::UTS_RELEASE mismatch. Expected '$OP_EXPECTED_UTS' but got '$REL'"
            exit 1
          fi

          # Resolve the built Image to an absolute path before leaving $KERNEL_DIR.
          # The packaging step runs from $GITHUB_WORKSPACE, so a relative value like
          # out/arch/arm64/boot/Image points to the wrong directory and breaks AnyKernel packaging.
          IMAGE="$(find "$KERNEL_DIR/out" -type f -path '*/arch/arm64/boot/Image' -print -quit 2>/dev/null || true)"
          if [ -z "$IMAGE" ]; then
            IMAGE="$(find "$KERNEL_DIR/out" -type f -name Image -print -quit 2>/dev/null || true)"
          fi
          [ -n "$IMAGE" ] && [ -f "$IMAGE" ] || { echo "::error::Kernel Image not found under $KERNEL_DIR/out"; find "$KERNEL_DIR/out" -type f \( -name 'Image*' -o -name 'vmlinux' \) | head -n 80 || true; exit 1; }
          IMAGE="$(realpath "$IMAGE")"
          echo "KERNEL_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "Image: $IMAGE"
          strings "$IMAGE" | grep -m1 -E 'Linux version|Android clang|Ubuntu clang|clang version' || true
          if strings "$IMAGE" | grep -m1 -E 'Linux version|clang version' | grep -qi 'Ubuntu clang'; then
            echo "::error::Final Image was built with Ubuntu clang; refusing to package."
            exit 1
          fi

      - name: "Package AnyKernel3"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf out_artifacts package_AK3
          mkdir -p out_artifacts/debug
          if [ -d kernel_workspace/AnyKernel3 ]; then
            cp -a kernel_workspace/AnyKernel3 package_AK3
          else
            git clone --depth=1 -b gki-2.0 https://github.com/TheWildJames/AnyKernel3.git package_AK3
          fi
          rm -rf package_AK3/.git
          if [ -z "${KERNEL_IMAGE:-}" ] || [ ! -f "$KERNEL_IMAGE" ]; then
            echo "KERNEL_IMAGE env was missing or invalid: ${KERNEL_IMAGE:-<empty>}"
            echo "Searching fallback locations under $KERNEL_DIR/out..."
            KERNEL_IMAGE="$(find "$KERNEL_DIR/out" -type f -path '*/arch/arm64/boot/Image' -print -quit 2>/dev/null || true)"
            [ -n "$KERNEL_IMAGE" ] || KERNEL_IMAGE="$(find "$KERNEL_DIR/out" -type f -name Image -print -quit 2>/dev/null || true)"
            [ -n "$KERNEL_IMAGE" ] && [ -f "$KERNEL_IMAGE" ] || { echo "::error::Cannot locate kernel Image for AnyKernel3 packaging"; find "$KERNEL_DIR/out" -type f \( -name 'Image*' -o -name 'vmlinux' \) | head -n 80 || true; exit 1; }
            KERNEL_IMAGE="$(realpath "$KERNEL_IMAGE")"
          fi
          echo "Packaging Image: $KERNEL_IMAGE"
          cp "$KERNEL_IMAGE" package_AK3/Image

          if [ "${{ inputs.susfs }}" = "On" ]; then
            SUS_LABEL="CCTV18_SUSFS_${SUSVER:-oki}"
            MODE_LABEL="CCTV18 SUSFS"
          else
            SUS_LABEL="NoSUSFS_Debug"
            MODE_LABEL="NoSUSFS Debug"
          fi
          PROFILE_LABEL="${{ inputs.feature_profile }}"
          RUN_NO="${{ github.run_number }}"
          REPO_URL="https://github.com/ox1d3x3/Op13_Susfs_kernel"
          INSTALL_TITLE="OP13 SukiSU Ultra + CCTV18 SUSFS"
          ZIP="AK3_OP13_OOS16_android15-6.6.89_${SUKISU_PACKAGE_LABEL:-SukiSUUltra}_${SUS_LABEL}_ADV_STABLE_${RUN_NO}.zip"
          export MODE_LABEL PROFILE_LABEL RUN_NO REPO_URL INSTALL_TITLE ZIP

          cat > package_AK3/INSTALL_INFO.txt <<EOF
          ${INSTALL_TITLE}
          ==================================

          Device target : OnePlus 13 / PJZ110 / sun / OOS16
          Kernel release: ${KERNEL_RELEASE:-unknown}
          Root backend  : SukiSU Ultra (${SUKISU_PACKAGE_LABEL:-SukiSUUltra})
          SUSFS source  : CCTV18 susfs4oki (${SUSVER:-${{ inputs.susfs_ref }}})
          Profile       : ${PROFILE_LABEL}
          Build number  : ${RUN_NO}

          Install notes:
          1. Keep a matching stock boot.img for your current active slot before flashing.
          2. Flash this ZIP from a custom recovery or kernel flasher that supports AnyKernel3.
          3. If the device bootloops, return to bootloader and flash your stock boot.img back to the active slot.
          4. First boot can take longer than usual. Do not force reboot too early.
          5. Do not enable extra modules until the kernel boots cleanly.

          Recommended first daily settings:
          - battery_daily profile
          - SukiSU Ultra builtin_latest
          - CCTV18 SUSFS On
          - BBR/BBG/ADIOS/TTL_IP_SET/NTSYNC/Unicode/ZRAM-LZ4 On
          - zram-module.zip On if you want the flashable replacement zip
          - HMBIRD/Droidspaces Off for battery_daily
          EOF
          cp package_AK3/INSTALL_INFO.txt out_artifacts/INSTALL_INFO.txt

          if [ -f package_AK3/anykernel.sh ]; then
            python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          label = os.environ.get('SUKISU_PACKAGE_LABEL', 'SukiSUUltra')
          mode_label = os.environ.get('MODE_LABEL', 'CCTV18 SUSFS')
          profile = os.environ.get('PROFILE_LABEL', 'battery_daily')
          run_no = os.environ.get('RUN_NO', '')
          repo_url = os.environ.get('REPO_URL', 'https://github.com/ox1d3x3/Op13_Susfs_kernel')
          kernel_rel = os.environ.get('KERNEL_RELEASE', '')
          zip_name = os.environ.get('ZIP', '')
          p = Path('package_AK3/anykernel.sh')
          s = p.read_text(encoding='utf-8', errors='replace')
          s = re.sub(r'^\s*kernel\.string=.*$', f'kernel.string=OP13 PJZ110 | {label} + {mode_label} | Advanced Stable Daily', s, flags=re.M)
          if 'block=boot' not in s:
              s = s.replace('block=auto', 'block=boot') if 'block=auto' in s else s + '\nblock=boot\n'
          s = re.sub(r'\n# --- OX1D3X3 INSTALL INFO START ---.*?# --- OX1D3X3 INSTALL INFO END ---\n', '\n', s, flags=re.S)
          marker = re.search(r'\n\.\s+tools/ak3-core\.sh\s*\n', s)
          block = f'''
          # --- OX1D3X3 INSTALL INFO START ---
          ui_print " "
          ui_print "===================================================="
          ui_print " __  __ __"
          ui_print " \\ \\ / //_ |"
          ui_print "  \\ V /  | |"
          ui_print "   > <   | |"
          ui_print "  / . \\  | |"
          ui_print " /_/ \\_\\ |_|"
          ui_print "===================================================="
          ui_print " "
          ui_print "OP13 PJZ110 | SukiSU Ultra + {mode_label}"
          ui_print "Profile : {profile}"
          ui_print "Kernel  : {kernel_rel or 'unknown'}"
          ui_print "Build   : #{run_no}"
          ui_print "Package : {zip_name}"
          ui_print "Builder : @Ox1d3x3"
          ui_print "Repo    : {repo_url}"
          ui_print " "
          ui_print "Install notes:"
          ui_print "- Target: OnePlus 13 / PJZ110 / sun / OOS16"
          ui_print "- Flash only on matching firmware/kernel base"
          ui_print "- Keep stock boot.img ready for rescue"
          ui_print "- First boot may take longer than usual"
          ui_print " "
          device="$(getprop ro.product.device 2>/dev/null || true)"
          model="$(getprop ro.product.model 2>/dev/null || true)"
          build="$(getprop ro.build.version.ota 2>/dev/null || true)"
          if [ -n "$device" ]; then ui_print "Device : $device ($model)"; fi
          if [ -n "$build" ]; then ui_print "OTA    : $build"; fi
          ui_print " "
          if command -v cmd >/dev/null 2>&1; then
            (cmd activity start --user 0 -a android.intent.action.VIEW -d "{repo_url}" >/dev/null 2>&1 &) || true
          elif command -v am >/dev/null 2>&1; then
            (am start --user 0 -a android.intent.action.VIEW -d "{repo_url}" >/dev/null 2>&1 &) || true
          fi
          # --- OX1D3X3 INSTALL INFO END ---
          '''
          if marker:
              s = s[:marker.end()] + block + s[marker.end():]
          else:
              s += '\n' + block
          p.write_text(s, encoding='utf-8')
          PY
          fi

          cat > package_AK3/banner <<EOF
          ====================================================
          Ox1d3x3 OP13 Kernel
          SukiSU Ultra + ${MODE_LABEL} [${PROFILE_LABEL}]
          ====================================================
          EOF

          AK3_ZIP="$GITHUB_WORKSPACE/out_artifacts/$ZIP"
          export AK3_ZIP
          rm -f "$AK3_ZIP" "$AK3_ZIP.sha256" || true
          rm -f package_AK3/*.zip package_AK3/*.sha256 || true
          echo "Creating AnyKernel3 zip with deterministic Python packer: $AK3_ZIP"
          python3 - <<'PYZIP'
          import os
          import zipfile
          from pathlib import Path

          src = Path('package_AK3').resolve()
          dst = Path(os.environ['AK3_ZIP']).resolve()
          dst.parent.mkdir(parents=True, exist_ok=True)

          exclude_parts = {'.git', '.github'}
          exclude_suffixes = {'.md', '.sha256'}
          exclude_names = {'README', 'README.md', 'README.txt'}

          with zipfile.ZipFile(dst, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(src.rglob('*')):
                  rel = path.relative_to(src)
                  if path.is_dir():
                      continue
                  if any(part in exclude_parts for part in rel.parts):
                      continue
                  if path.suffix.lower() in exclude_suffixes:
                      continue
                  if path.name in exclude_names:
                      continue
                  if path.suffix.lower() == '.zip':
                      continue
                  st = path.stat()
                  info = zipfile.ZipInfo(str(rel).replace('\\', '/'))
                  info.external_attr = (st.st_mode & 0xFFFF) << 16
                  zf.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED)
          PYZIP
          if [ ! -s "$AK3_ZIP" ]; then
            echo "::error::AnyKernel3 zip was not created or is empty: $AK3_ZIP"
            echo "out_artifacts contents:"
            find out_artifacts -maxdepth 3 -type f -printf '%p %s bytes\n' 2>/dev/null || true
            echo "package_AK3 contents:"
            find package_AK3 -maxdepth 2 -type f | sed -n '1,160p' || true
            exit 1
          fi
          # Check only archive members, not the unzip header line that prints the archive path itself.
          # v28 falsely failed because `unzip -l "$AK3_ZIP"` prints `Archive: ...zip`, which matched `\.zip$`.
          NESTED_ZIPS="$(zipinfo -1 "$AK3_ZIP" | grep -E '(^|/)[^/]+\.zip$' || true)"
          if [ -n "$NESTED_ZIPS" ]; then
            echo "::error::Nested zip detected inside AnyKernel package; refusing artifact."
            printf '%s\n' "$NESTED_ZIPS"
            exit 1
          fi
          sha256sum "$AK3_ZIP" | tee "$AK3_ZIP.sha256" > out_artifacts/SHA256SUMS.txt
          echo "AnyKernel3 zip created successfully:"
          ls -lh "$AK3_ZIP" "$AK3_ZIP.sha256"
          echo "AnyKernel3 zip preview:"
          unzip -l "$AK3_ZIP" | sed -n '1,80p'

          if [ "${{ inputs.debug_artifacts }}" = "true" ]; then
            cp "$KERNEL_DIR/out/.config" out_artifacts/debug/final.config || true
            cp "$KERNEL_DIR/out/include/generated/utsrelease.h" out_artifacts/debug/utsrelease.h || true
            cp "$KERNEL_DIR/out/include/config/kernel.release" out_artifacts/debug/kernel.release || true
            strings "$KERNEL_IMAGE" | grep -m1 -E 'Linux version|Android clang|Ubuntu clang|clang version' > out_artifacts/debug/image_version_string.txt || true
            find "$KERNEL_DIR" -name '*.rej' -print -exec sed -n '1,180p' {} \; > out_artifacts/debug/patch_rejects.txt || true
          fi

      - name: "Build flashable ZRAM module zip"
        if: ${{ inputs.zram_module == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p out_artifacts
          ZRAM_KO="$(find "$KERNEL_DIR/out" "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform" -type f -name "zram.ko" 2>/dev/null | head -n 1 || true)"
          if [ -z "$ZRAM_KO" ] || [ ! -f "$ZRAM_KO" ]; then
            echo "::error::zram_module=On but zram.ko was not found. Check final config for CONFIG_ZRAM=m and CONFIG_ZSMALLOC=m."
            grep -E '^CONFIG_ZRAM=|^CONFIG_ZSMALLOC=|^CONFIG_ZRAM_DEF_COMP' "$KERNEL_DIR/out/.config" || true
            find "$KERNEL_DIR/out" -type f -name "*zram*" -print | head -n 50 || true
            exit 1
          fi

          echo "Using freshly built zram.ko: $ZRAM_KO"
          TMP_ZIP="$RUNNER_TEMP/zram_template.zip"
          rm -f "$TMP_ZIP" || true
          URLS=(
            "https://raw.githubusercontent.com/cctv18/oppo_oplus_realme_sm8750/refs/heads/main/zram.zip"
            "https://cdn.jsdelivr.net/gh/cctv18/oppo_oplus_realme_sm8750@main/zram.zip"
          )
          ok=0
          for u in "${URLS[@]}"; do
            echo "Fetching zram template: $u"
            if curl -fL --retry 3 --retry-delay 2 "$u" -o "$TMP_ZIP"; then
              ok=1
              break
            fi
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Failed to download zram.zip template from all mirrors."
            exit 1
          fi

          WORK="$RUNNER_TEMP/zram_mod"
          rm -rf "$WORK" || true
          mkdir -p "$WORK"
          unzip -q "$TMP_ZIP" -d "$WORK"
          if ! find "$WORK" -name "zram.ko" -print -quit | grep -q .; then
            echo "::error::Template zip does not contain zram.ko placeholder."
            find "$WORK" -maxdepth 5 -type f | sed -n '1,120p'
            exit 1
          fi
          find "$WORK" -name "zram.ko" -print -exec cp "$ZRAM_KO" {} \;

          OUT_ZRAM="$GITHUB_WORKSPACE/out_artifacts/zram-module.zip"
          rm -f "$OUT_ZRAM" "$OUT_ZRAM.sha256" || true
          (cd "$WORK" && zip -qr "$OUT_ZRAM" .)
          sha256sum "$OUT_ZRAM" | tee "$OUT_ZRAM.sha256"
          cat "$OUT_ZRAM.sha256" >> "$GITHUB_WORKSPACE/out_artifacts/SHA256SUMS.txt" 2>/dev/null || true
          echo "ZRAM_ZIP=$OUT_ZRAM" >> "$GITHUB_ENV"

