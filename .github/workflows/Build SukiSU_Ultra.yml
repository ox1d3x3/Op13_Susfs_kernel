---
name: Build SukiSU Ultra
env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k
on:
  workflow_dispatch:
    inputs:
      SUSFS:
        description: "📦 SuSFS Support"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "On"
      KPM:
        description: "🧩 KPM Support"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"
      bbg:
        description: "🛡️ BBG baseband protection"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "On"
      bbr:
        description: "📶 BBR algorithm (Has little practical benefit for everyday phone use and may even result in negative optimization)"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"
      adios_rekernel_enable:
        description: "⚙️ ADIOS I/O scheduler and Re-Kernel support"
        required: true
        type: choice
        default: "ADIOS only"
        options:
          - "none"
          - "ADIOS only"
          - "Re-Kernel only"
          - "both"
      proxy:
        description: "🌐 Proxy performance optimization"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"
      UNICODE_BYPASS:
        description: "🚀 Unicode zero-width bypass fix patch (Not recommended for higher kernel versions; it is suggested to use https://t.me/real5ec1cff/271 for a painless fix)"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"
      kernel_suffix:
        description: "📝 Kernel suffix (Leave empty to use the default; do not add a hyphen at the beginning, and do not include spaces or other reserved characters that may affect command execution)"
        required: false
        type: string
        default: ""
      BUILD_TIME:
        type: string
        description: "Optional. Leave blank to mimic stock build time, or set to F to use current build time."
        required: false
        default: ""
        
jobs:
  build:
    name: SUSFS ${{ github.event.inputs.SUSFS }} | BBG ${{ github.event.inputs.bbg }} | ADIOS/Re-Kernel ${{ github.event.inputs.adios_rekernel_enable }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
    steps:
      - name: 🚀 Maximize Build Space
        uses: easimon/maximize-build-space@v9
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          
      - name: ⚙️ Setup Cache Env
        run: |
          echo "🔧 Setting up device-isolated cache directory..."
          echo "CCACHE_DIR=$HOME/.ccache_SukiSU" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_SukiSU"
          
          echo "✅ Cache directory set: $HOME/.ccache_SukiSU"
          
      - name: 🔐 Configure Git
        run: |
          echo "🔧 Configuring Git user info..."
          git config --global user.name "GitHub Actions - Ox1d3x3_SUS Kernel"
          git config --global user.email "builder@localhost"
          echo "✅ Git config complete"
          
      - name: 🌐 Default Network Optimization
        run: |
          echo "CURL_OPTS=--retry 5 --retry-all-errors --connect-timeout 20 --max-time 1200" >> "$GITHUB_ENV"

          # Make APT more resilient (retries + sane timeouts)
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::http::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::https::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/80-retries

          # Git fetch speed + resilience
          git config --global protocol.version 2
          git config --global fetch.parallel 8
          git config --global submodule.fetchJobs 8
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global core.compression 0

          echo "✅ Default network optimizations enabled"

      - name: 📦 Cache & Install Dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: python3 git curl ccache libelf-dev build-essential flex bison
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync
            unzip gawk dos2unix
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          execute_install_scripts: true
          
      - name: 💾 Restore ccache (With SUSFS)
        if: ${{ github.event.inputs.SUSFS == 'On' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref }}-SukiSU-SUSFS
          restore-keys: >
            ccache-${{ runner.os }}-SukiSU-SUSFS

            ccache-${{ runner.os }}-SukiSU-SUSFS
            
      - name: 💾 Restore ccache (Without SUSFS)
        if: ${{ github.event.inputs.SUSFS == 'Off' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref }}-SukiSU-NoSUSFS
          restore-keys: >
            ccache-${{ runner.os }}-SukiSU-NoSUSFS

            ccache-${{ runner.os }}-SukiSU-NoSUSFS
            
      - name: ⚙️ Initialize ccache
        run: |
          echo "🔧 Initializing ccache..."
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "✅ ccache initialized"
            else
              echo "ℹ️ ccache already initialized, skipping"
            fi
          else
            echo "⚠️ ccache not found, skipping initialization"
          fi
          # Show ccache statistics
          ccache -s
          echo "✅ ccache initialization flow complete"
          
      - name: 📥 Install Repo Tool
        run: |
          echo "⬇️ Downloading repo tool..."
          curl $CURL_OPTS -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          echo "✅ repo tool installed"
          
      - name: 📥 Install Neutron Clang Tool
        run: |
          echo "⬇️ Downloading Neutron clang tool..."
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          bash <(curl $CURL_OPTS -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S
          echo "✅ Neutron clang tool installed"
          
      - name: "⬇️ Clone Kernel Source"
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          
          echo "🌐 Initializing kernel repo..."
          repo init -u https://github.com/mrcxlinux/actions_oplus_sm8750.git -b refs/heads/zh -m manifest.xml --depth=1
          
          echo "🔄 Syncing repos (using $(nproc --all) threads)..."
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
          
          rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"
          
          # Remove -dirty in kernel version
          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion
          sed -i 's/ -dirty//g' kernel_platform/external/dtc/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/common/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/msm-kernel/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/external/dtc/scripts/setlocalversion
          
          echo "✅ Kernel setup complete"
          
      - name: ⚡ Setup Baseband-guard
        if: ${{ github.event.inputs.bbg == 'On' }}
        run: |
          set -e
          cd kernel_workspace/kernel_platform/common
          
          echo "🛠️ Setting up BBG..."
          curl $CURL_OPTS -fsSL https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh -o setup.sh
          bash setup.sh     
          
      - name: ⚡ Setup SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          
          # (translated comment)
          
          echo "🛠️ Setting up SukiSU Ultra..."
          
          curl $CURL_OPTS -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh" | bash -s main
          
          cd KernelSU
          KSU_VERSION_COUNT=$(git rev-list --count main)
          export KSUVER=$(expr $KSU_VERSION_COUNT + 37185)
          
          for i in {1..3}; do
            KSU_API_VERSION=$(curl $CURL_OPTS -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/Kbuild" | \
              grep -m1 "KSU_VERSION_API :=" | cut -d'=' -f2 | tr -d '[:space:]')
            [ -n "$KSU_API_VERSION" ] && break || sleep 2
          done
          
          if [ -z "$KSU_API_VERSION" ]; then
            echo "❌ Error: failed to fetch KSU_API_VERSION" >&2
            exit 1
          fi
          
          KSU_COMMIT_HASH=$(git ls-remote https://github.com/SukiSU-Ultra/SukiSU-Ultra.git refs/heads/builtin | cut -f1 | cut -c1-8)
          KSU_VERSION_FULL="v${KSU_API_VERSION}-${KSU_COMMIT_HASH}@Ox1d3x3_SUS"
          
          sed -i '/define get_ksu_version_full/,/endef/d' kernel/Kbuild
          sed -i '/KSU_VERSION_API :=/d' kernel/Kbuild
          sed -i '/KSU_VERSION_FULL :=/d' kernel/Kbuild
          
          TMP_FILE=$(mktemp)
          while IFS= read -r line; do
            echo "$line" >> "$TMP_FILE"
            if echo "$line" | grep -q 'REPO_OWNER :='; then
              cat >> "$TMP_FILE" <<EOF
          define get_ksu_version_full
          v\\\$\$1-${KSU_COMMIT_HASH}@Ox1d3x3_SUS
          endef
          
          KSU_VERSION_API := ${KSU_API_VERSION}
          KSU_VERSION_FULL := ${KSU_VERSION_FULL}
          EOF
            fi
          done < kernel/Kbuild
          mv "$TMP_FILE" kernel/Kbuild
          
          echo "✅ SukiSU Ultra version metadata configured"
          
      - name: 🔧 Setup Patches
        run: |
          cd kernel_workspace
          
          echo "⬇️ Cloning required patches..."
          
          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then          
            git clone --depth 1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6
          fi
          
          git clone --depth 1 https://github.com/mrcxlinux/kernel_patches.git
          git clone --depth 1 https://github.com/ShirkNeko/SukiSU_patch.git
          
          cd kernel_platform
          
          echo "📝 Copying patch files..."
          
          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then
            cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch ./common/
            cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
            cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          else
            cp ../kernel_patches/sukisu/scope_min_manual_hooks_v1.9.patch ./common/
          fi
          
          cp ../kernel_patches/zram/001-lz4.patch ./common/
          # Place lz4 ARMv8 asm where Kbuild expects it
          mkdir -p ./common/lib/lz4/lz4armv8
          cp ../kernel_patches/zram/lz4armv8.S ./common/lib/lz4/lz4armv8/lz4armv8.S
          # Backward-compatible copy (some trees reference lib/lz4/lz4armv8.S directly)
          cp ../kernel_patches/zram/lz4armv8.S ./common/lib/lz4/lz4armv8.S
          ls -l ./common/lib/lz4/lz4armv8/lz4armv8.S
          ls -l ./common/lib/lz4/lz4armv8.S

          cp ../kernel_patches/zram/002-zstd.patch ./common/
          
          cp ../kernel_patches/common/EnablePOLLY.patch ./common/
          
          if [ "${{ github.event.inputs.UNICODE_BYPASS }}" = "On" ]; then
            cp ../kernel_patches/common/unicode_bypass_fix_6.1+.patch ./common/unicode_bypass_fix.patch
          fi

                    # ---- SUSFS: enable + KernelSU integration (required) ----
          if [ "${SUSFS}" == "On" ]; then
            echo "🔧 Enabling SUSFS support (KernelSU + kernel patches)..."
          
            # Try to locate a KernelSU / KernelSU-Next / SukiSU directory created by the setup script (if any)
            KSU_DIR=""
            for d in "KernelSU-Next" "KernelSU_Next" "KernelSU" "SukiSU-Next" "SukiSU" "SukiSU_Ultra"; do
              if [ -d "$d" ]; then KSU_DIR="$d"; break; fi
            done
            if [ -z "$KSU_DIR" ]; then
              KSU_DIR=$(find . -maxdepth 2 -type d \( -iname 'kernelsu*' -o -iname 'sukisu*' \) 2>/dev/null | head -n 1 || true)
            fi
            echo "📁 KernelSU dir detected: ${KSU_DIR:-<none>}"
          
            apply_patch_stream() {
              local dir="$1"
              local name="$2"
              local url="$3"
              echo "➡️ $name"
              echo "   $url"
              rm -f /tmp/susfs_patch.$$ || true
              (cd "$dir" && curl -fsSL ${CURL_OPTS} "$url" > /tmp/susfs_patch.$$) || return 1
          
              # Prefer git-apply if the directory is a git repo; fall back to GNU patch with fuzz
              if (cd "$dir" && git rev-parse --is-inside-work-tree >/dev/null 2>&1); then
                (cd "$dir" && git apply --check -p1 --whitespace=nowarn /tmp/susfs_patch.$$ >/dev/null 2>&1) && \
                (cd "$dir" && git apply -p1 --whitespace=nowarn /tmp/susfs_patch.$$) && return 0
              fi
          
              (cd "$dir" && patch -p1 --forward -l -F 3 < /tmp/susfs_patch.$$) && return 0
              return 1
            }
          
            KSU_OK=0
          
            # Preferred: apply KernelSU-Next SUSFS patch-set (observed working on OP13/SM8750 workflows)
            if [ -n "$KSU_DIR" ] && [ -d "$KSU_DIR" ]; then
              echo "🧩 Trying KernelSU-side SUSFS enable patches..."
              apply_patch_stream "$KSU_DIR" "KernelSU SUSFS patch (ksun-susfs157)" "https://raw.githubusercontent.com/KOWX712/files/main/0001-ksun-susfs157.patch" && KSU_OK=1 || true
              apply_patch_stream "$KSU_DIR" "KernelSU-Next commit patch 30702f1" "https://github.com/KernelSU-Next/KernelSU-Next/commit/30702f14c3f22961f5ae2f98c840815dabf6b092.patch" && KSU_OK=1 || true
              apply_patch_stream "$KSU_DIR" "KernelSU-Next commit patch 1ac4ce8" "https://github.com/KernelSU-Next/KernelSU-Next/commit/1ac4ce834dc4fcb20d55a16f35c15c4658f52f4f.patch" && KSU_OK=1 || true
            fi
          
            # Fallback: try susfs4ksu's KernelSU enable patches against kernel_platform/common
            if [ "$KSU_OK" -ne 1 ]; then
              echo "🧩 Falling back to susfs4ksu KernelSU enable patches (common/)..."
              mapfile -t SUSFS_ENABLE_CANDIDATES < <(find ../susfs4ksu/kernel_patches -maxdepth 4 -type f -name '*.patch' | sort | while read -r p; do
                grep -q "drivers/kernelsu" "$p" 2>/dev/null && echo "$p"
              done)
          
              echo "📦 Found ${#SUSFS_ENABLE_CANDIDATES[@]} candidate KernelSU enable patches."
              for p in "${SUSFS_ENABLE_CANDIDATES[@]}"; do
                echo "➡️ Trying: $p"
                if (cd ./common && git apply --check -p1 --whitespace=nowarn "$p" >/dev/null 2>&1 && git apply -p1 --whitespace=nowarn "$p"); then
                  KSU_OK=1
                  break
                fi
                if (cd ./common && patch -p1 --forward -l -F 3 < "$p" >/dev/null 2>&1); then
                  KSU_OK=1
                  break
                fi
              done
            fi
          
            if [ "$KSU_OK" -ne 1 ]; then
              echo "❌ Unable to apply any KernelSU/SukiSU SUSFS enable patch."
              echo "   This is a version mismatch between your KernelSU fork and available SUSFS glue patches."
              echo "   Keep SUSFS=Off, or update the susfs4ksu branch/patch-set to match your KernelSU revision."
              exit 1
            fi
          
            # Ensure the defconfig requests KSU_SUSFS (will be ignored if the symbol doesn't exist)
            DEFCONFIG=./common/arch/arm64/configs/gki_defconfig
            grep -q '^CONFIG_KSU_SUSFS=' "$DEFCONFIG" 2>/dev/null || echo 'CONFIG_KSU_SUSFS=y' >> "$DEFCONFIG"
          
            echo "✅ SUSFS KernelSU integration step done."
          fi
          
          echo "---- LZ4 sanity ----"
          if [ ! -f lib/lz4/lz4armv8/lz4armv8.S ]; then
            echo "❌ Missing lib/lz4/lz4armv8/lz4armv8.S (required by Kbuild in this tree)"
            echo "   This will cause: No rule to make target 'lib/lz4/lz4armv8/lz4armv8.o'"
            exit 1
          fi
          echo "✅ Found lib/lz4/lz4armv8/lz4armv8.S"
          echo "---- LZ4 Makefile references (first 20) ----"
          grep -RIn --max-count=20 'lz4armv8\.o' lib/lz4 2>/dev/null || true


      - name: 📦 Add build name
        run: |
          echo "📦 Replacing kernel version suffix..."
          
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel_platform/
          
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            SUFFIX="${{ github.event.inputs.kernel_suffix }}"
            echo "Current kernel version suffix: $SUFFIX"
            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${SUFFIX}\"|" "$f"
            done
            sed -i "s/-4k/-${SUFFIX}/g" ./common/arch/arm64/configs/gki_defconfig
          else
            echo "Current kernel version suffix: ${KERNEL_NAME}"
            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${KERNEL_NAME}\"|" "$f"
            done
            sed -i "s/-4k/-${KERNEL_NAME}/g" ./common/arch/arm64/configs/gki_defconfig
          fi
          
          sed -i 's/${scm_version}//' ./common/scripts/setlocalversion
          
          echo "CONFIG_LOCALVERSION_AUTO=n" >> ./common/arch/arm64/configs/gki_defconfig
          
      - name: 📅 Set up custom BUILD_TIME
        shell: bash
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='Australia/Perth' date +'%a %b %d %T %Z %Y')"
            echo "Using Perth time as fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel_platform/
          for f in common/scripts/mkcompile_h msm-kernel/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done
          
      - name: 🔨 Build Kernel
        run: |
          echo "🏗️ Starting kernel build..."
            export PATH="/usr/lib/ccache:$HOME/toolchains/neutron-clang/bin:$PATH" 
            export PATH="/usr/lib/ccache:$PATH"
            cd kernel_workspace/kernel_platform/common
            curl $CURL_OPTS -fL https://github.com/cctv18/oppo_oplus_realme_sm8750/raw/refs/heads/main/lib/libfakestat.so -o libfakestat.so
            curl $CURL_OPTS -fL https://github.com/cctv18/oppo_oplus_realme_sm8750/raw/refs/heads/main/lib/libfaketimeMT.so -o libfaketimeMT.so
            chmod 777 ./*.so
            export FAKESTAT="2025-05-25 12:00:00"
            export FAKETIME="@2025-05-25 13:00:00"
            echo "FAKESTAT=$FAKESTAT" >> $GITHUB_ENV
            echo "FAKETIME=$FAKETIME" >> $GITHUB_ENV
            SO_DIR=$(pwd)
            export PRELOAD_LIBS="$SO_DIR/libfakestat.so $SO_DIR/libfaketimeMT.so"
          # Create CC (compiler) wrapper
            echo '#!/bin/bash' > cc-wrapper
            echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> cc-wrapper
            echo 'export FAKESTAT="'$FAKESTAT'"' >> cc-wrapper
            echo 'export FAKETIME="'$FAKETIME'"' >> cc-wrapper
            echo 'ccache clang "$@"' >> cc-wrapper
          # Create LD (linker) wrapper
            echo '#!/bin/bash' > ld-wrapper
            echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> ld-wrapper
            echo 'export FAKESTAT="'$FAKESTAT'"' >> ld-wrapper
            echo 'export FAKETIME="'$FAKETIME'"' >> ld-wrapper
            echo 'ld.lld "$@"' >> ld-wrapper
          
          # Wrapper self-test
            echo "--- [Wrapper Test] Creating generic time-spoof test script ---"
            echo '#!/bin/bash' > test-wrapper.sh
            echo 'export LD_PRELOAD="'$PRELOAD_LIBS'"' >> test-wrapper.sh
            echo 'export FAKESTAT="'$FAKESTAT'"' >> test-wrapper.sh
            echo 'export FAKETIME="'$FAKETIME'"' >> test-wrapper.sh
            echo 'echo ">>> Wrapper internal environment check complete."' >> test-wrapper.sh
            echo 'exec "$@"' >> test-wrapper.sh # Execute all passed arguments
            chmod +x test-wrapper.sh
            echo "--- [Wrapper Test] Testing (date) command ---"
            ./test-wrapper.sh date
            echo "--- [Wrapper Test] Testing (stat) command ---"
            ./test-wrapper.sh stat ./Makefile
            echo "--- [Wrapper Test] Test complete ---"
            chmod +x cc-wrapper ld-wrapper
            echo "--- Pre-build env time: $(LD_PRELOAD=$PRELOAD_LIBS date) ---"
            echo "--- Pre-build file timestamp: ---"
            LD_PRELOAD=$PRELOAD_LIBS stat ./Makefile
            set -o pipefail
            echo "---- Tool versions ----"
            clang --version || true
            ld.lld --version || true
            aarch64-linux-gnu-objcopy --version || true
          
            echo "---- Build (LLVM_IAS=1) ----"
            make -j$(nproc --all) LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-O2 gki_defconfig all 2>&1 | tee build.log || {
              echo "❌ Build failed (LLVM_IAS=1). Showing error summary:"
              grep -nEi "fatal error:|error:|ld\.lld: error|undefined reference|No such file|not found|killed|No space" build.log | head -n 120 || true
              echo "🔁 Retrying with LLVM_IAS=0 (GNU as fallback)..."
              make -j$(nproc --all) LLVM=1 LLVM_IAS=0 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-O2 gki_defconfig all 2>&1 | tee -a build.log || {
                echo "❌ Build failed again (LLVM_IAS=0). Error summary:"
                grep -nEi "fatal error:|error:|ld\.lld: error|undefined reference|No such file|not found|killed|No space" build.log | head -n 200 || true
                exit 2
              }
            }
          
          # Show ccache statistics
          ccache -s
          
          echo "✅ Kernel build complete"
          
      - name: 📤 Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel_workspace/kernel_platform/common/build.log

      - name: 📦 Package Kernel
        run: |
          echo "📦 Preparing AnyKernel3 packaging environment..."
          git clone https://github.com/mrcxlinux/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/
          
          dir1=""
          dir2=""
          
          image_path=$(find "./kernel_workspace/kernel_platform/common/out/" -name "Image" | head -n 1)
          
          if [ -n "$image_path" ]; then
            dir1=$(dirname "$image_path")/
            echo "✅ Successfully found Image file"
          fi
          
          if [ -n "$image_path" ] && [ -f "$image_path" ]; then
            echo "Image file finally located at: $image_path"
            cp "$image_path" ./AnyKernel3/Image
            cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image
          fi
          
      - name: 🧩 Patch Kernel Image (KPM)
        if: ${{ github.event.inputs.KPM == 'On' }}
        run: |
          echo "🔧 Applying KPM patch..."
          cd kernel_workspace/kernel_platform/out/Final-Image-Find
          curl $CURL_OPTS -fL -o patch_linux https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.13.0/patch_linux
          chmod +x patch_linux
          ./patch_linux
          
          rm -f Image
          mv oImage Image
          cp Image $GITHUB_WORKSPACE/AnyKernel3/Image
          
          echo "✅ KPM patch applied"
          
      - name: 🏷️ Customize AnyKernel Banner (with credits)
        run: |
          set -e
          AK="$GITHUB_WORKSPACE/AnyKernel3/anykernel.sh"
          if [ ! -f "$AK" ]; then
            echo "❌ anykernel.sh not found at $AK"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          ak_path = Path("AnyKernel3/anykernel.sh")
          s = ak_path.read_text(encoding="utf-8", errors="ignore").splitlines(True)

          start_idx = None
          end_idx = None

          # Locate original author banner block (chenhua13)
          for i, line in enumerate(s):
              if 'ui_print "chenhua13 Kernel' in line:
                  start_idx = i
                  break

          if start_idx is not None:
              for j in range(start_idx, len(s)):
                  if 'ksu_supported' in s[j] and 'ui_print' in s[j]:
                      end_idx = j
                      break

          KERNEL_NAME = "android15-8-g29d86c5fc9dd-abogki428889875-4k-Ox1d3x3-SUS"
          KSUVER = "${{ env.KSUVER }}"

          banner = []
          banner.append('ui_print " "\n')
          banner.append('MODEL="$(getprop ro.product.model 2>/dev/null)"; [ -z "$MODEL" ] && MODEL="$(getprop ro.product.marketname 2>/dev/null)"\n')
          banner.append('DEVICE="$(getprop ro.product.device 2>/dev/null)"\n')
          banner.append('ANDROID="$(getprop ro.build.version.release 2>/dev/null)"\n')
          banner.append('PATCH="$(getprop ro.build.version.security_patch 2>/dev/null)"\n')
          banner.append('SLOT="$(getprop ro.boot.slot_suffix 2>/dev/null)"; [ -z "$SLOT" ] && SLOT="$(getprop ro.boot.slot 2>/dev/null)"\n')
          banner.append('ui_print "===================================================="\n')
          banner.append('ui_print "  ${MODEL:-Unknown Model} | SukiSU_SUS Kernel"\n')
          banner.append(f'ui_print "  Kernel  : {KERNEL_NAME}"\n')
          banner.append(f'ui_print "  Build   : {KSUVER}"\n')
          banner.append('ui_print "  Builder : Ox1d3x3 (@ox1d3x3)"\n')
          banner.append('ui_print "  Credits : chenhua13 / mrcxlinux"\n')
          banner.append('ui_print "===================================================="\n')
          banner.append('ui_print "  Device  : ${DEVICE:-unknown}"\n')
          banner.append('ui_print "  Android : ${ANDROID:-unknown}"\n')
          banner.append('ui_print "  Patch   : ${PATCH:-unknown}"\n')
          banner.append('ui_print "  Slot    : ${SLOT:-unknown}"\n')
          banner.append('ui_print "===================================================="\n')
          banner.append('ui_print "  ⚠️ No warranty. Flash at your own risk."\n')
          banner.append('ui_print "  ⚠️ Backup boot / init_boot / recovery via OFOX first."\n')
          banner.append('ui_print "===================================================="\n')
          banner.append('ui_print "                   __   __  __"\n')
          banner.append('ui_print "                  \\ \\ / / /_ |"\n')
          banner.append('ui_print "                   \\ V /   | |"\n')
          banner.append('ui_print "                    > <    | |"\n')
          banner.append('ui_print "                   / . \\   | |"\n')
          banner.append('ui_print "                  /_/ \\_\\  |_|"\n')
          banner.append('ui_print "===================================================="\n')
          banner.append('ui_print "  -> ksu_supported: $ksu_supported"\n')

          banner_text = "".join(banner)

          if start_idx is not None and end_idx is not None and end_idx >= start_idx:
              s[start_idx:end_idx+1] = [banner_text]
          else:
              for i, line in enumerate(s):
                  if 'abort "  -> Non-GKI device, abort."' in line:
                      s.insert(i, banner_text)
                      break

          ak_path.write_text("".join(s), encoding="utf-8")
          print("✅ anykernel.sh banner updated (with credits)")
          PY

      - name: 🧠 Set Artifact Name
        id: set_name
        run: |
          BASE_NAME="SukiSU_Ultra_lz4_${{ env.KSUVER }}"
          
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            FINAL_NAME="${BASE_NAME}_SUSFS"
          else
            FINAL_NAME="${BASE_NAME}"
          fi
          
          echo "ARTIFACT_NAME=${FINAL_NAME}" >> $GITHUB_OUTPUT
          
      - name: 📤 Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_name.outputs.ARTIFACT_NAME }}
          path: ./AnyKernel3/*

      - name: 📝 Make ZRAM module
        run: |
          set -e
          echo "📥 Downloading zram.zip..."
          curl $CURL_OPTS -fL "https://github.com/cctv18/oppo_oplus_realme_sm8750/raw/refs/heads/main/zram.zip" -o "$GITHUB_WORKSPACE/zram.zip"
          
          echo "📦 Extracting..."
          unzip -q "$GITHUB_WORKSPACE/zram.zip" -d "$GITHUB_WORKSPACE/zram"
          
          echo "🔁 Replacing zram.ko..."
          find "$GITHUB_WORKSPACE/zram" -name "zram.ko" -exec cp "./kernel_workspace/kernel_platform/common/out/drivers/block/zram/zram.ko" {} \;
          rm -rf $GITHUB_WORKSPACE/zram.zip
          
          echo "📦 Repacking zip..."
          cd "$GITHUB_WORKSPACE/zram"
          zip -qr "../zram.zip" .
          
          echo "✅ Done!"
          
      - name: 📤 Upload zram.zip
        uses: actions/upload-artifact@v4
        with:
          name: zram-module.zip
          path: ./zram.zip
