name: Build SukiSU Ultra
env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k
  # Performance Flags
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_NOHASHDIR: "true"
  CCACHE_HARDLINK: "true"
  CCACHE_MAXSIZE: 10G

on:
  workflow_dispatch:
    inputs:
      SUSFS:
        description: "📦 SuSFS Support (v1.5.5+)"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "On"
      KPM:
        description: "🧩 KPM Support (Kernel Patch Manager)"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"
      bbg:
        description: "🛡️ BBG Baseband Protection"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "On"
      bbr:
        description: "📶 BBR TCP Congestion"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "On"
      optimize_level:
        description: "🚀 Optimization Level"
        required: true
        type: choice
        options:
          - "O3"
          - "O2"
        default: "O3"
      clean_build:
        description: "🧹 Clean Build"
        type: boolean
        default: false
      kernel_suffix:
        description: "📝 Kernel Suffix (Optional)"
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build ${{ inputs.optimize_level }} | SUSFS ${{ inputs.SUSFS }}
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          
      - name: 🔐 Configure Git & Tools
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global protocol.version 2
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

      - name: 📦 Install Dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          # Added 'cpio' to fix the immediate error, though we disable kheaders anyway
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix kmod bc cpio
          execute_install_scripts: true
          
      - name: ⚙️ Setup Cache
        if: ${{ inputs.clean_build == false }}
        uses: actions/cache@v4
        with:
          path: $HOME/.ccache
          key: ccache-${{ runner.os }}-${{ inputs.optimize_level }}-${{ inputs.SUSFS }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.optimize_level }}-${{ inputs.SUSFS }}-
            ccache-${{ runner.os }}-${{ inputs.optimize_level }}-
            
      - name: 🔧 Initialize ccache
        if: ${{ inputs.clean_build == false }}
        run: |
          mkdir -p $HOME/.ccache
          export CCACHE_DIR=$HOME/.ccache
          ccache -M 10G
          ccache -o compression=true
          ccache -o compression_level=5
          ccache -z
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 📥 Download Tools
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          bash <(curl -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S
          
      - name: ⬇️ Clone Kernel Source
        run: |
          export PATH=~/bin:$PATH
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://github.com/mrcxlinux/actions_oplus_sm8750.git -b refs/heads/zh -m manifest.xml --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle --force-sync
          rm -f kernel_platform/common/android/abi_gki_protected_exports_* || true
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || true

      - name: ⚡ Setup SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh" | bash -s main
          if [ -d "KernelSU" ]; then
            echo "✅ SukiSU initialized"
          else
            echo "❌ SukiSU setup failed!"
            exit 1
          fi

      - name: 🔧 Smart Patching (SUSFS & Fixes)
        run: |
          set -e
          cd kernel_workspace/kernel_platform
          
          # 1. Download SUSFS patches
          if [ "${{ inputs.SUSFS }}" == "On" ]; then
            echo "⬇️ Cloning SUSFS patches..."
            git clone --depth 1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6
            
            echo "🩹 Applying SUSFS Kernel Patch..."
            # Check file existence to avoid "No such file" errors
            if [ -f "susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch" ]; then
                cp susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch ./common/
            else
                echo "❌ Patch file not found in cloned repo!"
                ls -R susfs4ksu
                exit 1
            fi

            if patch -d common -p1 < common/50_add_susfs_in_gki-android15-6.6.patch; then
              echo "✅ SUSFS Kernel Patch applied successfully."
            else
              echo "❌ Failed to apply SUSFS Kernel Patch!"
              exit 1
            fi
            
            # Copy header files
            cp susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
            cp susfs4ksu/kernel_patches/fs/* ./common/fs/
          fi

          # 2. Fix LZ4 Assembly Path
          echo "🔧 Fixing LZ4 assembly path..."
          if [ -f "./common/lib/lz4/lz4armv8.S" ]; then
             mkdir -p ./common/lib/lz4/lz4armv8
             mv ./common/lib/lz4/lz4armv8.S ./common/lib/lz4/lz4armv8/lz4armv8.S
             echo "✅ Moved legacy lz4armv8.S to expected folder."
          elif [ -f "./common/lib/lz4/lz4armv8/lz4armv8.S" ]; then
             echo "✅ LZ4 path is already correct."
          fi

      - name: 💉 Inject SUSFS into SukiSU
        if: ${{ inputs.SUSFS == 'On' }}
        run: |
          cd kernel_workspace/kernel_platform
          
          KSU_DIR="KernelSU"
          KSU_CORE="$KSU_DIR/kernel/ksu.c"
          
          # Fallback for newer forks
          if [ ! -f "$KSU_CORE" ]; then
            KSU_CORE="$KSU_DIR/kernel/core_hook.c"
          fi
          
          if [ ! -f "$KSU_CORE" ]; then
            echo "❌ Could not find ksu.c or core_hook.c!"
            exit 1
          fi
          
          echo "💉 Injecting SUSFS hooks into: $KSU_CORE"
          
          if grep -q "susfs_init" "$KSU_CORE"; then
            echo "ℹ️ SUSFS hooks already present."
          else
            sed -i '/#include <linux\/types.h>/a #include <linux/susfs.h>' "$KSU_CORE" || sed -i '1i #include <linux/susfs.h>' "$KSU_CORE"
            sed -i '/int __init ksu_init(void)/,/^{/ s/^{/{\n\tsusfs_init();/' "$KSU_CORE"
            sed -i '/void __exit ksu_exit(void)/,/^{/ s/^{/{\n\tsusfs_exit();/' "$KSU_CORE"
            echo "✅ Successfully injected SUSFS hooks."
          fi

      - name: 🛡️ Setup Baseband Guard
        if: ${{ inputs.bbg == 'On' }}
        run: |
          cd kernel_workspace/kernel_platform/common
          curl -fsSL https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh -o setup.sh
          bash setup.sh

      - name: ⚙️ Apply Kernel Configuration
        run: |
          cd kernel_workspace/kernel_platform/common
          export PATH=$HOME/toolchains/neutron-clang/bin:$PATH
          
          config_file="arch/arm64/configs/gki_defconfig"
          
          # 🛑 DISABLE KHEADERS (Fixes the build error)
          echo "🚫 Disabling CONFIG_IKHEADERS to prevent build errors..."
          scripts/config --file $config_file -d CONFIG_IKHEADERS
          
          # Optimization
          scripts/config --file $config_file -e CONFIG_LTO_CLANG_THIN
          
          if [ "${{ inputs.SUSFS }}" == "On" ]; then
             scripts/config --file $config_file -e CONFIG_KSU_SUSFS
             scripts/config --file $config_file -e CONFIG_KSU_SUSFS_SUS_PATH
             scripts/config --file $config_file -e CONFIG_KSU_SUSFS_SUS_MOUNT
             scripts/config --file $config_file -e CONFIG_KSU_SUSFS_SUS_KSTAT
             scripts/config --file $config_file -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS
             scripts/config --file $config_file -e CONFIG_KSU_SUSFS_TRY_UMOUNT
             scripts/config --file $config_file -e CONFIG_KSU_SUSFS_SPOOF_UNAME
             scripts/config --file $config_file -e CONFIG_KSU_SUSFS_ENABLE_LOG
             scripts/config --file $config_file -e CONFIG_KSU_SUSFS_OPEN_REDIRECT
             scripts/config --file $config_file -e CONFIG_KSU_SUSFS_SUS_SU
          fi
          
          if [ "${{ inputs.bbr }}" == "On" ]; then
             scripts/config --file $config_file -e CONFIG_TCP_CONG_BBR
             scripts/config --file $config_file -e CONFIG_DEFAULT_BBR
          fi
          
          if [ "${{ inputs.optimize_level }}" == "O3" ]; then
             sed -i 's/-O2/-O3/g' Makefile
          fi

      - name: 🔨 Build Kernel
        run: |
          export PATH="/usr/lib/ccache:$HOME/toolchains/neutron-clang/bin:$PATH"
          cd kernel_workspace/kernel_platform/common
          
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            CC="ccache clang" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LD=ld.lld \
            gki_defconfig all 2>&1 | tee build.log

      - name: 📊 Check Build Status
        if: always()
        run: |
          if [ -f "kernel_workspace/kernel_platform/common/out/arch/arm64/boot/Image" ]; then
             echo "✅ Build Success!"
          else
             echo "❌ Build Failed. Checking logs..."
             if [ -f "kernel_workspace/kernel_platform/common/build.log" ]; then
                tail -n 100 kernel_workspace/kernel_platform/common/build.log
             else
                echo "⚠️ No build log found"
             fi
             exit 1
          fi
          ccache -s

      - name: 📦 Package with AnyKernel3
        run: |
          git clone --depth 1 https://github.com/mrcxlinux/AnyKernel3
          rm -rf AnyKernel3/.git
          cp kernel_workspace/kernel_platform/common/out/arch/arm64/boot/Image AnyKernel3/
          
          if [ "${{ inputs.KPM }}" == "On" ]; then
            cd AnyKernel3
            curl -L -o patch_linux https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.13.0/patch_linux
            chmod +x patch_linux
            ./patch_linux
            mv oImage Image
            rm patch_linux
            cd ..
          fi
          
          cd AnyKernel3
          zip -r9 ../SukiSU-Ultra-Kernel.zip *

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-${{ inputs.optimize_level }}-${{ inputs.SUSFS }}
          path: SukiSU-Ultra-Kernel.zip
