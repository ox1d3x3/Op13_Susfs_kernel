          SETUP_URL_FALLBACK="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/2aba6b8/kernel/setup.sh"
          echo "→ Fetching SukiSU Ultra builtin setup.sh"
          echo "→ SukiSU requested ref: $SETUP_ARG"
          if [[ "$SETUP_ARG" == "latest" || "$SETUP_ARG" == "latest-tag" ]]; then
            echo "Running SukiSU setup with no checkout argument → latest tagged source"
            (curl -fLSs "$SETUP_URL_PRIMARY" | bash) || (curl -fLSs "$SETUP_URL_FALLBACK" | bash)
          else
            echo "Running SukiSU setup with checkout arg: $SETUP_ARG"
            (curl -fLSs "$SETUP_URL_PRIMARY" | bash -s "$SETUP_ARG") || (curl -fLSs "$SETUP_URL_FALLBACK" | bash -s "$SETUP_ARG")
          fi
