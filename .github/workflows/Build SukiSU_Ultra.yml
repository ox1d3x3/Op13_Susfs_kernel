name: OP13 SukiSU Ultra
env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: android15
  # Label only (major.minor). Actual release (e.g. 6.6.89) is detected at build time.
  KERNEL_VERSION: "6.6"
  KERNEL_NAME: android15-8-g7e1f3c083cc6-abogki467167594-4k
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "8G"
  GIT_TERMINAL_PROMPT: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Toolchain"
        type: choice
        required: true
        default: aosp_prebuilt
        options: [aosp_prebuilt, neutron_clang]

      profile:
        description: "Build profile (safe presets)"
        type: choice
        required: true
        default: balanced
        options: [battery, balanced, performance]

      lz4_zram_patch:
        description: "Apply ZRAM LZ4 perf patch (best-effort)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      zram_module:
        description: "Build flashable zram-module.zip (replace zram.ko)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      SUSFS:
        description: "Enable SUSFS"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      susfs_mode:
        description: "SUSFS source (recommended: external)"
        type: choice
        required: true
        default: external
        options: [sukisu, external]

      sukisu_ref:
        description: "SukiSU Ultra ref (Defaulting to builtin for best compatibility)"
        type: string
        required: false
        default: "builtin"

      ksunext_multimanager:
        description: "Apply multi-manager patch (best-effort)"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      bbg:
        description: "Enable Baseband-Guard (BBG)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      bbr:
        description: "Enable BBR congestion control"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      adios:
        description: "Enable ADIOS I/O scheduler"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      rekernel:
        description: "Enable Re-Kernel support"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      proxy:
        description: "Enable proxy/network tweaks (best-effort)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      TTL:
        description: "Enable TTL target/match (netfilter)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      IP_SET:
        description: "Enable IP_SET (netfilter ipset)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      hmbird:
        description: "Dont use HMBIRD/Fengchi option/May Create instability"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      kernel_suffix:
        description: "Kernel suffix (LOCALVERSION)"
        type: string
        required: false
        default: ""

      BUILD_TIME:
        description: "Custom build time string (Enter F to use current UTC)"
        type: string
        required: false
        default: "F"

      BUILD_USER:
        description: "KBUILD_BUILD_USER"
        type: string
        required: false
        default: "OnePlus"

      BUILD_HOST:
        description: "KBUILD_BUILD_HOST"
        type: string
        required: false
        default: "ubuntu-build"

      create_release:
        description: "Create a GitHub Release (optional)"
        type: choice
        required: false
        default: "false"
        options: ["false", "true"]

jobs:
  build:
    name: "SUSFS=${{ github.event.inputs.SUSFS }} | Toolchain=${{ github.event.inputs.toolchain }}"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: "Runner disk preflight"
        id: disk
        shell: bash
        run: |
          set -euo pipefail
          echo "Memory and swap:"
          free -h || true
          echo ""
          echo "Block devices:"
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS || true
          echo ""
          use_maximize=false
          has_mnt_disk=false

          if findmnt -n /mnt >/dev/null 2>&1; then
            SRC="$(findmnt -n -o SOURCE /mnt || true)"
            if [[ "$SRC" == /dev/* ]]; then
              has_mnt_disk=true
              MNT_FREE_MB="$(df -Pm /mnt | awk 'NR==2 {print $4}' || true)"
              if [[ "$MNT_FREE_MB" =~ ^[0-9]+$ ]] && [[ "$MNT_FREE_MB" -gt 20000 ]]; then
                use_maximize=true
              fi
            fi
          fi
          echo "has_mnt_disk=$has_mnt_disk" >> "$GITHUB_OUTPUT"
          echo "use_maximize=$use_maximize" >> "$GITHUB_OUTPUT"

      - name: "Maximize build space"
        if: steps.disk.outputs.use_maximize == 'true'
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: "Extra disk cleanup"
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo docker image prune -a -f || true
          sudo docker system prune -af || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Git auth for non-interactive clones
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global credential.helper store
          git config --global core.askPass true
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: "Setup ccache directory"
        shell: bash
        run: |
          set -euo pipefail
          echo "CCACHE_DIR=$HOME/.ccache_SukiSUUltra" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ccache_SukiSUUltra"

      - name: "Restore ccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-op13-sukisuultra-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.SUSFS }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-op13-sukisuultra-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.SUSFS }}-
            ccache-${{ runner.os }}-op13-sukisuultra-

      - name: "Install build dependencies"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip git curl wget ca-certificates rsync unzip zip file \
            build-essential flex bison bc gawk ccache \
            clang lld llvm dwarves \
            libssl-dev libncurses-dev libelf-dev libdw-dev zlib1g-dev liblz4-tool \
            libxml2-utils dos2unix jq
          ccache -M "${{ env.CCACHE_MAXSIZE }}"

      - name: "Install repo tool"
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > /tmp/repo
          chmod a+x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo

      - name: "Sync kernel sources (Robust CodeLinaro)"
        shell: bash
        run: |
          set -euo pipefail
          git config --global http.version HTTP/1.1 || true
          git config --global http.postBuffer 1048576000 || true
          export GIT_HTTP_LOW_SPEED_LIMIT=1000
          export GIT_HTTP_LOW_SPEED_TIME=300

          mkdir -p kernel_workspace
          cd kernel_workspace

          MANIFEST_REPO="https://github.com/mrcxlinux/actions_oplus_sm8750.git"
          MANIFEST_BRANCH="zh"
          MANIFEST_FILE="manifest.xml"
          
          curl -fL --retry 5 --retry-delay 5 "https://raw.githubusercontent.com/mrcxlinux/actions_oplus_sm8750/${MANIFEST_BRANCH}/${MANIFEST_FILE}" >/dev/null

          repo init -u "$MANIFEST_REPO" -b "$MANIFEST_BRANCH" -m "$MANIFEST_FILE" --depth=1
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle --force-sync || repo sync -c -j1 --force-sync

          rm -f kernel_platform/common/android/abi_gki_protected_exports_* || true
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || true
          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion || true

      - name: "Select toolchain"
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.toolchain }}" = "neutron_clang" ]; then
            mkdir -p "$HOME/toolchains" && cd "$HOME/toolchains"
            git clone --depth=1 https://github.com/Neutron-Toolchains/antman.git antman
            cd antman && bash antman -S
            echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          else
            cd "$GITHUB_WORKSPACE/kernel_workspace"
            CANDIDATE="$(find . -type f -path '*prebuilts/clang/host/linux-x86/*/bin/clang' | head -n 1 || true)"
            echo "$(dirname "$CANDIDATE")" >> "$GITHUB_PATH"
          fi
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

          KERNEL_PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          for p in "$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin" \
                   "$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux_musl-x86/bin"; do
            if [ -d "$p" ]; then echo "$p" >> "$GITHUB_PATH"; fi
          done

      - name: "Apply SUSFS (External)"
        shell: bash
        run: |
          SUSFS_IN="${{ inputs.SUSFS }}"
          set -euo pipefail

          if [[ "$SUSFS_IN" != "On" ]]; then exit 0; fi

          KERNEL_PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          KERNEL_DIR="$KERNEL_PLATFORM/common"

          SUSFS_SRC_BRANCH="oki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
          SUSFS_PATCH_TAG="gki-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
          SUSFS_FOLDER="$GITHUB_WORKSPACE/susfs4oki"

          git clone --depth 1 --no-tags -b "$SUSFS_SRC_BRANCH" "https://github.com/cctv18/susfs4oki.git" "$SUSFS_FOLDER"

          if [[ -d "$SUSFS_FOLDER/kernel_patches/fs" ]]; then
            cp -a "$SUSFS_FOLDER/kernel_patches/fs/." "$KERNEL_DIR/fs/" || true
          fi
          if [[ -d "$SUSFS_FOLDER/kernel_patches/include/linux" ]]; then
            mkdir -p "$KERNEL_DIR/include/linux"
            cp -a "$SUSFS_FOLDER/kernel_patches/include/linux/." "$KERNEL_DIR/include/linux/" || true
          fi

          PATCH_FILE="$SUSFS_FOLDER/kernel_patches/50_add_susfs_in_${SUSFS_PATCH_TAG}.patch"
          cd "$KERNEL_PLATFORM"

          patch -p1 --forward < "$PATCH_FILE" || patch -p1 --forward -F 3 < "$PATCH_FILE"
          
          # Inject Legacy Uname Compat
          python3 - <<'PY'
          from pathlib import Path
          p = Path('./common/fs/susfs.c')
          if p.exists():
              src = p.read_text(encoding='utf-8')
              if 'susfs_uname_is_active' not in src:
                  code = "\n#ifdef CONFIG_KSU_SUSFS_SPOOF_UNAME\nbool susfs_uname_is_active(void) { return true; }\n#else\nbool susfs_uname_is_active(void) { return false; }\n#endif\nvoid susfs_set_uname_from_kernel(void) { }\n"
                  p.write_text(src + code, encoding='utf-8')
          PY

      - name: "Integrate SukiSU Ultra"
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          cd "$KERNEL_DIR"
          
          # Default to builtin to ensure stability and compatibility, avoiding v4.1.1 breakages
          SUKISU_REF="${{ github.event.inputs.sukisu_ref }}"
          SETUP_URL="https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${SUKISU_REF}/kernel/setup.sh"
          
          curl -fLSs "$SETUP_URL" | bash -s "$SUKISU_REF" || curl -fLSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/builtin/kernel/setup.sh" | bash -s "builtin"

          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

      - name: "Harmless SUSFS Compat Bridge (No Hook Interference)"
        if: ${{ github.event.inputs.SUSFS == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          KSU_KBUILD="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/KernelSU/kernel/Kbuild"
          
          if [[ -f "$KSU_KBUILD" ]]; then
            if ! grep -q 'susfs_compat_bridge.o' "$KSU_KBUILD"; then
              echo 'kernelsu-objs += susfs_compat_bridge.o' >> "$KSU_KBUILD"
            fi

            # Provide strictly the missing SELinux SIDs required by SUSFS to compile.
            # Do NOT stub ksu_handle_stat or execveat. This prevents LSPosed from breaking.
            cat > "$(dirname "$KSU_KBUILD")/susfs_compat_bridge.c" <<'EOF'
          #include <linux/types.h>
          #include <linux/cred.h>
          u32 susfs_ksu_sid = 0;
          u32 susfs_init_sid = 0;
          u32 susfs_zygote_sid = 0;
          u32 susfs_priv_app_sid = 0;
          bool susfs_is_current_ksu_domain(void) { return false; }
          bool susfs_is_current_init_domain(void) { return false; }
          bool susfs_is_current_zygote_domain(void) { return false; }
          bool susfs_is_current_priv_app_domain(void) { return false; }
          bool susfs_is_sid_equal(const struct cred *cred, u32 sid2) { return false; }
          u32 susfs_get_sid_from_name(const char *secctx_name) { return 0; }
          u32 susfs_get_current_sid(void) { return 0; }
          void susfs_set_ksu_sid(void) { }
          void susfs_set_init_sid(void) { }
          void susfs_set_zygote_sid(void) { }
          void susfs_set_priv_app_sid(void) { }
          EOF
          fi

      - name: "SukiSU SUSFS kernel-r25 compat (TRY_UMOUNT)"
        if: ${{ github.event.inputs.SUSFS == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          KSU_KCONFIG="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/drivers/kernelsu/Kconfig"
          KSU_SETUID="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/drivers/kernelsu/setuid_hook.c"

          if [[ -f "$KSU_KCONFIG" ]] && ! grep -q "config KSU_SUSFS_TRY_UMOUNT" "$KSU_KCONFIG"; then
            python3 - "$KSU_KCONFIG" <<'PY'
          import sys
          t = open(sys.argv[1]).read()
          insert = 'config KSU_SUSFS_TRY_UMOUNT\n\tbool "Try umount at post-fs-data"\n\tdepends on KSU_SUSFS\n\tdefault y\n\n'
          if 'config KSU_SUSFS_SPOOF_UNAME' in t: t = t.replace('config KSU_SUSFS_SPOOF_UNAME', insert + 'config KSU_SUSFS_SPOOF_UNAME', 1)
          open(sys.argv[1], 'w').write(t)
          PY
          fi

          if [[ -f "$KSU_SETUID" ]] && ! grep -q "susfs_try_umount(" "$KSU_SETUID"; then
            python3 - "$KSU_SETUID" <<'PY'
          import sys
          t = open(sys.argv[1]).read()
          hook = 'ksu_handle_umount(old_uid, new_uid);\n\n#ifdef CONFIG_KSU_SUSFS_TRY_UMOUNT\n\tsusfs_try_umount(new_uid);\n#endif\n'
          if 'ksu_handle_umount(old_uid, new_uid);' in t: t = t.replace('ksu_handle_umount(old_uid, new_uid);', hook, 1)
          open(sys.argv[1], 'w').write(t)
          PY
          fi

      - name: "Apply optional Multi-Manager patch"
        if: ${{ github.event.inputs.ksunext_multimanager == 'On' }}
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          if [ -f "$GITHUB_WORKSPACE/patches/kernelsu-next_multimanager.patch" ]; then
            git apply --whitespace=nowarn "$GITHUB_WORKSPACE/patches/kernelsu-next_multimanager.patch" || true
          fi

      - name: "Apply ZRAM LZ4 perf patch (best-effort)"
        if: ${{ github.event.inputs.lz4_zram_patch == 'On' }}
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          mkdir -p lib/lz4/lz4armv8
          curl -fsSL "https://raw.githubusercontent.com/mrcxlinux/kernel_patches/master/zram/001-lz4.patch" -o 001-lz4.patch
          curl -fsSL "https://raw.githubusercontent.com/mrcxlinux/kernel_patches/master/zram/lz4armv8.S" -o lib/lz4/lz4armv8/lz4armv8.S
          patch -p1 -F 3 < 001-lz4.patch || true

      - name: "Enable features via defconfig"
        shell: bash
        run: |
          set -euo pipefail
          DEFCONFIG="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/arch/arm64/configs/gki_defconfig"

          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG" || true

          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            for opt in PATH MOUNT KSTAT SPOOF_UNAME ENABLE_LOG HIDE_KSU_SUSFS_SYMBOLS SPOOF_CMDLINE_OR_BOOTCONFIG TRY_UMOUNT OPEN_REDIRECT SUS_MAP; do
              echo "CONFIG_KSU_SUSFS_$opt=y" >> "$DEFCONFIG"
            done
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
          else
            echo "CONFIG_KSU_SUSFS=n" >> "$DEFCONFIG"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"
          fi

          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"
          
          for crypto in LZ4_COMPRESS LZ4_DECOMPRESS CRYPTO_LZ4 CRYPTO_LZ4HC; do echo "CONFIG_$crypto=y" >> "$DEFCONFIG"; done

          if [ "${{ github.event.inputs.zram_module }}" = "On" ]; then
            echo "CONFIG_ZRAM=m" >> "$DEFCONFIG"
            echo "CONFIG_ZSMALLOC=m" >> "$DEFCONFIG"
            echo 'CONFIG_ZRAM_DEF_COMP="lz4"' >> "$DEFCONFIG"
          else
            echo "CONFIG_ZRAM=y" >> "$DEFCONFIG"
            echo "CONFIG_ZSMALLOC=y" >> "$DEFCONFIG"
          fi

          echo "# CONFIG_KSU_MANUAL_SU is not set" >> "$DEFCONFIG"
          echo "# CONFIG_KSU_NONE_HOOK is not set" >> "$DEFCONFIG"
          echo "CONFIG_KSU_THRONE_TRACKER_ALWAYS_THREADED=y" >> "$DEFCONFIG"

          if [ "${{ github.event.inputs.bbg }}" = "On" ]; then echo "CONFIG_BBG=y" >> "$DEFCONFIG"; fi
          if [ "${{ github.event.inputs.bbr }}" = "On" ]; then echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"; fi
          if [ "${{ github.event.inputs.adios }}" = "On" ]; then echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> "$DEFCONFIG"; fi
          if [ "${{ github.event.inputs.TTL }}" = "On" ]; then echo "CONFIG_NETFILTER_XT_TARGET_TTL=y" >> "$DEFCONFIG"; fi

          echo "CONFIG_HEADERS_INSTALL=n" >> "$DEFCONFIG"

          if [ "${{ github.event.inputs.profile }}" = "battery" ]; then
            echo "CONFIG_CC_OPTIMIZE_FOR_SIZE=y" >> "$DEFCONFIG"
            echo "CONFIG_DEBUG_INFO=n" >> "$DEFCONFIG"
          elif [ "${{ github.event.inputs.profile }}" = "performance" ]; then
            echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$DEFCONFIG"
          fi

      - name: "Set kernel version suffix (LOCALVERSION)"
        shell: bash
        run: |
          SUF="${{ github.event.inputs.kernel_suffix }}"
          [ -z "$SUF" ] && SUF="${{ env.KERNEL_NAME }}"
          SUF="${SUF#-}"
          echo "LOCALVERSION=-$SUF" >> "$GITHUB_ENV"
          echo "SUFFIX=$SUF" >> "$GITHUB_ENV"

      - name: "Build kernel"
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" LD=ld.lld HOSTLD=ld.lld O=out LOCALVERSION=${LOCALVERSION:-} gki_defconfig
          ./scripts/config --file out/.config -d DEBUG_INFO_REDUCED || true
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" LD=ld.lld HOSTLD=ld.lld O=out LOCALVERSION=${LOCALVERSION:-} olddefconfig
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" LD=ld.lld HOSTLD=ld.lld O=out LOCALVERSION=${LOCALVERSION:-} all
          echo "KERNEL_RELEASE=$(cat out/include/config/kernel.release)" >> "$GITHUB_ENV"

      - name: "Package AnyKernel3"
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 -b gki-2.0 https://github.com/TheWildJames/AnyKernel3 AnyKernel3
          cp "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/out/arch/arm64/boot/Image" "AnyKernel3/Image"
          
          cat > AnyKernel3/banner <<EOF
          ====================================================
                         Ox1d3x3 OP13 Kernel
          SukiSU Ultra [${{ github.event.inputs.profile }}] + SUSFS
          ====================================================
          EOF
          
          OUT="OP13_Stable_SUSFS_${{ env.SUFFIX }}_${{ github.run_number }}.zip"
          (cd AnyKernel3 && zip -r9 "../$OUT" . -x "*.git*" >/dev/null)
          echo "OUT_ZIP=$OUT" >> "$GITHUB_ENV"
          sha256sum "$OUT" > "$OUT.sha256"

      - name: "Upload build outputs (Actions artifact)"
        uses: actions/upload-artifact@v4
        with:
          name: OP13_${{ env.SUFFIX }}_${{ github.run_number }}
          path: |
            ${{ env.OUT_ZIP }}
            ${{ env.OUT_ZIP }}.sha256
          retention-days: 7
