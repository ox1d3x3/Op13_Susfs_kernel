            echo "| HMBIRD | ${{ inputs.hmbird }} |"
            echo "| BBR | ${{ inputs.bbr }} |"
            echo "| BBG | ${{ inputs.bbg }} |"
            echo "| TTL/IP_SET | ${{ inputs.ttl_ipset }} |"
            echo "| NTSYNC | ${{ inputs.ntsync }} |"
            echo "| Unicode fix | ${{ inputs.unicode_fix }} |"
            echo "| Droidspaces | ${{ inputs.droidspaces }} |"
            echo "| ADIOS | ${{ inputs.adios }} |"
            echo "| ZRAM/LZ4 support | ${{ inputs.zram_lz4_support }} |"
            echo "| Flashable zram-module.zip | ${{ inputs.zram_module }} |"
            echo "| BUILD_TIME input | ${{ inputs.BUILD_TIME }} |"
            echo "| Build timestamp resolved | ${BUILD_TIME_RESOLVED:-unknown} |"
            echo "| Build user/host | ${{ inputs.BUILD_USER }}@${{ inputs.BUILD_HOST }} |"
            echo ""
            echo "### Install info"
            echo ""
            echo "- The flash ZIP includes `INSTALL_INFO.txt` and an AnyKernel3 installer banner."
            echo "- Keep a matching stock `boot.img` for the active slot before flashing."
            echo "- If the device bootloops, restore stock `boot.img` first, then collect logs from recovery."
            echo ""
            echo "### Profile difference: battery_daily vs advanced_daily"
            echo ""
            echo "| Feature | battery_daily | advanced_daily | Notes |"
            echo "|---|---:|---:|---|"
            echo "| SukiSU Ultra + CCTV18 SUSFS | On | On | Same root/SUSFS base. |"
            echo "| ADIOS | On | On | Default On from v26. |"
            echo "| BBR / BBG / TTL_IP_SET / NTSYNC / Unicode | On | On | Same stable daily features. |"
            echo "| ZRAM/LZ4 + zram-module.zip | On | On | Same ZRAM support and flashable module package. |"
            echo "| Droidspaces | Off | On | This is the main feature missing from battery_daily. |"
            echo "| HMBIRD/Fengchi | Off | On | Advanced scheduler testing path, not the safest battery default. |"
            echo "| Intended use | Daily battery/stability | Feature-rich testing | Start with battery_daily for OP13 CN. |"
            echo ""
            echo "### Recommended proven daily defaults for OP13 CN/PJZ110"
            echo ""
            echo "| Option | Recommended | Why |"
            echo "|---|---:|---|"
            echo "| feature_profile | battery_daily | Safest profile that already built successfully. |"
            echo "| sukisu_channel | builtin_latest | This is the channel that compiled cleanly in the successful v24/v26 baseline. |"
            echo "| susfs | On | Target feature; CCTV18 susfs4oki is now compiling. |"
            echo "| bbr | On | Reasonable network default, low risk. |"
            echo "| bbg | On | Keep enabled because the current successful build used it. |"
            echo "| ttl_ipset | On | Useful advanced netfilter support; current build passed with it. |"
            echo "| ntsync | On | Low-risk modern compatibility feature if present in tree. |"
            echo "| unicode_fix | On | Keep enabled because current build passed with it. |"
            echo "| zram_lz4_support | On | Enables LZ4/ZRAM support. |"
            echo "| zram_module | On | Builds flashable zram-module.zip like your older workflow by replacing zram.ko in the template. |"
            echo "| adios | On | Default On from v26 because your successful compile used it and it is useful for responsiveness. Monitor idle drain. |"
            echo "| hmbird | Off for battery_daily | Advanced scheduler path; use advanced_daily only after battery_daily is proven on-device. |"
            echo "| droidspaces | Off for battery_daily | Extra container feature; advanced_daily turns it On. |"
          } >> "$GITHUB_STEP_SUMMARY"
          ccache -s || true
          df -hT || true

      - name: "Upload artifacts"
