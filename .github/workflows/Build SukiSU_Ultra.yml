name: Build SukiSU Ultra Final
env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k
  # Performance & System Flags
  CCACHE_MAXSIZE: 10G
  CCACHE_COMPILERCHECK: content

on:
  workflow_dispatch:
    inputs:
      SUSFS:
        description: "📦 SuSFS Support"
        required: true
        type: choice
        options: [ "On", "Off" ]
        default: "On"
      optimize_level:
        description: "🚀 Optimization (O3 = Max Performance)"
        required: true
        type: choice
        options: [ "O3", "O2" ]
        default: "O3"
      bbr:
        description: "📶 Enable BBR (Network Speed)"
        required: true
        type: choice
        options: [ "On", "Off" ]
        default: "On"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Maximize Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"

      - name: 📦 Install Essential Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix kmod bc cpio
          
      - name: 📥 Setup Toolchain (Neutron)
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          cd $GITHUB_WORKSPACE/toolchain
          bash <(curl -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> $GITHUB_PATH

      - name: ⬇️ Sync Source (Simplified Pathing)
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          
          mkdir -p $GITHUB_WORKSPACE/project
          cd $GITHUB_WORKSPACE/project
          repo init -u https://github.com/mrcxlinux/actions_oplus_sm8750.git -b refs/heads/zh -m manifest.xml --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle --force-sync
          
          # Clean ABI references immediately to prevent "Error 2"
          find . -name "abi_gki_protected_exports_*" -delete

      - name: ⚡ Integrate SukiSU Ultra
        run: |
          cd $GITHUB_WORKSPACE/project/kernel_platform
          # Use manual clone to ensure clean state
          git clone --depth 1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          
          # Manual linking (More reliable than setup.sh)
          sed -i "s|source \"scripts/Kconfig.include\"|source \"scripts/Kconfig.include\"\nsource \"../KernelSU/Kconfig\"|g" common/Kconfig
          echo "obj-y += ../KernelSU/kernel/" >> common/Makefile

      - name: 🔧 Apply SUSFS & LZ4 Fixes
        run: |
          cd $GITHUB_WORKSPACE/project/kernel_platform
          
          if [ "${{ inputs.SUSFS }}" == "On" ]; then
            git clone --depth 1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6 susfs_repo
            
            # Apply Kernel Patch
            cd common
            patch -p1 < ../susfs_repo/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch
            
            # Copy SUSFS Files
            cp ../susfs_repo/kernel_patches/include/linux/susfs.h include/linux/
            cp ../susfs_repo/kernel_patches/fs/susfs.c fs/
            cp ../susfs_repo/kernel_patches/include/linux/magic.h include/linux/
            cd ..
          fi
          
          # Fix LZ4 for SukiSU
          mkdir -p common/lib/lz4/lz4armv8
          if [ -f "common/lib/lz4/lz4armv8.S" ]; then
            mv common/lib/lz4/lz4armv8.S common/lib/lz4/lz4armv8/lz4armv8.S
          fi

      - name: 💉 Inject SUSFS Hooks into SukiSU
        if: ${{ inputs.SUSFS == 'On' }}
        run: |
          # The core fix for SukiSU integration
          TARGET="$GITHUB_WORKSPACE/project/kernel_platform/KernelSU/kernel/ksu.c"
          [ ! -f "$TARGET" ] && TARGET="$GITHUB_WORKSPACE/project/kernel_platform/KernelSU/kernel/core_hook.c"
          
          sed -i '1i #include <linux/susfs.h>' "$TARGET"
          sed -i '/ksu_init(void)/ {n; s/{/{\n\tsusfs_init();/}' "$TARGET"
          sed -i '/ksu_exit(void)/ {n; s/{/{\n\tsusfs_exit();/}' "$TARGET"

      - name: ⚙️ Best Daily Settings (Perf & Battery)
        run: |
          cd $GITHUB_WORKSPACE/project/kernel_platform/common
          CONF="arch/arm64/configs/gki_defconfig"
          
          # DISABLE triggers for "Error 2"
          scripts/config --file $CONF -d CONFIG_IKHEADERS
          scripts/config --file $CONF -d CONFIG_KPROBES
          
          # ENABLE Performance/Daily optimizations
          scripts/config --file $CONF -e CONFIG_LTO_CLANG_THIN
          scripts/config --file $CONF -e CONFIG_HZ_300
          
          if [ "${{ inputs.bbr }}" == "On" ]; then
            scripts/config --file $CONF -e CONFIG_TCP_CONG_BBR
            scripts/config --file $CONF -d CONFIG_DEFAULT_CUBIC
            scripts/config --file $CONF -e CONFIG_DEFAULT_BBR
          fi
          
          if [ "${{ inputs.SUSFS }}" == "On" ]; then
            scripts/config --file $CONF -e CONFIG_KSU_SUSFS
            scripts/config --file $CONF -e CONFIG_KSU_SUSFS_SUS_PATH
            scripts/config --file $CONF -e CONFIG_KSU_SUSFS_SUS_MOUNT
            scripts/config --file $CONF -e CONFIG_KSU_SUSFS_SUS_KSTAT
            scripts/config --file $CONF -e CONFIG_KSU_SUSFS_SUS_OVERLAYFS
            scripts/config --file $CONF -e CONFIG_KSU_SUSFS_TRY_UMOUNT
          fi
          
          # Optimization Level
          if [ "${{ inputs.optimize_level }}" == "O3" ]; then
            sed -i 's/-O2/-O3/g' Makefile
          fi

      - name: 🔨 Final Build
        run: |
          cd $GITHUB_WORKSPACE/project/kernel_platform/common
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          
          make -j$(nproc) O=out ARCH=arm64 CC=clang \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            gki_defconfig
            
          make -j$(nproc) O=out ARCH=arm64 CC=clang \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            LD=ld.lld NM=llvm-nm OBJCOPY=llvm-objcopy \
            Image 2>&1 | tee build.log

      - name: 📦 Archive
        run: |
          git clone --depth 1 https://github.com/mrcxlinux/AnyKernel3
          cp $GITHUB_WORKSPACE/project/kernel_platform/common/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3 && zip -r9 ../SukiSU-Ultra-Final.zip *

      - name: 📤 Upload
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-Final
          path: SukiSU-Ultra-Final.zip
