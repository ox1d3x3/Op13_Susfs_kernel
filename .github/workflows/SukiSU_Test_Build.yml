name: OP13 KernelSU-Next

env:
  TZ: Asia/Shanghai
  ANDROID_VERSION: android15
  # Label only (major.minor). Actual release (e.g. 6.6.89) is detected at build time.
  KERNEL_VERSION: "6.6"
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "8G"
  GIT_TERMINAL_PROMPT: "0"

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Toolchain"
        type: choice
        required: true
        default: aosp_prebuilt
        options: [aosp_prebuilt, neutron_clang]

      SUSFS:
        description: "Enable SUSFS"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      ksunext_multimanager:
        description: "Apply KernelSU-Next multi-manager patch (best-effort)"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      bbg:
        description: "Enable Baseband-Guard (BBG)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      bbr:
        description: "Enable BBR congestion control"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      adios:
        description: "Enable ADIOS I/O scheduler"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      rekernel:
        description: "Enable Re-Kernel support"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      proxy:
        description: "Enable proxy/network tweaks (best-effort)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      TTL:
        description: "Enable TTL target/match (netfilter)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      IP_SET:
        description: "Enable IP_SET (netfilter ipset)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      hmbird:
        description: "Enable HMBIRD (FengChi + overwriter config) (best-effort)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      kernel_suffix:
        description: "Kernel suffix (LOCALVERSION). Leave empty to use KERNEL_NAME"
        type: string
        required: false
        default: ""

      BUILD_TIME:
        description: "Custom build time string (Enter F to use current UTC)"
        type: string
        required: false
        default: "F"

      BUILD_USER:
        description: "KBUILD_BUILD_USER"
        type: string
        required: false
        default: "OnePlus"

      BUILD_HOST:
        description: "KBUILD_BUILD_HOST"
        type: string
        required: false
        default: "ubuntu-build"

jobs:
  build:
    name: "SUSFS=${{ github.event.inputs.SUSFS }} | Toolchain=${{ github.event.inputs.toolchain }}"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: "Runner disk preflight"
        id: disk
        shell: bash
        run: |
          set -euo pipefail
          echo "Memory and swap:"
          free -h || true
          echo ""
          echo "Swap devices:"
          swapon --show || true
          echo ""
          echo "Block devices:"
          lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS || true
          echo ""
          echo "Disk usage:"
          df -hT || true
          echo ""
          use_maximize=false
          has_mnt_disk=false

          if findmnt -n /mnt >/dev/null 2>&1; then
            SRC="$(findmnt -n -o SOURCE /mnt || true)"
            echo "/mnt is a mount point from: $SRC"
            if [[ "$SRC" == /dev/* ]]; then
              has_mnt_disk=true
              MNT_FREE_MB="$(df -Pm /mnt | awk 'NR==2 {print $4}' || true)"
              echo "/mnt free (MB): $MNT_FREE_MB"
              if [[ "$MNT_FREE_MB" =~ ^[0-9]+$ ]] && [[ "$MNT_FREE_MB" -gt 20000 ]]; then
                use_maximize=true
              else
                echo "Skipping maximize-build-space: /mnt does not have enough free space."
              fi
            fi
          else
            echo "/mnt is NOT a mount point on this runner."
          fi

          echo "has_mnt_disk=$has_mnt_disk" >> "$GITHUB_OUTPUT"
          echo "use_maximize=$use_maximize" >> "$GITHUB_OUTPUT"

      - name: "Maximize build space (only if /mnt temp disk exists)"
        if: steps.disk.outputs.use_maximize == 'true'
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          swap-size-mb: 2048
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: "Extra disk cleanup"
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo docker image prune -a -f || true
          sudo docker system prune -af || true
          df -hT

      - name: Checkout
        uses: actions/checkout@v4

      - name: Git auth for non-interactive clones
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Prevent any interactive prompts during git operations
          git config --global credential.helper store
          git config --global core.askPass true
          # Use the workflow token for any https://github.com/ clones (public or private where permitted)
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: "Setup ccache directory"
        shell: bash
        run: |
          set -euo pipefail
          echo "CCACHE_DIR=$HOME/.ccache_KSUNext" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ccache_KSUNext"

      - name: "Restore ccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-op13-ksunext-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.SUSFS }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-op13-ksunext-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.SUSFS }}-
            ccache-${{ runner.os }}-op13-ksunext-

      - name: "Install build dependencies"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             python3 python3-pip git curl wget ca-certificates rsync unzip zip file             build-essential flex bison bc gawk ccache             clang lld llvm dwarves             libssl-dev libncurses-dev libelf-dev libdw-dev zlib1g-dev liblz4-tool             libxml2-utils dos2unix jq
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -s

      - name: "Install repo tool"
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > /tmp/repo
          chmod a+x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo
          repo --version

      - name: "Sync kernel sources"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          # Manifest repo: only zh branch contains manifest.xml
          MANIFEST_REPO="https://github.com/mrcxlinux/actions_oplus_sm8750.git"
          MANIFEST_BRANCH="zh"
          MANIFEST_FILE="manifest.xml"
          echo "Using manifest: $MANIFEST_REPO ($MANIFEST_BRANCH/$MANIFEST_FILE)"
          curl -fsSL "https://raw.githubusercontent.com/mrcxlinux/actions_oplus_sm8750/${MANIFEST_BRANCH}/${MANIFEST_FILE}" >/dev/null
          repo init -u "$MANIFEST_REPO" -b "$MANIFEST_BRANCH" -m "$MANIFEST_FILE" --depth=1
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle --force-sync

          rm -f kernel_platform/common/android/abi_gki_protected_exports_* || true
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || true

          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion || true
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion || true
          sed -i 's/ -dirty//g' kernel_platform/external/dtc/scripts/setlocalversion || true

      - name: "Select toolchain"
        shell: bash
        run: |
          set -euo pipefail
          echo "Selected toolchain: ${{ github.event.inputs.toolchain }}"
          if [ "${{ github.event.inputs.toolchain }}" = "neutron_clang" ]; then
            mkdir -p "$HOME/toolchains"
            cd "$HOME/toolchains"
            git clone --depth=1 https://github.com/Neutron-Toolchains/antman.git antman
            cd antman
            bash antman -S
            echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          else
            cd "$GITHUB_WORKSPACE/kernel_workspace"
            CANDIDATE="$(find . -type f -path '*prebuilts/clang/host/linux-x86/*/bin/clang' | head -n 1 || true)"
            if [ -z "$CANDIDATE" ]; then
              echo "Error: clang prebuilts not found under kernel_workspace."
              exit 1
            fi
            echo "$(dirname "$CANDIDATE")" >> "$GITHUB_PATH"
          fi
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

          # Add AOSP kernel build tools (contains ld.lld, llvm-ar, etc.) to PATH
          KERNEL_PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          ADD_PATHS=()
          for p in "$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux-x86/bin" \
                    "$KERNEL_PLATFORM/prebuilts/kernel-build-tools/linux_musl-x86/bin"; do
            if [ -d "$p" ]; then
              echo "$p" >> "$GITHUB_PATH"
              ADD_PATHS+=("$p")
            fi
          done

          # Also export for THIS step so we can verify tools now
          if [ "${#ADD_PATHS[@]}" -gt 0 ]; then
            export PATH="$(IFS=:; echo "${ADD_PATHS[*]}"):$PATH"
          fi

          echo "Toolchain check:"
          echo "  clang:  $(command -v clang || true)"
          echo "  ld.lld: $(command -v ld.lld || true)"
          clang --version || true
          ld.lld --version || true


      - name: "Integrate KernelSU-Next (official)"
        shell: bash
        run: |
          set -euo pipefail
          KERNEL_PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          cd "$KERNEL_PLATFORM"
          echo "📌 KernelSU-Next: using official setup.sh (defaults to latest tag)"
          curl -fsSL https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh -o /tmp/ksu_setup.sh
          bash /tmp/ksu_setup.sh
          rm -f /tmp/ksu_setup.sh
      
          # Sanity checks
          test -d "$KERNEL_PLATFORM/KernelSU-Next/kernel" || { echo "❌ KernelSU-Next/kernel not found"; ls -la "$KERNEL_PLATFORM" || true; exit 1; }
          test -L "$KERNEL_PLATFORM/common/drivers/kernelsu" || { echo "❌ common/drivers/kernelsu symlink not created"; ls -la "$KERNEL_PLATFORM/common/drivers" || true; exit 1; }
      
          # Keep DKSU_VERSION stable (matches what many OP13 GKI builds expect)
          KSU_MK="$KERNEL_PLATFORM/KernelSU-Next/kernel/Makefile"
          if grep -qE '^DKSU_VERSION' "$KSU_MK"; then
            sed -i -E 's/^(DKSU_VERSION\s*:?=\s*).*/\113167/' "$KSU_MK"
          fi
      - name: "Apply optional Multi-Manager patch"
        if: ${{ github.event.inputs.ksunext_multimanager == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          if [ -f "$GITHUB_WORKSPACE/patches/kernelsu-next_multimanager.patch" ]; then
            git apply --whitespace=nowarn "$GITHUB_WORKSPACE/patches/kernelsu-next_multimanager.patch" || true
          fi

      - name: "Apply SUSFS (v2-safe + KSUN fix patches)"
        if: ${{ github.event.inputs.SUSFS == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
      
          ANDROID_VERSION="${{ env.ANDROID_VERSION }}"
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
      
          KERNEL_PLATFORM="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          KERNEL_DIR="$KERNEL_PLATFORM/common"
          KSUN_DIR="$KERNEL_PLATFORM/KernelSU-Next"
      
          test -d "$KERNEL_DIR" || { echo "❌ Kernel dir not found: $KERNEL_DIR"; exit 1; }
          test -d "$KSUN_DIR" || { echo "❌ KernelSU-Next dir not found: $KSUN_DIR"; exit 1; }
      
          SUSFS_REF="gki-${ANDROID_VERSION}-${KERNEL_VERSION}"
          echo "Using susfs4ksu branch: $SUSFS_REF"
      
          work="$GITHUB_WORKSPACE/_susfs_work"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"
      
          pick_and_clone() {
            local ref="$1"; shift
            for url in "$@"; do
              echo "→ Checking susfs4ksu: $url"
              if git ls-remote --exit-code --heads "$url" "$ref" >/dev/null 2>&1; then
                echo "→ Cloning $url ($ref)"
                git clone --depth=1 --branch "$ref" "$url" susfs4ksu
                return 0
              fi
            done
            return 1
          }
      
          SUS_URLS=(
            "https://gitlab.com/simonpunk/susfs4ksu.git"
            "https://gitlab.com/pershoot/susfs4ksu.git"
            "https://github.com/simonpunk/susfs4ksu.git"
          )
      
          if ! pick_and_clone "$SUSFS_REF" "${SUS_URLS[@]}"; then
            echo "❌ Could not find branch '$SUSFS_REF' on any susfs4ksu remote."
            echo "Tried:"; printf ' - %s\n' "${SUS_URLS[@]}"
            exit 1
          fi
      
          SUS_PATCH_DIR="$work/susfs4ksu/kernel_patches"
          PATCH_FILE="$SUS_PATCH_DIR/50_add_susfs_in_${SUSFS_REF}.patch"
          test -d "$SUS_PATCH_DIR/fs" || { echo "❌ susfs4ksu kernel_patches/fs missing"; exit 1; }
          test -d "$SUS_PATCH_DIR/include/linux" || { echo "❌ susfs4ksu kernel_patches/include/linux missing"; exit 1; }
      
          echo "Copying SUSFS source/header files..."
          rsync -a "$SUS_PATCH_DIR/fs/" "$KERNEL_DIR/fs/"
          rsync -a "$SUS_PATCH_DIR/include/linux/" "$KERNEL_DIR/include/linux/"
      
          if [[ ! -f "$PATCH_FILE" ]]; then
            echo "❌ SUSFS main patch not found: $PATCH_FILE"
            echo "Available patches:"; ls -la "$SUS_PATCH_DIR" || true
            exit 1
          fi
      
          echo "Applying SUSFS patch to kernel (3-way + fuzz fallback)..."
          cd "$KERNEL_DIR"
          # small pre-adjustments improve patch success on vendor trees
          grep -q "include/linux/susfs.h" include/linux/mount.h || sed -i '1i#include <linux/susfs.h>' include/linux/mount.h
          grep -q "include/linux/susfs.h" include/linux/fs.h || sed -i '1i#include <linux/susfs.h>' include/linux/fs.h
      
          if git apply --check "$PATCH_FILE" >/dev/null 2>&1; then
            git apply "$PATCH_FILE"
          else
            git apply -3 --reject "$PATCH_FILE" || true
            if find . -name "*.rej" -print -quit | grep -q .; then
              echo "❌ SUSFS kernel patch produced rejects (.rej). SUSFS will be incomplete."
              find . -name "*.rej" -maxdepth 5 -print || true
              exit 1
            fi
          fi
      
          # Ensure defconfig toggles are set
          DEFCONF="$KERNEL_DIR/arch/arm64/configs/gki_defconfig"
          {
            echo ""
            echo "# KernelSU + SUSFS"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KSU_SUSFS=y"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=\"/data/adb/ksu/susfs\""
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=\"/debug_ramdisk/susfs\""
          } >> "$DEFCONF"
      
          SUSFS_VERSION="$(grep -oE 'SUSFS_VERSION\s+\"v[0-9]+\.[0-9]+\.[0-9]+\"' "$KERNEL_DIR/include/linux/susfs.h" | head -n1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || true)"
          echo "Detected SUSFS_VERSION: $SUSFS_VERSION"
      
          echo "Enabling SUSFS support in KernelSU-Next..."
          cd "$KSUN_DIR"
          SUS_KSU_PATCH="$SUS_PATCH_DIR/KernelSU/10_enable_susfs_for_ksu.patch"
          test -f "$SUS_KSU_PATCH" || { echo "❌ Missing patch: $SUS_KSU_PATCH"; exit 1; }
          patch -p1 -F 3 --forward < "$SUS_KSU_PATCH" || true
      
          KP_DIR="$work/kernel_patches"
          if [[ ! -d "$KP_DIR" ]]; then
            echo "Cloning kernel_patches (for KSUN SUSFS fix patches)..."
            git clone --depth=1 https://github.com/WildKernels/kernel_patches.git "$KP_DIR"
          fi
      
          FIX_BASE=""
          if [[ -n "$SUSFS_VERSION" ]]; then
            for d in "$KP_DIR/next/susfs_fix_patches/$SUSFS_VERSION" "$KP_DIR/ksu/susfs_fix_patches/$SUSFS_VERSION"; do
              if [[ -d "$d" ]]; then FIX_BASE="$d"; break; fi
            done
          fi
      
          if [[ -n "$FIX_BASE" ]]; then
            echo "Applying KSUN SUSFS fix patches from: $FIX_BASE"

            # Apply all available fix_*.patch (forward only). This covers cases where the enable patch

            # applies but still needs API shims for the current SUSFS version.

            for p in "$FIX_BASE"/fix_*.patch "$FIX_BASE"/fix_*.c.patch; do

              [[ -f "$p" ]] || continue

              patch -p1 -F 3 --forward < "$p" || true

            done

            

            # (Optional) also replay fixes based on any reject files (keeps things minimal when available)

            while IFS= read -r -d '' rej; do

              file="$(basename "$rej" .rej)"

              pf1="$FIX_BASE/fix_${file}.patch"

              pf2="$FIX_BASE/fix_${file}.c.patch"

              if [[ -f "$pf1" ]]; then patch -p1 -F 3 --forward < "$pf1" || true; fi

              if [[ -f "$pf2" ]]; then patch -p1 -F 3 --forward < "$pf2" || true; fi

            done < <(find ./kernel -maxdepth 2 -name "*.rej" -print0)
      
            if [[ -f "$FIX_BASE/overwrite_hook_mode.patch" ]]; then
              patch -p1 -F 3 --forward < "$FIX_BASE/overwrite_hook_mode.patch" || true
            fi
          else
            echo "⚠️ No KSUN fix patch directory found for SUSFS_VERSION='$SUSFS_VERSION'."
          fi
      
          if find ./kernel -maxdepth 2 -name "*.rej" -print -quit | grep -q .; then
            echo "❌ KernelSU-Next still has .rej files after fix patches:"
            find ./kernel -maxdepth 2 -name "*.rej" -print || true
            exit 1
          fi
      
          echo "✅ SUSFS patching complete."
      - name: "Enable features via defconfig"

        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"

          # Keep localversion deterministic (we set LOCALVERSION ourselves later)
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG"

          # KernelSU base
          echo "CONFIG_KSU=y" >> "$DEFCONFIG" || true

          # SUSFS vs MANUAL_HOOK (match your original logic)
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> "$DEFCONFIG"
            echo "CONFIG_KSU_SUSFS_SUS_MAP=y" >> "$DEFCONFIG"
          else
            echo "CONFIG_KSU_SUSFS=n" >> "$DEFCONFIG"
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$DEFCONFIG"
          fi

          # Support Mountify-style tmpfs xattrs (as in your base workflow)
          echo "CONFIG_TMPFS_XATTR=y" >> "$DEFCONFIG"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$DEFCONFIG"

          # Optional features (already in your workflow)
          if [ "${{ github.event.inputs.bbg }}" = "On" ]; then echo "CONFIG_BBG=y" >> "$DEFCONFIG" || true; fi
          if [ "${{ github.event.inputs.bbr }}" = "On" ]; then echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"; fi
          if [ "${{ github.event.inputs.adios }}" = "On" ]; then
            echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> "$DEFCONFIG"
            echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> "$DEFCONFIG"
          fi
          if [ "${{ github.event.inputs.rekernel }}" = "On" ]; then echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"; fi
          if [ "${{ github.event.inputs.TTL }}" = "On" ]; then
            echo "CONFIG_NETFILTER_XT_TARGET_TTL=y" >> "$DEFCONFIG"
            echo "CONFIG_NETFILTER_XT_MATCH_TTL=y" >> "$DEFCONFIG"
          fi
          if [ "${{ github.event.inputs.IP_SET }}" = "On" ]; then
            echo "CONFIG_IP_SET=y" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET_MAX=256" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET_HASH_IP=y" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET_HASH_IPPORT=y" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> "$DEFCONFIG"
          fi

          # Reduce header install work
          echo "CONFIG_HEADERS_INSTALL=n" >> "$DEFCONFIG"
          sed -i 's/check_defconfig//' ./common/build.config.gki || true


      - name: "Set kernel version suffix (LOCALVERSION)"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

          # Prefer explicit input, else fall back to env.KERNEL_NAME
          if [ -n "${{ github.event.inputs.kernel_suffix }}" ]; then
            SUF_RAW="${{ github.event.inputs.kernel_suffix }}"
          else
            SUF_RAW="${{ env.KERNEL_NAME }}"
          fi

          # Sanitize: remove whitespace, avoid double '-' prefix
          SUF="${SUF_RAW//[[:space:]]/}"
          SUF="${SUF#-}"
          LOCALVER="-$SUF"

          echo "Using suffix: $SUF"
          echo "LOCALVERSION=$LOCALVER" >> "$GITHUB_ENV"
          echo "SUFFIX=$SUF" >> "$GITHUB_ENV"

          # Ensure defconfig doesn't hardcode another localversion
          DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"
          if [ -f "$DEFCONFIG" ]; then
            grep -v '^CONFIG_LOCALVERSION=' "$DEFCONFIG" > "$DEFCONFIG.tmp" || true
            mv "$DEFCONFIG.tmp" "$DEFCONFIG"
          fi
      - name: "Set KBUILD build identity and timestamp"
        shell: bash
        run: |
          set -euo pipefail
          echo "KBUILD_BUILD_USER=${{ github.event.inputs.BUILD_USER }}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=${{ github.event.inputs.BUILD_HOST }}" >> "$GITHUB_ENV"
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then DATESTR="$INPUT_TIME"; else DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"; fi
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

          # Ensure uname -v / UTS_VERSION matches our chosen BUILD_TIME (mimic stock identification)
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          for f in common/scripts/mkcompile_h msm-kernel/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching $f for UTS_VERSION time stamp"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\\(.*?\\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done

      - name: "Clone WildKernel kernel_patches (for HMBIRD etc)"
        if: ${{ github.event.inputs.hmbird == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf kernel_patches || true
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git clone --depth=1 https://github.com/TheWildJames/kernel_patches.git kernel_patches

      - name: "Apply WildKernel patches (HMBIRD/overwriter) (best-effort)"
        if: ${{ github.event.inputs.hmbird == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

          apply_best_effort() {
            local p="$1"
            if [ ! -f "$p" ]; then
              echo "⚠️ Skipped (missing): $(basename "$p")"
              return 0
            fi

            local tmp=""
            if grep -q "GIT binary patch" "$p"; then
              tmp="$p"
            else
              tmp="$(mktemp)"
              tr -d '\r' < "$p" > "$tmp"
            fi

            if patch -p1 -F 3 -N --silent < "$tmp"; then
              echo "✅ Applied: $(basename "$p")"
            elif git apply --reject --whitespace=nowarn "$tmp" >/dev/null 2>&1; then
              echo "✅ Applied (git): $(basename "$p")"
            else
              echo "⚠️ Skipped (does not apply cleanly): $(basename "$p")"
            fi

            if [ "$tmp" != "$p" ]; then rm -f "$tmp"; fi
            return 0
          }

          echo "Applying HMBIRD-related patches (best-effort)..."
          HMBIRD_DIR="$GITHUB_WORKSPACE/kernel_patches/oneplus/hmbird"

          # Pick the most likely FengChi patch (apply at most ONE)
          pick_first() { for f in "$@"; do [ -f "$f" ] && { echo "$f"; return 0; }; done; return 1; }
          FENGCHI="$(pick_first             "$HMBIRD_DIR/fengchi_PJZ110_OOS15.patch"             "$HMBIRD_DIR/fengchi_PJZ110_OOS16.patch"             "$HMBIRD_DIR/fengchi_OP13_OOS15.patch"             "$HMBIRD_DIR/fengchi_OP13_OOS16.patch"           )" || true
          if [ -n "${FENGCHI:-}" ]; then
            echo "→ FengChi: $(basename "$FENGCHI")"
            apply_best_effort "$FENGCHI"
          else
            echo "⚠️ No FengChi patch matched (skipping fengchi)"
          fi

          apply_best_effort "$HMBIRD_DIR/overwriter.patch"
          apply_best_effort "$HMBIRD_DIR/hmbird_config.patch"

          # Optional common optimizations used by WildKernel action (best-effort)
          COMMON_DIR="$GITHUB_WORKSPACE/kernel_patches/common"
          apply_best_effort "$COMMON_DIR/optimized_mem_operations.patch"
          apply_best_effort "$COMMON_DIR/file_struct_8bytes_align.patch"

      - name: "Fix permissions for overwriter scripts"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          chmod +x drivers/of/overwriter/overwrite_configs/convert_configs.sh 2>/dev/null || true
          chmod +x drivers/of/overwriter/overwrite_configs/*.sh 2>/dev/null || true

      - name: "Build kernel"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          command -v ld.lld >/dev/null 2>&1 || { echo "::error::ld.lld not found in PATH"; echo "PATH=$PATH"; ls -la "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/kernel-build-tools/linux-x86/bin" 2>/dev/null || true; exit 1; }
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-O2 LOCALVERSION=${LOCALVERSION:-} gki_defconfig all
          REL="$(cat out/include/config/kernel.release 2>/dev/null || true)"
          if [ -z "$REL" ]; then REL="$(make -s O=out LOCALVERSION=${LOCALVERSION:-} kernelrelease 2>/dev/null || true)"; fi
          echo "KERNEL_RELEASE=$REL" >> "$GITHUB_ENV"
          echo "Kernel release: $REL"

      - name: Verify final config (KernelSU-Next / SUSFS)
        shell: bash
        run: |
          set -euo pipefail
          CFG="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/out/.config"
          if [[ ! -f "$CFG" ]]; then
            echo "::error::.config not found: $CFG"
            exit 1
          fi
          echo "Checking $CFG ..."
          if [[ "${{ github.event.inputs.SUSFS }}" == "On" ]]; then
            grep -q '^CONFIG_KSU_SUSFS=y' "$CFG" || { echo "::error::CONFIG_KSU_SUSFS=y missing in final .config"; grep -n 'KSU_SUSFS' "$CFG" || true; exit 1; }
          fi
          echo "✅ Config looks good."

      - name: "Package AnyKernel3 (single zip, banner, no breakage)"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          rm -rf AnyKernel3 || true
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
          git clone --depth=1 -b gki-2.0 https://github.com/TheWildJames/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git

          IMAGE_PATH="$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/out" -type f -name Image | head -n 1 || true)"
          if [ -z "$IMAGE_PATH" ]; then
            echo "❌ Image not found in out/ (build likely failed)."
            exit 1
          fi
          cp "$IMAGE_PATH" "AnyKernel3/Image"

          # Patch anykernel.sh safely: keep properties() intact; update strings + inject our info block after ak3-core is sourced.
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          ak = Path("AnyKernel3/anykernel.sh")
          s = ak.read_text(encoding="utf-8", errors="replace")

          # Clean english kernel.string
          s = re.sub(r'^\s*kernel\.string=.*$', 'kernel.string=PJZ110 | KernelSU-Next (OP-OX)', s, flags=re.M)

          # Remove previous custom injection (idempotent)
          s = re.sub(r'\n# --- OX1D3X3 CUSTOM START ---.*?# --- OX1D3X3 CUSTOM END ---\n', '\n', s, flags=re.S)

          m = re.search(r'\n\.\s+tools/ak3-core\.sh\s*\n', s)
          if not m:
            raise SystemExit("Cannot find '. tools/ak3-core.sh' marker in anykernel.sh")

          run_number = os.environ.get("GITHUB_RUN_NUMBER", "")
          kernel_rel = os.environ.get("KERNEL_RELEASE", "")
          suffix = os.environ.get("SUFFIX", "OP-OX")

          block = f"""
          # --- OX1D3X3 CUSTOM START ---
          ui_print " "
          ui_print "===================================================="
          ui_print "                   __   __  __ "
          ui_print "                  \\ \\ / //_ |"
          ui_print "                   \\ V /   | |"
          ui_print "                     > <    | |"
          ui_print "                   / . \\   | |"
          ui_print "                 /_/ \\_\\  |_|"
          ui_print "===================================================="
          ui_print " "
          ui_print "PJZ110 | KernelSU-Next + SUSFS"
          ui_print "Kernel : {kernel_rel}"
          ui_print "Build  : #{run_number} ({suffix})"
          ui_print "Builder: @Ox1d3x3"
          ui_print "Credits: @mrcxlinux, WildKernels"
          ui_print " "

          device="$(getprop ro.product.device 2>/dev/null || true)"
          model="$(getprop ro.product.model 2>/dev/null || true)"
          android="$(getprop ro.build.version.release 2>/dev/null || true)"
          patch="$(getprop ro.build.version.security_patch 2>/dev/null || true)"
          if [ -n "$device" ]; then ui_print "Device : $device ($model)"; fi
          if [ -n "$android" ]; then ui_print "Android: $android"; fi
          if [ -n "$patch" ]; then ui_print "Patch  : $patch"; fi
          ui_print " "

          # Best-effort open project page (may be ignored in recovery)
          if command -v cmd >/dev/null 2>&1; then
            (cmd activity start --user 0 -a android.intent.action.VIEW -d "https://github.com/ox1d3x3/Op13_Susfs_kernel" >/dev/null 2>&1 &) || true
          elif command -v am >/dev/null 2>&1; then
            (am start --user 0 -a android.intent.action.VIEW -d "https://github.com/ox1d3x3/Op13_Susfs_kernel" >/dev/null 2>&1 &) || true
          fi
          # --- OX1D3X3 CUSTOM END ---
          """

          s = s[:m.end()] + block + s[m.end():]
          ak.write_text(s, encoding="utf-8")
          PY

          # Plain-text banner shown early by update-binary (optional)
          cat > AnyKernel3/banner <<'EOF'
          ====================================================
                         Ox1d3x3 Kernel
                   KernelSU-Next + SUSFS
          ====================================================
          EOF

          OUT="OP13_${{ env.ANDROID_VERSION }}_${{ env.KERNEL_VERSION }}_${{ env.SUFFIX }}_${{ github.run_number }}_SUSFS_FLASH_THIS.zip"
          rm -f "$OUT" || true
          (cd AnyKernel3 && zip -r9 "../$OUT" . -x "*.git*" -x "*README*" -x "*.md" >/dev/null)
          echo "OUT_ZIP=$OUT" >> "$GITHUB_ENV"

          echo "FLASH_ZIP=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - name: "Generate checksums"
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "${{ env.OUT_ZIP }}" | tee "${{ env.OUT_ZIP }}.sha256"

      - name: "Upload flash zip (artifact)"
        uses: actions/upload-artifact@v4
        with:
          name: OP13_KSU_NEXT_FLASH_ZIP
          path: ${{ env.OUT_ZIP }}
          if-no-files-found: error
      - name: Reset PATH for cache save (system tar)
        if: always()
        shell: bash
        run: |
          echo "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> "$GITHUB_ENV"
          echo "TAR=/usr/bin/tar" >> "$GITHUB_ENV"

      - name: "Prepare GitHub Release"
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          # Use run_attempt so re-runs don't collide with existing tags
          TAG="v${{ github.run_number }}.${{ github.run_attempt }}-${{ env.SUFFIX }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=OP13 KSUNext $TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: "Publish GitHub Release (direct-download flash ZIP)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ env.OUT_ZIP }}
            ${{ env.OUT_ZIP }}.sha256

      - name: "Summary"
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Output"
            echo ""
            echo "- Flashable ZIP: **${{ env.OUT_ZIP }}**"
            echo "- SHA256: **${{ env.OUT_ZIP }}.sha256**"
            echo ""
            echo "### Note about Artifacts"
            echo "GitHub Artifacts download as a wrapper ZIP. If you download the Artifact, extract it and flash **${{ env.OUT_ZIP }}**."
            echo "For direct download (no wrapper ZIP), use the **GitHub Release** asset created by this run."
          } >> "$GITHUB_STEP_SUMMARY"
