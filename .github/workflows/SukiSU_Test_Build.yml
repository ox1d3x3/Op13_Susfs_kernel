---
name: Build SukiSU Ultra-Test

env:
  TZ: Australia/Perth
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  # This is only used for naming (does not affect the build)
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k

on:
  workflow_dispatch:
    inputs:
      PROFILE:
        description: "⚡ Performance profile (artifact naming)"
        required: true
        type: choice
        options:
          - "optimal"
          - "highest"
          - "lowest"
        default: "optimal"

      SUSFS:
        description: "📦 SuSFS Support"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "On"

      KPM:
        description: "🧩 KPM Support"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"

      bbg:
        description: "🛡️ BBG baseband protection (may affect terminals; keep Off for daily)"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"

      bbr:
        description: "📶 BBR support (compile support only; not default runtime)"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"

      HMBIRD:
        description: "🕊️ HMBird patches (optional)"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "On"

      TTL:
        description: "🧷 TTL / net tweaks patches (optional)"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"

      IP_SET:
        description: "🧱 IP_SET support (useful for firewall lists)"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "On"

      adios_rekernel_enable:
        description: "⚙️ ADIOS I/O scheduler and Re-Kernel support"
        required: true
        type: choice
        default: "ADIOS only"
        options:
          - "none"
          - "ADIOS only"
          - "Re-Kernel only"
          - "both"

      proxy:
        description: "🌐 Proxy download acceleration (only affects curl clone/download)"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"

      UNICODE_BYPASS:
        description: "🚀 Unicode zero-width bypass fix patch (optional)"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"

      kernel_suffix:
        description: "📝 Kernel suffix (no spaces, no leading '-')"
        required: false
        type: string
        default: ""

      BUILD_TIME:
        type: string
        description: "Optional. Leave blank to mimic stock build time, or set to F to use current build time."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CURL_OPTS: "--retry 5 --retry-delay 2"
      CCACHE_DIR: /home/runner/.ccache_op13
      CCACHE_MAXSIZE: 10G

      # Kernel manifest
      MANIFEST_URL: https://github.com/mrcxlinux/actions_oplus_sm8750.git
      MANIFEST_BRANCH: zh
      MANIFEST_NAME: manifest.xml

      # Patches
      KERNEL_PATCHES_REPO: https://github.com/mrcxlinux/kernel_patches.git
      SUKISU_PATCH_REPO: https://github.com/ShirkNeko/SukiSU_patch.git
      SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git

      # Packaging
      ANYKERNEL_REPO: https://github.com/mrcxlinux/AnyKernel3
      ANYKERNEL_BRANCH: gki

    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v4

      # ✅ Fix: remove easimon/maximize-build-space (it caused fallocate invalid length)
      - name: 🧹 Free disk space (safe)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: ⚙️ Setup dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             bc bison flex git git-lfs curl wget rsync zip unzip jq             python3 python3-pip             build-essential libssl-dev libelf-dev dwarves libtinfo6 libncurses6             ccache             gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          git lfs install

      - name: ⚡ Setup ccache
        run: |
          set -e
          mkdir -p "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE" || true
          ccache -s || true

      - name: 💾 Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-op13-${{ github.ref }}-${{ github.event.inputs.PROFILE }}
          restore-keys: |
            ccache-${{ runner.os }}-op13-

      - name: 📥 Install Repo Tool
        run: |
          set -e
          echo "⬇️ Downloading repo tool..."
          curl $CURL_OPTS -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          echo "✅ repo tool installed"

      - name: "⬇️ Clone Kernel Source"
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "🌐 Initializing kernel repo..."
          repo init -u "$MANIFEST_URL" -b "refs/heads/$MANIFEST_BRANCH" -m "$MANIFEST_NAME" --depth=1

          echo "🔄 Syncing repos (using $(nproc --all) threads)..."
          repo sync -c -j"$(nproc --all)" --no-tags --no-clone-bundle --force-sync

          rm -f kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"

          # Remove -dirty in kernel version
          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion || true
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion || true
          sed -i 's/ -dirty//g' kernel_platform/external/dtc/scripts/setlocalversion || true

          echo "✅ Kernel setup complete"

      # ✅ Fix: NO Neutron clang (glibc mismatch). Use in-tree AOSP clang and make sure `clang` exists.
      - name: "🧰 Toolchain: Neutron clang (AntMan, stable)"
        run: |
          set -e
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl $CURL_OPTS -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman" -o antman
          chmod +x antman
          ./antman -S
          # Patch toolchain for runner glibc if needed (safe no-op if not required)
          ./antman --patch=glibc || true

          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          command -v clang
          clang --version

      - name: "🧩 Setup SukiSU Ultra (builtin)"
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          curl -fsSL https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s builtin

      - name: "⬇️ Clone Patch Repos"
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          rm -rf kernel_patches SukiSU_patch susfs4ksu
          git clone --depth=1 "$KERNEL_PATCHES_REPO" kernel_patches
          git clone --depth=1 "$SUKISU_PATCH_REPO" SukiSU_patch
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            git clone --depth=1 -b "gki-${ANDROID_VERSION}-${KERNEL_VERSION}" "$SUSFS_REPO" susfs4ksu ||             git clone --depth=1 "$SUSFS_REPO" susfs4ksu
          fi

      - name: ⚡ Setup Baseband-guard
        if: ${{ github.event.inputs.bbg == 'On' }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          echo "🛠️ Setting up BBG..."
          curl $CURL_OPTS -fsSL https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh -o setup.sh
          bash setup.sh

      - name: 🧩 Apply SUSFS + Common Patches
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          COMMON_DIR="./common"
          DEFCONFIG="${COMMON_DIR}/arch/arm64/configs/gki_defconfig"

          echo "🧠 Termux/terminal essentials (always enabled)..."
          {
            echo "CONFIG_TTY=y"
            echo "CONFIG_PTY=y"
            echo "CONFIG_UNIX98_PTYS=y"
            echo "CONFIG_DEVPTS_FS=y"
            echo "CONFIG_DEVPTS_MULTIPLE_INSTANCES=y"
            echo "CONFIG_DEVTMPFS=y"
            echo "CONFIG_DEVTMPFS_MOUNT=y"
          } >> "$DEFCONFIG"

          echo "🧱 IP_SET..."
          if [ "${{ github.event.inputs.IP_SET }}" = "On" ]; then
            echo "CONFIG_IP_SET=y" >> "$DEFCONFIG"
          else
            echo "# CONFIG_IP_SET is not set" >> "$DEFCONFIG"
          fi

          echo "🧩 SUSFS..."
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            # Locate core patch (avoid hardcoding)
            CORE_PATCH="$(find ../susfs4ksu/kernel_patches -maxdepth 2 -type f -name "50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch" 2>/dev/null | head -n 1)"
            if [ -z "${CORE_PATCH}" ]; then
              CORE_PATCH="$(find ../susfs4ksu/kernel_patches -maxdepth 2 -type f -name "*android15*6.6*.patch" 2>/dev/null | head -n 1)"
            fi
            if [ -z "${CORE_PATCH}" ]; then
              echo "❌ Could not locate SUSFS core patch in susfs4ksu/kernel_patches."
              find ../susfs4ksu/kernel_patches -maxdepth 2 -type f -name "*.patch" | sed 's|^|   - |' || true
              exit 1
            fi

            echo "✅ Applying SUSFS patch: $CORE_PATCH"
            rsync -a --ignore-missing-args ../susfs4ksu/kernel_patches/fs/ "${COMMON_DIR}/fs/" || true
            rsync -a --ignore-missing-args ../susfs4ksu/kernel_patches/include/linux/ "${COMMON_DIR}/include/linux/" || true
            (cd "$COMMON_DIR" && patch -p1 < "../$CORE_PATCH")
          fi

          echo "🧠 ZRAM LZ4..."
          # Ensure LZ4 support is enabled (usually already enabled in GKI)
          grep -q '^CONFIG_LZ4_COMPRESS=' "$DEFCONFIG"   || echo 'CONFIG_LZ4_COMPRESS=y' >> "$DEFCONFIG"
          grep -q '^CONFIG_LZ4_DECOMPRESS=' "$DEFCONFIG" || echo 'CONFIG_LZ4_DECOMPRESS=y' >> "$DEFCONFIG"
          grep -q '^CONFIG_DECOMPRESS_LZ4=' "$DEFCONFIG" || echo 'CONFIG_DECOMPRESS_LZ4=y' >> "$DEFCONFIG"
          grep -q '^CONFIG_RD_LZ4=' "$DEFCONFIG"         || echo 'CONFIG_RD_LZ4=y' >> "$DEFCONFIG"
          echo 'CONFIG_ZRAM=y' >> "$DEFCONFIG"
          echo 'CONFIG_ZRAM_DEF_COMP_LZ4=y' >> "$DEFCONFIG"
          echo 'CONFIG_ZRAM_DEF_COMP="lz4"' >> "$DEFCONFIG"

          echo "🌐 BBR support..."
          if [ "${{ github.event.inputs.bbr }}" = "On" ]; then
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$DEFCONFIG"
            echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"
            echo "CONFIG_NET_SCH_FQ=y" >> "$DEFCONFIG"
          fi

          echo "🕊️ HMBird / TTL patches..."
          if [ "${{ github.event.inputs.HMBIRD }}" = "On" ]; then
            # If your kernel_patches repo includes HMBird patches, apply them; otherwise skip safely
            if [ -d "../kernel_patches/hmbird" ]; then
              for p in $(find ../kernel_patches/hmbird -maxdepth 1 -type f -name "*.patch" | sort); do
                echo "  -> $p"
                (cd "$COMMON_DIR" && git apply --whitespace=nowarn "$p") || (echo "❌ failed: $p" && exit 1)
              done
            else
              echo "No HMBird folder found in kernel_patches; skipping."
            fi
          fi

          if [ "${{ github.event.inputs.TTL }}" = "On" ]; then
            if [ -d "../kernel_patches/ttl" ]; then
              for p in $(find ../kernel_patches/ttl -maxdepth 1 -type f -name "*.patch" | sort); do
                echo "  -> $p"
                (cd "$COMMON_DIR" && git apply --whitespace=nowarn "$p") || (echo "❌ failed: $p" && exit 1)
              done
            else
              echo "No TTL folder found in kernel_patches; skipping."
            fi
          fi

          # ✅ Hard guard: if BBG is OFF, remove baseband_guard from CONFIG_LSM if present
          if [ "${{ github.event.inputs.bbg }}" = "Off" ]; then
            sed -i 's/baseband_guard//g; s/,,/,/g; s/,"/"/g; s/",,/",/g' "$DEFCONFIG" || true
            sed -i '/^CONFIG_BBG=/d' "$DEFCONFIG" || true
            sed -i '/^CONFIG_SECURITY_BASEBAND_GUARD=/d' "$DEFCONFIG" || true
            sed -i '/^CONFIG_BASEBAND_GUARD=/d' "$DEFCONFIG" || true
          fi

          echo "✅ Defconfig ready"

      - name: 🔨 Build Kernel
        run: |
          set -e
          echo "🏗️ Starting kernel build..."
          export PATH="/usr/lib/ccache:$HOME/toolchains/neutron-clang/bin:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export HOSTCC=gcc
          export HOSTCXX=g++
          export CC="ccache clang"

          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

          # 1) Generate config
          make O=out gki_defconfig

          # 2) Enforce terminal/PTy options in FINAL out/.config (prevents false checks + fixes terminals)
          if [ -x "./scripts/config" ]; then
            ./scripts/config --file out/.config               -e TTY -e PTY -e UNIX98_PTYS -e DEVPTS_FS -e DEVPTS_MULTIPLE_INSTANCES               -e DEVTMPFS -e DEVTMPFS_MOUNT
            if [ "${{ github.event.inputs.bbg }}" = "Off" ]; then
              ./scripts/config --file out/.config -d BBG || true
            fi
          fi

          # Remove baseband_guard from CONFIG_LSM if BBG is OFF
          if [ "${{ github.event.inputs.bbg }}" = "Off" ]; then
            sed -i 's/baseband_guard//g; s/,,/,/g; s/,"/"/g; s/",,/",/g' out/.config || true
          fi

          make O=out olddefconfig

          echo "---- Terminal config in final .config ----"
          grep -E "^(CONFIG_TTY=|CONFIG_PTY=|CONFIG_UNIX98_PTYS=|CONFIG_DEVPTS_FS=|CONFIG_DEVPTS_MULTIPLE_INSTANCES=|CONFIG_DEVTMPFS=|CONFIG_DEVTMPFS_MOUNT=)" out/.config || true
          echo "---- CONFIG_LSM ----"
          grep -E '^CONFIG_LSM=' out/.config || true
          echo "-----------------------------------------"

          # 3) Build
          EXTRA=""
          if [ -n "${RUSTC_BIN:-}" ]; then EXTRA="$EXTRA RUSTC=$RUSTC_BIN"; fi
          if [ -n "${PAHOLE_BIN:-}" ]; then EXTRA="$EXTRA PAHOLE=$PAHOLE_BIN"; fi

          echo "Using EXTRA tools: $EXTRA"
          make -j"$(nproc --all)" O=out KCFLAGS+=-O2 $EXTRA all 2>&1 | tee build.log

          test -f out/arch/arm64/boot/Image

      - name: 📦 Package AnyKernel3
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -rf AnyKernel3
          git clone --depth=1 -b "$ANYKERNEL_BRANCH" "$ANYKERNEL_REPO" AnyKernel3
          cp "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/out/arch/arm64/boot/Image" AnyKernel3/Image

          SUFFIX="${{ github.event.inputs.kernel_suffix }}"
          SUFFIX="${SUFFIX// /_}"
          ZIP_NAME="OP13-SukiSUUltra-${{ github.event.inputs.PROFILE }}"
          if [ -n "$SUFFIX" ]; then
            ZIP_NAME="${ZIP_NAME}-${SUFFIX}"
          fi

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}.zip" . -x ".git/*" ".github/*"
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}.zip" >> "$GITHUB_ENV"

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}

      - name: 🧾 Upload kernel configs (debug)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-configs
          path: |
            ${{ github.workspace }}/kernel_workspace/kernel_platform/common/arch/arm64/configs/gki_defconfig
            ${{ github.workspace }}/kernel_workspace/kernel_platform/common/out/.config
            ${{ github.workspace }}/kernel_workspace/kernel_platform/common/build.log
