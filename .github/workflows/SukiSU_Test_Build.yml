name: KSU
'on':
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "repo manifest URL (kernel source)"
        required: true
        default: "https://github.com/mrcxlinux/actions_oplus_sm8750.git"
      MANIFEST_BRANCH:
        description: "manifest branch"
        required: true
        default: "main"
      FETCH_TAGS:
        description: "Fetch git tags (needed for nicer localversion strings)"
        type: choice
        required: true
        default: "On"
        options:
          - "On"
          - "Off"
      LOCALVERSION_SUFFIX:
        description: "Appended to kernel version (written to common/localversion)"
        required: true
        default: "-abogki428889875-4k"
      SUSFS:
        description: "Enable SuSFS patchset"
        type: choice
        required: true
        default: "Off"
        options:
          - "Off"
          - "On"
      KSU_REF:
        description: "KernelSU-Next ref (tag/branch/commit). Leave blank for latest tag. If SUSFS=On and blank, uses dev_susfs."
        required: false
        default: ""
      FORCE_LZ4_ZRAM:
        description: "Force ZRAM to use LZ4 (best-effort)"
        type: choice
        required: true
        default: "Off"
        options:
          - "Off"
          - "On"
      PERF_PROFILE:
        description: "Artifact label only (doesn't change configs by itself)"
        type: choice
        required: true
        default: "balanced"
        options:
          - "balanced"
          - "performance"
          - "powersave"

jobs:
  build:
    name: "OP13 KSUN build"
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git gnupg gperf jq \
            libelf-dev libncurses-dev libssl-dev lz4 python3 python3-pip rsync \
            unzip zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo
          repo --version
          ccache --version || true

      - name: Sync kernel source (repo)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          repo init -u "${{ inputs.MANIFEST_URL }}" -b "${{ inputs.MANIFEST_BRANCH }}"
          if [[ "${{ inputs.FETCH_TAGS }}" == "Off" ]]; then
            repo sync -c -j"$(nproc)" --no-tags --force-sync --no-clone-bundle
          else
            repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle
          fi
          test -d kernel_platform/common

      - name: Set localversion suffix
        shell: bash
        run: |
          set -euo pipefail
          COMMON_DIR="${GITHUB_WORKSPACE}/kernel_workspace/kernel_platform/common"
          echo "${{ inputs.LOCALVERSION_SUFFIX }}" > "${COMMON_DIR}/localversion"
          sed -i 's/-dirty//g' "${COMMON_DIR}/scripts/setlocalversion" || true
          echo "localversion=$(cat "${COMMON_DIR}/localversion")"

      - name: Apply SuSFS patch (optional)
        if: ${{ inputs.SUSFS == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}/kernel_workspace"
          COMMON="${WS}/kernel_platform/common"

          rm -rf "${WS}/susfs4ksu"
          git clone --depth 1 --branch gki-android15-6.6 https://gitlab.com/simonpunk/susfs4ksu.git "${WS}/susfs4ksu"

          PATCH="${WS}/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch"
          if [[ ! -f "$PATCH" ]]; then
            echo "::error::SuSFS patch not found at $PATCH"
            exit 1
          fi

          cd "$COMMON"
          echo "Applying: $PATCH"
          git apply --3way "$PATCH" || (echo "::warning::git apply failed; trying patch(1) with fuzz" && patch -p1 --fuzz=3 < "$PATCH")

          if find . -name "*.rej" -o -name "*.orig" | grep -q .; then
            echo "::error::Patch produced reject/orig files. Fix conflicts."
            find . -name "*.rej" -o -name "*.orig" -maxdepth 6 -print || true
            exit 1
          fi

          for f in fs/susfs.c include/linux/susfs_def.h include/linux/susfs.h; do
            [[ -f "$f" ]] || { echo "::error::Missing $f after patch"; exit 1; }
          done

          echo "✅ SuSFS patch applied"

      - name: Integrate KernelSU Next
        shell: bash
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}/kernel_workspace"
          KP="${WS}/kernel_platform"
          cd "$KP"

          KSU_REF="${{ inputs.KSU_REF }}"
          if [[ "${{ inputs.SUSFS }}" == "On" && -z "$KSU_REF" ]]; then
            KSU_REF="dev_susfs"
          fi

          # Optional: if KSU_REF looks like a branch/tag name but doesn't exist, fall back to latest tag.
          if [[ -n "$KSU_REF" && "$KSU_REF" != [0-9a-fA-F]* ]]; then
            if ! git ls-remote --exit-code --heads https://github.com/KernelSU-Next/KernelSU-Next.git "$KSU_REF" >/dev/null 2>&1 \
               && ! git ls-remote --exit-code --tags  https://github.com/KernelSU-Next/KernelSU-Next.git "$KSU_REF" >/dev/null 2>&1; then
              echo "::warning::KernelSU-Next ref '$KSU_REF' not found as branch/tag; falling back to latest tag."
              KSU_REF=""
            fi
          fi

          echo "Using KernelSU-Next ref: ${KSU_REF:-<latest-tag>}"
          curl -fsSL https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh -o /tmp/ksu_setup.sh
          head -n 1 /tmp/ksu_setup.sh | grep -q "#!" || { echo "::error::Downloaded setup.sh doesn't look like a script"; exit 1; }

          if [[ -n "$KSU_REF" ]]; then
            bash /tmp/ksu_setup.sh "$KSU_REF"
          else
            bash /tmp/ksu_setup.sh
          fi

          test -d "${KP}/KernelSU-Next" || { echo "::error::KernelSU-Next directory missing"; exit 1; }
          echo "✅ KernelSU-Next integrated"

      - name: Configure kernel (defconfig + options)
        shell: bash
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}/kernel_workspace"
          KP="${WS}/kernel_platform"
          COMMON="${KP}/common"
          OUT="${COMMON}/out"

          export PATH="${KP}/prebuilts/clang/host/linux-x86/clang-stable/bin:${KP}/prebuilts/kernel-build-tools/linux-x86/bin:${PATH}"
          echo "clang=$(command -v clang)"
          echo "ld.lld=$(command -v ld.lld)"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          make -C "$COMMON" O="$OUT" ARCH=arm64 gki_defconfig

          CFG="${OUT}/.config"
          SCONF="${COMMON}/scripts/config"

          "$SCONF" --file "$CFG" -e KSU || true

          if [[ "${{ inputs.SUSFS }}" == "On" ]]; then
            "$SCONF" --file "$CFG" -e KSU_SUSFS || true
            "$SCONF" --file "$CFG" -e KSU_SUSFS_SUS_PATH || true
            "$SCONF" --file "$CFG" -e KSU_SUSFS_SUS_MOUNT || true
            "$SCONF" --file "$CFG" -e KSU_SUSFS_SUS_KSTAT || true
            "$SCONF" --file "$CFG" -e KSU_SUSFS_ENABLE_LOG || true
          fi

          if [[ "${{ inputs.FORCE_LZ4_ZRAM }}" == "On" ]]; then
            "$SCONF" --file "$CFG" -e ZRAM || true
            "$SCONF" --file "$CFG" -e CRYPTO_LZ4 || true
            "$SCONF" --file "$CFG" -e LZ4_COMPRESS || true
            "$SCONF" --file "$CFG" -e LZ4_DECOMPRESS || true
            "$SCONF" --file "$CFG" -e ZRAM_DEF_COMP_LZ4 || true
            "$SCONF" --file "$CFG" --set-str ZRAM_DEF_COMP lz4 || true
          fi

          make -C "$COMMON" O="$OUT" ARCH=arm64 olddefconfig

          echo "---- Key config flags ----"
          egrep -n "CONFIG_KSU=|CONFIG_KSU_SUSFS|CONFIG_ZRAM|CONFIG_ZRAM_DEF_COMP|CONFIG_ZRAM_DEF_COMP_LZ4" "$CFG" || true

          echo "---- Terminal/PTTY sanity ----"
          if grep -R "config DEVPTS_FS" -n "$COMMON"/fs/Kconfig* "$COMMON"/drivers/tty/Kconfig* >/dev/null 2>&1; then
            grep -n "CONFIG_DEVPTS_FS" "$CFG" || true
          else
            echo "::warning::DEVPTS symbol not present in this tree's Kconfig; skipping strict DEVPTS check."
          fi
          if grep -qE "CONFIG_UNIX98_PTYS=y|CONFIG_DEVPTS_FS=y" "$CFG"; then
            echo "✅ PTY/devpts OK"
          else
            echo "::warning::PTY/devpts config not obviously enabled (may still be fine on GKI)."
          fi

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          WS="${GITHUB_WORKSPACE}/kernel_workspace"
          KP="${WS}/kernel_platform"
          COMMON="${KP}/common"
          OUT="${COMMON}/out"

          export PATH="${KP}/prebuilts/clang/host/linux-x86/clang-stable/bin:${KP}/prebuilts/kernel-build-tools/linux-x86/bin:${PATH}"

          make -C "$COMMON" O="$OUT" ARCH=arm64 \
            CC=clang LD=ld.lld HOSTLD=ld.lld \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            -j"$(nproc)" all

          test -f "$OUT/arch/arm64/boot/Image"
          echo "✅ Build OK: $OUT/arch/arm64/boot/Image"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: OP13_KSUN_${{ inputs.PERF_PROFILE }}_SUSFS-${{ inputs.SUSFS }}_LZ4-${{ inputs.FORCE_LZ4_ZRAM }}
          path: kernel_workspace/kernel_platform/common/out/arch/arm64/boot/Image
