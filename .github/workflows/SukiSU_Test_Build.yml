name: KSU/SUKI-TEST
permissions:
  contents: write
env:
  TZ: Australia/Perth
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "🏷️ Create GitHub Release"
        required: true
        type: boolean
        default: true
      root_solution:
        description: "Root Solution"
        required: true
        default: "sukisu-ultra"
        type: choice
        options:
          - "sukisu-ultra"
          - "ksu-next"
          - "none"
      root_ref:
        description: "Root Branch/Tag (e.g. main, next, v1.0)"
        required: true
        default: "builtin"
        type: string
      clean_build:
        description: "🧼 Clean build (no ccache)"
        required: true
        type: boolean
        default: false
      optimize_level:
        description: "🧠 Optimization Level"
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      susfs_branch_or_commit:
        description: "🌿 SusFS Ref (Leave empty for auto)"
        required: false
        type: string
        default: ""
      PROFILE:
        description: "⚡ Performance Profile"
        required: true
        type: choice
        options: ["optimal", "highest", "lowest"]
        default: "optimal"
      SUSFS:
        description: "📦 Enable SuSFS"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"
      KPM:
        description: "🧩 Enable KPM"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "Off"
      bbg:
        description: "🛡️ Enable BBG"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "Off"

jobs:
  build:
    name: ${{ inputs.root_solution }} | SUSFS ${{ inputs.SUSFS }} | ${{ inputs.PROFILE }}
    # CRITICAL FIX: Use 22.04 to avoid libncurses5/dependency errors found in 24.04
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
    steps:
      - name: 🚀 Maximize Build Space
        uses: easimon/maximize-build-space@v9
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-codeql: "true"

      - name: 🔐 Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "builder@localhost"

      - name: 📦 Install Dependencies (Fixed)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip \
            python3-dev python-is-python3 device-tree-compiler

      - name: ⚙️ Setup Cache
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_op13" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_op13"

      - name: 💾 Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: kernel-ccache-${{ runner.os }}-${{ inputs.root_solution }}-${{ inputs.PROFILE }}
          restore-keys: |
            kernel-ccache-${{ runner.os }}-${{ inputs.root_solution }}-

      - name: 📥 Install Tools (Repo & Neutron)
        run: |
          # Install Repo
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          
          # Install Neutron Clang
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          bash <(curl -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S
          echo "PATH=$HOME/toolchains/neutron-clang/bin:$PATH" >> $GITHUB_ENV

      - name: ⬇️ Clone Kernel Source
        run: |
          mkdir -p kernel_workspace
          cd kernel_workspace
          # Shallow clone for speed
          repo init -u https://github.com/mrcxlinux/actions_oplus_sm8750.git -b refs/heads/zh -m manifest.xml --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

          # Clean up dirty version tags
          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion || true
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion || true

      - name: ⚡ Integrate Root & SUSFS (The Fix)
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          ROOT_SOL="${{ inputs.root_solution }}"
          ROOT_REF="${{ inputs.root_ref }}"
          
          # === 1. Install Root Solution ===
          echo "::group::Installing Root ($ROOT_SOL)"
          case "${ROOT_SOL}" in
            sukisu-ultra)
              cd common
              REF_ARG=""
              [ -n "$ROOT_REF" ] && [ "$ROOT_REF" != "builtin" ] && REF_ARG="-s $ROOT_REF"
              curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash $REF_ARG
              cd ..
              KSU_DIR="./common/KernelSU"
              ;;
            ksu-next)
              cd common
              REF_ARG=""
              [ -n "$ROOT_REF" ] && [ "$ROOT_REF" != "builtin" ] && [ "$ROOT_REF" != "next" ] && REF_ARG="-s $ROOT_REF"
              curl -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash $REF_ARG
              cd ..
              # Detect folder name (Next can be KernelSU-Next or KernelSU)
              if [ -d "./common/KernelSU-Next" ]; then KSU_DIR="./common/KernelSU-Next"; else KSU_DIR="./common/KernelSU"; fi
              ;;
            none)
              KSU_DIR=""
              ;;
          esac
          echo "KSU_DIR=${KSU_DIR}" >> "$GITHUB_ENV"
          echo "::endgroup::"

          # === 2. Install SusFS Patches ===
          if [ "${{ inputs.SUSFS }}" == "On" ]; then
            echo "::group::Setting up SusFS"
            
            # Clone SusFS Repo
            cd "$GITHUB_WORKSPACE/kernel_workspace"
            SUSFS_REF="${{ inputs.susfs_branch_or_commit }}"
            [ -z "$SUSFS_REF" ] && SUSFS_REF="gki-${ANDROID_VERSION}-${KERNEL_VERSION}"
            
            git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
            cd susfs4ksu
            git fetch --depth=1 origin "${SUSFS_REF}" || true
            git checkout "${SUSFS_REF}" || git checkout -B susfs_ref "origin/${SUSFS_REF}" || true
            cd ..

            COMMON_DIR="./kernel_platform/common"
            
            # Apply Core Patch to Kernel
            CORE_PATCH=$(find susfs4ksu/kernel_patches -name "50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch" | head -n 1)
            # Fallback search
            [ -z "$CORE_PATCH" ] && CORE_PATCH=$(find susfs4ksu/kernel_patches -name "50_add_susfs_in_gki-android*-6.6*.patch" | head -n 1)

            if [ -f "$CORE_PATCH" ]; then
               echo "Applying Core Patch: $CORE_PATCH"
               # Check if already applied to avoid error
               if grep -q "susfs_init" "$COMMON_DIR/fs/dcache.c"; then
                  echo "⚠️ Core patch seems already applied. Skipping."
               else
                  patch -d "$COMMON_DIR" -p1 < "$CORE_PATCH" || echo "❌ Patch failed (might be partial)"
                  # Sync files regardless
                  rsync -a susfs4ksu/kernel_patches/fs/ "$COMMON_DIR/fs/"
                  rsync -a susfs4ksu/kernel_patches/include/linux/ "$COMMON_DIR/include/linux/"
               fi
            fi

            # === 3. SMART PATCHING FOR KSU (Fixing the redefinition error) ===
            if [ "$ROOT_SOL" != "none" ] && [ -d "$COMMON_DIR/$KSU_DIR" ]; then
               echo "Checking KernelSU for existing SusFS hooks..."
               SUCOMPAT="$COMMON_DIR/$KSU_DIR/sucompat.c"
               
               # The Check: Does sucompat.c already have SusFS code?
               if grep -q "ksu_susfs" "$SUCOMPAT" || grep -q "susfs_" "$SUCOMPAT"; then
                  echo "✅ SUSFS detected in KernelSU. Skipping 'enable_susfs' patch to prevent redefinition errors."
               else
                  echo "⚡ Patching KernelSU with SusFS support..."
                  ENABLE_PATCH=$(find susfs4ksu/kernel_patches -name "*enable_susfs_for_ksu.patch" | head -n 1)
                  if [ -f "$ENABLE_PATCH" ]; then
                     patch -d "$COMMON_DIR/$KSU_DIR" -p1 < "$ENABLE_PATCH"
                  else
                     echo "⚠️ Enable patch not found!"
                  fi
               fi
            fi
            echo "::endgroup::"
          fi
          
          # Fix LZ4 assembler path (Standard fix for OP13)
          cp "$GITHUB_WORKSPACE/kernel_workspace/kernel_patches/zram/lz4armv8.S" "$COMMON_DIR/lib/lz4/lz4armv8.S" 2>/dev/null || true
          mkdir -p "$COMMON_DIR/lib/lz4/lz4armv8"
          cp "$GITHUB_WORKSPACE/kernel_workspace/kernel_patches/zram/lz4armv8.S" "$COMMON_DIR/lib/lz4/lz4armv8/lz4armv8.S" 2>/dev/null || true

      - name: ⚙️ Configure Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          
          # Function to safely update config
          update_config() {
            # Remove existing entries
            sed -i "/$1/d" arch/arm64/configs/gki_defconfig
            # Add new entry
            echo "$1=$2" >> arch/arm64/configs/gki_defconfig
          }
          
          # 1. Root Config
          if [ "${{ inputs.root_solution }}" != "none" ]; then
             update_config "CONFIG_KSU" "y"
          fi

          # 2. SusFS Config
          if [ "${{ inputs.SUSFS }}" == "On" ]; then
             update_config "CONFIG_KSU_SUSFS" "y"
             update_config "CONFIG_KSU_SUSFS_SUS_PATH" "y"
             update_config "CONFIG_KSU_SUSFS_SUS_MOUNT" "y"
             update_config "CONFIG_KSU_SUSFS_SUS_KSTAT" "y"
             update_config "CONFIG_KSU_SUSFS_SUS_OVERLAYFS" "y"
             update_config "CONFIG_KSU_SUSFS_TRY_UMOUNT" "y"
             update_config "CONFIG_KSU_SUSFS_SPOOF_UNAME" "y"
             update_config "CONFIG_KSU_SUSFS_ENABLE_LOG" "y"
             update_config "CONFIG_KSU_SUSFS_OPEN_REDIRECT" "y"
          else
             update_config "CONFIG_KSU_SUSFS" "n"
          fi
          
          # 3. Optimization
          if [ "${{ inputs.optimize_level }}" == "O3" ]; then
             update_config "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE" "y"
             update_config "CONFIG_CC_OPTIMIZE_FOR_SIZE" "n"
          fi

      - name: 🔨 Build Kernel
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          
          # Reset Out directory if clean build
          if [ "${{ inputs.clean_build }}" == "true" ]; then
             rm -rf out
             ccache -C
          fi

          # Build Command
          make -j$(nproc --all) \
            LLVM=1 \
            LLVM_IAS=1 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            LD=ld.lld \
            O=out \
            gki_defconfig all

      - name: 📦 Package Kernel (AnyKernel3)
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone https://github.com/mrcxlinux/AnyKernel3 --depth=1
          rm -rf AnyKernel3/.git
          
          # Find Image
          IMG=$(find kernel_workspace/kernel_platform/common/out -name Image | head -n 1)
          if [ -f "$IMG" ]; then
             echo "✅ Found Image at $IMG"
             cp "$IMG" AnyKernel3/
          else
             echo "❌ Image not found! Build failed?"
             exit 1
          fi

          # Optional KPM Patching
          if [ "${{ inputs.KPM }}" == "On" ]; then
             cd AnyKernel3
             curl -L -o patch_linux https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.13.0/patch_linux
             chmod +x patch_linux
             ./patch_linux
             mv oImage Image
             rm patch_linux
             cd ..
          fi

          # Zip It
          cd AnyKernel3
          zip -r9 "../Kernel-${{ inputs.PROFILE }}-${{ inputs.root_solution }}.zip" ./*

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.PROFILE }}-${{ inputs.root_solution }}
          path: Kernel-*.zip

      - name: 🚀 Release
        if: inputs.make_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Build-${{ github.run_number }}
          files: Kernel-*.zip
