name: OP13 KernelSU-Next

env:
  TZ: UTC
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"  # label (major.minor). Actual release (e.g. 6.6.89) is detected at build time.
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k

on:
  workflow_dispatch:
    inputs:
      SUSFS:
        description: "Enable SUSFS (recommended for module compatibility)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"

      ksunext_multimanager:
        description: "Enable KernelSU-Next Multi-Manager support patch (skip if it does not apply cleanly)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "Off"

      hmbird:
        description: "Enable OnePlus HMBIRD patches (WildKernels)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"

      ttl:
        description: "Enable netfilter TTL target (WildKernels)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"

      ipset:
        description: "Enable IP_SET + xt_set (WildKernels)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"

      bbg:
        description: "Enable Baseband Guard (BBG)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"

      bbr:
        description: "Enable TCP BBR congestion control (usually no benefit on mobile)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "Off"

      adios:
        description: "Enable ADIOS I/O scheduler (optional)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"

      rekernel:
        description: "Enable ReKernel support (optional)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "Off"

      proxy:
        description: "Enable proxy/networking helpers (includes extra netfilter options)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "Off"

      UNICODE_BYPASS:
        description: "Enable Unicode Bypass patches (optional)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "Off"

      kernel_suffix:
        description: "Kernel localversion suffix (e.g. OP-WILD, OP-OX)"
        required: true
        type: string
        default: "OP-OX"

      BUILD_TIME:
        description: "Build timestamp. Use 'auto' for commit-time (recommended), or provide: 'Fri Jan 23 13:09:51 UTC 2026'"
        required: true
        type: string
        default: "auto"

      MAKE_RELEASE:
        description: "Create a GitHub Release with the flashable zip (recommended; avoids nested artifact zip issues)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"

      toolchain:
        description: "Toolchain to use when clang prebuilts are missing from the synced tree"
        required: true
        type: choice
        options: ["aosp", "neutron"]
        default: "aosp"

permissions:
  contents: write

jobs:
  build:
    name: Build OP13 KernelSU-Next (Ultimate)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize build space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          sudo apt-get clean || true
          df -h

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++ gcc git gperf \
            libelf-dev libssl-dev lld llvm make ninja-build \
            python3 python3-pip rsync unzip wget zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            zstd \
            ca-certificates \
            gnupg \
            jq
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python3 1

      - name: Setup repo tool
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Setup ccache
        run: |
          set -euo pipefail
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=true" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESSLEVEL=6" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=8G" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          ccache -M 8G
          ccache -z || true

      - name: Clone kernel source (manifest)
        run: |
          set -euo pipefail

          mkdir -p kernel_workspace
          cd kernel_workspace

          REPO_URL="https://github.com/mrcxlinux/actions_oplus_sm8750.git"
          MANIFEST_FILE="manifest.xml"

          # The 'english' branch currently doesn't ship manifest.xml, so we auto-select a branch that contains it.
          pick_manifest_branch() {
            for b in english zh main master; do
              if curl -fsSL "https://raw.githubusercontent.com/mrcxlinux/actions_oplus_sm8750/${b}/${MANIFEST_FILE}" -o /dev/null; then
                echo "$b"
                return 0
              fi
            done
            return 1
          }

          MANIFEST_BRANCH="$(pick_manifest_branch)"
          if [ -z "${MANIFEST_BRANCH:-}" ]; then
            echo "::error::manifest.xml not found on any known branch of mrcxlinux/actions_oplus_sm8750"
            exit 1
          fi

          echo "Using manifest branch: ${MANIFEST_BRANCH}"
          repo init -u "$REPO_URL" -b "$MANIFEST_BRANCH" -m "$MANIFEST_FILE" --depth=1
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle

      - name: Setup toolchain (auto-detect or download)
        shell: bash
        run: |
          set -euo pipefail
          echo "Selected toolchain: ${{ github.event.inputs.toolchain }}"
          
          # 1) Prefer clang prebuilts shipped with the synced tree (paths vary across manifests)
          CANDIDATES=(
          "$GITHUB_WORKSPACE/kernel_workspace/prebuilts/clang/host/linux-x86/clang-r510928"
          "$GITHUB_WORKSPACE/kernel_workspace/prebuilts/clang/host/linux-x86"
          "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928"
          "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86"
          "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/prebuilts/clang/host/linux-x86/clang-r510928"
          "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/prebuilts/clang/host/linux-x86"
          )
          
          FOUND=""
          for p in "${CANDIDATES[@]}"; do
          if [[ -x "$p/bin/clang" ]]; then
          FOUND="$p"
          break
          fi
          done
          
          if [[ -n "$FOUND" ]]; then
          echo "Using tree clang at: $FOUND"
          echo "PATH=$FOUND/bin:$PATH" >> "$GITHUB_ENV"
          else
          echo "Tree clang prebuilts not found; downloading toolchain..."
          mkdir -p "$HOME/toolchains"
          
          if [[ "${{ github.event.inputs.toolchain }}" == "neutron" ]]; then
          # Neutron clang (requires ubuntu-24.04 runner due to glibc)
          git clone --depth=1 https://github.com/Neutron-Toolchains/clang.git "$HOME/toolchains/neutron-clang"
          echo "PATH=$HOME/toolchains/neutron-clang/bin:$PATH" >> "$GITHUB_ENV"
          else
          # AOSP prebuilt clang (matches WildKernels style; pick r510928 when available)
          git clone --depth=1 --filter=blob:none https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 "$HOME/toolchains/aosp-clang"
          BASE="$HOME/toolchains/aosp-clang"
          if [[ -d "$BASE/clang-r510928" ]]; then
          CLANG_DIR="$BASE/clang-r510928"
          else
          CLANG_DIR="$(ls -d "$BASE"/clang-* 2>/dev/null | sort | tail -n 1 || true)"
          fi
          if [[ -z "${CLANG_DIR:-}" || ! -x "$CLANG_DIR/bin/clang" ]]; then
          echo "::error::AOSP clang folder not found or clang not executable under $BASE"
          ls -la "$BASE" || true
          exit 1
          fi
          echo "Using AOSP clang at: $CLANG_DIR"
          echo "PATH=$CLANG_DIR/bin:$PATH" >> "$GITHUB_ENV"
          fi
          fi
          
          echo "clang path: $(command -v clang || true)"
          clang --version
      - name: Setup KernelSU-Next (stable)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

          # Run the official setup script from within kernel_platform (expects ./common/).
          curl -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/stable/kernel/setup.sh" | bash -s stable
          # Record version + commit (used for naming).
          KSUVER=""
          # Try common version variables across KernelSU-Next revisions
          for f in "KernelSU-Next/kernel/Makefile" "KernelSU-Next/Makefile" "KernelSU-Next/kernel/Makefile.kernelsu"; do
            if [ -f "$f" ]; then
              v="$(grep -Eo '(DKSU_VERSION|KSU_VERSION|KSUN_VERSION)[[:space:]]*[:?+]?=[[:space:]]*[0-9]+' \"$f\" | head -n1 | grep -Eo '[0-9]+' | head -n1 || true)"
              if [ -n "$v" ]; then KSUVER="$v"; break; fi
            fi
          done
          # Fallback: parse from git tag like v32966 if present
          if [ -z "$KSUVER" ]; then
            tag="$(git -C KernelSU-Next tag --points-at HEAD 2>/dev/null | head -n1 || true)"
            KSUVER="$(echo "$tag" | grep -Eo '[0-9]+' || true)"
          fi
          KSUVER="${KSUVER:-unknown}"
          KSU_COMMIT="$(git -C KernelSU-Next rev-parse --short=8 HEAD)"
          # Sanitize (GITHUB_ENV cannot accept multiline values)
          KSUVER="$(printf '%s\n' "$KSUVER" | head -n1 | tr -cd '0-9')"
          if [ -z "$KSUVER" ]; then KSUVER="unknown"; fi
          KSU_COMMIT="$(printf '%s\n' "$KSU_COMMIT" | head -n1 | tr -d '\r')"
          echo "KSUVER=$KSUVER" >> "$GITHUB_ENV"
          echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"

          # Optional: apply Multi-Manager support patch (best-effort).
          if [ "${{ github.event.inputs.ksunext_multimanager }}" = "On" ]; then
            echo "Applying Multi-Manager patch (best-effort)..."
            cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/KernelSU-Next"
            curl -fsSL "https://raw.githubusercontent.com/mrcxlinux/kernel_patches/main/ksun/kernelsu-next_multimanager.patch" -o "kernelsu-next_multimanager.patch"

            apply_patch() {
              local p="$1"
              if git apply -p1 --check "$p" >/dev/null 2>&1; then
                git apply -p1 -3 --whitespace=nowarn "$p"
                echo "✅ Applied: $(basename "$p")"
                return 0
              fi
              if git apply -p1 -R --check "$p" >/dev/null 2>&1; then
                echo "ℹ️ Already applied: $(basename "$p")"
                return 0
              fi
              patch -p1 --forward --batch --silent < "$p" >/dev/null 2>&1 || true
              if git apply -p1 -R --check "$p" >/dev/null 2>&1; then
                echo "✅ Applied (fallback): $(basename "$p")"
              else
                echo "⚠️ Skipped (does not apply cleanly): $(basename "$p")"
              fi
              return 0
            }

            apply_patch "kernelsu-next_multimanager.patch"
          fi

      - name: Setup SUSFS + WildKernels patches
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

          # Helper: apply patch without failing the workflow.
          apply_patch() {
            local p="$1"
            if [ ! -f "$p" ]; then
              echo "⚠️ Missing patch: $p"
              return 0
            fi
            if git apply -p1 --check "$p" >/dev/null 2>&1; then
              git apply -p1 -3 --whitespace=nowarn "$p"
              echo "✅ Applied: $(basename "$p")"
              return 0
            fi
            if git apply -p1 -R --check "$p" >/dev/null 2>&1; then
              echo "ℹ️ Already applied: $(basename "$p")"
              return 0
            fi
            patch -p1 --forward --batch --silent < "$p" >/dev/null 2>&1 || true
            if git apply -p1 -R --check "$p" >/dev/null 2>&1; then
              echo "✅ Applied (fallback): $(basename "$p")"
            else
              echo "⚠️ Skipped (does not apply cleanly): $(basename "$p")"
            fi
            return 0
          }

          # Clone patch repos (public, no auth prompts).
          rm -rf susfs4ksu mrcx_patches wildkernel_patches || true
          git clone --depth=1 -b gki-android15-6.6 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          git clone --depth=1 https://github.com/mrcxlinux/kernel_patches.git mrcx_patches
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git wildkernel_patches

          # Apply SUSFS (best-effort, matches android15/6.6 trees).
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            echo "Applying SUSFS patches..."
            cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
            apply_patch "../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch" || true
            # Extra SUSFS files (best-effort; only if paths exist)
            rsync -a ../susfs4ksu/kernel_patches/fs/ fs/ 2>/dev/null || true
            rsync -a ../susfs4ksu/kernel_patches/include/linux/ include/linux/ 2>/dev/null || true
          fi

          # ZRAM (LZ4/ZSTD) optional patches from mrcxlinux (best-effort).
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          # Fix overwriter script permissions (avoid convert_configs.sh permission denied)
          if [[ -d "drivers/of/overwriter/overwrite_configs" ]]; then
            echo "Fixing overwriter scripts permissions..."
            chmod -R u+rx,go+rx drivers/of/overwriter/overwrite_configs || true
            find drivers/of/overwriter/overwrite_configs -maxdepth 1 -type f -name "*.sh" -exec chmod +x {} \; || true
            # Strip CRLF (portable)
            find drivers/of/overwriter/overwrite_configs -maxdepth 1 -type f -name "*.sh" -exec perl -pi -e 's/\\r$//' {} \\; || true
          fi

          apply_patch "../mrcx_patches/zram/001-lz4.patch"
          apply_patch "../mrcx_patches/zram/002-zstd.patch"
          # If asm source exists in repo, copy it (best-effort)
          if [ -f "../mrcx_patches/zram/lz4armv8.S" ]; then
            mkdir -p lib/lz4/lz4armv8
            cp -f "../mrcx_patches/zram/lz4armv8.S" lib/lz4/lz4armv8.S 2>/dev/null || true
            cp -f "../mrcx_patches/zram/lz4armv8.S" lib/lz4/lz4armv8/lz4armv8.S 2>/dev/null || true
          fi

          # Unicode bypass (optional)
          if [ "${{ github.event.inputs.UNICODE_BYPASS }}" = "On" ]; then
            echo "Applying Unicode Bypass patches..."
            apply_patch "../mrcx_patches/common/unicode_bypass_fix_6.1+.patch"
            apply_patch "../mrcx_patches/common/unicode_bypass_fix.patch"
          fi

          # WildKernels: HMBIRD patches (optional; apply only if requested).
          if [ "${{ github.event.inputs.hmbird }}" = "On" ]; then
            echo "Applying WildKernels HMBIRD patches..."
            # Apply all patches in the directory (best-effort).
            if [ -d "../wildkernel_patches/oneplus/hmbird" ]; then
              for p in ../wildkernel_patches/oneplus/hmbird/*.patch; do
                [ -e "$p" ] || continue
                apply_patch "$p"
              done
            else
              echo "⚠️ WildKernels HMBIRD directory not found."
            fi
          fi

      - name: Set build identity and timestamp (mimic stock)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

          # Match WildKernels style uname identity
          echo "KBUILD_BUILD_USER=OnePlus" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=ubuntu-build" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [ -z "$INPUT_TIME" ] || [ "$INPUT_TIME" = "auto" ] || [ "$INPUT_TIME" = "AUTO" ]; then
            # Use commit time of kernel_platform/common HEAD (closest to "stock-like" deterministic timestamp)
            TS="$(git -C common log -1 --format=%ct)"
            DATESTR="$(TZ='UTC' date -u -d "@$TS" +'%a %b %d %T UTC %Y')"
            echo "Using kernel source commit time: $DATESTR"
          else
            DATESTR="$INPUT_TIME"
            echo "Using BUILD_TIME input: $DATESTR"
          fi

          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"

          # Also patch mkcompile_h where present to ensure UTS_VERSION contains the exact timestamp
          for f in common/scripts/mkcompile_h msm-kernel/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching $f UTS_VERSION..."
              perl -pi -e "s{UTS_VERSION=.*}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}g" "$f" || true
            fi
          done

      - name: Build kernel (GKI)
        run: |
          set -euo pipefail
          export PATH="/usr/lib/ccache:$PATH"

          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          # Fix overwriter script permissions (avoid convert_configs.sh permission denied)
          if [[ -d "drivers/of/overwriter/overwrite_configs" ]]; then
            echo "Fixing overwriter scripts permissions..."
            chmod -R u+rx,go+rx drivers/of/overwriter/overwrite_configs || true
            find drivers/of/overwriter/overwrite_configs -maxdepth 1 -type f -name "*.sh" -exec chmod +x {} \; || true
            find drivers/of/overwriter/overwrite_configs -maxdepth 1 -type f -name "*.sh" -exec perl -pi -e 's/\\r$//' {} \; || true
          fi

          mkdir -p out

          # Use prebuilts shipped with the manifest when available (more compatible than system packages).
          if [ -d "$GITHUB_WORKSPACE/kernel_workspace/prebuilts/rust/linux-x86/1.73.0/bin" ]; then
            echo "$GITHUB_WORKSPACE/kernel_workspace/prebuilts/rust/linux-x86/1.73.0/bin" >> "$GITHUB_PATH"
          fi
          if [ -f "$GITHUB_WORKSPACE/kernel_workspace/prebuilts/kernel-build-tools/linux-x86/bin/pahole" ]; then
            sudo cp -f "$GITHUB_WORKSPACE/kernel_workspace/prebuilts/kernel-build-tools/linux-x86/bin/pahole" /usr/local/bin/pahole
            sudo chmod +x /usr/local/bin/pahole
          fi

          # Build (same structure as your original workflow; keep it close to stock for stability)
          make -j"$(nproc --all)" \
            LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD=ld.lld HOSTLD=ld.lld \
            O=out \
            KCFLAGS+=-O2 \
            gki_defconfig

          # Apply feature toggles safely via scripts/config (no defconfig file editing)
          CFG="out/.config"
          if [[ ! -f "$CFG" ]]; then
            echo "::error::.config not found at $PWD/$CFG"; exit 1
          fi
          if [[ ! -x "./scripts/config" ]]; then
            echo "::error::scripts/config not found"; exit 1
          fi

          # Localversion suffix (cosmetic)
          SUFFIX_INPUT="${{ github.event.inputs.kernel_suffix }}"
          if [[ -n "$SUFFIX_INPUT" ]]; then
            ./scripts/config --file "$CFG" --set-str LOCALVERSION "-$SUFFIX_INPUT" || true
            ./scripts/config --file "$CFG" -d LOCALVERSION_AUTO || true
          fi

          # WildKernels: TMPFS_XATTR + POSIX ACL (Mountify support)
          ./scripts/config --file "$CFG" -e TMPFS_XATTR -e TMPFS_POSIX_ACL || true

          # TTL support (netfilter targets)
          if [[ "${{ github.event.inputs.ttl }}" == "On" ]]; then
            ./scripts/config --file "$CFG" -e NETFILTER -e NETFILTER_XTABLES \
              -m NETFILTER_XT_TARGET_TTL -m NETFILTER_XT_TARGET_HL || true
          else
            ./scripts/config --file "$CFG" -d NETFILTER_XT_TARGET_TTL -d NETFILTER_XT_TARGET_HL || true
          fi

          # IPSET support (netfilter ipset)
          if [[ "${{ github.event.inputs.ipset }}" == "On" ]]; then
            ./scripts/config --file "$CFG" -e NETFILTER -e NETFILTER_XTABLES \
              -m IP_SET -m IP_SET_HASH_IP -m NETFILTER_XT_SET || true
          else
            ./scripts/config --file "$CFG" -d IP_SET -d IP_SET_HASH_IP -d NETFILTER_XT_SET || true
          fi

          # Finalize config
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

          # Build all targets
          make -j"$(nproc --all)" \
            LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" LD=ld.lld HOSTLD=ld.lld \
            O=out \
            KCFLAGS+=-O2 \
            all

          ccache -s || true

          # Detect kernel release for naming
          KREL="$(make -s O=out kernelrelease 2>/dev/null || true)"
          if [ -n "$KREL" ]; then
            echo "KERNEL_RELEASE=$KREL" >> "$GITHUB_ENV"
            echo "Detected kernel release: $KREL"
          else
            echo "KERNEL_RELEASE=unknown" >> "$GITHUB_ENV"
          fi

      - name: Package AnyKernel3 flashable zip (custom banner)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          echo "Preparing AnyKernel3..."
          rm -rf AnyKernel3
          git clone --depth=1 https://github.com/mrcxlinux/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git

          IMAGE_PATH="$(find "./kernel_workspace/kernel_platform/common/out/" -type f -name "Image" | head -n 1 || true)"
          if [ -z "$IMAGE_PATH" ] || [ ! -f "$IMAGE_PATH" ]; then
            echo "::error::Kernel Image not found under common/out"
            exit 1
          fi
          cp -f "$IMAGE_PATH" ./AnyKernel3/Image

          # Set localversion suffix to help identify the build (safe; does not change ABI)
          SUFFIX="${{ github.event.inputs.kernel_suffix }}"
          if [ -n "$SUFFIX" ]; then
            # AnyKernel3 uses anykernel.sh variables; we keep suffix for filename only.
            echo "Kernel suffix for naming: $SUFFIX"
          fi

          # Replace/insert a clean English installer banner
          python3 - <<'PY'
          from pathlib import Path
          import re, os

          ak = Path("AnyKernel3/anykernel.sh")
          s = ak.read_text(encoding="utf-8", errors="ignore").splitlines()

          # Remove obvious stock banner blocks (best-effort)
          filtered = []
          skip = False
          for line in s:
              if "ui_print" in line and ("=== " in line or "KernelSU" in line or "SukiSU" in line):
                  # don't aggressively drop everything; keep later commands
                  pass
              filtered.append(line)

          tag = os.environ.get("TAG", "unknown")
          build = os.environ.get("BUILD", "unknown")

          ascii_block = (
              'ui_print "===================================================="\\n'
              'ui_print "                   __   __  __ "                     \\n'
              'ui_print "                  \\\\ \\\\ / //_ |"                    \\n'
              'ui_print "                   \\\\ V /   | |"                    \\n'
              'ui_print "                     > <    | |"                    \\n'
              'ui_print "                   / . \\\\   | |"                    \\n'
              'ui_print "                 /_/ \\\\_\\\\  |_|"                    \\n'
              'ui_print "===================================================="\\n'
          )

          banner = []
          banner.append('ui_print " "')
          banner.extend(ascii_block.strip("\\n").split("\\n"))
          banner.append('ui_print " "')
          banner.append('ui_print "PJZ110 | KernelSU-Next Kernel"')
          banner.append(f'ui_print "Kernel : {tag}"')
          banner.append(f'ui_print "Build  : {build}"')
          banner.append('ui_print "Builder: @Ox1d3x3"')
          banner.append('ui_print "Credits: @mrcxlinux, @WildKernels"')
          banner.append('ui_print " "')
          banner.append('DEVICE="$(getprop ro.product.device 2>/dev/null)"; [ -z "$DEVICE" ] && DEVICE="$(getprop ro.product.name 2>/dev/null)"')
          banner.append('PATCH="$(getprop ro.build.version.security_patch 2>/dev/null)"')
          banner.append('ANDROID="$(getprop ro.build.version.release 2>/dev/null)"')
          banner.append('SLOT_SUFFIX="$(getprop ro.boot.slot_suffix 2>/dev/null)"')
          banner.append('if [ -z "$SLOT_SUFFIX" ]; then SLOT="$(getprop ro.boot.slot 2>/dev/null)"; [ -n "$SLOT" ] && SLOT_SUFFIX="_$SLOT"; fi')
          banner.append('if [ -z "$SLOT_SUFFIX" ]; then SLOT_SUFFIX="$(grep -oE "androidboot.slot_suffix=[^ ]+" /proc/cmdline 2>/dev/null | head -n1 | cut -d= -f2)"; fi')
          banner.append('if [ -z "$SLOT_SUFFIX" ]; then SLOT="$(grep -oE "androidboot.slot=[^ ]+" /proc/cmdline 2>/dev/null | head -n1 | cut -d= -f2)"; [ -n "$SLOT" ] && SLOT_SUFFIX="_$SLOT"; fi')
          banner.append('ui_print "Device : $DEVICE"')
          banner.append('ui_print "Android: $ANDROID"')
          banner.append('ui_print "Patch  : $PATCH"')
          banner.append('if [ -n "$SLOT_SUFFIX" ]; then ui_print "Slot   : $SLOT_SUFFIX"; fi')
          banner.append('ui_print " "')
          banner.append('if [ -n "$(command -v cmd 2>/dev/null)" ]; then')
          banner.append('  (cmd activity start --user 0 -a android.intent.action.VIEW -d "https://github.com/ox1d3x3/Op13_Susfs_kernel" >/dev/null 2>&1 &) || true')
          banner.append('elif [ -n "$(command -v am 2>/dev/null)" ]; then')
          banner.append('  (am start --user 0 -a android.intent.action.VIEW -d "https://github.com/ox1d3x3/Op13_Susfs_kernel" >/dev/null 2>&1 &) || true')
          banner.append('fi')
          banner.append('ui_print " "')

          # Insert banner right after the initial header/comments and before properties()
          out = []
          inserted = False
          for line in filtered:
              out.append(line)
              if (not inserted) and re.match(r'^\s*properties\(\)\s*\{', line):
                  out.extend(banner)
                  inserted = True

          if not inserted:
              # Fallback: prepend banner at start (safe)
              out = banner + [""] + filtered

          ak.write_text("\\n".join(out) + "\\n", encoding="utf-8")
          print("Installer banner updated.")
          PY
          # Prepare tags for naming
          BUILD_ID="${{ github.run_number }}"
          KREL="${{ env.KERNEL_RELEASE }}"
          KSUVER="${{ env.KSUVER }}"
          SUSFS="${{ github.event.inputs.SUSFS }}"
          SUFFIX="${{ github.event.inputs.kernel_suffix }}"
          DATE="$(date -u +%Y%m%d-%H%M)"

          TAG="OP13_${ANDROID_VERSION}_${KREL}_KSU${KSUVER}_${SUFFIX}"
          BUILD="${DATE}_${BUILD_ID}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"

          ZIP_NAME="${TAG}_${BUILD}"
          if [ "$SUSFS" = "On" ]; then ZIP_NAME="${ZIP_NAME}_SUSFS"; fi
          ZIP_NAME="${ZIP_NAME}_FLASH_THIS.zip"

          (cd AnyKernel3 && zip -r9 "../${ZIP_NAME}" .)
          echo "FLASH_ZIP=${ZIP_NAME}" >> "$GITHUB_ENV"
          ls -lah "./${ZIP_NAME}"

      - name: Upload flashable zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FLASH_ZIP }}
          path: ${{ env.FLASH_ZIP }}

      - name: Create GitHub Release (recommended)
        if: ${{ github.event.inputs.MAKE_RELEASE == 'On' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}-${{ github.run_number }}
          name: ${{ env.TAG }} (kernel ${{ env.KERNEL_RELEASE }})
          prerelease: true
          files: ${{ env.FLASH_ZIP }}
          body: |
            **Device:** PJZ110 (OnePlus 13)
            **OS:** OOS16 / ColorOS16
            **Kernel release:** ${{ env.KERNEL_RELEASE }}
            **KernelSU-Next:** v${{ env.KSUVER }} (${{ env.KSU_COMMIT }})
            **SUSFS:** ${{ github.event.inputs.SUSFS }}
            **WildKernels:** HMBIRD=${{ github.event.inputs.hmbird }}, TTL=${{ github.event.inputs.ttl }}, IP_SET=${{ github.event.inputs.ipset }}
            **Build timestamp:** ${{ env.KBUILD_BUILD_TIMESTAMP }}
            **Build user/host:** ${{ env.KBUILD_BUILD_USER }}@${{ env.KBUILD_BUILD_HOST }}

            ⚠️ **Notes**
            - Flash the **Release asset** zip (it is not nested). Downloading an artifact creates a wrapper zip which can confuse some flashing apps.
            - If you bootloop: make sure you built from the right manifest/tag for your ROM build and try disabling optional patches (HMBIRD, zram patches, etc.).
