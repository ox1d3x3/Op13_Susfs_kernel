---
name: KSU/SUKI-Build
permissions:
  contents: write
env:
  TZ: Australia/Perth
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: "🏷️ Create GitHub Release (tagged build)"
        required: true
        type: boolean
        default: false
      root_solution:
        description: "Root implementation to integrate"
        required: true
        default: "sukisu-ultra"
        type: choice
        options:
          - "sukisu-ultra"
          - "ksu-next"
          - "none"
      root_ref:
        description: "Branch/tag/commit for the chosen root (sukisu: builtin/main; ksu-next: next/dev)"
        required: true
        default: "builtin"
        type: string
      clean_build:
        description: "🧼 Clean build (no ccache, fresh out/)"
        required: true
        type: boolean
        default: false
      optimize_level:
        description: "🧠 Compiler optimization level"
        required: true
        type: choice
        options: [O2, O3]
        default: O2
      susfs_branch_or_commit:
        description: "🌿 SusFS ref (branch or commit). Leave blank to auto-select gki-android* branch."
        required: false
        type: string
        default: ""
      PROFILE:
        description: "⚡ Performance profile (artifact naming)"
        required: true
        type: choice
        options:
          - "optimal"
          - "highest"
          - "lowest"
        default: "optimal"
      SUSFS:
        description: "📦 SuSFS Support"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "On"
      KPM:
        description: "🧩 KPM Support"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"
      bbg:
        description: "🛡️ BBG baseband protection"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"
      bbr:
        description: "📶 BBR algorithm (Has little practical benefit for everyday phone use and may even result in negative optimization)"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"
      adios_rekernel_enable:
        description: "⚙️ ADIOS I/O scheduler and Re-Kernel support"
        required: true
        type: choice
        default: "ADIOS only"
        options:
          - "none"
          - "ADIOS only"
          - "Re-Kernel only"
          - "both"
      proxy:
        description: "🌐 Proxy performance optimization"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"
      UNICODE_BYPASS:
        description: "🚀 Unicode zero-width bypass fix patch (Not recommended for higher kernel versions; it is suggested to use https://t.me/real5ec1cff/271 for a painless fix)"
        required: true
        type: choice
        options:
          - "On"
          - "Off"
        default: "Off"
      kernel_suffix:
        description: "📝 Kernel suffix (Leave empty to use the default; do not add a hyphen at the beginning, and do not include spaces or other reserved characters that may affect command execution)"
        required: false
        type: string
        default: ""
      BUILD_TIME:
        type: string
        description: "Optional. Leave blank to mimic stock build time, or set to F to use current build time."
        required: false
        default: ""
        
jobs:
  build:
    name: SUSFS ${{ github.event.inputs.SUSFS }} | BBG ${{ github.event.inputs.bbg }} | ADIOS/Re-Kernel ${{ github.event.inputs.adios_rekernel_enable }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
    steps:
      - name: 🚀 Maximize Build Space
        uses: easimon/maximize-build-space@v9
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          
      - name: ⚙️ Setup Cache Env
        run: |
          echo "🔧 Setting up device-isolated cache directory..."
          echo "CCACHE_DIR=$HOME/.ccache_SukiSU" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_SukiSU"
          
          echo "✅ Cache directory set: $HOME/.ccache_SukiSU"
          
      - name: 🔐 Configure Git
        run: |
          echo "🔧 Configuring Git user info..."
          git config --global user.name "GitHub Actions - Ox1d3x3_SUS Kernel"
          git config --global user.email "builder@localhost"
          echo "✅ Git config complete"
          
      - name: 🌐 Default Network Optimization
        run: |
          echo "CURL_OPTS=--retry 5 --retry-all-errors --connect-timeout 20 --max-time 1200" >> "$GITHUB_ENV"

          # Make APT more resilient (retries + sane timeouts)
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::http::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::https::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/80-retries

          # Git fetch speed + resilience
          git config --global protocol.version 2
          git config --global fetch.parallel 8
          git config --global submodule.fetchJobs 8
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global core.compression 0

          echo "✅ Default network optimizations enabled"

      - name: 📦 Cache & Install Dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: python3 git curl ccache libelf-dev build-essential flex bison
            libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync
            unzip gawk dos2unix
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          execute_install_scripts: true
          
      - name: 💾 Restore ccache (With SUSFS)
        if: ${{ github.event.inputs.SUSFS == 'On' && github.event.inputs.clean_build != 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref }}-SukiSU-SUSFS
          restore-keys: >
            ccache-${{ runner.os }}-SukiSU-SUSFS

            ccache-${{ runner.os }}-SukiSU-SUSFS
            
      - name: 💾 Restore ccache (Without SUSFS)
        if: ${{ github.event.inputs.SUSFS == 'Off' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref }}-SukiSU-NoSUSFS
          restore-keys: >
            ccache-${{ runner.os }}-SukiSU-NoSUSFS

            ccache-${{ runner.os }}-SukiSU-NoSUSFS
            
      - name: ⚙️ Initialize ccache
        run: |
          echo "🔧 Initializing ccache..."
          # option: clean build disables ccache usage
          if [ "${{ github.event.inputs.clean_build }}" = "true" ]; then
            export CCACHE_DISABLE=1
            echo "🧼 clean_build=true -> CCACHE_DISABLE=1"
          fi
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "✅ ccache initialized"
            else
              echo "ℹ️ ccache already initialized, skipping"
            fi
          else
            echo "⚠️ ccache not found, skipping initialization"
          fi
          # Show ccache statistics
          ccache -s
          echo "✅ ccache initialization flow complete"
          
      - name: 📥 Install Repo Tool
        run: |
          echo "⬇️ Downloading repo tool..."
          curl $CURL_OPTS -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          echo "✅ repo tool installed"
          
      - name: 📥 Install Neutron Clang Tool
        run: |
          echo "⬇️ Downloading Neutron clang tool..."
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          bash <(curl $CURL_OPTS -fsSL "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S
          echo "✅ Neutron clang tool installed"
          
      - name: "⬇️ Clone Kernel Source"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace" && cd "$GITHUB_WORKSPACE/kernel_workspace"
          
          echo "🌐 Initializing kernel repo..."
          repo init -u https://github.com/mrcxlinux/actions_oplus_sm8750.git -b refs/heads/zh -m manifest.xml --depth=1
          
          echo "🔄 Syncing repos (using $(nproc --all) threads)..."
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
          
          rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"
          
          # Remove -dirty in kernel version
          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion
          sed -i 's/ -dirty//g' kernel_platform/external/dtc/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/common/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/msm-kernel/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/external/dtc/scripts/setlocalversion
          
          echo "✅ Kernel setup complete"
          
      - name: ⚡ Setup Baseband-guard
        if: ${{ github.event.inputs.bbg == 'On' }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          
          echo "🛠️ Setting up BBG..."
          curl $CURL_OPTS -fsSL https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh -o setup.sh
          bash setup.sh 
          
      - name: ⚡ Integrate Root (SukiSU Ultra / KernelSU-Next)
        run: |
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

          ROOT_SOL="${{ github.event.inputs.root_solution }}"
          ROOT_REF="${{ github.event.inputs.root_ref }}"
          echo "🧩 Root selection: ${ROOT_SOL} (${ROOT_REF})"

          case "${ROOT_SOL}" in
            sukisu-ultra)
              cd common
              if [ -n "${ROOT_REF}" ]; then
                curl $CURL_OPTS -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "${ROOT_REF}"
              else
                curl $CURL_OPTS -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash
              fi
              cd ..
              # setup.sh clones under common/
              KSU_DIR="./common/KernelSU"
              ;;
            ksu-next)
              cd common
              # KernelSU-Next doesn't always have a "next"/"builtin" branch; treat those as "use default"
              if [ -z "${ROOT_REF}" ] || [ "${ROOT_REF}" = "next" ] || [ "${ROOT_REF}" = "builtin" ]; then
                curl $CURL_OPTS -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash
              else
                curl $CURL_OPTS -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "${ROOT_REF}"
              fi
              cd ..
              # Detect where setup.sh placed the repo (upstream differs)
              if [ -d "./common/KernelSU-Next" ]; then
                KSU_DIR="./common/KernelSU-Next"
              elif [ -d "./common/KernelSU" ]; then
                KSU_DIR="./common/KernelSU"
              else
                KSU_DIR="$(find ./common -maxdepth 2 -type d \( -name 'KernelSU*' -o -name 'SukiSU*' \) 2>/dev/null | head -n 1)"
              fi
              [ -n "${KSU_DIR:-}" ] && [ -d "${KSU_DIR:-}" ] || die "Root integration failed: could not locate root repo under ./common"
              ;;
            none)
              echo "Skipping root integration."
              KSU_DIR=""
              ;;
            *)
              echo "Unknown root_solution: ${ROOT_SOL}"
              exit 1
              ;;
          esac

          # Make KSU_DIR available to later steps
          echo "ROOT_SOL=${ROOT_SOL}" >> "$GITHUB_ENV"
          echo "KSU_DIR=${KSU_DIR}" >> "$GITHUB_ENV"

          if [ "${ROOT_SOL}" != "none" ]; then
            if [ -z "${KSU_DIR}" ] || [ ! -d "${KSU_DIR}" ]; then
              echo "::error::Root integration failed: expected ${KSU_DIR} to exist."
              echo "Debug: searching for KernelSU directories under kernel_platform..."
              find . -maxdepth 3 -type d -name "KernelSU*" -print || true
              exit 1
            fi
            if [ -d "${KSU_DIR}/.git" ]; then
              echo "Root repo HEAD: $(git -C "${KSU_DIR}" rev-parse --short=12 HEAD)"
              KSUVER="$(git -C "${KSU_DIR}" describe --tags --always --dirty 2>/dev/null || git -C "${KSU_DIR}" rev-parse --short=12 HEAD)"
              echo "Root repo tag : ${KSUVER}"
              echo "KSUVER=${KSUVER}" >> "$GITHUB_ENV"
            fi
            if [ -z "${KSUVER:-}" ]; then
              KSUVER="patched"
              echo "KSUVER=${KSUVER}" >> "$GITHUB_ENV"
            fi
          fi

          cd "$GITHUB_WORKSPACE/kernel_workspace"



          echo "⬇️ Cloning required patches..."
          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then
            # option: allow overriding SusFS ref (branch or commit)
            SUSFS_REF="${{ github.event.inputs.susfs_branch_or_commit }}"
            if [ -z "${SUSFS_REF}" ]; then
              SUSFS_REF="gki-${ANDROID_VERSION}-${KERNEL_VERSION}"
            fi

            git clone https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
            cd susfs4ksu
            # Try branch/tag first, then commit hash
            if git rev-parse --verify "origin/${SUSFS_REF}" >/dev/null 2>&1 || git ls-remote --exit-code origin "refs/heads/${SUSFS_REF}" >/dev/null 2>&1; then
              git fetch --depth=1 origin "${SUSFS_REF}" || true
              git checkout -B susfs_ref "origin/${SUSFS_REF}" || git checkout "${SUSFS_REF}"
            else
              # assume commit hash
              git fetch --depth=1 origin "${SUSFS_REF}" || true
              git checkout "${SUSFS_REF}"
            fi
            cd ..

          fi
          git clone --depth=1 https://github.com/mrcxlinux/kernel_patches.git kernel_patches

          cd kernel_platform

          COMMON_DIR="./common"
          KSU_DIR="${KSU_DIR}" # set by root selection above

          echo "📝 Copying patch files into common tree..."
          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then
            # Locate SUSFS core patch for this tree (avoid hardcoding filename)
            CORE_PATCH="$(find ../susfs4ksu/kernel_patches -maxdepth 2 -type f -name "50_add_susfs_in_gki-${ANDROID_VERSION}-${KERNEL_VERSION}.patch" 2>/dev/null | head -n 1)"
            if [ -z "${CORE_PATCH}" ]; then
              CORE_PATCH="$(find ../susfs4ksu/kernel_patches -maxdepth 2 -type f -name "50_add_susfs_in_gki-android*-6.6*.patch" 2>/dev/null | head -n 1)"
            fi
            if [ -z "${CORE_PATCH}" ]; then
              echo "❌ Could not locate SUSFS core patch (50_add_susfs_in_gki-*.patch) in susfs4ksu."
              find ../susfs4ksu/kernel_patches -maxdepth 2 -type f -name "*.patch" | sed 's|^| - |' || true
              exit 1
            fi

            cp "${CORE_PATCH}" "${COMMON_DIR}/50_add_susfs.patch"
            # Copy any extra files shipped with susfs4ksu (ignore if upstream layout changes)
            rsync -a --ignore-missing-args ../susfs4ksu/kernel_patches/fs/ "${COMMON_DIR}/fs/" || true
            rsync -a --ignore-missing-args ../susfs4ksu/kernel_patches/include/linux/ "${COMMON_DIR}/include/linux/" || true
          fi

          # LZ4 ARMv8 asm placement (fixes "No rule to make target ... lz4armv8.o")
          mkdir -p "${COMMON_DIR}/lib/lz4/lz4armv8"
          cp ../kernel_patches/zram/lz4armv8.S "${COMMON_DIR}/lib/lz4/lz4armv8/lz4armv8.S"
          cp ../kernel_patches/zram/lz4armv8.S "${COMMON_DIR}/lib/lz4/lz4armv8.S"

          # Optional performance/feature patches (kept optional: they vary across trees)
          cp ../kernel_patches/zram/001-lz4.patch "${COMMON_DIR}/" || true
          cp ../kernel_patches/zram/002-zstd.patch "${COMMON_DIR}/" || true
          cp ../kernel_patches/common/EnablePOLLY.patch "${COMMON_DIR}/" || true

          echo "---- LZ4 sanity ----"
          if [ ! -f "${COMMON_DIR}/lib/lz4/lz4armv8/lz4armv8.S" ]; then
            echo "❌ Missing ${COMMON_DIR}/lib/lz4/lz4armv8/lz4armv8.S (required by Kbuild in this tree)"
            exit 1
          fi

          apply_patch_optional() {
            local dir="$1"
            local patch="$2"
            [ -f "$patch" ] || return 0
            patch="$(realpath "$patch")"

            echo "Applying optional patch: $(basename "$patch") in $dir"
            pushd "$dir" >/dev/null

            # Already applied?
            if git apply -p1 --reverse --check "$patch" >/dev/null 2>&1 || patch -p1 -R --dry-run < "$patch" >/dev/null 2>&1; then
              echo "✅ Optional patch already applied"
              popd >/dev/null
              return 0
            fi

            if git apply -p1 --3way --whitespace=nowarn "$patch" >/dev/null 2>&1 || git apply -p1 --whitespace=nowarn "$patch" >/dev/null 2>&1; then
              echo "✅ Applied (git apply)"
              popd >/dev/null
              return 0
            fi

            if patch -p1 -l -F 3 < "$patch" >/dev/null 2>&1; then
              echo "✅ Applied (patch -F3)"
              popd >/dev/null
              return 0
            fi

            echo "⚠️ Optional patch did not apply cleanly: $(basename "$patch") (skipping)"
            popd >/dev/null
            return 0
          }

          apply_patch_required() {
            local dir="$1"
            local patch="$2"
            [ -f "$patch" ] || { echo "❌ Required patch not found: $patch"; return 1; }
            patch="$(realpath "$patch")"

            echo "Applying required patch: $(basename "$patch") in $dir"
            pushd "$dir" >/dev/null

            # Already applied?
            if git apply -p1 --reverse --check "$patch" >/dev/null 2>&1 || patch -p1 -R --dry-run < "$patch" >/dev/null 2>&1; then
              echo "✅ Patch already applied"
              popd >/dev/null
              return 0
            fi

            if git apply -p1 --3way --whitespace=nowarn "$patch" >/dev/null 2>&1 || git apply -p1 --whitespace=nowarn "$patch" >/dev/null 2>&1; then
              echo "✅ Applied (git apply)"
              popd >/dev/null
              return 0
            fi

            if patch -p1 -l -F 3 < "$patch" >/dev/null 2>&1; then
              echo "✅ Applied (patch -F3)"
              popd >/dev/null
              return 0
            fi

            echo "❌ Required patch failed: $(basename "$patch")"
            echo "---- Rejects (first 120 lines each) ----"
            find . -maxdepth 3 -name "*.rej" -print -exec sed -n '1,120p' {} \; || true
            popd >/dev/null
            return 1
          }

          echo "🔧 Applying patches to common kernel tree..."
          apply_patch_optional "${COMMON_DIR}" "${COMMON_DIR}/001-lz4.patch"
          apply_patch_optional "${COMMON_DIR}" "${COMMON_DIR}/002-zstd.patch"
          apply_patch_optional "${COMMON_DIR}" "${COMMON_DIR}/EnablePOLLY.patch"

          if [ "${{ github.event.inputs.SUSFS }}" == "On" ]; then
            echo "🔧 Applying SUSFS core patch to common..."
            apply_patch_required "${COMMON_DIR}" "${COMMON_DIR}/50_add_susfs.patch"

            echo "🔧 Ensuring KernelSU <-> SUSFS integration..."
            if [ ! -d "${KSU_DIR}" ]; then
              echo "❌ KernelSU directory not found: ${KSU_DIR}"
              exit 1
            fi

            # If KSU_SUSFS already exists, don't force-apply the enable patch (upstream may already include it).
            if grep -Rqs "config KSU_SUSFS" "${KSU_DIR}" "${COMMON_DIR}/drivers/kernelsu" 2>/dev/null; then
              echo "✅ KSU_SUSFS already present in KernelSU tree; skipping enable patch."
            else
              echo "🔧 Applying SUSFS enable patch to KernelSU (only if missing)..."

              mapfile -t ENABLE_CANDIDATES < <(find ../susfs4ksu/kernel_patches -type f -iname "*enable_susfs_for_ksu.patch" 2>/dev/null | sort)
              if [ "${#ENABLE_CANDIDATES[@]}" -eq 0 ]; then
                ENABLE_CANDIDATES=($(find ../susfs4ksu/kernel_patches -type f -iname "*enable*su*susfs*.patch" 2>/dev/null | sort))
              fi
              if [ "${#ENABLE_CANDIDATES[@]}" -eq 0 ]; then
                echo "❌ No SUSFS enable patch found in susfs4ksu/kernel_patches."
                exit 1
              fi

                            pick_enable_patch() {
                local p
                local want="${{ github.event.inputs.root_solution }}"
                if [ "${want}" = "suki-ultra" ]; then
                  for p in "${ENABLE_CANDIDATES[@]}"; do
                    echo "$p" | grep -Eqi "sukisu" && { echo "$p"; return 0; }
                  done
                fi
                if [ "${want}" = "ksu-next" ]; then
                  for p in "${ENABLE_CANDIDATES[@]}"; do
                    echo "$p" | grep -Eqi "(ksu[_-]?next|next)" && { echo "$p"; return 0; }
                  done
                fi
                for p in "${ENABLE_CANDIDATES[@]}"; do
                  echo "$p" | grep -Eqi "kernelsu" && { echo "$p"; return 0; }
                done
                echo "${ENABLE_CANDIDATES[0]}"
              }

              ENABLE_PATCH="$(pick_enable_patch)"
              echo "📦 Using enable patch candidate: ${ENABLE_PATCH}"

              if ! apply_patch_required "${KSU_DIR}" "${ENABLE_PATCH}"; then
                echo "⚠️ First enable patch failed. Trying remaining candidates..."
                success=0
                for p in "${ENABLE_CANDIDATES[@]}"; do
                  [ "$p" = "$ENABLE_PATCH" ] && continue
                  echo "➡️ Trying: $p"
                  if apply_patch_required "${KSU_DIR}" "$p"; then
                    ENABLE_PATCH="$p"
                    success=1
                    break
                  fi
                done
                [ "$success" = "1" ] || {
                  if grep -Rqs "^\s*config\s\+KSU_SUSFS" "${KSU_DIR}" "${COMMON_DIR}/drivers/kernelsu" 2>/dev/null; then
                    echo "⚠️ Enable patch failed, but SUSFS symbols already exist in this tree. Continuing."
                  else
                    echo "❌ All enable patch candidates failed to apply, and SUSFS symbols were not found."
                    exit 1
                  fi
                }
              fi
              echo "✅ Enable patch applied: ${ENABLE_PATCH}"
            fi

            echo "🧩 Verifying Kconfig symbol exists..."
            if ! grep -Rqs "config KSU_SUSFS" "${KSU_DIR}" "${COMMON_DIR}/drivers/kernelsu" 2>/dev/null; then
              echo "❌ KSU_SUSFS Kconfig symbol not found (integration missing)."
              exit 1
            fi
            echo "🧯 Terminal fix: prevent devpts SELinux relabeling (Termux/MT terminal)"
            # In some KernelSU/SukiSU builds, a bad sepolicy patch can label devpts nodes as ksu_file,
            # which causes terminal emulators to instantly exit due to SELinux AVC denials.
            # We sanitize any embedded policy snippet so devpts stays devpts.
            DEVPTS_BAD_REGEX='genfscon[[:space:]]+devpts[[:space:]]+/[^[:space:]]*[[:space:]]+u:object_r:ksu_file:s0|genfscon[[:space:]]+devpts[[:space:]]+/[[:space:]]+u:object_r:ksu_file:s0|/dev/pts[^[:space:]]*[[:space:]]+u:object_r:ksu_file:s0'
            SEARCH_DIRS=("${KSU_DIR}" "${COMMON_DIR}/drivers/kernelsu" "${COMMON_DIR}/security/selinux")

            if grep -RInqE "${DEVPTS_BAD_REGEX}" "${SEARCH_DIRS[@]}" 2>/dev/null; then
              echo "⚠️ Found devpts -> ksu_file policy snippet. Patching to devpts..."
              mapfile -t DEVPTS_FILES < <(grep -RIlE "${DEVPTS_BAD_REGEX}" "${SEARCH_DIRS[@]}" 2>/dev/null | sort -u || true)
              for f in "${DEVPTS_FILES[@]}"; do
                echo "    - patching: $f"
                sed -i -E 's/(genfscon[[:space:]]+devpts[[:space:]]+\/[^[:space:]]*[[:space:]]+u:object_r:)ksu_file(:s0)/\1devpts\2/g' "$f"
                sed -i -E 's/(genfscon[[:space:]]+devpts[[:space:]]+\/[[:space:]]+u:object_r:)ksu_file(:s0)/\1devpts\2/g' "$f"
                sed -i -E 's|(/dev/pts[^[:space:]]*[[:space:]]+u:object_r:)ksu_file(:s0)|\1devpts\2|g' "$f"
                sed -i -E 's/(devpts[^[:space:]]*[[:space:]]+u:object_r:)ksu_file(:s0)/\1devpts\2/g' "$f"
              done
            fi

            if grep -RInqE "${DEVPTS_BAD_REGEX}" "${SEARCH_DIRS[@]}" 2>/dev/null; then
              echo "❌ devpts relabel to ksu_file is still present after patch — terminals will break."
              grep -RInE "${DEVPTS_BAD_REGEX}" "${SEARCH_DIRS[@]}" | head -n 20 || true
              exit 1
            fi


            echo "📝 Enabling SUSFS options in gki_defconfig..."
            DEFCONFIG="${COMMON_DIR}/arch/arm64/configs/gki_defconfig"
            mapfile -t KSU_SUSFS_SYMS < <(grep -RhoP '^\s*config\s+\K(KSU_SUSFS[0-9A-Za-z_]*)' "${KSU_DIR}" "${COMMON_DIR}/drivers/kernelsu" 2>/dev/null | sort -u)
            for sym in "${KSU_SUSFS_SYMS[@]}"; do
              grep -q "^CONFIG_${sym}=" "${DEFCONFIG}" || echo "CONFIG_${sym}=y" >> "${DEFCONFIG}"
            done

            if grep -Rqs "^\s*config\s+SUSFS" "${COMMON_DIR}/fs" 2>/dev/null; then
              grep -q "^CONFIG_SUSFS=" "${DEFCONFIG}" || echo "CONFIG_SUSFS=y" >> "${DEFCONFIG}"
            fi

            echo "---- SUSFS config summary ----"
            grep -E "SUSFS" "${DEFCONFIG}" | tail -n 50 || true
          fi

          echo "✅ Patch step completed"
      - name: ⚙️ Configure Kernel Options
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

          echo "⚙️ Configuring kernel build options (stable + daily balanced)..."
          DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            echo "❌ gki_defconfig not found: $DEFCONFIG"
            exit 1
          fi

          # Idempotent defconfig writer (prevents duplicate overrides / reassign warnings)
          defcfg_set() {
            local key="$1"
            local val="$2"
            # Remove old value and '# ... is not set'
            sed -i -E "/^CONFIG_${key}=.*/d;/^# CONFIG_${key} is not set/d" "$DEFCONFIG" || true
            if [ "$val" = "y" ] || [ "$val" = "m" ]; then
              echo "CONFIG_${key}=${val}" >> "$DEFCONFIG"
            elif [ "$val" = "n" ]; then
              echo "# CONFIG_${key} is not set" >> "$DEFCONFIG"
            else
              # String values must be passed with quotes, e.g. '"bbr"'
              echo "CONFIG_${key}=${val}" >> "$DEFCONFIG"
            fi
          }

          ROOT_SOL="${ROOT_SOL:-${{ github.event.inputs.root_solution }}}"
          if [ "${ROOT_SOL}" = "none" ]; then
            echo "📦 Root disabled (root_solution=none)."
            defcfg_set KSU n
          else
            echo "📦 Enabling KernelSU (${ROOT_SOL})..."
            defcfg_set KSU y
          fi

          # Useful for debugging user reports ("what config did you ship?")
          defcfg_set IKCONFIG y
          defcfg_set IKCONFIG_PROC y

          # Terminal/PTTY safety (prevents terminal apps failing/crashing on some builds)
          # Terminals rely on UNIX98 PTYs + devpts (/dev/ptmx). Some trees also expose LEGACY_PTYS or PTY.
          defcfg_set TTY y
          defcfg_set UNIX98_PTYS y

          # Only set PTY/LEGACY_PTYS if this tree actually defines them (avoid unknown-symbol noise)
          if grep -Rqs --include='Kconfig*' '^\s*config\s\+PTY\b' ./common; then
            defcfg_set PTY y
          elif grep -Rqs --include='Kconfig*' '^\s*config\s\+LEGACY_PTYS\b' ./common; then
            # Not required for Termux, but harmless
            defcfg_set LEGACY_PTYS y
          fi

          # DEVPTS symbol detection (fallback if tree differs)
          if grep -Rqs --include='Kconfig*' '^\s*config\s\+DEVPTS_FS\b' ./common; then
            defcfg_set DEVPTS_FS y
            defcfg_set DEVPTS_MULTIPLE_INSTANCES y
          elif grep -Rqs --include='Kconfig*' '^\s*config\s\+DEVPTS\b' ./common; then
            defcfg_set DEVPTS y
          else
            echo "⚠️ DEVPTS config symbol not found in Kconfig (tree-specific). Skipping explicit DEVPTS enable."
          fi

          # KPM
          if [ "${{ github.event.inputs.KPM }}" = "On" ]; then
            echo "🧩 Enabling KPM..."
            defcfg_set KPM y
          fi

          # SUSFS vs Manual Hook
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            echo "📦 Enabling SUSFS features..."
            defcfg_set KSU_SUSFS y
            defcfg_set KSU_SUSFS_SUS_PATH y
            defcfg_set KSU_SUSFS_SUS_MOUNT y
            defcfg_set KSU_SUSFS_SUS_KSTAT y
          else
            echo "📦 SUSFS off → enabling MANUAL_HOOK..."
            defcfg_set KSU_SUSFS n
            defcfg_set KSU_MANUAL_HOOK y
          fi
          defcfg_try_set() {
            local key="$1"
            local val="$2"
            if grep -Rqs --include='Kconfig*' "^\s*config\s\+${key}\b" ./common; then
              defcfg_set "${key}" "${val}"
            fi
          }

          # Optional: keep a sane default TCP congestion control if user didn't enable BBR
          if [ "${{ github.event.inputs.bbr }}" != "On" ]; then
            # Ensure CUBIC exists (nearly universal)
            defcfg_set TCP_CONG_CUBIC y
          fi


          # Polly is great for benchmark builds, but can cause rare miscompiles; keep it for "highest" only.
          if [ "${{ github.event.inputs.PROFILE }}" = "highest" ]; then
            defcfg_set LLVM_POLLY y
          else
            defcfg_set LLVM_POLLY n
          fi

          # Optional BBR (mostly for Wi-Fi/5G throughput tests; can be negative for daily use)
          if [ "${{ github.event.inputs.bbr }}" = "On" ]; then
            echo "📶 Enabling BBR..."
            defcfg_set TCP_CONG_CUBIC y
            defcfg_set TCP_CONG_BBR y
            defcfg_set DEFAULT_BBR y
            defcfg_set DEFAULT_TCP_CONG '"bbr"'
          fi

          # Optional BBG (safe-mode) — auto-detect symbol + LSM name and patch defconfig cleanly
          if [ "${{ github.event.inputs.bbg }}" = "On" ]; then
            echo "🛡️ Configuring BBG (Baseband Guard) — safe mode..."
            python3 - <<'PY'
          from pathlib import Path
          import os, re
    
          ws = Path(os.environ["GITHUB_WORKSPACE"])
          defconfig = ws / "kernel_workspace/kernel_platform/common/arch/arm64/configs/gki_defconfig"
          common_root = defconfig.parents[3] # .../kernel_platform/common
          security_dir = common_root / "security"
    
          def read_text(p: Path) -> str:
              try:
                  return p.read_text(errors="ignore")
              except Exception:
                  return ""
    
          def ensure_cfg(lines, key, val):
              out = []
              for l in lines:
                  if l.startswith(f"CONFIG_{key}=") or l.startswith(f"# CONFIG_{key} is not set"):
                      continue
                  out.append(l)
              if val in ("y", "m", "n"):
                  if val == "n":
                      out.append(f"# CONFIG_{key} is not set")
                  else:
                      out.append(f"CONFIG_{key}={val}")
              else:
                  out.append(f"CONFIG_{key}=" + val)
              return out
    
          # detect BBG config symbol (varies by patch)
          candidates = ["BBG", "SECURITY_BASEBAND_GUARD", "BASEBAND_GUARD"]
          found_syms = set()
          if security_dir.exists():
              for kcfg in security_dir.rglob("Kconfig"):
                  txt = read_text(kcfg)
                  for sym in candidates:
                      if re.search(rf"^\s*config\s+{re.escape(sym)}\b", txt, flags=re.M):
                          found_syms.add(sym)
          bbg_sym = next((s for s in candidates if s in found_syms), "BBG")
    
          # detect LSM name (string must match DEFINE_LSM(<name>))
          lsm_name = None
          if security_dir.exists():
              for cfile in security_dir.rglob("*.c"):
                  txt = read_text(cfile)
                  for name in re.findall(r"DEFINE_LSM\(\s*([A-Za-z0-9_]+)\s*\)", txt):
                      if "baseband" in name.lower() or name.lower() == "bbg" or name.lower().startswith("bbg_"):
                          lsm_name = name
                          break
                  if lsm_name:
                      break
          if not lsm_name:
              lsm_name = "baseband_guard"
    
          lines = defconfig.read_text(errors="ignore").splitlines()
          lines = ensure_cfg(lines, "SECURITY", "y")
          lines = ensure_cfg(lines, "SECURITYFS", "y")
          lines = ensure_cfg(lines, bbg_sym, "y")
    
          # Update CONFIG_LSM ordering: insert after selinux, keep de-dup
          lsm_vals = []
          for l in lines:
              if l.startswith('CONFIG_LSM="'):
                  m = re.match(r'CONFIG_LSM="([^"]*)"', l)
                  if m:
                      lsm_vals = [x.strip() for x in m.group(1).split(',') if x.strip()]
          if not lsm_vals:
              lsm_vals = ["landlock","lockdown","yama","integrity","selinux","bpf"]
          seen=set(); dedup=[]
          for x in lsm_vals:
              if x not in seen:
                  dedup.append(x); seen.add(x)
          lsm_vals = dedup
          if lsm_name not in lsm_vals:
              if "selinux" in lsm_vals:
                  lsm_vals.insert(lsm_vals.index("selinux")+1, lsm_name)
              else:
                  lsm_vals.append(lsm_name)
          if "selinux" in lsm_vals and lsm_name in lsm_vals and lsm_vals.index(lsm_name) < lsm_vals.index("selinux"):
              lsm_vals.remove(lsm_name)
              lsm_vals.insert(lsm_vals.index("selinux")+1, lsm_name)
          lsm_line = 'CONFIG_LSM="' + ','.join(lsm_vals) + '"'
          lines = [l for l in lines if not l.startswith('CONFIG_LSM="')]
          lines.append(lsm_line)
    
          # Safe-mode: disable BBG_* options that can break SELinux transitions
          symbols=set()
          if security_dir.exists():
              for kcfg in security_dir.rglob("Kconfig"):
                  txt = read_text(kcfg)
                  for sym in re.findall(r"^\s*config\s+(BBG_[A-Za-z0-9_]+)\b", txt, flags=re.M):
                      symbols.add(sym)
          susp = sorted([s for s in symbols if re.search(r"(SELINUX|DOMAIN|TRANSITION|CONTEXT|TRUST)", s)])
          for sym in susp:
              lines = ensure_cfg(lines, sym, "n")
    
          defconfig.write_text("\n".join(lines).rstrip()+"\n")
          print('BBG enabled symbol :', bbg_sym)
          print('BBG LSM name :', lsm_name)
          print('CONFIG_LSM :', lsm_line)
          PY
          fi

          echo "✅ Kernel config options updated"
          echo "---- Tail of gki_defconfig (last 80) ----"
          tail -n 80 "$DEFCONFIG" || true
          
      - name: 🔎 Verify KSU/SUSFS config (pre-build)
          
        run: |
          
          set -e
          
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"

          
          # Generate .config from gki_defconfig so we can verify the effective settings
          
          make O=out ARCH=arm64 gki_defconfig

          
          echo "---- Effective config (KSU/KPM/SUSFS) ----"
          
          grep -nE '^CONFIG_KSU(=|_)|^CONFIG_KPM(=|_)|^CONFIG_KSU_SUSFS(=|_)' out/.config || true # Terminal apps sanity (PTY/devpts)
          echo "---- Terminal/PTTY sanity ----"

          must_y() {
            local sym="$1"
            if ! grep -q "^${sym}=y" out/.config; then
              echo "❌ Missing ${sym}=y in out/.config — terminal emulators may crash or fail to start."
              exit 1
            fi
          }

          must_y CONFIG_TTY
          # CONFIG_PTY is not present on all trees; only enforce if it exists.
          if grep -q "^CONFIG_PTY=" out/.config; then
            must_y CONFIG_PTY
          fi
          must_y CONFIG_UNIX98_PTYS

          # DEVPTS symbol may differ by tree; validate if present/known
          if grep -q "^CONFIG_DEVPTS_FS=" out/.config; then
            must_y CONFIG_DEVPTS_FS
            if grep -q "^CONFIG_DEVPTS_MULTIPLE_INSTANCES=" out/.config; then
              must_y CONFIG_DEVPTS_MULTIPLE_INSTANCES
            fi
          elif grep -q "^CONFIG_DEVPTS=" out/.config; then
            must_y CONFIG_DEVPTS
          else
            # If the symbol exists in Kconfig but isn't in .config, that's a real issue.
            if grep -Rqs --include='Kconfig*' '^\s*config\s\+DEVPTS_FS\b' .; then
              echo "❌ Kconfig contains DEVPTS_FS but it didn't land in out/.config. Check dependencies (PTY/UNIX98_PTYS) and defconfig edits."
              exit 1
            elif grep -Rqs --include='Kconfig*' '^\s*config\s\+DEVPTS\b' .; then
              echo "❌ Kconfig contains DEVPTS but it didn't land in out/.config. Check dependencies and defconfig edits."
              exit 1
            else
              echo "⚠️ DEVPTS symbol not present in this tree's Kconfig; skipping strict DEVPTS check."
            fi
          fi

          echo "✅ PTY/devpts OK"
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
          
            if ! grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
          
              echo "❌ SUSFS was requested, but CONFIG_KSU_SUSFS is not enabled in out/.config"
          
              echo " Likely causes:"
          
              echo " - SUSFS KernelSU enable patch didn't apply"
          
              echo " - SUSFS Kconfig symbols are missing in this kernel tree"
          
              echo ""
          
              echo "---- Grep for SUSFS symbols in KernelSU driver ----"
          
              grep -RIn --max-count=50 'KSU_SUSFS\|SUSFS' drivers/kernelsu 2>/dev/null || true
          
              exit 1
          
            fi
          
          fi

          
          echo "---- LZ4 sanity ----"
          
          if [ ! -f lib/lz4/lz4armv8/lz4armv8.S ]; then
          
            echo "❌ Missing lib/lz4/lz4armv8/lz4armv8.S (required by Kbuild in this tree)"
          
            echo " This will cause: No rule to make target 'lib/lz4/lz4armv8/lz4armv8.o'"
          
            exit 1
          
          fi
          
          echo "✅ Found lib/lz4/lz4armv8/lz4armv8.S"
          
          echo "---- LZ4 Makefile references (first 20) ----"
          
          grep -RIn --max-count=20 'lz4armv8\.o' lib/lz4 2>/dev/null || true


      - name: 📦 Add build name
        run: |
          echo "📦 Replacing kernel version suffix..."
          
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel_platform/
          
          if [[ -n "${{ github.event.inputs.kernel_suffix }}" ]]; then
            SUFFIX="${{ github.event.inputs.kernel_suffix }}"
            echo "Current kernel version suffix: $SUFFIX"
            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${SUFFIX}\"|" "$f"
            done
            sed -i "s/-4k/-${SUFFIX}/g" ./common/arch/arm64/configs/gki_defconfig
          else
            echo "Current kernel version suffix: ${KERNEL_NAME}"
            for f in ./common/scripts/setlocalversion; do
              sed -i "\$s|echo \"\\\$res\"|echo \"-${KERNEL_NAME}\"|" "$f"
            done
            sed -i "s/-4k/-${KERNEL_NAME}/g" ./common/arch/arm64/configs/gki_defconfig
          fi
          
          sed -i 's/${scm_version}//' ./common/scripts/setlocalversion
          
          sed -i -E "/^CONFIG_LOCALVERSION_AUTO=.*/d;/^# CONFIG_LOCALVERSION_AUTO is not set/d" ./common/arch/arm64/configs/gki_defconfig || true
          echo "CONFIG_LOCALVERSION_AUTO=n" >> ./common/arch/arm64/configs/gki_defconfig
          
      - name: 📅 Set up custom BUILD_TIME
        shell: bash
        run: |
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='Australia/Perth' date +'%a %b %d %T %Z %Y')"
            echo "Using Perth time as fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd $GITHUB_WORKSPACE/kernel_workspace/kernel_platform/
          for f in common/scripts/mkcompile_h msm-kernel/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done
          
      - name: 🗜️ Default ZRAM compression to LZ4
        run: |
          set -e
          echo "🗜️ Forcing ZRAM default compressor to LZ4 (kernel-side default)..."
          DEFCONFIG="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/arch/arm64/configs/gki_defconfig"
          if [ ! -f "$DEFCONFIG" ]; then
            echo "❌ gki_defconfig not found at $DEFCONFIG"
            exit 1
          fi

          # Remove any previous defaults to avoid conflicts/duplicates
          sed -i '/^CONFIG_ZRAM_DEF_COMP_/d;/^CONFIG_ZRAM_DEF_COMP=/d' "$DEFCONFIG" || true

          # Ensure LZ4 support is enabled (usually already enabled in GKI)
          grep -q '^CONFIG_LZ4_COMPRESS=' "$DEFCONFIG" || echo 'CONFIG_LZ4_COMPRESS=y' >> "$DEFCONFIG"
          grep -q '^CONFIG_LZ4_DECOMPRESS=' "$DEFCONFIG" || echo 'CONFIG_LZ4_DECOMPRESS=y' >> "$DEFCONFIG"
          grep -q '^CONFIG_DECOMPRESS_LZ4=' "$DEFCONFIG" || echo 'CONFIG_DECOMPRESS_LZ4=y' >> "$DEFCONFIG"
          grep -q '^CONFIG_RD_LZ4=' "$DEFCONFIG" || echo 'CONFIG_RD_LZ4=y' >> "$DEFCONFIG"

          # Set ZRAM default compressor to lz4
          echo 'CONFIG_ZRAM_DEF_COMP_LZ4=y' >> "$DEFCONFIG"
          echo '# CONFIG_ZRAM_DEF_COMP_LZORLE is not set' >> "$DEFCONFIG"
          echo '# CONFIG_ZRAM_DEF_COMP_ZSTD is not set' >> "$DEFCONFIG"
          echo '# CONFIG_ZRAM_DEF_COMP_LZO is not set' >> "$DEFCONFIG"
          echo 'CONFIG_ZRAM_DEF_COMP="lz4"' >> "$DEFCONFIG"

          echo "✅ ZRAM default compressor set to lz4"
          grep -E '^(CONFIG_ZRAM_DEF_COMP|CONFIG_(LZ4|RD_LZ4|DECOMPRESS_LZ4))' "$DEFCONFIG" | tail -n 50 || true

      - name: 🔨 Build Kernel

        run: |

          set -e

          echo "🏗️ Starting kernel build..."


          export PATH="/usr/lib/ccache:$HOME/toolchains/neutron-clang/bin:$PATH"

          export PATH="/usr/lib/ccache:$PATH"


          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"


          set -o pipefail

          echo "---- Tool versions ----"

          clang --version || true

          ld.lld --version || true

          aarch64-linux-gnu-objcopy --version || true


          echo "---- Build (LLVM_IAS=1) ----"
          # option: clean build wipes out/ and ccache stats
          if [ "${{ github.event.inputs.clean_build }}" = "true" ]; then
            echo "🧼 clean_build=true -> removing out/ and resetting ccache..."
            rm -rf out build.log || true
            ccache -C || true
          fi

          # Optimization level ( option) + PROFILE naming
          # - If PROFILE=lowest -> -Os (size/battery bias)
          # - Else use optimize_level (O2 or O3)
          if [ "${{ github.event.inputs.PROFILE }}" = "lowest" ]; then
            KOPT="-Os"
          else
            case "${{ github.event.inputs.optimize_level }}" in
              O3) KOPT="-O3" ;;
              *) KOPT="-O2" ;;
            esac
          fi
          echo "Using KCFLAGS: ${KOPT}"


          make -j"$(nproc --all)" LLVM=1 LLVM_IAS=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=${KOPT} gki_defconfig all 2>&1 | tee build.log || {

              echo "❌ Build failed (LLVM_IAS=1). Showing error summary:"

              grep -nEi "fatal error:|error:|ld\.lld: error|undefined reference|No such file|not found|killed|No space" build.log | head -n 160 || true

              echo "🔁 Retrying with LLVM_IAS=0 (GNU as fallback)..."

              make -j"$(nproc --all)" LLVM=1 LLVM_IAS=0 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" RUSTC=../../prebuilts/rust/linux-x86/1.73.0b/bin/rustc PAHOLE=../../prebuilts/kernel-build-tools/linux-x86/bin/pahole LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=${KOPT} gki_defconfig all 2>&1 | tee -a build.log || {

                  echo "❌ Build failed again (LLVM_IAS=0). Error summary:"

                  grep -nEi "fatal error:|error:|ld\.lld: error|undefined reference|No such file|not found|killed|No space" build.log | head -n 220 || true

                  exit 2

                }

            }


          # Show ccache statistics

          ccache -s


          echo "✅ Kernel build complete"
          
      - name: 📤 Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel_workspace/kernel_platform/common/build.log

      - name: 📦 Package Kernel
        run: |
          echo "📦 Preparing AnyKernel3 packaging environment..."
          git clone https://github.com/mrcxlinux/AnyKernel3 --depth=1
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/
          
          dir1=""
          dir2=""
          
          image_path=$(find "./kernel_workspace/kernel_platform/common/out/" -name "Image" | head -n 1)
          
          if [ -n "$image_path" ]; then
            dir1=$(dirname "$image_path")/
            echo "✅ Successfully found Image file"
          fi
          
          if [ -n "$image_path" ] && [ -f "$image_path" ]; then
            echo "Image file finally located at: $image_path"
            cp "$image_path" ./AnyKernel3/Image
            cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image
          fi
          
      - name: 🧩 Patch Kernel Image (KPM)
        if: ${{ github.event.inputs.KPM == 'On' }}
        run: |
          echo "🔧 Applying KPM patch..."
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"/out/Final-Image-Find
          curl $CURL_OPTS -fL -o patch_linux https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/download/0.13.0/patch_linux
          chmod +x patch_linux
          ./patch_linux
          
          rm -f Image
          mv oImage Image
          cp Image $GITHUB_WORKSPACE/AnyKernel3/Image
          
          echo "✅ KPM patch applied"
          

      - name: 🏷️ Customize AnyKernel Banner (ASCII top + clean)
        run: |
          set -e
          AK="$GITHUB_WORKSPACE/AnyKernel3/anykernel.sh"
          if [ ! -f "$AK" ]; then
            echo "❌ anykernel.sh not found at $AK"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          ak_path = Path("AnyKernel3/anykernel.sh")
          s = ak_path.read_text(encoding="utf-8", errors="ignore").splitlines(True)

          # Remove noisy warnings (no value after successful flash)
          remove_phrases = [
              "No warranty",
              "Flash at your own risk",
              "Backup boot",
              "Backup init_boot",
              "Backup boot / init_boot",
              "Backup boot/init_boot",
              "Backup boot / init_boot / recovery",
          ]
          cleaned = []
          for ln in s:
              if "ui_print" in ln and any(p in ln for p in remove_phrases):
                  continue
              cleaned.append(ln)
          s = cleaned

          start_idx = None
          end_idx = None

          # Locate original author banner block (chenhua13) used in scripts
          for i, line in enumerate(s):
              if 'ui_print "chenhua13 Kernel' in line:
                  start_idx = i
                  break

          if start_idx is not None:
              for j in range(start_idx, len(s)):
                  if 'ksu_supported' in s[j] and 'ui_print' in s[j]:
                      end_idx = j
                      break

          PROFILE = "${{ github.event.inputs.PROFILE }}".strip() or "optimal"
          SUSFS = "${{ github.event.inputs.SUSFS }}".strip()
          base = "${{ env.KERNEL_NAME }}".strip() or "kernel"
          # Display kernel name exactly as provided by KERNEL_NAME
          tag = base
          RUNNUM = "${{ github.run_number }}".strip()
          SHA = "${{ github.sha }}".strip()
          BUILD = f"{RUNNUM}-{SHA[:7]}" if SHA else RUNNUM

          ascii_block = 'ui_print "===================================================="\nui_print " __ __ __ "\nui_print " \\\\ \\\\ / //_ |"\nui_print " \\\\ V / | |"\nui_print " > < | |"\nui_print " / . \\\\ | |"\nui_print " /_/ \\\\_\\\\ |_|"\nui_print "===================================================="\n'

          banner = []
          banner.append('ui_print " "\n')
          banner.append(ascii_block)
          banner.append('ui_print " "\n')
          banner.append('ui_print "PJZ110 | GREATEST KERNEL EVER"\n')
          banner.append(f'ui_print "Kernel:{tag}"\n')
          banner.append(f'ui_print "Build : {BUILD}"\n')
          banner.append('ui_print "Builder: @Ox1d3x3"\n')
          banner.append('ui_print "Credits: chenhua13 / mrcxlinux"\n')
          banner.append('ui_print " "\n')
          banner.append('DEVICE="$(getprop ro.product.device 2>/dev/null)"; [ -z "$DEVICE" ] && DEVICE="$(getprop ro.product.name 2>/dev/null)"\n')
          banner.append('PATCH="$(getprop ro.build.version.security_patch 2>/dev/null)"\n')
          banner.append('ANDROID="$(getprop ro.build.version.release 2>/dev/null)"\n')
          banner.append('SLOT_SUFFIX="$(getprop ro.boot.slot_suffix 2>/dev/null)"\n')
          banner.append('if [ -z "$SLOT_SUFFIX" ]; then SLOT="$(getprop ro.boot.slot 2>/dev/null)"; [ -n "$SLOT" ] && SLOT_SUFFIX="_$SLOT"; fi\n')
          banner.append('if [ -z "$SLOT_SUFFIX" ]; then SLOT_SUFFIX="$(grep -oE "androidboot.slot_suffix=[^ ]+" /proc/cmdline 2>/dev/null | head -n1 | cut -d= -f2)"; fi\n')
          banner.append('if [ -z "$SLOT_SUFFIX" ]; then SLOT="$(grep -oE "androidboot.slot=[^ ]+" /proc/cmdline 2>/dev/null | head -n1 | cut -d= -f2)"; [ -n "$SLOT" ] && SLOT_SUFFIX="_$SLOT"; fi\n')
          banner.append('ui_print "Device : $DEVICE"\n')
          banner.append('ui_print "Android: $ANDROID"\n')
          banner.append('ui_print "Patch : $PATCH"\n')
          banner.append('if [ -n "$SLOT_SUFFIX" ]; then ui_print "Slot : $SLOT_SUFFIX"; fi\n')

          # Open GitHub page after flash (works when flashing in Android; safe no-op elsewhere)
          banner.append('if [ -n "$(command -v cmd 2>/dev/null)" ]; then\n')
          banner.append(' (cmd activity start --user 0 -a android.intent.action.VIEW -d "https://github.com/ox1d3x3/Op13_Susfs_kernel" >/dev/null 2>&1 &) || true\n')
          banner.append('elif [ -n "$(command -v am 2>/dev/null)" ]; then\n')
          banner.append(' (am start --user 0 -a android.intent.action.VIEW -d "https://github.com/ox1d3x3/Op13_Susfs_kernel" >/dev/null 2>&1 &) || true\n')
          banner.append('fi\n')

          banner_text = "".join(banner)

          if start_idx is not None and end_idx is not None and end_idx >= start_idx:
              s[start_idx:end_idx+1] = [banner_text]
          else:
              inserted = False
              for i, line in enumerate(s):
                  if 'abort " -> Non-GKI device, abort."' in line:
                      s.insert(i, banner_text)
                      inserted = True
                      break
              if not inserted:
                  s.insert(0, banner_text)

          ak_path.write_text("".join(s), encoding="utf-8")
          PY


      - name: 🧠 Set Artifact Name
        id: set_name
        run: |
          ROOT_SOL="${ROOT_SOL:-${{ github.event.inputs.root_solution }}}"
          BASE_NAME="GREATEST_KERNEL_${ROOT_SOL}_lz4_${KSU_VERSION_FULL}_${{ github.event.inputs.PROFILE }}"
          
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            FINAL_NAME="${BASE_NAME}_SUSFS"
          else
            FINAL_NAME="${BASE_NAME}"
          fi
          
          echo "ARTIFACT_NAME=${FINAL_NAME}" >> $GITHUB_OUTPUT
          
      - name: 📤 Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set_name.outputs.ARTIFACT_NAME }}
          path: ./AnyKernel3/*

      - name: 📝 Make ZRAM module
        run: |
          set -e
          echo "📥 Downloading zram.zip..."
          curl $CURL_OPTS -fL "https://github.com/cctv18/oppo_oplus_realme_sm8750/raw/refs/heads/main/zram.zip" -o "$GITHUB_WORKSPACE/zram.zip"
          
          echo "📦 Extracting..."
          unzip -q "$GITHUB_WORKSPACE/zram.zip" -d "$GITHUB_WORKSPACE/zram"
          
          echo "🔁 Replacing zram.ko..."
          find "$GITHUB_WORKSPACE/zram" -name "zram.ko" -exec cp "./kernel_workspace/kernel_platform/common/out/drivers/block/zram/zram.ko" {} \;
          rm -rf $GITHUB_WORKSPACE/zram.zip
          
          echo "📦 Repacking zip..."
          cd "$GITHUB_WORKSPACE/zram"
          zip -qr "../zram.zip" .
          
          echo "✅ Done!"
          
      - name: 📤 Upload zram.zip
        uses: actions/upload-artifact@v4
        with:
          name: zram-module.zip
          path: ./zram.zip

      - name: 🏷️ Prepare tag and release notes
        if: ${{ github.event.inputs.make_release == 'true' }}
        id: relmeta
        run: |
          set -euo pipefail
          DATE_TAG="$(date -u +%Y%m%d)"
          # Keep it simple and deterministic (-style)
          TAG="OP13-${DATE_TAG}-r${GITHUB_RUN_NUMBER}-${{ github.event.inputs.PROFILE }}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

          # Minimal release notes (you can expand later)
          {
            echo "## Build"
            echo "- Device: OnePlus 13 (PJZ110)"
            echo "- Profile: ${{ github.event.inputs.PROFILE }}"
            echo "- optimize_level: ${{ github.event.inputs.optimize_level }}"
            echo "- SUSFS: ${{ github.event.inputs.SUSFS }}"
            echo "- KPM: ${{ github.event.inputs.KPM }}"
            echo "- BBG: ${{ github.event.inputs.bbg }}"
            echo "- BBR: ${{ github.event.inputs.bbr }}"
            echo ""
            echo "## Assets"
            echo "- AnyKernel3 flashable zip"
            echo "- zram.zip module"
          } > RELEASE_NOTES.md

      - name: 📦 Prepare release assets
        if: ${{ github.event.inputs.make_release == 'true' }}
        run: |
          set -euo pipefail
          # Create a flashable zip from AnyKernel3 folder
          ZIP_NAME="${{ steps.set_name.outputs.ARTIFACT_NAME }}.zip"
          (cd AnyKernel3 && zip -qr "../${ZIP_NAME}" .)
          ls -lh "${ZIP_NAME}" zram.zip

      - name: 🚀 Create GitHub Release
        if: ${{ github.event.inputs.make_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.relmeta.outputs.TAG }}
          name: ${{ steps.relmeta.outputs.TAG }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.set_name.outputs.ARTIFACT_NAME }}.zip
            zram.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
