name: OP13 KernelSU-Next

env:
  TZ: UTC
  ANDROID_VERSION: android15
  # Label only (major.minor). Actual release (e.g. 6.6.89) is detected at build time.
  KERNEL_VERSION: "6.6"
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "8G"
  GIT_TERMINAL_PROMPT: "0"

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Toolchain"
        type: choice
        required: true
        default: aosp_prebuilt
        options: [aosp_prebuilt, neutron_clang]

      SUSFS:
        description: "Enable SUSFS"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      ksunext_multimanager:
        description: "Apply KernelSU-Next multi-manager patch (best-effort)"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      bbg:
        description: "Enable Baseband-Guard (BBG)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      bbr:
        description: "Enable BBR congestion control"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      adios:
        description: "Enable ADIOS I/O scheduler"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      rekernel:
        description: "Enable Re-Kernel support"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]

      proxy:
        description: "Enable proxy/network tweaks (best-effort)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      TTL:
        description: "Enable TTL target/match (netfilter)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      IP_SET:
        description: "Enable IP_SET (netfilter ipset)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      kernel_suffix:
        description: "Kernel suffix (LOCALVERSION). Leave empty to use KERNEL_NAME"
        type: string
        required: false
        default: ""

      BUILD_TIME:
        description: "Custom build time string (F = current UTC)"
        type: string
        required: false
        default: "F"

      BUILD_USER:
        description: "KBUILD_BUILD_USER"
        type: string
        required: false
        default: "OnePlus"

      BUILD_HOST:
        description: "KBUILD_BUILD_HOST"
        type: string
        required: false
        default: "ubuntu-build"

jobs:
  build:
    name: "SUSFS=${{ github.event.inputs.SUSFS }} | Toolchain=${{ github.event.inputs.toolchain }}"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: "Maximize build space"
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"

      - name: "Extra disk cleanup"
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/share/powershell /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          df -h

      - name: "Setup ccache directory"
        shell: bash
        run: |
          set -euo pipefail
          echo "CCACHE_DIR=$HOME/.ccache_KSUNext" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.ccache_KSUNext"

      - name: "Restore ccache"
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-op13-ksunext-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.SUSFS }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-op13-ksunext-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.SUSFS }}-
            ccache-${{ runner.os }}-op13-ksunext-

      - name: "Install build dependencies"
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             python3 python3-pip git curl wget ca-certificates rsync unzip zip             build-essential flex bison bc gawk ccache             libssl-dev libncurses-dev libelf-dev zlib1g-dev liblz4-tool             libxml2-utils dos2unix jq
          ccache -M "${{ env.CCACHE_MAXSIZE }}"
          ccache -s

      - name: "Install repo tool"
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > /tmp/repo
          chmod a+x /tmp/repo
          sudo mv /tmp/repo /usr/local/bin/repo
          repo --version

      - name: "Sync kernel sources"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace
          repo init -u https://github.com/mrcxlinux/actions_oplus_sm8750.git -b english --depth=1
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle --force-sync

          rm -f kernel_platform/common/android/abi_gki_protected_exports_* || true
          rm -f kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || true

          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion || true
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion || true
          sed -i 's/ -dirty//g' kernel_platform/external/dtc/scripts/setlocalversion || true

      - name: "Select toolchain"
        shell: bash
        run: |
          set -euo pipefail
          echo "Selected toolchain: ${{ github.event.inputs.toolchain }}"
          if [ "${{ github.event.inputs.toolchain }}" = "neutron_clang" ]; then
            mkdir -p "$HOME/toolchains"
            cd "$HOME/toolchains"
            git clone --depth=1 https://github.com/Neutron-Toolchains/antman.git antman
            cd antman
            bash antman -S
            echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          else
            cd "$GITHUB_WORKSPACE/kernel_workspace"
            CANDIDATE="$(find . -type f -path '*prebuilts/clang/host/linux-x86/*/bin/clang' | head -n 1 || true)"
            if [ -z "$CANDIDATE" ]; then
              echo "Error: clang prebuilts not found under kernel_workspace."
              exit 1
            fi
            echo "$(dirname "$CANDIDATE")" >> "$GITHUB_PATH"
          fi
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          clang --version || true

      - name: "Integrate KernelSU-Next (stable)"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s stable

      - name: "Apply optional Multi-Manager patch"
        if: ${{ github.event.inputs.ksunext_multimanager == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          if [ -f "$GITHUB_WORKSPACE/patches/kernelsu-next_multimanager.patch" ]; then
            git apply --whitespace=nowarn "$GITHUB_WORKSPACE/patches/kernelsu-next_multimanager.patch" || true
          fi

      - name: "Apply SUSFS"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          if [ "${{ github.event.inputs.SUSFS }}" = "On" ]; then
            rm -rf susfs4ksu || true
            git clone --depth=1 -b gki-android15-6.6 https://github.com/sidex15/susfs4ksu.git susfs4ksu
            for p in susfs4ksu/kernel_patches/*.patch; do
              [ -f "$p" ] || continue
              if git apply --whitespace=nowarn "$p"; then
                echo "✅ Applied: $(basename "$p")"
              else
                echo "⚠️ Skipped: $(basename "$p")"
              fi
            done
          fi

      - name: "Enable features via defconfig"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          DEFCONFIG="./common/arch/arm64/configs/gki_defconfig"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFCONFIG"
          if [ "${{ github.event.inputs.bbg }}" = "On" ]; then echo "CONFIG_BBG=y" >> "$DEFCONFIG" || true; fi
          if [ "${{ github.event.inputs.bbr }}" = "On" ]; then echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFCONFIG"; fi
          if [ "${{ github.event.inputs.adios }}" = "On" ]; then
            echo "CONFIG_MQ_IOSCHED_ADIOS=y" >> "$DEFCONFIG"
            echo "CONFIG_MQ_IOSCHED_DEFAULT_ADIOS=y" >> "$DEFCONFIG"
          fi
          if [ "${{ github.event.inputs.rekernel }}" = "On" ]; then echo "CONFIG_REKERNEL=y" >> "$DEFCONFIG"; fi
          if [ "${{ github.event.inputs.TTL }}" = "On" ]; then
            echo "CONFIG_NETFILTER_XT_TARGET_TTL=y" >> "$DEFCONFIG"
            echo "CONFIG_NETFILTER_XT_MATCH_TTL=y" >> "$DEFCONFIG"
          fi
          if [ "${{ github.event.inputs.IP_SET }}" = "On" ]; then
            echo "CONFIG_IP_SET=y" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET_MAX=256" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET_HASH_IP=y" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET_HASH_IPPORT=y" >> "$DEFCONFIG"
            echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> "$DEFCONFIG"
          fi
          echo "CONFIG_HEADERS_INSTALL=n" >> "$DEFCONFIG"
          sed -i 's/check_defconfig//' ./common/build.config.gki || true

      - name: "Set kernel version suffix (LOCALVERSION)"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          if [ -n "${{ github.event.inputs.kernel_suffix }}" ]; then SUF="${{ github.event.inputs.kernel_suffix }}"; else SUF="${{ env.KERNEL_NAME }}"; fi
          echo "Using suffix: $SUF"
          sed -i "\$s|echo "\\$res"|echo "-$SUF"|" ./common/scripts/setlocalversion
          sed -i 's/${scm_version}//' ./common/scripts/setlocalversion || true

      - name: "Set KBUILD build identity and timestamp"
        shell: bash
        run: |
          set -euo pipefail
          echo "KBUILD_BUILD_USER=${{ github.event.inputs.BUILD_USER }}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=${{ github.event.inputs.BUILD_HOST }}" >> "$GITHUB_ENV"
          INPUT_TIME="${{ github.event.inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then DATESTR="$INPUT_TIME"; else DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"; fi
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

      - name: "Fix permissions for overwriter scripts"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          chmod +x drivers/of/overwriter/overwrite_configs/convert_configs.sh 2>/dev/null || true
          chmod +x drivers/of/overwriter/overwrite_configs/*.sh 2>/dev/null || true

      - name: "Build kernel"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 CC="ccache clang" LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-O2 gki_defconfig all
          REL="$(cat out/include/config/kernel.release 2>/dev/null || true)"
          if [ -z "$REL" ]; then REL="$(make -s O=out kernelrelease 2>/dev/null || true)"; fi
          echo "KERNEL_RELEASE=$REL" >> "$GITHUB_ENV"
          echo "Kernel release: $REL"

      - name: "Package AnyKernel3 (single zip)"
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf AnyKernel3 || true
          git clone --depth=1 https://github.com/mrcxlinux/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git

          IMAGE_PATH="$(find "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/out" -type f -name Image | head -n 1 || true)"
          if [ -z "$IMAGE_PATH" ]; then echo "Image not found"; exit 1; fi
          cp "$IMAGE_PATH" "AnyKernel3/Image"

          \
          python3 - << 'PY'
          import pathlib, re, os
          ak = pathlib.Path("AnyKernel3/anykernel.sh")
          data = ak.read_text(encoding="utf-8", errors="ignore").splitlines(True)

          tag = os.environ.get("KERNEL_RELEASE","")
          build = os.environ.get("GITHUB_RUN_NUMBER","")
          ascii_block = (
          'ui_print "===================================================="\n'
          'ui_print "                   __   __  __ " \n'
          'ui_print "                  \\ \\ / //_ |"\n'
          'ui_print "                   \\ V /   | |"\n'
          'ui_print "                     > <    | |"\n'
          'ui_print "                   / . \\   | |"\n'
          'ui_print "                 /_/ \\_\\  |_|"\n'
          'ui_print "===================================================="\n'
          )

          banner = []
          banner.append('ui_print " "\n')
          banner.append(ascii_block)
          banner.append('ui_print " "\n')
          banner.append('ui_print "PJZ110 | KernelSU-Next Kernel"\n')
          banner.append(f'ui_print "Kernel : {tag}"\n')
          banner.append(f'ui_print "Build  : {build}"\n')
          banner.append('ui_print "Builder: @Ox1d3x3"\n')
          banner.append('ui_print "Credits: @mrcxlinux"\n')
          banner.append('ui_print " "\n')
          banner.append('DEVICE="$(getprop ro.product.device 2>/dev/null)"; [ -z "$DEVICE" ] && DEVICE="$(getprop ro.product.name 2>/dev/null)"\n')
          banner.append('PATCH="$(getprop ro.build.version.security_patch 2>/dev/null)"\n')
          banner.append('ANDROID="$(getprop ro.build.version.release 2>/dev/null)"\n')
          banner.append('SLOT_SUFFIX="$(getprop ro.boot.slot_suffix 2>/dev/null)"\n')
          banner.append('if [ -z "$SLOT_SUFFIX" ]; then SLOT="$(getprop ro.boot.slot 2>/dev/null)"; [ -n "$SLOT" ] && SLOT_SUFFIX="_$SLOT"; fi\n')
          banner.append('if [ -z "$SLOT_SUFFIX" ]; then SLOT_SUFFIX="$(grep -oE "androidboot.slot_suffix=[^ ]+" /proc/cmdline 2>/dev/null | head -n1 | cut -d= -f2)"; fi\n')
          banner.append('if [ -z "$SLOT_SUFFIX" ]; then SLOT="$(grep -oE "androidboot.slot=[^ ]+" /proc/cmdline 2>/dev/null | head -n1 | cut -d= -f2)"; [ -n "$SLOT" ] && SLOT_SUFFIX="_$SLOT"; fi\n')
          banner.append('ui_print "Device : $DEVICE"\n')
          banner.append('ui_print "Android: $ANDROID"\n')
          banner.append('ui_print "Patch  : $PATCH"\n')
          banner.append('if [ -n "$SLOT_SUFFIX" ]; then ui_print "Slot   : $SLOT_SUFFIX"; fi\n')
          banner.append('ui_print " "\n')

          banner.append('if [ -n "$(command -v cmd 2>/dev/null)" ]; then\n')
          banner.append('  (cmd activity start --user 0 -a android.intent.action.VIEW -d "https://github.com/ox1d3x3/Op13_Susfs_kernel" >/dev/null 2>&1 &) || true\n')
          banner.append('elif [ -n "$(command -v am 2>/dev/null)" ]; then\n')
          banner.append('  (am start --user 0 -a android.intent.action.VIEW -d "https://github.com/ox1d3x3/Op13_Susfs_kernel" >/dev/null 2>&1 &) || true\n')
          banner.append('fi\n')

          banner_text = "".join(banner)

          out=[]
          inserted=False
          for line in data:
              out.append(line)
              if (not inserted) and re.match(r'\s*#\s*AnyKernel3', line):
                  out.append("\n# --- Custom Banner (Ox1d3x3) ---\n")
                  out.append(banner_text)
                  out.append("# --- End Banner ---\n\n")
                  inserted=True
          if not inserted:
              out = data[:1] + ["\n# --- Custom Banner (Ox1d3x3) ---\n", banner_text, "# --- End Banner ---\n\n"] + data[1:]

          ak.write_text("".join(out), encoding="utf-8")
          print("Banner injected into anykernel.sh")
          PY


          chmod +x AnyKernel3/anykernel.sh || true
          find AnyKernel3 -type f -name "*.sh" -exec chmod +x {} \; || true
          [ -f AnyKernel3/META-INF/com/google/android/update-binary ] && chmod +x AnyKernel3/META-INF/com/google/android/update-binary || true

          mkdir -p out
          REL="${{ env.KERNEL_RELEASE }}"
          ZIP_NAME="OP13_${{ env.ANDROID_VERSION }}_${REL}_KSUNext_${{ github.run_number }}_SUSFS-${{ github.event.inputs.SUSFS }}_FLASH_THIS.zip"
          (cd AnyKernel3 && zip -r9 "$GITHUB_WORKSPACE/out/$ZIP_NAME" . -x ".git/*" "*.md" "*.txt")
          echo "FLASH_ZIP=$GITHUB_WORKSPACE/out/$ZIP_NAME" >> "$GITHUB_ENV"

      - name: "Upload flashable zip"
        uses: actions/upload-artifact@v4
        with:
          name: OP13_KSUNext_FLASH
          path: ${{ env.FLASH_ZIP }}
