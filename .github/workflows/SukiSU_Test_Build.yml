name: TEST

'on':
  workflow_dispatch:
    inputs:
      SOURCE_URL:
        description: "Kernel source URL (manifest repo OR normal git repo)."
        required: true
        default: "https://github.com/WildKernels/OnePlus_KernelSU_SUSFS.git"
      SOURCE_METHOD:
        description: "How to fetch sources. auto tries repo first, then git."
        type: choice
        required: true
        default: "auto"
        options: ["auto", "repo", "git"]
      SOURCE_BRANCH:
        description: "Branch to use. 'auto' detects default branch."
        required: true
        default: "auto"
      MANIFEST_FILE:
        description: "Repo manifest XML (only used for repo/auto when repo works)."
        required: true
        default: "default.xml"
      SYNC_DEPTH:
        description: "Sync depth. 1 is fastest; 0 is full history."
        required: true
        default: "1"

      DEFCONFIG:
        description: "Defconfig file name under arch/arm64/configs (auto picks gki_defconfig if present)."
        required: true
        default: "auto"

      KERNEL_NAME:
        description: "Exact localversion name (embedded): android15-8-g29d86c5fc9dd-abogki428889875-4k"
        required: true
        default: "android15-8-g29d86c5fc9dd-abogki428889875-4k"

      KSU_REF:
        description: "KernelSU Next ref: stable | dev | legacy | <tag/commit>"
        required: true
        default: "stable"

      PROFILE:
        description: "Preset profile (applies safe toggles)."
        type: choice
        required: true
        default: "balanced"
        options: ["balanced", "performance", "battery"]

      OPT_LEVEL:
        description: "Compiler optimization level."
        type: choice
        required: true
        default: "O2"
        options: ["O2", "O3"]
      LTO:
        description: "Link-Time Optimization."
        type: choice
        required: true
        default: "thin"
        options: ["off", "thin", "full"]

      NET_STACK:
        description: "Network tuning preset."
        type: choice
        required: true
        default: "bbr+fq"
        options: ["default", "bbr", "fq", "bbr+fq"]

      ZRAM:
        description: "Enable ZRAM."
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      ZRAM_COMP:
        description: "ZRAM default compressor (best-effort)."
        type: choice
        required: true
        default: "lz4"
        options: ["lz4", "lzo", "zstd"]

      EXTRA_KCONFIG:
        description: "Extra Kconfig lines appended to defconfig (one per line, e.g. CONFIG_FOO=y). Leave blank if unsure."
        required: false
        default: ""

      TOOLCHAIN:
        description: "Toolchain preference."
        type: choice
        required: true
        default: "auto"
        options: ["auto", "in-tree", "neutron", "system"]

      CCACHE:
        description: "Enable ccache."
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

      PACKAGE_ANYKERNEL:
        description: "Create AnyKernel3 zip (requires ANYKERNEL_REPO)."
        type: choice
        required: true
        default: "Off"
        options: ["Off", "On"]
      ANYKERNEL_REPO:
        description: "AnyKernel3 repo URL (only used if PACKAGE_ANYKERNEL=On)."
        required: false
        default: ""
      ANYKERNEL_BRANCH:
        description: "AnyKernel3 repo branch."
        required: true
        default: "main"

      CREATE_RELEASE:
        description: "Create GitHub Release (tags repo)."
        type: choice
        required: true
        default: "Off"
        options: ["Off", "On"]
      RELEASE_TAG:
        description: "Release tag (auto generates if blank)."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      WORKDIR: kernel_workspace
      ANDROID_VERSION: android15
      KERNEL_VERSION: "6.6"

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@v9
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gawk git gnupg gperf jq \
            libelf-dev libncurses-dev libssl-dev lld lz4 rsync unzip zip \
            python3 python3-pip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          echo "✅ deps installed"

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          sudo curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          repo --version

      - name: Resolve source branch (auto detection)
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          url="${{ inputs.SOURCE_URL }}"
          want="${{ inputs.SOURCE_BRANCH }}"
          symref="$(git ls-remote --symref "$url" HEAD 2>/dev/null || true)"
          detected="$(printf "%s\n" "$symref" | awk '/^ref:/ {print $2}' | sed 's#refs/heads/##' | head -n1)"
          [[ -n "$detected" ]] || detected="master"
          chosen="$detected"
          if [[ "$want" != "auto" && -n "$want" ]]; then
            if git ls-remote --exit-code --heads "$url" "$want" >/dev/null 2>&1; then
              chosen="$want"
            else
              echo "::warning::Branch '$want' not found; using '$detected'"
            fi
          fi
          echo "chosen=$chosen" >> "$GITHUB_OUTPUT"
          echo "detected=$detected" >> "$GITHUB_OUTPUT"
          echo "✅ branch: $chosen (default: $detected)"

      - name: Fetch sources (repo init/sync or git clone)
        shell: bash
        run: |
          set -euo pipefail
          url="${{ inputs.SOURCE_URL }}"
          branch="${{ steps.branch.outputs.chosen }}"
          method="${{ inputs.SOURCE_METHOD }}"
          depth="${{ inputs.SYNC_DEPTH }}"
          manifest="${{ inputs.MANIFEST_FILE }}"

          rm -rf "${WORKDIR}"
          mkdir -p "${WORKDIR}"
          cd "${WORKDIR}"

          try_repo() {
            echo "==> Trying repo init/sync"
            repo init -u "$url" -b "$branch" -m "$manifest"
            flags=( -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags )
            if [[ "$depth" != "0" ]]; then
              flags+=( --depth="$depth" )
            fi
            repo sync "${flags[@]}"
          }

          try_git() {
            echo "==> Trying git clone"
            if [[ "$depth" != "0" ]]; then
              git clone --depth "$depth" --single-branch -b "$branch" "$url" src
            else
              git clone -b "$branch" "$url" src
            fi
          }

          ok="false"
          if [[ "$method" == "repo" ]]; then
            try_repo && ok="true"
          elif [[ "$method" == "git" ]]; then
            try_git && ok="true"
          else
            if try_repo; then ok="true"; else echo "::warning::repo sync failed; falling back to git clone"; try_git && ok="true"; fi
          fi

          if [[ "$ok" != "true" ]]; then
            echo "::error::Could not fetch sources via repo or git."
            exit 1
          fi
          echo "✅ sources fetched"

      - name: Locate kernel_platform/common
        shell: bash
        run: |
          set -euo pipefail
          cd "${WORKDIR}"

          if [[ -d "kernel_platform/common" ]]; then
            kp="$(pwd)/kernel_platform"
          elif [[ -d "src/kernel_platform/common" ]]; then
            kp="$(pwd)/src/kernel_platform"
          elif [[ -d "common" && -d "build" ]]; then
            mkdir -p kernel_platform
            ln -s "$(pwd)/common" kernel_platform/common
            kp="$(pwd)/kernel_platform"
          else
            found="$(find . -maxdepth 4 -type d -name common -path "*/kernel_platform/common" | head -n1 || true)"
            if [[ -n "$found" ]]; then
              kp="$(cd "$(dirname "$found")/.." && pwd)"
            else
              echo "::error::Cannot find kernel_platform/common in fetched sources."
              find . -maxdepth 3 -type d -print | head -n 200 || true
              exit 1
            fi
          fi

          echo "KP_DIR=$kp" >> "$GITHUB_ENV"
          echo "COMMON_DIR=$kp/common" >> "$GITHUB_ENV"
          echo "OUT_DIR=$kp/common/out" >> "$GITHUB_ENV"
          echo "✅ KP_DIR=$kp"

      - name: Setup ccache cache
        if: ${{ inputs.CCACHE == 'On' }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ inputs.PROFILE }}-${{ inputs.OPT_LEVEL }}-${{ inputs.LTO }}-${{ inputs.ZRAM_COMP }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Integrate KernelSU Next (KSUN only)
        shell: bash
        run: |
          set -euo pipefail
          cd "$KP_DIR"
          if [[ -d "$COMMON_DIR/KernelSU-Next" ]]; then
            echo "✅ KernelSU-Next already present."
            exit 0
          fi
          curl -fL https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh -o /tmp/ksu_setup.sh
          head -n 1 /tmp/ksu_setup.sh | grep -q "#!" || { echo "::error::Invalid KernelSU setup.sh"; exit 1; }
          echo "Running setup.sh ref=${{ inputs.KSU_REF }}"
          bash /tmp/ksu_setup.sh "${{ inputs.KSU_REF }}"
          test -d "$COMMON_DIR/KernelSU-Next" || { echo "::error::KernelSU-Next missing after setup"; exit 1; }
          echo "✅ KernelSU-Next integrated"

      - name: Select defconfig
        shell: bash
        run: |
          set -euo pipefail
          want="${{ inputs.DEFCONFIG }}"
          if [[ "$want" == "auto" ]]; then
            if [[ -f "$COMMON_DIR/arch/arm64/configs/gki_defconfig" ]]; then
              echo "DEFNAME=gki_defconfig" >> "$GITHUB_ENV"
              echo "DEFPATH=$COMMON_DIR/arch/arm64/configs/gki_defconfig" >> "$GITHUB_ENV"
              exit 0
            fi
            found="$(find "$COMMON_DIR/arch/arm64/configs" -maxdepth 1 -type f -name "*gki*_defconfig" | head -n1 || true)"
            [[ -n "$found" ]] || { echo "::error::No defconfig found"; ls -la "$COMMON_DIR/arch/arm64/configs" || true; exit 1; }
            echo "DEFNAME=$(basename "$found")" >> "$GITHUB_ENV"
            echo "DEFPATH=$found" >> "$GITHUB_ENV"
          else
            test -f "$COMMON_DIR/arch/arm64/configs/$want" || { echo "::error::Defconfig '$want' not found"; exit 1; }
            echo "DEFNAME=$want" >> "$GITHUB_ENV"
            echo "DEFPATH=$COMMON_DIR/arch/arm64/configs/$want" >> "$GITHUB_ENV"
          fi
          echo "✅ defconfig: $DEFNAME"

      - name: Apply feature presets to defconfig
        shell: bash
        run: |
          set -euo pipefail
          # Clean conflicting lines first
          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_LOCALVERSION_AUTO=/d' "$DEFPATH" || true
          sed -i '/^CONFIG_LTO=/d;/^CONFIG_LTO_CLANG=/d;/^CONFIG_THINLTO=/d' "$DEFPATH" || true
          sed -i '/^CONFIG_CC_OPTIMIZE_FOR_/d' "$DEFPATH" || true
          sed -i '/^CONFIG_DEFAULT_BBR=/d;/^CONFIG_TCP_CONG_BBR=/d' "$DEFPATH" || true
          sed -i '/^CONFIG_DEFAULT_FQ=/d;/^CONFIG_NET_SCH_FQ=/d' "$DEFPATH" || true
          sed -i '/^CONFIG_ZRAM=/d;/^CONFIG_ZRAM_DEF_COMP=/d;/^CONFIG_ZRAM_DEF_COMP_/d' "$DEFPATH" || true

          # Embed your exact kernel string
          echo "CONFIG_LOCALVERSION=\"-${{ inputs.KERNEL_NAME }}\"" >> "$DEFPATH"
          echo "CONFIG_LOCALVERSION_AUTO=n" >> "$DEFPATH"

          # Compiler optimization
          if [[ "${{ inputs.OPT_LEVEL }}" == "O3" ]]; then
            echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$DEFPATH"
          else
            echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O2=y" >> "$DEFPATH"
          fi

          # LTO
          case "${{ inputs.LTO }}" in
            off)
              echo "CONFIG_LTO=n" >> "$DEFPATH"
              echo "CONFIG_LTO_CLANG=n" >> "$DEFPATH"
              ;;
            thin)
              echo "CONFIG_LTO=y" >> "$DEFPATH"
              echo "CONFIG_LTO_CLANG=y" >> "$DEFPATH"
              echo "CONFIG_THINLTO=y" >> "$DEFPATH"
              ;;
            full)
              echo "CONFIG_LTO=y" >> "$DEFPATH"
              echo "CONFIG_LTO_CLANG=y" >> "$DEFPATH"
              echo "CONFIG_THINLTO=n" >> "$DEFPATH"
              ;;
          esac

          # Network tuning
          case "${{ inputs.NET_STACK }}" in
            bbr)
              echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFPATH"
              echo "CONFIG_DEFAULT_BBR=y" >> "$DEFPATH"
              ;;
            fq)
              echo "CONFIG_NET_SCH_FQ=y" >> "$DEFPATH"
              echo "CONFIG_DEFAULT_FQ=y" >> "$DEFPATH"
              ;;
            bbr+fq)
              echo "CONFIG_TCP_CONG_BBR=y" >> "$DEFPATH"
              echo "CONFIG_DEFAULT_BBR=y" >> "$DEFPATH"
              echo "CONFIG_NET_SCH_FQ=y" >> "$DEFPATH"
              echo "CONFIG_DEFAULT_FQ=y" >> "$DEFPATH"
              ;;
            default) : ;;
          esac

          # ZRAM
          if [[ "${{ inputs.ZRAM }}" == "On" ]]; then
            echo "CONFIG_ZRAM=y" >> "$DEFPATH"
            echo "CONFIG_ZSMALLOC=y" >> "$DEFPATH"
            echo "CONFIG_ZRAM_DEF_COMP=\"${{ inputs.ZRAM_COMP }}\"" >> "$DEFPATH"
          fi

          # Extra Kconfig lines (optional)
          if [[ -n "${{ inputs.EXTRA_KCONFIG }}" ]]; then
            echo "---- Applying EXTRA_KCONFIG ----"
            printf "%s\n" "${{ inputs.EXTRA_KCONFIG }}" >> "$DEFPATH"
          fi

          echo "✅ defconfig updated"

      - name: Toolchain selection
        shell: bash
        run: |
          set -euo pipefail
          IN_CLANG="$KP_DIR/prebuilts/clang/host/linux-x86/clang-stable/bin"
          IN_KBT="$KP_DIR/prebuilts/kernel-build-tools/linux-x86/bin"

          choose="${{ inputs.TOOLCHAIN }}"
          if [[ "$choose" == "auto" || "$choose" == "in-tree" ]]; then
            if [[ -d "$IN_CLANG" ]]; then
              echo "TOOLCHAIN_BIN=$IN_CLANG" >> "$GITHUB_ENV"
              echo "KBT_BIN=$IN_KBT" >> "$GITHUB_ENV"
              echo "✅ Using in-tree clang"
              exit 0
            fi
            if [[ "$choose" == "in-tree" ]]; then
              echo "::error::Requested in-tree toolchain but it was not found."
              exit 1
            fi
          fi

          if [[ "$choose" == "auto" || "$choose" == "neutron" ]]; then
            echo "✅ Installing Neutron clang via antman"
            mkdir -p "$HOME/neutron"
            cd "$HOME/neutron"
            curl -fL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman -o antman
            chmod +x antman
            ./antman -S
            if [[ -d "$HOME/neutron/clang/bin" ]]; then
              echo "TOOLCHAIN_BIN=$HOME/neutron/clang/bin" >> "$GITHUB_ENV"
              echo "KBT_BIN=" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::Neutron toolchain installed but clang/bin not found."
            exit 1
          fi

          echo "✅ Using system toolchain"
          echo "TOOLCHAIN_BIN=" >> "$GITHUB_ENV"
          echo "KBT_BIN=" >> "$GITHUB_ENV"

      - name: Configure (defconfig → .config)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_BIN:$KBT_BIN:$PATH"
          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y lld
          fi
          rm -rf "$OUT_DIR"
          mkdir -p "$OUT_DIR"
          make -C "$COMMON_DIR" O="$OUT_DIR" ARCH=arm64 "$DEFNAME"
          make -C "$COMMON_DIR" O="$OUT_DIR" ARCH=arm64 olddefconfig
          egrep -n "CONFIG_KSU=|CONFIG_LOCALVERSION=|CONFIG_LTO|CONFIG_ZRAM=|CONFIG_ZRAM_DEF_COMP=" "$OUT_DIR/.config" || true

      - name: Build kernel Image
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$TOOLCHAIN_BIN:$KBT_BIN:$PATH"
          make -C "$COMMON_DIR" O="$OUT_DIR" ARCH=arm64 \
            CC=clang LD=ld.lld HOSTLD=ld.lld \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            -j"$(nproc)" all
          test -f "$OUT_DIR/arch/arm64/boot/Image"

      - name: Prepare artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          cp "$OUT_DIR/arch/arm64/boot/Image" artifacts/Image
          cp "$OUT_DIR/.config" artifacts/kernel.config
          {
            echo "ANDROID_VERSION=${ANDROID_VERSION}"
            echo "KERNEL_VERSION=${KERNEL_VERSION}"
            echo "KERNEL_NAME=${{ inputs.KERNEL_NAME }}"
            echo "KSU_REF=${{ inputs.KSU_REF }}"
            echo "PROFILE=${{ inputs.PROFILE }}"
            echo "OPT_LEVEL=${{ inputs.OPT_LEVEL }}"
            echo "LTO=${{ inputs.LTO }}"
            echo "NET_STACK=${{ inputs.NET_STACK }}"
            echo "ZRAM=${{ inputs.ZRAM }}"
            echo "ZRAM_COMP=${{ inputs.ZRAM_COMP }}"
            echo "TOOLCHAIN=${{ inputs.TOOLCHAIN }}"
          } > artifacts/build.meta

      - name: Package AnyKernel3 zip (optional)
        if: ${{ inputs.PACKAGE_ANYKERNEL == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ inputs.ANYKERNEL_REPO }}" ]]; then
            echo "::error::PACKAGE_ANYKERNEL=On but ANYKERNEL_REPO is empty."
            exit 1
          fi
          rm -rf anykernel
          git clone --depth 1 -b "${{ inputs.ANYKERNEL_BRANCH }}" "${{ inputs.ANYKERNEL_REPO }}" anykernel
          cp artifacts/Image anykernel/Image
          (cd anykernel && zip -r ../artifacts/AnyKernel3.zip .)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OP13_${{ inputs.KERNEL_NAME }}_KSUN-${{ inputs.KSU_REF }}_${{ inputs.PROFILE }}_${{ inputs.OPT_LEVEL }}_LTO-${{ inputs.LTO }}_ZRAM-${{ inputs.ZRAM_COMP }}
          path: artifacts/*

      - name: Compute release metadata
        if: ${{ inputs.CREATE_RELEASE == 'On' }}
        id: rel
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.RELEASE_TAG }}"
          if [[ -z "$tag" ]]; then
            tag="op13-${{ inputs.KERNEL_NAME }}-ksun-${{ inputs.KSU_REF }}-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=OP13 ${ANDROID_VERSION} ${KERNEL_VERSION} | ${{ inputs.KERNEL_NAME }} | KSUN ${{ inputs.KSU_REF }}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ inputs.CREATE_RELEASE == 'On' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          files: |
            artifacts/Image
            artifacts/kernel.config
            artifacts/build.meta
            artifacts/AnyKernel3.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
