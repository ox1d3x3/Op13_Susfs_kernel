name: ⚡ SukiSU Ultra - OnePlus 13 (Auto-Fix)

permissions:
  contents: write
  actions: write

env:
  # 🌍 Global Settings
  TZ: Asia/Shanghai
  RELEASE_NAME: "SukiSU Ultra: OnePlus 13"
  
  # 📱 Device Specifics (Hardcoded for OP13)
  DEVICE_MODEL: "OnePlus 13"
  ANDROID_VER: "android15"
  KERNEL_VER: "6.6"
  # The exact kernel tag you provided
  KERNEL_TAG: "android15-8-g29d86c5fc9dd-abogki428889875-4k"

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: '🧹 Wipe Cache (Clean Build)'
        type: boolean
        default: false
      susfs_version:
        description: '🛡️ SUSFS Version (Leave empty for auto)'
        type: string
        default: ''

jobs:
  # -----------------------------------------------------------------------
  # JOB 1: CONFIGURATION & SETUP
  # -----------------------------------------------------------------------
  setup-ultra:
    name: ⚙️ Initialize Ultra Build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
    steps:
      - name: 📥 Checkout Source (Full)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Get everything to avoid "file not found" errors

      - name: 💎 Generate SukiSU Ultra Config
        id: gen-matrix
        shell: bash
        run: |
          echo "::group::🔍 SukiSU Intelligence: Config Search"
          
          # 1. Search for an existing config file recursively
          CONFIG_FILE=""
          if [ -d "configs" ]; then
             FOUND=$(find configs -name "*.json" -print0 | xargs -0 grep -l "\"model\": \"${{ env.DEVICE_MODEL }}\"" || true)
             if [ ! -z "$FOUND" ]; then
                CONFIG_FILE=$(echo "$FOUND" | head -n 1)
                echo "✅ Found existing config: $CONFIG_FILE"
             fi
          fi

          # 2. FAIL-SAFE: If no config exists, create the "Ultra" config manually
          if [ -z "$CONFIG_FILE" ]; then
            echo "⚠️ No config found. Generating SukiSU Ultra Config from scratch..."
            
            # Create a temporary config structure based on your requirements
            cat <<EOF > sukisu_ultra_config.json
            {
              "model": "${{ env.DEVICE_MODEL }}",
              "android_version": "${{ env.ANDROID_VER }}",
              "kernel_version": "${{ env.KERNEL_VER }}",
              "repo": "https://github.com/OnePlusOSS/android_kernel_oneplus_sm8750.git",
              "branch": "${{ env.KERNEL_TAG }}",
              "boot_img": "vendor_boot.img" 
            }
          EOF
            CONFIG_FILE="sukisu_ultra_config.json"
            echo "✅ Created fail-safe config: $CONFIG_FILE"
          fi
          
          # 3. Read the base config
          BASE_JSON=$(jq -c '.' "$CONFIG_FILE")
          
          # 4. Inject ULTRA Features (SusFS, KSU Next, HMBIRD, LZ4)
          # We force these settings regardless of what the file says
          ULTRA_JSON=$(echo "$BASE_JSON" | jq -c '
            . + {
              "ksu_type": "KSUN",
              "ksu_hash": "dev",
              "susfs": true,
              "hmbird": true,
              "lz4_ramdisk": true,
              "lto": true
            }
          ')
          
          echo "📝 Final Configuration:"
          echo "$ULTRA_JSON" | jq .
          
          # 5. Output for Matrix
          # We wrap it in an array so the matrix strategy can read it
          MATRIX_JSON="[$ULTRA_JSON]"
          WRAPPED=$(jq -n --argjson items "$MATRIX_JSON" '{ include: $items }')
          echo "matrix=$(jq -c . <<< "$WRAPPED")" >> "$GITHUB_OUTPUT"
          
          echo "::endgroup::"

  # -----------------------------------------------------------------------
  # JOB 2: BUILD KERNEL
  # -----------------------------------------------------------------------
  build-ultra:
    name: 🚀 Build (OnePlus 13)
    needs: setup-ultra
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-ultra.outputs.matrix) }}
    
    steps:
      # --- SPACE CLEANUP (PREVENT DISK FULL) ---
      - name: 🧹 Deep Clean (Pre-Build)
        uses: docker://alpine:latest
        with:
          args: /bin/sh -c "rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true"
      
      - name: 🧹 Apt Clean
        run: |
          sudo apt-get clean
          docker rmi $(docker images -q) 2>/dev/null || true

      # --- CHECKOUT & TOOLS ---
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🛠️ Install Ultra Dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl build-essential clang lld flex bison libelf-dev \
            libssl-dev libncurses-dev zlib1g-dev liblz4-tool libxml2-utils \
            rsync unzip dwarves file python3 ccache jq bc dos2unix kmod
          
      # --- CACHE ---
      - name: ⚡ CCache Setup
        if: ${{ inputs.clean_build != true }}
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-${{ env.KERNEL_VER }}-${{ env.DEVICE_MODEL }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.KERNEL_VER }}-

      - name: ⚙️ Configure CCache
        run: |
          mkdir -p /home/runner/.ccache
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 5G
          ccache -o compression=true
          ccache -z

      # --- BUILD ---
      - name: 📝 Prepare Config Object
        id: prep_config
        shell: bash
        run: |
          # The local action needs the config without KSU keys to avoid conflicts
          echo "config_json=$(jq -nc --argjson m '${{ toJSON(matrix) }}' '$m | del(.ksu_type, .ksu_hash)')" >> "$GITHUB_OUTPUT"

      - name: 🔨 Execute SukiSU Build Action
        id: build
        uses: ./.github/actions
        with:
          op_config_json: ${{ steps.prep_config.outputs.config_json }}
          ksu_type: ${{ matrix.ksu_type }}
          ksu_branch_or_hash: ${{ matrix.ksu_hash }}
          susfs_commit_hash_or_branch: ${{ inputs.susfs_version }}
          optimize_level: O3
          clean: ${{ inputs.clean_build }}

      # --- VERIFY & SUMMARY ---
      - name: 📊 Verify Build
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" == "success" ]; then
            echo "✅ Build Passed!"
            echo "::notice title=SukiSU Ultra::Build Successful for OnePlus 13"
          else
            echo "❌ Build Failed"
            exit 1
          fi

      # --- POST-BUILD CLEANUP ---
      - name: 🧹 Cleanup Workspace
        if: always()
        run: |
          sudo rm -rf kernel out build
          ccache -s

  # -----------------------------------------------------------------------
  # JOB 3: RELEASE
  # -----------------------------------------------------------------------
  release-ultra:
    name: 📦 Publish Release
    needs: build-ultra
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 🏷️ Create Tag
        id: tag
        run: |
          TAG="SukiSU-Ultra-OP13-$(date +'%Y%m%d-%H%M')"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: 🚀 Publish to GitHub
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "⚡ ${{ env.RELEASE_NAME }} - ${{ steps.tag.outputs.tag_name }}"
          body: |
            # ⚡ SukiSU Ultra: OnePlus 13 Edition
            
            **The World's Best OnePlus 13 Kernel Build**
            
            - **Device:** OnePlus 13 (SM8750)
            - **Android:** 15
            - **Kernel Base:** 6.6
            - **Base Tag:** `${{ env.KERNEL_TAG }}`
            
            ### 🛡️ Ultra Features
            - ✅ **KernelSU Next:** Latest `dev` branch
            - ✅ **SusFS v2.0:** Enabled & Optimized
            - ✅ **Performance:** O3 Optimization + ThinLTO
            - ✅ **Boot:** LZ4 Compression
            
            *Flash using Kernel Flasher or FKM.*
          files: |
            artifacts/**/*.zip
            artifacts/**/*.img
