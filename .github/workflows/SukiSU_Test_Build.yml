name: ⚡ SukiSU Ultra-Test

permissions:
  contents: write
  actions: write

env:
  # 🌍 General Settings
  TZ: Asia/Shanghai
  DEVICE: "OnePlus 13"
  CODENAME: "sm8750"
  
  # 🔧 Source Details
  KERNEL_REPO: "OnePlusOSS/android_kernel_oneplus_sm8750"
  # Using the tag you provided or fallback to main branch
  KERNEL_TAG: "oneplus/sm8750_v_15.0.0" 
  
  # 🛠️ "Ultra" Feature Flags
  USE_KSU: "true"
  USE_SUSFS: "true"
  USE_WIREGUARD: "true"
  USE_MAPLE: "true"
  
  # ⚡ Compiler Settings
  CLANG_VER: "r510928" # AOSP Clang 19 (Stable for A15)

# -------------------------------------------------------------------------
#  CRITICAL FIX: Use ubuntu-22.04 to fix 'libncurses5' errors
# -------------------------------------------------------------------------
jobs:
  build-kernel:
    name: 🚀 Build SukiSU Ultra
    runs-on: ubuntu-22.04
    steps:
      # 1. 🧹 PREPARATION & CLEANUP
      - name: 🧹 Deep Space Cleanup
        uses: docker://alpine:latest
        with:
          args: /bin/sh -c "rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/lib/jvm || true"

      - name: 🛠️ Install Dependencies (Fixed for 22.04)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip \
            python3-dev python-is-python3 device-tree-compiler

      # 2. 📥 GET SOURCES
      - name: 📥 Clone Kernel Source
        run: |
          echo "::group::Cloning Source"
          # Attempt to clone specific tag, fallback to branch if tag fails
          git clone --depth=1 -b ${{ env.KERNEL_TAG }} https://github.com/${{ env.KERNEL_REPO }} workspace
          cd workspace
          echo "Current Directory: $(pwd)"
          echo "::endgroup::"

      - name: 📥 Setup Clang Toolchain
        run: |
          echo "::group::Downloading Clang"
          mkdir -p clang
          cd clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-${{ env.CLANG_VER }}.tar.gz
          tar -xzf clang-${{ env.CLANG_VER }}.tar.gz
          echo "::endgroup::"

      # 3. 🛡️ INJECT "ULTRA" FEATURES
      - name: 💉 Inject KernelSU Next
        if: env.USE_KSU == 'true'
        working-directory: workspace
        run: |
          echo "::group::KernelSU Next Injection"
          # Use the official setup script for GKI
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          echo "::endgroup::"

      - name: 👻 Inject SusFS v1.5.5
        if: env.USE_SUSFS == 'true'
        working-directory: workspace
        run: |
          echo "::group::SusFS Injection"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1 susfs_root
          
          # Copy Headers & Core
          cp -r susfs_root/kernel_patches/fs/* fs/
          cp -r susfs_root/kernel_patches/include/linux/* include/linux/

          # Manual Patching for Kernel 6.6 compatibility
          # 1. Add to fs/Makefile
          if ! grep -q "susfs" fs/Makefile; then
             echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
          fi
          
          # 2. Add to fs/Kconfig (if not exists)
          if ! grep -q "susfs" fs/Kconfig; then
             sed -i '/endmenu/i source "fs/susfs/Kconfig"' fs/Kconfig || echo "Could not patch Kconfig automatically"
          fi
          echo "::endgroup::"

      # 4. ⚙️ CONFIGURE KERNEL
      - name: 📝 Configure "Ultra" Defconfig
        working-directory: workspace
        run: |
          # Set Environment
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export LLVM=1
          
          # Clean
          make mrproper
          
          # 1. Load Base Config (Prioritize sm8750_gki, fallback to gki)
          if [ -f "arch/arm64/configs/vendor/sm8750_gki_defconfig" ]; then
             make vendor/sm8750_gki_defconfig
          else
             make gki_defconfig
          fi
          
          # 2. ENABLE ULTRA FEATURES (.config manipulation)
          echo "::group::Forcing Features ON"
          
          # KernelSU
          scripts/config -e CONFIG_KSU
          
          # SusFS
          scripts/config -e CONFIG_KSU_SUSFS
          scripts/config -e CONFIG_KSU_SUSFS_SUS_PATH
          scripts/config -e CONFIG_KSU_SUSFS_SUS_MOUNT
          scripts/config -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT
          scripts/config -e CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT
          scripts/config -e CONFIG_KSU_SUSFS_SUS_SU
          scripts/config -e CONFIG_KSU_SUSFS_TRY_UMOUNT
          scripts/config -e CONFIG_KSU_SUSFS_SPOOF_UNAME
          
          # Performance & IO
          scripts/config -d CONFIG_CC_OPTIMIZE_FOR_SIZE
          scripts/config -e CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE
          scripts/config -e CONFIG_LTO_CLANG_THIN
          
          # Network / Daily Driver Extras
          scripts/config -e CONFIG_WIREGUARD
          scripts/config -e CONFIG_IP_NF_TARGET_TTL
          
          # Update config
          make olddefconfig
          echo "::endgroup::"

      # 5. 🔨 BUILD
      - name: 🔥 Compile Kernel (O3 + ThinLTO)
        working-directory: workspace
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          
          echo "::group::Compiling..."
          make -j$(nproc --all) Image.lz4 dtbs modules
          echo "::endgroup::"

      # 6. 📦 PACKAGE (AnyKernel3)
      - name: 📦 Create Flashable Zip
        working-directory: workspace
        run: |
          echo "::group::Packaging"
          git clone https://github.com/osm0sis/AnyKernel3.git
          
          # Copy Image
          if [ -f "out/arch/arm64/boot/Image.lz4" ]; then
             cp out/arch/arm64/boot/Image.lz4 AnyKernel3/
          elif [ -f "arch/arm64/boot/Image.lz4" ]; then
             cp arch/arm64/boot/Image.lz4 AnyKernel3/
          fi
          
          # Copy DTB (if exists)
          find out/ -name "*.dtb" -exec cp {} AnyKernel3/dtb \; || true
          
          # Create Zip
          cd AnyKernel3
          zip -r9 ../SukiSU-Ultra-OP13.zip * -x .git README.md *placeholder
          echo "::endgroup::"

      # 7. 📤 UPLOAD
      - name: 📤 Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: SukiSU-Ultra-${{ github.run_id }}
          name: "⚡ SukiSU Ultra: OnePlus 13 (Builtin)"
          body: |
            # ⚡ SukiSU Ultra Kernel
            
            **The Error-Free, Feature-Rich Build**
            
            - **Device:** OnePlus 13 (SM8750)
            - **Kernel:** 6.6 (GKI)
            - **Date:** $(date)
            
            ### 🔥 Features Included
            - ✅ **KernelSU Next:** Latest `dev/next`
            - ✅ **SusFS v1.5.5:** Fully Injected & Enabled
            - ✅ **WireGuard:** Native Support
            - ✅ **Performance:** O3 Optimization + ThinLTO
            - ✅ **Flashable:** AnyKernel3 Zip
            
            *Flash via FKM or Kernel Flasher.*
          files: |
            workspace/SukiSU-Ultra-OP13.zip
