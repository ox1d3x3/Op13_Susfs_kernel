name: ⚡ SukiSU Ultra-TEST

permissions:
  contents: write
  actions: write

env:
  TZ: Asia/Shanghai
  # Ultra Branding
  RELEASE_PREFIX: "SukiSU Ultra"
  # Target Specifics
  TARGET_DEVICE: "OnePlus 13"
  TARGET_ANDROID: "android15"
  TARGET_KERNEL: "6.6"

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: '📦 Create SukiSU Ultra Release?'
        required: true
        type: boolean
        default: true
      clean_build:
        description: '🧹 Clean Build (No ccache for max stability)'
        type: boolean
        default: false
      susfs_version:
        description: '🛡️ SUSFS Version/Hash (Leave empty for auto)'
        type: string
        default: ''

jobs:
  configure-ultra:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      device_count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            configs/
          sparse-checkout-cone-mode: false

      - name: 💎 Generate Ultra Configuration
        id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::🔍 Locating OnePlus 13 Config"
          
          # 1. Find the Config File for OnePlus 13 / Android 15 / Kernel 6.6
          # We look for files containing "OnePlus 13" and "android15"
          
          TARGET_FILE=""
          mapfile -t all_json_files < <(find configs/ -name "*.json" -print0 | xargs -0 -n1)
          
          for file in "${all_json_files[@]}"; do
            if [ -f "$file" ]; then
              # Check if this file matches our Target Specs
              if jq -e ".model == \"${{ env.TARGET_DEVICE }}\" and .android_version == \"${{ env.TARGET_ANDROID }}\" and .kernel_version == \"${{ env.TARGET_KERNEL }}\"" "$file" > /dev/null; then
                TARGET_FILE="$file"
                echo "✅ Found Base Config: $file"
                break
              fi
            fi
          done
          
          if [ -z "$TARGET_FILE" ]; then
            echo "::error::❌ Could not find a config file for ${{ env.TARGET_DEVICE }} ${{ env.TARGET_ANDROID }} ${{ env.TARGET_KERNEL }}"
            exit 1
          fi
          
          # 2. Inject "Ultra" Settings
          # We force: KSUN (Next), Dev branch, SusFS=true, HMBIRD=true, O3 optimization hints
          
          echo "::group::⚙️  Injecting SukiSU Ultra Features"
          
          # Base config
          BASE_JSON=$(jq -c '.' "$TARGET_FILE")
          
          # The Ultra Matrix Object
          # We merge the base config with our hardcoded overrides
          ULTRA_MATRIX=$(jq -n \
            --argjson base "$BASE_JSON" \
            --arg ksu_type "KSUN" \
            --arg ksu_hash "dev" \
            --argjson susfs true \
            --argjson hmbird true \
            --argjson lz4 true \
            '$base + {
              ksu_type: $ksu_type, 
              ksu_hash: $ksu_hash, 
              susfs: $susfs,
              hmbird: $hmbird,
              lz4_ramdisk: $lz4
            }' \
          )
          
          # Wrap it for the matrix strategy (array of 1)
          FINAL_JSON="[$ULTRA_MATRIX]"
          
          echo "📝 Ultra Config Generated:"
          echo "$FINAL_JSON" | jq .
          
          WRAPPED=$(jq -n --argjson items "$FINAL_JSON" '{ include: $items }')
          
          echo "matrix=$(jq -c . <<< "$wrapped")" >> "$GITHUB_OUTPUT"
          echo "count=1" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

  build-ultra:
    name: 🚀 Build SukiSU Ultra
    needs: configure-ultra
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure-ultra.outputs.matrix) }}
    outputs:
      ksun_ver: ${{ steps.build-stat.outputs.ksu_version }}
    steps:
      # --- CLEANUP PHASE (CRITICAL FOR STABILITY) ---
      - name: 🧹 Deep Space Cleanup
        run: |
          echo "::group::Removing Unnecessary Software"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker rmi $(docker images -q) 2>/dev/null || true
          echo "✅ Disk Space Optimized"
          echo "::endgroup::"

      - name: 📥 Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --- DEPENDENCY PHASE ---
      - name: 🛠️ Install Build Tools
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential clang lld flex bison \
            libelf-dev libssl-dev libncurses-dev zlib1g-dev liblz4-tool \
            libxml2-utils rsync unzip dwarves file python3 ccache jq bc dos2unix kmod libdw-dev elfutils
          echo "✅ Build Environment Ready"

      # --- CACHE PHASE ---
      - name: ⚡ Configure Ultra CCache
        if: ${{ inputs.clean_build != true }}
        run: |
          if command -v ccache >/dev/null 2>&1; then
            # Use lower compression for speed (1) or higher for space (3-5). 
            # For "Ultra" speed, we use 1.
            ccache -o max_size=3.0G
            ccache -o compression=true
            ccache -o compression_level=1
            ccache -s
          fi

      # --- CONFIG PREP ---
      - name: 📝 Prepare Config
        id: prepare_config
        shell: bash
        run: |
          # The local action expects op_config_json WITHOUT ksu fields usually, 
          # as it handles them via inputs. We strip them here just in case.
          echo "config_json=$(jq -nc --argjson m '${{ toJSON(matrix) }}' '$m | del(.ksu_type, .ksu_hash)')" >> "$GITHUB_OUTPUT"

      # --- BUILD EXECUTION ---
      - name: 🔨 Compile SukiSU Kernel
        id: build
        uses: ./.github/actions
        with:
          op_config_json: ${{ steps.prepare_config.outputs.config_json }}
          ksu_type: ${{ matrix.ksu_type }}
          ksu_branch_or_hash: ${{ matrix.ksu_hash }}
          susfs_commit_hash_or_branch: ${{ inputs.susfs_version }}
          optimize_level: O3  # FORCED ULTRA OPTIMIZATION
          clean: ${{ inputs.clean_build }}

      # --- STATS & VERIFICATION ---
      - name: 📊 Build Verification
        id: build-stat
        if: always()
        run: |
          if [ "${{ steps.build.outcome }}" = "success" ]; then
            echo "✅ Build SUCCESS"
            echo "ksu_version=${{ steps.build.outputs.ksu_version }}" >> "$GITHUB_OUTPUT"
            
            # Write Summary
            echo "### ⚡ SukiSU Ultra Build Complete" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Device** | ${{ matrix.model }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Optimization** | O3 (Max) |" >> $GITHUB_STEP_SUMMARY
            echo "| **KernelSU** | Next v${{ steps.build.outputs.ksu_version }} |" >> $GITHUB_STEP_SUMMARY
            echo "| **SusFS** | Enabled |" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build FAILED"
            exit 1
          fi

      # --- CLEANUP (Preserve CCache) ---
      - name: 🧹 Post-Build Cleanup
        run: |
          sudo rm -rf "$GITHUB_WORKSPACE/out" "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/kernel/out"
          if command -v ccache >/dev/null 2>&1; then ccache -s; fi

  release-ultra:
    needs: [build-ultra]
    runs-on: ubuntu-latest
    if: ${{ inputs.make_release }}
    permissions:
      contents: write
    steps:
      - name: 📥 Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: 🏷️ Generate Release Tag
        id: tag
        run: |
          DATE_TAG="$(date +'%Y.%m.%d-Ultra')"
          echo "tag_name=SukiSU-${DATE_TAG}" >> "$GITHUB_OUTPUT"

      - name: 📦 Publish SukiSU Ultra Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "⚡ SukiSU Ultra: OnePlus 13 (A15/6.6) - ${{ steps.tag.outputs.tag_name }}"
          body: |
            # ⚡ SukiSU Ultra Kernel Release
            
            **The World's Best OnePlus 13 Kernel Build**
            
            > **Build Date:** $(date)
            > **Target:** OnePlus 13 (Android 15 / Kernel 6.6)
            
            ### 🔥 Ultra Features
            - **Performance:** O3 Optimization + ThinLTO
            - **Root:** KernelSU Next (Latest Dev)
            - **Stealth:** SUSFS v2.0 Enabled
            - **Scheduler:** HMBIRD Optimized
            - **Compression:** LZ4 (Fast Boot)
            
            ### 📥 Installation
            1. Ensure you are on OxygenOS/ColorOS 15.
            2. Flash via Kernel Flasher or FKM.
            3. Enjoy balanced performance and battery life.
            
            *Built with ❤️ by SukiSU Workflow*
          files: |
            artifacts/**/*.zip
            artifacts/**/*.img
