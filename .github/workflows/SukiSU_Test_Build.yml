name: KSU

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "Repo manifest URL (e.g., a kernel_platform repo/manifest repo)"
        required: true
        default: "https://github.com/WildKernels/OnePlus_KernelSU_SUSFS.git"
      MANIFEST_BRANCH:
        description: "Manifest branch. Leave 'auto' to detect default branch."
        required: true
        default: "auto"
      MANIFEST_FILE:
        description: "Manifest XML file (usually default.xml)"
        required: true
        default: "default.xml"
      SYNC_DEPTH:
        description: "Repo sync depth (0=full history; 1=shallow). Shallow is faster."
        required: true
        default: "1"
      FETCH_TAGS:
        description: "Fetch git tags (recommended Off unless you need tag-based versioning)"
        type: choice
        required: true
        default: "Off"
        options: ["Off", "On"]

      ANDROID_VERSION:
        description: "Label only (artifact naming)"
        required: true
        default: "android15"
      KERNEL_VERSION:
        description: "Label only (artifact naming)"
        required: true
        default: "6.6"
      KERNEL_NAME:
        description: "Exact localversion name to embed (e.g. android15-8-g...-4k)"
        required: true
        default: "android15-8-g29d86c5fc9dd-abogki428889875-4k"

      KSU_REF:
        description: "KernelSU Next ref: stable | dev | legacy | <tag/commit>. Default: stable"
        required: true
        default: "stable"

      FORCE_LZ4_ZRAM:
        description: "Enable LZ4 ZRAM config (best-effort)"
        type: choice
        required: true
        default: "Off"
        options: ["Off", "On"]

      BUILD_DEFCONFIG:
        description: "Defconfig name. Leave 'auto' to use arch/arm64/configs/gki_defconfig if present."
        required: true
        default: "auto"

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      WORKDIR: kernel_workspace
      KP_DIR: kernel_workspace/kernel_platform
      COMMON_DIR: kernel_workspace/kernel_platform/common
      OUT_DIR: kernel_workspace/kernel_platform/common/out

    steps:
      - name: Checkout repo (this repo)
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex gawk git gnupg gperf jq \
            libelf-dev libncurses-dev libssl-dev lld lz4 rsync unzip zip \
            python3 python3-pip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          ccache --version || true
          echo "✅ deps installed"

      - name: Install repo tool (required for repo init/sync)
        shell: bash
        run: |
          set -euo pipefail
          sudo curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo
          export PATH="/usr/local/bin:$PATH"
          command -v repo
          repo --version

      - name: Detect manifest default branch (if MANIFEST_BRANCH=auto)
        id: detect_branch
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_URL="${{ inputs.MANIFEST_URL }}"
          WANT="${{ inputs.MANIFEST_BRANCH }}"
          # detect default branch
          symref="$(git ls-remote --symref "$MANIFEST_URL" HEAD 2>/dev/null || true)"
          detected="$(printf "%s\n" "$symref" | awk '/^ref:/ {print $2}' | sed 's#refs/heads/##' | head -n1)"
          if [[ -z "$detected" ]]; then
            detected="master"
          fi

          chosen="$detected"
          if [[ "$WANT" != "auto" && -n "$WANT" ]]; then
            if git ls-remote --exit-code --heads "$MANIFEST_URL" "$WANT" >/dev/null 2>&1; then
              chosen="$WANT"
            else
              echo "::warning::MANIFEST_BRANCH '$WANT' not found; falling back to '$detected'."
            fi
          fi

          echo "chosen=$chosen" >> "$GITHUB_OUTPUT"
          echo "detected=$detected" >> "$GITHUB_OUTPUT"
          echo "Manifest branch chosen: $chosen (detected default: $detected)"

      - name: Repo init + sync kernel sources
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:$PATH"
          mkdir -p "${WORKDIR}"
          cd "${WORKDIR}"

          MANIFEST_URL="${{ inputs.MANIFEST_URL }}"
          MANIFEST_BRANCH="${{ steps.detect_branch.outputs.chosen }}"
          MANIFEST_FILE="${{ inputs.MANIFEST_FILE }}"
          DEPTH="${{ inputs.SYNC_DEPTH }}"

          echo "repo init: url=$MANIFEST_URL branch=$MANIFEST_BRANCH manifest=$MANIFEST_FILE depth=$DEPTH"
          repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" -m "$MANIFEST_FILE"

          # Sync flags
          FLAGS=( -c -j"$(nproc)" --force-sync --no-clone-bundle )
          if [[ "${{ inputs.FETCH_TAGS }}" == "Off" ]]; then
            FLAGS+=( --no-tags )
          fi
          if [[ "$DEPTH" != "0" ]]; then
            FLAGS+=( --depth="$DEPTH" )
          fi

          repo sync "${FLAGS[@]}"

          test -d kernel_platform || { echo "::error::kernel_platform not found after sync"; ls -la; exit 1; }
          test -d kernel_platform/common || { echo "::error::kernel_platform/common not found after sync"; ls -la kernel_platform; exit 1; }
          echo "✅ repo sync done"

      - name: Select defconfig
        id: defcfg
        shell: bash
        run: |
          set -euo pipefail
          COMMON="${COMMON_DIR}"
          want="${{ inputs.BUILD_DEFCONFIG }}"
          if [[ "$want" == "auto" ]]; then
            if [[ -f "${COMMON}/arch/arm64/configs/gki_defconfig" ]]; then
              echo "path=${COMMON}/arch/arm64/configs/gki_defconfig" >> "$GITHUB_OUTPUT"
              echo "name=gki_defconfig" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # fallback: first match
            found="$(find "${COMMON}/arch/arm64/configs" -maxdepth 1 -type f -name "*gki*_defconfig" | head -n1 || true)"
            if [[ -n "$found" ]]; then
              echo "path=$found" >> "$GITHUB_OUTPUT"
              echo "name=$(basename "$found")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Could not auto-detect defconfig under arch/arm64/configs"
            ls -la "${COMMON}/arch/arm64/configs" || true
            exit 1
          else
            # user supplied file name (assume arch/arm64/configs/<name>)
            if [[ -f "${COMMON}/arch/arm64/configs/${want}" ]]; then
              echo "path=${COMMON}/arch/arm64/configs/${want}" >> "$GITHUB_OUTPUT"
              echo "name=${want}" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Defconfig '${want}' not found under arch/arm64/configs"
              ls -la "${COMMON}/arch/arm64/configs" || true
              exit 1
            fi
          fi

      - name: Embed kernel localversion string (KERNEL_NAME)
        shell: bash
        run: |
          set -euo pipefail
          DEF_PATH="${{ steps.defcfg.outputs.path }}"
          KNAME="${{ inputs.KERNEL_NAME }}"

          # Ensure deterministic localversion
          # Remove previous CONFIG_LOCALVERSION / AUTO if any
          sed -i '/^CONFIG_LOCALVERSION=/d' "$DEF_PATH" || true
          sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "$DEF_PATH" || true
          {
            echo "CONFIG_LOCALVERSION=\"-${KNAME}\""
            echo "CONFIG_LOCALVERSION_AUTO=n"
          } >> "$DEF_PATH"

          echo "✅ Updated defconfig localversion to -${KNAME}"
          tail -n 5 "$DEF_PATH" || true

      - name: Integrate KernelSU Next (KSUN only)
        shell: bash
        run: |
          set -euo pipefail
          KP="${KP_DIR}"
          COMMON="${COMMON_DIR}"

          if [[ -d "${COMMON}/KernelSU-Next" ]]; then
            echo "✅ KernelSU-Next already present; skipping setup."
            exit 0
          fi

          curl -fL https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh -o /tmp/ksu_setup.sh
          head -n 1 /tmp/ksu_setup.sh | grep -q "#!" || { echo "::error::setup.sh download invalid"; exit 1; }

          cd "${KP}"
          echo "Running KernelSU-Next setup with ref: ${{ inputs.KSU_REF }}"
          bash /tmp/ksu_setup.sh "${{ inputs.KSU_REF }}"

          test -d "${COMMON}/KernelSU-Next" || { echo "::error::KernelSU-Next dir missing after setup"; exit 1; }
          echo "✅ KernelSU-Next integrated"

      - name: Toolchain setup (ensure clang + ld.lld)
        shell: bash
        run: |
          set -euo pipefail
          KP="${KP_DIR}"

          # Prefer in-tree prebuilts if present
          if [[ -d "${KP}/prebuilts/clang/host/linux-x86/clang-stable/bin" ]]; then
            echo "✅ Using in-tree clang-stable"
            echo "TOOLCHAIN_BIN=${KP}/prebuilts/clang/host/linux-x86/clang-stable/bin" >> "$GITHUB_ENV"
          else
            echo "::warning::In-tree clang-stable not found; using system clang (may be incompatible)."
            echo "TOOLCHAIN_BIN=" >> "$GITHUB_ENV"
          fi

          # Kernel build tools (lld often lives here)
          if [[ -d "${KP}/prebuilts/kernel-build-tools/linux-x86/bin" ]]; then
            echo "KBUILD_BIN=${KP}/prebuilts/kernel-build-tools/linux-x86/bin" >> "$GITHUB_ENV"
          else
            echo "KBUILD_BIN=" >> "$GITHUB_ENV"
          fi

      - name: Configure kernel (defconfig + options)
        shell: bash
        run: |
          set -euo pipefail
          COMMON="${COMMON_DIR}"
          OUT="${OUT_DIR}"
          DEFNAME="${{ steps.defcfg.outputs.name }}"

          export PATH="${TOOLCHAIN_BIN}:${KBUILD_BIN}:${PATH}"
          echo "clang: $(command -v clang || true)"
          echo "ld.lld: $(command -v ld.lld || true)"
          if ! command -v ld.lld >/dev/null 2>&1; then
            echo "::warning::ld.lld not found in PATH; installing lld"
            sudo apt-get update
            sudo apt-get install -y lld
          fi
          command -v ld.lld

          rm -rf "$OUT"
          mkdir -p "$OUT"

          make -C "$COMMON" O="$OUT" ARCH=arm64 "$DEFNAME"

          # Best-effort feature toggles via scripts/config
          CFG="${OUT}/.config"
          SCONF="${COMMON}/scripts/config"
          if [[ -x "$SCONF" ]]; then
            # KernelSU is expected to add CONFIG_KSU; enforce if possible
            "$SCONF" --file "$CFG" -e KSU || true

            if [[ "${{ inputs.FORCE_LZ4_ZRAM }}" == "On" ]]; then
              "$SCONF" --file "$CFG" -e ZRAM || true
              "$SCONF" --file "$CFG" --set-str ZRAM_DEF_COMP lz4 || true
              "$SCONF" --file "$CFG" -e ZRAM_DEF_COMP_LZ4 || true
              "$SCONF" --file "$CFG" -e CRYPTO_LZ4 || true
              "$SCONF" --file "$CFG" -e LZ4_COMPRESS || true
              "$SCONF" --file "$CFG" -e LZ4_DECOMPRESS || true
            fi
          else
            echo "::warning::scripts/config not found; skipping optional config edits."
          fi

          make -C "$COMMON" O="$OUT" ARCH=arm64 olddefconfig

          echo "---- key flags ----"
          egrep -n "CONFIG_KSU=|CONFIG_ZRAM=|CONFIG_ZRAM_DEF_COMP=" "$CFG" || true

      - name: Build kernel Image
        shell: bash
        run: |
          set -euo pipefail
          COMMON="${COMMON_DIR}"
          OUT="${OUT_DIR}"

          export PATH="${TOOLCHAIN_BIN}:${KBUILD_BIN}:${PATH}"
          echo "---- toolchain ----"
          clang --version || true
          ld.lld --version || true

          make -C "$COMMON" O="$OUT" ARCH=arm64 \
            CC=clang LD=ld.lld HOSTLD=ld.lld \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            -j"$(nproc)" all

          test -f "$OUT/arch/arm64/boot/Image"
          echo "✅ Image built: $OUT/arch/arm64/boot/Image"

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp "${OUT_DIR}/arch/arm64/boot/Image" artifacts/Image
          cp "${OUT_DIR}/.config" artifacts/kernel.config

          {
            echo "ANDROID_VERSION=${{ inputs.ANDROID_VERSION }}"
            echo "KERNEL_VERSION=${{ inputs.KERNEL_VERSION }}"
            echo "KERNEL_NAME=${{ inputs.KERNEL_NAME }}"
            echo "KSU_REF=${{ inputs.KSU_REF }}"
            echo "FORCE_LZ4_ZRAM=${{ inputs.FORCE_LZ4_ZRAM }}"
          } > artifacts/build.meta

          echo "✅ artifacts ready"
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OP13_${{ inputs.ANDROID_VERSION }}_${{ inputs.KERNEL_VERSION }}_${{ inputs.KERNEL_NAME }}_KSUN-${{ inputs.KSU_REF }}_LZ4-${{ inputs.FORCE_LZ4_ZRAM }}
          path: artifacts/*
