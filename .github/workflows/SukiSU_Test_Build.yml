name: SukiSU_Ultra-Test

on:
  workflow_dispatch:
    inputs:
      KERNEL_SUFFIX:
        description: "Kernel suffix shown in uname (e.g. Ox1d3x3-WildMix)"
        required: true
        default: "Ox1d3x3-WildMix"
      BUILD_PROFILE:
        description: "Daily driver profile"
        type: choice
        required: true
        default: balanced
        options: [battery, balanced, performance]
      SUSFS:
        description: "Enable SUSFS integration"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      SUSFS_BRANCH:
        description: "SUSFS branch/tag for setup.sh (only used if SUSFS=On)"
        required: true
        default: "main"
      KSU_RELEASE:
        description: "SukiSU-Ultra setup.sh release/channel (e.g. main, stable tag)"
        required: true
        default: "main"
      KSU_HOOK:
        description: "KernelSU hook method (recommended: kprobe for GKI)"
        type: choice
        required: true
        default: kprobe
        options: [kprobe, tracepoint, manual]
      KPM:
        description: "Enable KPM"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]
      TMPFS_XATTR:
        description: "Enable TMPFS_XATTR + POSIX_ACL (Mountify-style features; may add overhead)"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]
      NET_TUNING:
        description: "Enable safe network features (BBR, WireGuard, ipset, TTL target if available)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      ZRAM_LZ4:
        description: "Enable ZRAM with LZ4 (recommended daily-driver)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      ZRAM_FORCE_LZ4:
        description: "Force LZ4 as default ZRAM compressor (if kernel supports)"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]
      PTYFIX_MODULE:
        description: "Build optional KernelSU module that remounts /dev/pts with ptmxmode=0666 (workaround)"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]
      CREATE_RELEASE:
        description: "Create GitHub Release"
        type: choice
        required: true
        default: "Off"
        options: ["On", "Off"]
      UPLOAD_ARTIFACTS:
        description: "Upload build artifacts"
        type: choice
        required: true
        default: "On"
        options: ["On", "Off"]

permissions:
  contents: write

concurrency:
  group: op13-wildmix-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  MANIFEST_URL: https://github.com/mrcxlinux/actions_oplus_sm8750
  MANIFEST_BRANCH: zh
  MANIFEST_FILE: manifest.xml

  KERNEL_WORKSPACE: kernel_workspace
  KP_DIR: kernel_platform
  COMMON_DIR: kernel_platform/common
  OUT_DIR: kernel_platform/common/out

  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: "true"
  CCACHE_MAXSIZE: 8G

jobs:
  build:
    name: Build OP13 kernel (WildMix)
    runs-on: ubuntu-latest

    steps:
      - name: 🧹 Maximize runner disk
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 4096
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: 📦 Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 update -y
          sudo apt-get -o Acquire::Retries=3 install -y \
            bc bison build-essential ca-certificates ccache clang curl flex g++ gcc git gnupg \
            gperf jq libelf-dev libncurses-dev libssl-dev lld llvm make ninja-build \
            openssl python3 python3-pip rsync unzip wget xz-utils zstd
          python3 -m pip install --upgrade pip

      - name: 🗄️ Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: op13-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            op13-ccache-${{ github.ref_name }}-
            op13-ccache-

      - name: 🧰 Configure ccache
        shell: bash
        run: |
          set -euo pipefail
          ccache -M "${CCACHE_MAXSIZE}"
          ccache -o compression="${CCACHE_COMPRESS}"
          ccache -p

      - name: 📥 Repo init + sync (kernel_platform)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${KERNEL_WORKSPACE}"
          cd "${KERNEL_WORKSPACE}"

          if ! command -v repo >/dev/null 2>&1; then
            mkdir -p "${HOME}/bin"
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "${HOME}/bin/repo"
            chmod +x "${HOME}/bin/repo"
            echo "${HOME}/bin" >> "${GITHUB_PATH}"
          fi

          repo init -u "${MANIFEST_URL}" -b "${MANIFEST_BRANCH}" -m "${MANIFEST_FILE}"
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags

      - name: 🧩 Integrate SukiSU Ultra (+ SUSFS optional)
        shell: bash
        run: |
          set -euo pipefail
          cd "${KERNEL_WORKSPACE}/${KP_DIR}"

          if [ "${{ inputs.SUSFS }}" = "On" ]; then
            echo ">> SukiSU setup.sh: susfs-${{ inputs.SUSFS_BRANCH }}"
            curl -fsSL https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
              | bash -s "susfs-${{ inputs.SUSFS_BRANCH }}"
          else
            echo ">> SukiSU setup.sh: ${{ inputs.KSU_RELEASE }}"
            curl -fsSL https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
              | bash -s "${{ inputs.KSU_RELEASE }}"
          fi

      - name: 🧩 Configure defconfig (profile + KSU/SUSFS + PTY + ZRAM)
        shell: bash
        run: |
          set -euo pipefail
          DEFCONFIG="${KERNEL_WORKSPACE}/${COMMON_DIR}/arch/arm64/configs/gki_defconfig"

          set_cfg() {
            local key="$1" val="$2"
            if grep -qE "^${key}=" "$DEFCONFIG"; then
              sed -i -E "s|^${key}=.*|${key}=${val}|g" "$DEFCONFIG"
            elif grep -qE "^# ${key} is not set" "$DEFCONFIG"; then
              sed -i -E "s|^# ${key} is not set|${key}=${val}|g" "$DEFCONFIG"
            else
              echo "${key}=${val}" >> "$DEFCONFIG"
            fi
          }

          unset_cfg() {
            local key="$1"
            if grep -qE "^${key}=" "$DEFCONFIG"; then
              sed -i -E "s|^${key}=.*|# ${key} is not set|g" "$DEFCONFIG"
            elif ! grep -qE "^# ${key} is not set" "$DEFCONFIG"; then
              echo "# ${key} is not set" >> "$DEFCONFIG"
            fi
          }

          echo ">> Daily driver profile: ${{ inputs.BUILD_PROFILE }}"
          case "${{ inputs.BUILD_PROFILE }}" in
            battery)
              unset_cfg CONFIG_DEBUG_KERNEL
              unset_cfg CONFIG_SCHED_DEBUG
              set_cfg CONFIG_CPU_FREQ_GOV_SCHEDUTIL y
              ;;
            balanced)
              unset_cfg CONFIG_DEBUG_KERNEL
              unset_cfg CONFIG_SCHED_DEBUG
              set_cfg CONFIG_CPU_FREQ_GOV_SCHEDUTIL y
              ;;
            performance)
              unset_cfg CONFIG_DEBUG_KERNEL
              unset_cfg CONFIG_SCHED_DEBUG
              set_cfg CONFIG_CPU_FREQ_GOV_PERFORMANCE y
              ;;
          esac

          echo ">> KernelSU hook: ${{ inputs.KSU_HOOK }}"
          case "${{ inputs.KSU_HOOK }}" in
            kprobe)
              set_cfg CONFIG_KPROBES y
              unset_cfg CONFIG_KSU_MANUAL_HOOK
              unset_cfg CONFIG_KSU_TRACEPOINT_HOOK
              ;;
            tracepoint)
              set_cfg CONFIG_KSU_TRACEPOINT_HOOK y
              unset_cfg CONFIG_KSU_MANUAL_HOOK
              ;;
            manual)
              set_cfg CONFIG_KSU_MANUAL_HOOK y
              ;;
          esac

          if [ "${{ inputs.KPM }}" = "On" ]; then
            set_cfg CONFIG_KPM y
          else
            unset_cfg CONFIG_KPM
          fi

          if [ "${{ inputs.TMPFS_XATTR }}" = "On" ]; then
            set_cfg CONFIG_TMPFS_XATTR y
            set_cfg CONFIG_TMPFS_POSIX_ACL y
          else
            unset_cfg CONFIG_TMPFS_XATTR
            unset_cfg CONFIG_TMPFS_POSIX_ACL
          fi

          if [ "${{ inputs.NET_TUNING }}" = "On" ]; then
            set_cfg CONFIG_TCP_CONG_BBR y
            set_cfg CONFIG_WIREGUARD y
            set_cfg CONFIG_NETFILTER_XT_SET m
            set_cfg CONFIG_NETFILTER_XT_TARGET_HL m
          fi

          if [ "${{ inputs.ZRAM_LZ4 }}" = "On" ]; then
            set_cfg CONFIG_ZRAM y
            set_cfg CONFIG_ZSMALLOC y
            set_cfg CONFIG_CRYPTO_LZ4 y
            set_cfg CONFIG_LZ4_COMPRESS y
            set_cfg CONFIG_LZ4_DECOMPRESS y
            if [ "${{ inputs.ZRAM_FORCE_LZ4 }}" = "On" ]; then
              set_cfg CONFIG_ZRAM_DEF_COMP_LZ4 y
            fi
          else
            unset_cfg CONFIG_ZRAM
          fi

          # ✅ Terminal/PTTY sanity (hard requirements)
          set_cfg CONFIG_PTY y
          set_cfg CONFIG_UNIX98_PTYS y
          set_cfg CONFIG_DEVPTS_FS y
          set_cfg CONFIG_DEVPTS_MULTIPLE_INSTANCES y

          # SUSFS toggles if symbols exist
          if grep -Rqs "^config KSU_SUSFS" "${KERNEL_WORKSPACE}/${COMMON_DIR}/drivers/kernelsu/Kconfig" 2>/dev/null; then
            set_cfg CONFIG_KSU_SUSFS y
            set_cfg CONFIG_KSU_SUSFS_SUS_PATH y
            set_cfg CONFIG_KSU_SUSFS_SUS_MOUNT y
            set_cfg CONFIG_KSU_SUSFS_SUS_KSTAT y
            set_cfg CONFIG_KSU_SUSFS_SUS_MAP y
            set_cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT y
          fi

          echo ">> Defconfig tail:"
          tail -n 120 "$DEFCONFIG"

      - name: 🔎 Preflight sanity (config + lz4 + pty)
        shell: bash
        run: |
          set -euo pipefail
          cd "${KERNEL_WORKSPACE}/${COMMON_DIR}"

          # Generate effective config from gki_defconfig
          make O=out ARCH=arm64 gki_defconfig

          echo "---- Effective config quick check ----"
          grep -nE '^CONFIG_KSU(=|_)|^CONFIG_KPM(=|_)|^CONFIG_(KSU_SUSFS|SUSFS)(=|_)' out/.config || true
          grep -nE '^CONFIG_(PTY|UNIX98_PTYS|DEVPTS_FS|DEVPTS_MULTIPLE_INSTANCES)=y' out/.config || true

          for k in CONFIG_PTY CONFIG_UNIX98_PTYS CONFIG_DEVPTS_FS CONFIG_DEVPTS_MULTIPLE_INSTANCES; do
            if ! grep -q "^${k}=y" out/.config; then
              echo "❌ Preflight failed: missing ${k}=y in effective config"
              exit 1
            fi
          done

          if [ -f lib/lz4/lz4armv8/lz4armv8.S ]; then
            echo "✅ LZ4 armv8 source exists"
          else
            echo "::warning::Missing lib/lz4/lz4armv8/lz4armv8.S — if your tree expects it, build may fail with 'No rule to make target ...'"
          fi

      - name: 🛠️ Build kernel (oplus_build_kernel.sh)
        shell: bash
        run: |
          set -euo pipefail
          cd "${KERNEL_WORKSPACE}/${KP_DIR}"

          echo "-${{ inputs.KERNEL_SUFFIX }}" > "${KERNEL_WORKSPACE}/${COMMON_DIR}/localversion"

          chmod +x ./oplus/build/oplus_build_kernel.sh
          ./oplus/build/oplus_build_kernel.sh

          CFG="${KERNEL_WORKSPACE}/${OUT_DIR}/.config"
          echo "---- Terminal/PTTY sanity (post-build) ----"
          grep -nE "^CONFIG_(PTY|UNIX98_PTYS|DEVPTS_FS|DEVPTS_MULTIPLE_INSTANCES)=y" "$CFG" || true
          for k in CONFIG_PTY CONFIG_UNIX98_PTYS CONFIG_DEVPTS_FS CONFIG_DEVPTS_MULTIPLE_INSTANCES; do
            if ! grep -q "^${k}=y" "$CFG"; then
              echo "❌ Missing ${k}=y in out/.config — terminal emulators may crash or fail."
              exit 1
            fi
          done

      - name: 📦 Package flashable zip (AnyKernel3)
        shell: bash
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          rm -rf AnyKernel3
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

          KIMG="${KERNEL_WORKSPACE}/${OUT_DIR}/arch/arm64/boot/Image"
          DTBO="${KERNEL_WORKSPACE}/${OUT_DIR}/arch/arm64/boot/dtbo.img"

          if [ ! -f "$KIMG" ]; then
            echo "❌ Kernel Image not found at: $KIMG"
            exit 1
          fi

          cp -f "$KIMG" AnyKernel3/Image
          [ -f "$DTBO" ] && cp -f "$DTBO" AnyKernel3/dtbo.img || true

          ZIP_NAME="OP13-${{ inputs.KERNEL_SUFFIX }}-${{ github.run_number }}.zip"
          (cd AnyKernel3 && zip -r9 "../${ZIP_NAME}" . -x "*.git*" "*README*")
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          ls -lh "${ZIP_NAME}"

      - name: "🧩 Build optional KernelSU module: PTYFix"
        if: ${{ inputs.PTYFIX_MODULE == 'On' }}
        shell: bash
        run: |
          set -euo pipefail
          MOD="PTYFix-KSU"
          rm -rf "$MOD"
          mkdir -p "$MOD"

          cat > "$MOD/module.prop" <<'EOF'
          id=ptyfix-ksu
          name=PTYFix (devpts ptmxmode)
          version=1.0
          versionCode=10
          author=Ox1d3x3
          description=Remount /dev/pts with ptmxmode=0666 and fix /dev/ptmx perms. Use only if terminal apps crash.
          EOF

          cat > "$MOD/service.sh" <<'EOF'
          #!/system/bin/sh
          log() { echo "[PTYFix] $*" ; }
          MOUNT_BIN="$(command -v mount)"
          [ -z "$MOUNT_BIN" ] && MOUNT_BIN="/system/bin/mount"

          $MOUNT_BIN -o remount,mode=620,gid=5,ptmxmode=0666 /dev/pts 2>/dev/null && log "remounted /dev/pts"
          chmod 666 /dev/ptmx 2>/dev/null && log "chmod 666 /dev/ptmx"
          chmod 666 /dev/pts/ptmx 2>/dev/null && log "chmod 666 /dev/pts/ptmx"
          exit 0
          EOF
          chmod 0755 "$MOD/service.sh"

          MOD_ZIP="${MOD}.zip"
          (cd "$MOD" && zip -r9 "../${MOD_ZIP}" .)
          echo "MOD_ZIP=${MOD_ZIP}" >> "$GITHUB_ENV"
          ls -lh "${MOD_ZIP}"

      - name: 📝 Generate changelog
        shell: bash
        run: |
          set -euo pipefail
          cat > CHANGELOG.md <<'EOF'
          # WildMix (OP13) - Build Notes

          - Manifest: mrcxlinux/actions_oplus_sm8750 (branch zh)
          - SukiSU Ultra: official setup.sh integration (optional SUSFS)
          - Focus: battery + stable + balanced daily-driver
          - Enforced: CONFIG_PTY / CONFIG_DEVPTS_FS / CONFIG_DEVPTS_MULTIPLE_INSTANCES
          - ZRAM: LZ4 enabled by option
          - Packaging: AnyKernel3 zip

          If terminals still crash:
          - Check SELinux context: `su -c 'ls -Z /dev/pts/0 /dev/ptmx'`
          - If you see `u:object_r:ksu_file:s0` on /dev/pts/*, a KSU/SUSFS module or policy injection is mislabeling devpts.
          EOF

      - name: ⬆️ Upload artifacts
        if: ${{ inputs.UPLOAD_ARTIFACTS == 'On' }}
        uses: actions/upload-artifact@v4
        with:
          name: op13-wildmix-${{ github.run_number }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.MOD_ZIP }}
            CHANGELOG.md

      - name: 🚀 Create GitHub Release
        if: ${{ inputs.CREATE_RELEASE == 'On' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: op13-wildmix-${{ github.run_number }}
          name: OP13 WildMix ${{ github.run_number }}
          body_path: CHANGELOG.md
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.MOD_ZIP }}
