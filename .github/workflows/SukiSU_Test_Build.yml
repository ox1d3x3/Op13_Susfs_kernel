name: test

permissions:
  contents: write

env:
  TZ: Australia/Perth
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k

'on':
  workflow_dispatch:
    inputs:
      target_os:
        description: "Build target"
        required: true
        type: choice
        default: oxygenos
        options: [oxygenos, coloros, both]
      make_release:
        description: "Create GitHub Release"
        required: true
        type: boolean
        default: false
      clean_build:
        description: "Clean build (wipe out/ and reset ccache)"
        required: true
        type: boolean
        default: false
      toolchain:
        description: "Toolchain"
        required: true
        type: choice
        default: in-tree
        options: [in-tree, neutron, proton]
      ksu_channel:
        description: "KernelSU Next channel"
        required: true
        type: choice
        default: stable
        options: [stable, dev, legacy, v3.0.0]
      defconfig:
        description: "Defconfig (arch/arm64/configs/<name>)"
        required: true
        type: string
        default: gki_defconfig
      optimize_profile:
        description: "Profile (battery/perf balance)"
        required: true
        type: choice
        default: balanced
        options: [balanced, performance, battery]
      optimize_level:
        description: "KCFLAGS optimization level"
        required: true
        type: choice
        default: O2
        options: [O2, O3]
      lto:
        description: "LTO mode"
        required: true
        type: choice
        default: thin
        options: [off, thin, full]
      enable_bbr:
        description: "Enable TCP BBR"
        required: true
        type: boolean
        default: true
      enable_zram_lz4:
        description: "Enable ZRAM + LZ4"
        required: true
        type: boolean
        default: true
      force_localversion:
        description: "Force LOCALVERSION to include KERNEL_NAME"
        required: true
        type: boolean
        default: true
      repo_depth:
        description: "repo sync depth (1 = fastest)"
        required: true
        type: choice
        default: "1"
        options: ["1", "0"]

jobs:
  build_oxygenos:
    name: OxygenOS (oneplus_13_global.xml)
    if: ${{ github.event.inputs.target_os == 'oxygenos' || github.event.inputs.target_os == 'both' }}
    runs-on: ubuntu-22.04
    env:
      MANIFEST_URL: https://github.com/OnePlusOSS/kernel_manifest.git
      MANIFEST_BRANCH: oneplus/sm8750
      MANIFEST_FILE: oneplus_13_global.xml
      TARGET_LABEL: OOS
    steps: &build_steps
      - name: Checkout (workflow repo)
        uses: actions/checkout@v4

      - name: Prepare build deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates rsync zip unzip file \
            bc bison flex make ninja-build \
            build-essential libssl-dev libelf-dev \
            python3 python3-pip \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            ccache lld llvm
          git config --global http.postBuffer 524288000

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          repo version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.job }}-

      - name: Setup ccache
        shell: bash
        run: |
          set -euo pipefail
          ccache -M 12G
          ccache -s || true

      - name: Sync kernel sources (repo)
        shell: bash
        env:
          DEPTH: ${{ github.event.inputs.repo_depth }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "🌐 repo init: $MANIFEST_URL ($MANIFEST_BRANCH) -m $MANIFEST_FILE"
          rm -rf .repo kernel_platform out src || true

          if [ "$DEPTH" = "1" ]; then
            repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" -m "$MANIFEST_FILE" --depth=1
          else
            repo init -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" -m "$MANIFEST_FILE"
          fi

          echo "🔄 repo sync..."
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle --optimized-fetch --force-sync --prune

          if [ ! -d "kernel_platform/common" ]; then
            echo "::error::Cannot find kernel_platform/common after repo sync."
            echo "Top-level dirs:"
            find . -maxdepth 2 -type d | sed 's|^|  |' | head -n 200
            exit 1
          fi

          # Keep version strings clean/reproducible
          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion || true

      - name: Select toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
        run: |
          set -euo pipefail
          if [ "$TOOLCHAIN" = "neutron" ]; then
            echo "⬇️ Installing Neutron clang (antman)..."
            mkdir -p "$HOME/toolchains/neutron-clang"
            cd "$HOME/toolchains/neutron-clang"
            bash <(curl -fsSL https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman) -S
            echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"
          elif [ "$TOOLCHAIN" = "proton" ]; then
            echo "⬇️ Installing Proton clang..."
            mkdir -p "$HOME/toolchains/proton-clang"
            cd "$HOME/toolchains/proton-clang"
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git .
            echo "$HOME/toolchains/proton-clang/bin" >> "$GITHUB_PATH"
          else
            echo "✅ Using in-tree clang (preferred)."
            WS="$GITHUB_WORKSPACE/kernel_workspace"
            TC="$(find "$WS/kernel_platform/prebuilts/clang/host/linux-x86" -maxdepth 3 -type f -name clang -printf '%h\n' 2>/dev/null | head -n 1 || true)"
            if [ -n "$TC" ]; then
              echo "$TC" >> "$GITHUB_PATH"
            else
              echo "::warning::In-tree clang not found; using system clang."
            fi
          fi

      - name: Integrate KernelSU Next
        shell: bash
        env:
          KSU_CHANNEL: ${{ github.event.inputs.ksu_channel }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          echo "🧩 Integrating KernelSU Next (channel=$KSU_CHANNEL)..."
          curl -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_CHANNEL"

      - name: Configure kernel features
        shell: bash
        env:
          DEFCONFIG: ${{ github.event.inputs.defconfig }}
          ENABLE_BBR: ${{ github.event.inputs.enable_bbr }}
          ENABLE_ZRAM_LZ4: ${{ github.event.inputs.enable_zram_lz4 }}
          LTO: ${{ github.event.inputs.lto }}
          PROFILE: ${{ github.event.inputs.optimize_profile }}
          OPT_LEVEL: ${{ github.event.inputs.optimize_level }}
          FORCE_LOCALVERSION: ${{ github.event.inputs.force_localversion }}
        run: |
          set -euo pipefail
          KDIR="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          OUT="$KDIR/out"
          cd "$KDIR"

          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "::error::Defconfig not found: arch/arm64/configs/$DEFCONFIG"
            ls -1 arch/arm64/configs | head -n 120
            exit 1
          fi

          rm -rf "$OUT" || true
          mkdir -p "$OUT"

          # Base config
          make O="$OUT" ARCH=arm64 "$DEFCONFIG"

          CFG="./scripts/config"
          if [ ! -x "$CFG" ]; then
            echo "::error::scripts/config not found."
            exit 1
          fi

          if [ "$ENABLE_BBR" = "true" ]; then
            "$CFG" --file "$OUT/.config" -e TCP_CONG_BBR -e DEFAULT_BBR
          fi

          if [ "$ENABLE_ZRAM_LZ4" = "true" ]; then
            "$CFG" --file "$OUT/.config" -e ZRAM -e ZSMALLOC -e CRYPTO_LZ4 -e LZ4_COMPRESS -e LZ4_DECOMPRESS
          fi

          case "$LTO" in
            off)  "$CFG" --file "$OUT/.config" -d LTO_CLANG -d LTO_CLANG_THIN -d LTO_CLANG_FULL ;;
            thin) "$CFG" --file "$OUT/.config" -e LTO_CLANG -e LTO_CLANG_THIN -d LTO_CLANG_FULL ;;
            full) "$CFG" --file "$OUT/.config" -e LTO_CLANG -e LTO_CLANG_FULL -d LTO_CLANG_THIN ;;
          esac

          # Conservative governor default
          "$CFG" --file "$OUT/.config" -e CPU_FREQ_GOV_SCHEDUTIL

          make O="$OUT" ARCH=arm64 olddefconfig

          # KCFLAGS optimization
          if [ "$PROFILE" = "battery" ]; then
            echo "KOPT=-Os" >> "$GITHUB_ENV"
          else
            if [ "$OPT_LEVEL" = "O3" ]; then
              echo "KOPT=-O3" >> "$GITHUB_ENV"
            else
              echo "KOPT=-O2" >> "$GITHUB_ENV"
            fi
          fi

          # LOCALVERSION (optional)
          if [ "$FORCE_LOCALVERSION" = "true" ]; then
            echo "LOCALVERSION=-${KERNEL_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Build kernel (LLVM)
        shell: bash
        env:
          CLEAN: ${{ github.event.inputs.clean_build }}
        run: |
          set -euo pipefail
          KDIR="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common"
          OUT="$KDIR/out"
          cd "$KDIR"

          if [ "$CLEAN" = "true" ]; then
            rm -rf "$OUT" build.log || true
            ccache -C || true
          fi

          command -v clang >/dev/null 2>&1 || { echo "::error::clang not found"; exit 1; }
          command -v ld.lld >/dev/null 2>&1 || { echo "::error::ld.lld not found"; exit 1; }

          echo "---- toolchain ----"
          clang --version || true
          ld.lld --version || true
          echo "Using KCFLAGS: ${KOPT:-<none>}"
          echo "LOCALVERSION: ${LOCALVERSION:-<none>}"

          make -j"$(nproc)" \
            O="$OUT" ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang" \
            LD=ld.lld HOSTLD=ld.lld \
            LOCALVERSION="${LOCALVERSION:-}" \
            KCFLAGS+="${KOPT:-}" \
            all 2>&1 | tee build.log

      - name: Package artifacts
        shell: bash
        env:
          KSU_CHANNEL: ${{ github.event.inputs.ksu_channel }}
          TOOLCHAIN: ${{ github.event.inputs.toolchain }}
          DEFCONFIG: ${{ github.event.inputs.defconfig }}
          PROFILE: ${{ github.event.inputs.optimize_profile }}
          OPT_LEVEL: ${{ github.event.inputs.optimize_level }}
          LTO: ${{ github.event.inputs.lto }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/out"
          ART="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ART"

          [ -f "$OUT/arch/arm64/boot/Image" ] && cp -v "$OUT/arch/arm64/boot/Image" "$ART/Image"
          [ -f "$OUT/.config" ] && cp -v "$OUT/.config" "$ART/config"
          [ -f "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/build.log" ] && cp -v "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/build.log" "$ART/build.log" || true

          # Optional outputs (if present in this tree)
          for f in \
            "$OUT/arch/arm64/boot/Image.gz" \
            "$OUT/arch/arm64/boot/Image.lz4" \
            "$OUT/arch/arm64/boot/dtbo.img" \
            "$OUT/arch/arm64/boot/dtb.img" \
            "$OUT/arch/arm64/boot/Image.gz-dtb"; do
            if [ -f "$f" ]; then
              cp -v "$f" "$ART/$(basename "$f")"
            fi
          done

          # Modules (best-effort)
          MOD_TMP="$ART/modules"
          mkdir -p "$MOD_TMP"
          find "$OUT" -type f -name "*.ko" -print0 2>/dev/null | xargs -0 -I{} cp -v "{}" "$MOD_TMP/" 2>/dev/null || true
          if [ "$(ls -A "$MOD_TMP" 2>/dev/null | wc -l)" -gt 0 ]; then
            (cd "$MOD_TMP" && tar -czf "$ART/modules.tar.gz" .)
          else
            rm -rf "$MOD_TMP" || true
          fi

          printf "%s\n" \
            "ANDROID_VERSION=$ANDROID_VERSION" \
            "KERNEL_VERSION=$KERNEL_VERSION" \
            "KERNEL_NAME=$KERNEL_NAME" \
            "TARGET=$TARGET_LABEL" \
            "MANIFEST=$MANIFEST_FILE" \
            "KSU_CHANNEL=$KSU_CHANNEL" \
            "TOOLCHAIN=$TOOLCHAIN" \
            "DEFCONFIG=$DEFCONFIG" \
            "PROFILE=$PROFILE" \
            "OPT_LEVEL=$OPT_LEVEL" \
            "LTO=$LTO" \
            > "$ART/build_meta.txt"

          ZIP="OP13_${TARGET_LABEL}_${ANDROID_VERSION}_${KERNEL_VERSION}_${KERNEL_NAME}_KSU-Next.zip"
          (cd "$ART" && zip -r "../$ZIP" .)
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OP13_${{ env.TARGET_LABEL }}_KSU-Next_${{ github.run_number }}
          path: ${{ env.ZIP_NAME }}

      - name: Create release
        if: ${{ github.event.inputs.make_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: OP13-${{ env.TARGET_LABEL }}-${{ env.ANDROID_VERSION }}-${{ env.KERNEL_VERSION }}-${{ github.run_number }}
          name: OP13 ${{ env.TARGET_LABEL }} KernelSU Next (${{ env.ANDROID_VERSION }} / ${{ env.KERNEL_VERSION }})
          body: |
            Automated build for OnePlus 13 (SM8750) with KernelSU Next.
            build_meta.txt is included in the zip.
          files: ${{ env.ZIP_NAME }}

  build_coloros:
    name: ColorOS (oneplus_13.xml)
    if: ${{ github.event.inputs.target_os == 'coloros' || github.event.inputs.target_os == 'both' }}
    runs-on: ubuntu-22.04
    env:
      MANIFEST_URL: https://github.com/OnePlusOSS/kernel_manifest.git
      MANIFEST_BRANCH: oneplus/sm8750
      MANIFEST_FILE: oneplus_13.xml
      TARGET_LABEL: COS
    steps: *build_steps
