---
name: Build SukiSU Ultra-Teset

env:
  TZ: Australia/Perth
  ANDROID_VERSION: android15
  KERNEL_VERSION: "6.6"
  KERNEL_NAME: android15-8-g29d86c5fc9dd-abogki428889875-4k

on:
  workflow_dispatch:
    inputs:
      PROFILE:
        description: "⚡ Performance profile (artifact naming only)"
        required: true
        type: choice
        options: ["optimal", "highest", "lowest"]
        default: "optimal"
      SUSFS:
        description: "📦 SuSFS Support"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"
      KPM:
        description: "🧩 KPM Support"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "Off"
      bbr:
        description: "📶 Enable BBR support (compile support only; not default runtime)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "Off"
      adios:
        description: "⚙️ ADIOS I/O scheduler support"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "On"
      proxy:
        description: "🌐 Extra netfilter/ipset modules (optional)"
        required: true
        type: choice
        options: ["On", "Off"]
        default: "Off"
      kernel_suffix:
        description: "📝 Kernel suffix (optional, no spaces)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v4

      # ✅ Safe cleanup (does NOT mount over workspace like maximize-build-space)
      - name: 🧹 Free disk space (safe)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 🔧 Setup dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex git git-lfs curl wget rsync zip unzip jq \
            python3 python3-pip \
            build-essential libssl-dev libelf-dev dwarves \
            ccache
          git lfs install

      - name: ⚙️ Setup repo tool
        run: |
          set -e
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: ⬇️ Clone Kernel Source
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"
          cd "$GITHUB_WORKSPACE/kernel_workspace"

          echo "🌐 Initializing kernel repo..."
          # ✅ FIX: manifest is manifest.xml (NOT oneplus.xml)
          repo init -u https://github.com/mrcxlinux/actions_oplus_sm8750.git -b refs/heads/zh -m manifest.xml --depth=1

          echo "🔄 Syncing repos (using $(nproc --all) threads)..."
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

          rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"

      - name: 🧩 Apply SukiSU Ultra (builtin)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

          # ✅ Use in-tree AOSP clang shipped with the manifest (no GLIBC mismatch)
          CLANG_DIR="$(find prebuilts/clang/host/linux-x86 -maxdepth 1 -type d -name 'clang-*' | sort | tail -n1)"
          if [ -z "$CLANG_DIR" ]; then
            echo "❌ Could not find prebuilts clang in the tree!"
            ls -la prebuilts/clang/host/linux-x86 || true
            exit 1
          fi
          echo "Using clang: $CLANG_DIR"
          export PATH="$PWD/$CLANG_DIR/bin:$PATH"
          curl -fsSL https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh | bash -s builtin

      - name: 📦 Apply SUSFS (optional)
        if: ${{ github.event.inputs.SUSFS == 'On' }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          rm -rf susfs4ksu
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
          # SUSFS scripts are safe for GKI trees
          bash susfs4ksu/kernel_patches.sh "$(pwd)/common" || true
          bash susfs4ksu/kernel_patches_ksu.sh "$(pwd)/common" || true

      - name: ⚙️ Kernel config (Terminal emulator safe)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          DEF=./common/arch/arm64/configs/gki_defconfig

          # --- Force essential PTY/devpts (for ALL terminal emulators) ---
          {
            echo "CONFIG_TTY=y"
            echo "CONFIG_PTY=y"
            echo "CONFIG_UNIX98_PTYS=y"
            echo "CONFIG_DEVPTS_FS=y"
            echo "CONFIG_DEVPTS_MULTIPLE_INSTANCES=y"
          } >> "$DEF"

          # --- Termux/Proot compatible (safe) ---
          {
            echo "CONFIG_BINFMT_MISC=y"
            echo "CONFIG_USER_NS=y"
            echo "CONFIG_SECCOMP=y"
            echo "CONFIG_SECCOMP_FILTER=y"
          } >> "$DEF"

          # --- ZRAM LZ4 (good daily QoL) ---
          {
            echo "CONFIG_ZRAM=y"
            echo "CONFIG_ZRAM_DEF_COMP_LZ4=y"
          } >> "$DEF"

          # ✅ CRITICAL: ensure BBG/baseband_guard is NOT enabled anywhere
          # (This is the #1 cause of "terminal opens then closes" on some ROMs.)
          sed -i '/^CONFIG_BBG=/d' "$DEF" || true
          sed -i 's/baseband_guard//g' "$DEF" || true
          sed -i 's/,,/,/g; s/,\"/\"/g; s/\",,/\",/g' "$DEF" || true

          if [ "${{ github.event.inputs.KPM }}" = "On" ]; then
            echo "CONFIG_KPM=y" >> "$DEF"
          fi

          if [ "${{ github.event.inputs.bbr }}" = "On" ]; then
            echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$DEF"
            echo "CONFIG_TCP_CONG_BBR=y" >> "$DEF"
            echo "CONFIG_NET_SCH_FQ=y" >> "$DEF"
          fi

          if [ "${{ github.event.inputs.adios }}" = "On" ]; then
            echo "CONFIG_SCHED_CLASS_EXT=y" >> "$DEF" || true
            echo "CONFIG_ADIOS=y" >> "$DEF" || true
          fi

          if [ "${{ github.event.inputs.proxy }}" = "On" ]; then
            # Safe/common extras (won't affect terminals)
            echo "CONFIG_IP_SET=y" >> "$DEF"
            echo "CONFIG_NETFILTER=y" >> "$DEF"
          fi

      - name: 🏗️ Build kernel (GKI)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
                    export CC="ccache clang"

          make -C common O=out gki_defconfig

          # Make sure defconfig edits are applied
          if [ -x "./common/scripts/config" ]; then
            ./common/scripts/config --file "./common/out/.config" \
              -e TTY -e PTY -e UNIX98_PTYS -e DEVPTS_FS -e DEVPTS_MULTIPLE_INSTANCES \
              -d BBG || true
          fi
          make -C common O=out olddefconfig

          echo "---- final terminal options ----"
          grep -E "^(CONFIG_TTY=|CONFIG_PTY=|CONFIG_UNIX98_PTYS=|CONFIG_DEVPTS_FS=|CONFIG_DEVPTS_MULTIPLE_INSTANCES=)" common/out/.config || true
          echo "---- final BBG/LSM ----"
          grep -E "^(CONFIG_BBG=|CONFIG_LSM=)" common/out/.config || true
          echo "------------------------------"

          make -C common O=out -j"$(nproc --all)" Image modules
          test -f common/out/arch/arm64/boot/Image

      - name: 📦 Package AnyKernel3 ZIP
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -rf AnyKernel3
          git clone --depth=1 -b gki https://github.com/mrcxlinux/AnyKernel3 AnyKernel3

          cp "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/out/arch/arm64/boot/Image" AnyKernel3/Image

          SUFFIX="${{ github.event.inputs.kernel_suffix }}"
          SUFFIX="${SUFFIX// /_}"

          ZIP_NAME="OP13-SukiSUUltra-${{ github.event.inputs.PROFILE }}"
          if [ -n "$SUFFIX" ]; then
            ZIP_NAME="${ZIP_NAME}-${SUFFIX}"
          fi

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}.zip" . -x ".git/*" ".github/*"
          cd ..

          echo "ZIP_NAME=${ZIP_NAME}.zip" >> "$GITHUB_ENV"

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
