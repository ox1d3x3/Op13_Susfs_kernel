name: OP13 KernelSU Next 

'on':
  workflow_dispatch:
    inputs:
      toolchain:
        description: 'Toolchain (recommended: aosp_prebuilt)'
        required: true
        default: aosp_prebuilt
        type: choice
        options:
          - aosp_prebuilt
          - neutron_clang

      susfs:
        description: 'Enable SUSFS (adds kernel hooks; may reduce compatibility)'
        required: true
        default: false
        type: boolean

      enable_multimanager:
        description: 'Apply KernelSU Next Multi-Manager patch (best-effort)'
        required: true
        default: false
        type: boolean

      enable_hmbird:
        description: 'Enable HMBIRD scheduler/overwriter patches (best-effort)'
        required: true
        default: true
        type: boolean

      enable_ttl:
        description: 'Enable TTL target support (CONFIG_NETFILTER_XT_TARGET_TTL)'
        required: true
        default: true
        type: boolean

      enable_ipset:
        description: 'Enable IPSET support (CONFIG_IP_SET)'
        required: true
        default: true
        type: boolean

      enable_bbr:
        description: 'Enable BBR congestion control (CONFIG_TCP_CONG_BBR)'
        required: true
        default: false
        type: boolean

      enable_zram_lz4:
        description: 'Enable ZRAM LZ4 patch (best-effort)'
        required: true
        default: true
        type: boolean

      enable_zram_zstd:
        description: 'Enable ZRAM ZSTD patch (best-effort)'
        required: true
        default: false
        type: boolean

      kernel_suffix:
        description: 'Kernel local version suffix appended to 6.6.89- (no leading ''-'')'
        required: true
        default: android15-8-g29d86c5fc9dd-abogki428889875-4k
        type: string

      build_user:
        description: 'KBUILD_BUILD_USER (use ''OnePlus'' to mimic stock style)'
        required: true
        default: OnePlus
        type: string

      build_host:
        description: 'KBUILD_BUILD_HOST (use ''ubuntu-build'' to mimic stock style)'
        required: true
        default: ubuntu-build
        type: string

      build_timestamp:
        description: 'KBUILD_BUILD_TIMESTAMP. Leave empty for current UTC. Example: ''Fri Jan 23 13:09:51 UTC 2026'''
        required: false
        default: ''
        type: string

      publish_release:
        description: 'Publish a GitHub Release asset (avoids artifact zip-in-zip confusion)'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  TZ: UTC
  ANDROID_VERSION: android15
  KERNEL_VERSION: '6.6'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: 'true'
  CCACHE_COMPRESSLEVEL: '6'
  CCACHE_MAXSIZE: 8G
  GIT_TERMINAL_PROMPT: '0'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 20480
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Free disk space (prevent apt no-space-left)
        shell: bash
        run: |
          set -euo pipefail
          echo "== Before cleanup =="
          df -h

          # Reduce apt metadata size
          echo 'Acquire::Languages "none";' | sudo tee /etc/apt/apt.conf.d/99no-translations >/dev/null

          # Remove large preinstalled components not needed for kernel builds
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/share/swift || true

          # Clean apt caches/lists to free space
          sudo rm -rf /var/lib/apt/lists/* || true
          sudo rm -rf /var/cache/apt/archives/* || true
          sudo apt-get clean || true

          # Remove docker leftovers if present
          docker system prune -af >/dev/null 2>&1 || true

          echo "== After cleanup =="
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ca-certificates clang curl flex gawk git gnupg gperf \
            jq libelf-dev libssl-dev lld llvm lz4 make ninja-build openssl \
            patch python3 python3-pip python3-setuptools rsync unzip wget zip zstd \
            libncurses-dev pkg-config ccache

          # repo tool
          sudo curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod +x /usr/local/bin/repo

      - name: Configure build identity (mimic stock)
        shell: bash
        run: |
          set -euo pipefail
          echo "KBUILD_BUILD_USER=${{ github.event.inputs.build_user }}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_HOST=${{ github.event.inputs.build_host }}" >> "$GITHUB_ENV"

          if [ -n "${{ github.event.inputs.build_timestamp }}" ]; then
            echo "KBUILD_BUILD_TIMESTAMP=${{ github.event.inputs.build_timestamp }}" >> "$GITHUB_ENV"
            echo "Using custom build timestamp: ${{ github.event.inputs.build_timestamp }}"
          else
            echo "KBUILD_BUILD_TIMESTAMP=$(date -u '+%a %b %d %H:%M:%S UTC %Y')" >> "$GITHUB_ENV"
            echo "Using current UTC build timestamp."
          fi

      - name: Initialize & sync kernel source (mrcxlinux manifest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel_workspace
          cd kernel_workspace

          echo "Initializing kernel manifest..."
          # NOTE: manifest.xml is hosted on the 'zh' branch of mrcxlinux/actions_oplus_sm8750.
          repo init -u https://github.com/mrcxlinux/actions_oplus_sm8750.git -b zh -m manifest.xml --depth=1

          echo "Syncing kernel source..."
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle --force-sync

          test -d kernel_platform/common || (echo "Error: kernel_platform/common not found after sync." && exit 1)

      - name: Select toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "Selected toolchain: ${{ github.event.inputs.toolchain }}"
          cd kernel_workspace

          if [ "${{ github.event.inputs.toolchain }}" = "aosp_prebuilt" ]; then
            CANDIDATES=(
              "$GITHUB_WORKSPACE/kernel_workspace/prebuilts/clang/host/linux-x86/clang-r510928/bin"
              "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin"
              "$GITHUB_WORKSPACE/kernel_workspace/prebuilts/clang/host/linux-x86/bin"
              "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/bin"
            )
            for p in "${CANDIDATES[@]}"; do
              if [ -x "$p/clang" ]; then
                echo "Using AOSP clang prebuilts: $p"
                echo "PATH=$p:$PATH" >> "$GITHUB_ENV"
                break
              fi
            done
            if ! command -v clang >/dev/null 2>&1; then
              echo "Error: Clang prebuilts not found in synced tree."
              printf ' - %s\n' "${CANDIDATES[@]}"
              exit 1
            fi
          else
            echo "Installing Neutron-Clang..."
            mkdir -p toolchains && cd toolchains
            git clone --depth=1 https://github.com/Neutron-Toolchains/antman.git antman
            cd antman
            bash antman --install clang
            echo "PATH=$GITHUB_WORKSPACE/toolchains/antman/bin:$PATH" >> "$GITHUB_ENV"
          fi

          clang --version | head -n 2

      - name: KernelSU Next (stable) integration
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform

          echo "[+] Setting up KernelSU-Next (stable)..."
          curl -fsSL https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh | bash -s stable

          if [ -d "KernelSU-Next" ]; then
            KSU_COMMIT="$(git -C KernelSU-Next rev-parse --short=8 HEAD)"
            KSU_COUNT="$(git -C KernelSU-Next rev-list --count HEAD)"
            KSUVER="$((30000 + KSU_COUNT))"
            echo "KSUVER=$KSUVER" >> "$GITHUB_ENV"
            echo "KSU_COMMIT=$KSU_COMMIT" >> "$GITHUB_ENV"
            echo "KernelSU-Next commit: $KSU_COMMIT (v$KSUVER)"
          else
            echo "Error: KernelSU-Next directory not found after setup."
            exit 1
          fi

          if [ "${{ github.event.inputs.enable_multimanager }}" = "true" ]; then
            echo "Applying Multi-Manager patch (best-effort)..."
            if [ -f "$GITHUB_WORKSPACE/patches/kernelsu-next_multimanager.patch" ]; then
              (cd common && git apply -p1 "$GITHUB_WORKSPACE/patches/kernelsu-next_multimanager.patch") || \
                echo "⚠️ Skipped (does not apply cleanly): kernelsu-next_multimanager.patch"
            else
              echo "⚠️ Multi-Manager patch not found at patches/kernelsu-next_multimanager.patch (skipping)."
            fi
          fi

      - name: Clone patch collections
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace

          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android15-6.6 susfs4ksu
          git clone --depth=1 https://github.com/mrcxlinux/kernel_patches.git mrcx_patches
          git clone --depth=1 https://github.com/WildKernels/kernel_patches.git wildkernel_patches

          echo "Patch sources cloned."

      - name: Apply patches (safe defaults; best-effort)
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform/common

          chmod +x drivers/of/overwriter/overwrite_configs/convert_configs.sh 2>/dev/null || true

          apply_patch() {
            local label="$1"
            shift
            if "$@"; then
              echo "✅ Applied: $label"
            else
              echo "⚠️ Skipped (does not apply cleanly): $label"
              return 0
            fi
          }

          # ZRAM patches (mrcxlinux)
          if [ "${{ github.event.inputs.enable_zram_lz4 }}" = "true" ] && [ -f "$GITHUB_WORKSPACE/kernel_workspace/mrcx_patches/zram/001-lz4.patch" ]; then
            apply_patch "001-lz4.patch" git apply -p1 "$GITHUB_WORKSPACE/kernel_workspace/mrcx_patches/zram/001-lz4.patch"
          fi
          if [ "${{ github.event.inputs.enable_zram_zstd }}" = "true" ] && [ -f "$GITHUB_WORKSPACE/kernel_workspace/mrcx_patches/zram/002-zstd.patch" ]; then
            apply_patch "002-zstd.patch" git apply -p1 "$GITHUB_WORKSPACE/kernel_workspace/mrcx_patches/zram/002-zstd.patch"
          fi

          # SUSFS
          if [ "${{ github.event.inputs.susfs }}" = "true" ]; then
            if [ -f "$GITHUB_WORKSPACE/kernel_workspace/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch" ]; then
              apply_patch "50_add_susfs_in_gki-android15-6.6.patch" bash -lc "patch -p1 < '$GITHUB_WORKSPACE/kernel_workspace/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android15-6.6.patch'"
            else
              echo "⚠️ SUSFS patch file not found (skipping)."
            fi
            if [ -f "$GITHUB_WORKSPACE/kernel_workspace/mrcx_patches/69_hide_stuff.patch" ]; then
              apply_patch "69_hide_stuff.patch" bash -lc "patch -p1 -F 3 < '$GITHUB_WORKSPACE/kernel_workspace/mrcx_patches/69_hide_stuff.patch'"
            fi
          else
            if [ -f "$GITHUB_WORKSPACE/kernel_workspace/mrcx_patches/susfs/scope_min_manual_hooks_v1.9.patch" ]; then
              apply_patch "scope_min_manual_hooks_v1.9.patch" bash -lc "patch -p1 --fuzz=3 < '$GITHUB_WORKSPACE/kernel_workspace/mrcx_patches/susfs/scope_min_manual_hooks_v1.9.patch'"
            fi
          fi

          # WildKernels patches (best-effort)
          if [ -d "$GITHUB_WORKSPACE/kernel_workspace/wildkernel_patches" ]; then
            echo "Applying WildKernels patches (best-effort)..."

            for p in \
              fengchi_OP13-CPH_OOS15.patch \
              fengchi_OP13-PJZ_OOS15.patch \
              fengchi_OP13_OOS16.patch
            do
              if [ -f "$GITHUB_WORKSPACE/kernel_workspace/wildkernel_patches/$p" ]; then
                apply_patch "$p" bash -lc "patch -p1 < '$GITHUB_WORKSPACE/kernel_workspace/wildkernel_patches/$p'"
              fi
            done

            [ -f "$GITHUB_WORKSPACE/kernel_workspace/wildkernel_patches/hmbird_config.patch" ] && \
              apply_patch "hmbird_config.patch" bash -lc "patch -p1 < '$GITHUB_WORKSPACE/kernel_workspace/wildkernel_patches/hmbird_config.patch'"

            [ -f "$GITHUB_WORKSPACE/kernel_workspace/wildkernel_patches/overwriter.patch" ] && \
              apply_patch "overwriter.patch" bash -lc "patch -p1 < '$GITHUB_WORKSPACE/kernel_workspace/wildkernel_patches/overwriter.patch'"
          fi

      - name: Configure kernel defconfig (idempotent)
        shell: bash
        run: |
          set -euo pipefail
          DEFCONFIG="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/arch/arm64/configs/gki_defconfig"
          test -f "$DEFCONFIG" || (echo "Error: gki_defconfig not found at $DEFCONFIG" && exit 1)

          set_config() {
            local key="$1" val="$2"
            grep -v -E "^${key}=|^# ${key} is not set" "$DEFCONFIG" > "$DEFCONFIG.tmp"
            mv "$DEFCONFIG.tmp" "$DEFCONFIG"
            if [ "$val" = "y" ]; then
              echo "${key}=y" >> "$DEFCONFIG"
            elif [ "$val" = "n" ]; then
              echo "# ${key} is not set" >> "$DEFCONFIG"
            else
              echo "${key}=${val}" >> "$DEFCONFIG"
            fi
          }

          set_config "CONFIG_KSU" "y"

          if [ "${{ github.event.inputs.susfs }}" = "true" ]; then
            set_config "CONFIG_KSU_SUSFS" "y"
            set_config "CONFIG_KSU_SUSFS_SUS_PATH" "y"
            set_config "CONFIG_KSU_SUSFS_SUS_MOUNT" "y"
            set_config "CONFIG_KSU_SUSFS_SUS_KSTAT" "y"
            set_config "CONFIG_KSU_SUSFS_SPOOF_UNAME" "y"
            set_config "CONFIG_KSU_SUSFS_ENABLE_LOG" "y"
            set_config "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS" "y"
            set_config "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG" "y"
          else
            set_config "CONFIG_KSU_SUSFS" "n"
          fi

          [ "${{ github.event.inputs.enable_ttl }}" = "true" ] && set_config "CONFIG_NETFILTER_XT_TARGET_TTL" "y" || set_config "CONFIG_NETFILTER_XT_TARGET_TTL" "n"
          [ "${{ github.event.inputs.enable_ipset }}" = "true" ] && set_config "CONFIG_IP_SET" "y" || set_config "CONFIG_IP_SET" "n"
          [ "${{ github.event.inputs.enable_bbr }}" = "true" ] && set_config "CONFIG_TCP_CONG_BBR" "y" || set_config "CONFIG_TCP_CONG_BBR" "n"

          SUFFIX="${{ github.event.inputs.kernel_suffix }}"
          set_config "CONFIG_LOCALVERSION" "\"-${SUFFIX}\""

          echo "Defconfig updated:"
          tail -n 30 "$DEFCONFIG"

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_workspace/kernel_platform/common

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION) ?=' Makefile || true

          if [ -f scripts/setlocalversion ]; then
            sed -i 's/ -dirty//g' scripts/setlocalversion || true
          fi

          mkdir -p out
          make O=out ARCH=arm64 gki_defconfig

          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang LD=ld.lld \
            LLVM=1 LLVM_IAS=1 \
            Image

          if [ -f out/include/config/kernel.release ]; then
            KERNEL_RELEASE="$(cat out/include/config/kernel.release)"
            echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"
            echo "Kernel release: $KERNEL_RELEASE"
          else
            echo "KERNEL_RELEASE=unknown" >> "$GITHUB_ENV"
          fi

      - name: Package AnyKernel3 (single zip, custom banner)
        shell: bash
        run: |
          set -euo pipefail
          OUTDIR="$GITHUB_WORKSPACE/out"
          mkdir -p "$OUTDIR"

          rm -rf ak3
          git clone --depth=1 https://github.com/mrcxlinux/AnyKernel3.git ak3
          rm -rf ak3/.git

          cp -f "$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/common/out/arch/arm64/boot/Image" ak3/Image

          KTAG="${{ github.event.inputs.kernel_suffix }}"
          BUILD_ID="$(date -u '+%Y%m%d-%H%M')"

          cat > ak3/banner <<-'EOF'
          	====================================================
          	            Ox1d3x3 OP13 KernelSU Next
          	====================================================
          	   __   __  __
          	  \ \ / //_ |
          	   \ V /   | |
          	    > <    | |
          	   / . \   | |
          	  /_/ \_\  |_|
          	====================================================
          	EOF

          cat > ak3/anykernel.sh <<-'EOF'
          	### AnyKernel3 Ramdisk Mod Script
          	## osm0sis @ xda-developers
          	
          	properties() { '
          	kernel.string=Ox1d3x3 OP13 KernelSU Next
          	do.devicecheck=0
          	do.modules=0
          	do.systemless=0
          	do.cleanup=1
          	do.cleanuponabort=0
          	supported.versions=
          	supported.patchlevels=
          	supported.vendorpatchlevels=
          	'; }
          	
          	block=boot
          	is_slot_device=auto
          	ramdisk_compression=auto
          	patch_vbmeta_flag=auto
          	no_magisk_check=1
          	
          	. tools/ak3-core.sh
          	
          	ui_print " "
          	ui_print "PJZ110 | KernelSU Next Kernel"
          	ui_print "Kernel : __KERNEL_RELEASE__"
          	ui_print "Tag    : __KERNEL_TAG__"
          	ui_print "Build  : __BUILD_ID__"
          	ui_print "KSU    : v__KSUVER__ (__KSU_COMMIT__)"
          	ui_print "Builder: @Ox1d3x3"
          	ui_print "Credits: @mrcxlinux, @WildKernels, @osm0sis"
          	ui_print " "
          	
          	DEVICE="$(getprop ro.product.device 2>/dev/null)"; [ -z "$DEVICE" ] && DEVICE="$(getprop ro.product.name 2>/dev/null)"
          	PATCH="$(getprop ro.build.version.security_patch 2>/dev/null)"
          	ANDROID="$(getprop ro.build.version.release 2>/dev/null)"
          	SLOT_SUFFIX="$(getprop ro.boot.slot_suffix 2>/dev/null)"
          	[ -n "$SLOT_SUFFIX" ] && ui_print "Slot   : $SLOT_SUFFIX"
          	ui_print "Device : $DEVICE"
          	ui_print "Android: $ANDROID"
          	ui_print "Patch  : $PATCH"
          	ui_print " "
          	
          	if command -v cmd >/dev/null 2>&1; then
          	  (cmd activity start --user 0 -a android.intent.action.VIEW -d "https://github.com/ox1d3x3/Op13_Susfs_kernel" >/dev/null 2>&1 &) || true
          	elif command -v am >/dev/null 2>&1; then
          	  (am start --user 0 -a android.intent.action.VIEW -d "https://github.com/ox1d3x3/Op13_Susfs_kernel" >/dev/null 2>&1 &) || true
          	fi
          	
          	kernel_version=$(cat /proc/version | awk -F '-' '{print $1}' | awk '{print $3}')
          	case $kernel_version in
          	  5.1*|6.1*|6.6*) ksu_supported=true ;;
          	  *) ksu_supported=false ;;
          	esac
          	ui_print "  -> GKI kernel supported: $ksu_supported"
          	$ksu_supported || abort "  -> Non-GKI device, abort."
          	
          	split_boot
          	if [ -f "split_img/ramdisk.cpio" ]; then
          	  unpack_ramdisk
          	  write_boot
          	else
          	  flash_boot
          	fi
          	EOF

          KR="${KERNEL_RELEASE:-unknown}"
          KC="${KSU_COMMIT:-unknown}"
          KV="${KSUVER:-unknown}"

          sed -i "s|__KERNEL_RELEASE__|$KR|g" ak3/anykernel.sh
          sed -i "s|__KERNEL_TAG__|$KTAG|g" ak3/anykernel.sh
          sed -i "s|__BUILD_ID__|$BUILD_ID|g" ak3/anykernel.sh
          sed -i "s|__KSUVER__|$KV|g" ak3/anykernel.sh
          sed -i "s|__KSU_COMMIT__|$KC|g" ak3/anykernel.sh

          ZIP_NAME="OP13_${ANDROID_VERSION}_${KR}_${KTAG}_KSUN_${KV}_FLASH_THIS.zip"
          (cd ak3 && zip -r9 "$OUTDIR/$ZIP_NAME" . -x "*.git*" -x "*README*")

          echo "FLASH_ZIP=$OUTDIR/$ZIP_NAME" >> "$GITHUB_ENV"
          echo "Built flash zip: $ZIP_NAME"
      - name: Upload artifact (contains the flash zip)
        uses: actions/upload-artifact@v4
        with:
          name: OP13_KSU_NEXT_flash_zip
          path: ${{ env.FLASH_ZIP }}
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release (optional)
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: op13-ksunext-${{ github.run_number }}
          name: OP13 KernelSU Next - build ${{ github.run_number }}
          prerelease: true
          files: ${{ env.FLASH_ZIP }}
