name: KSU/SUKI-TEST

'on':
  workflow_dispatch:
    inputs:
      root_solution:
        description: "Root solution to integrate"
        required: true
        default: "wild-ksu"
        type: choice
        options:
          - none
          - ksu-next
          - wild-ksu
          - sukisu-ultra
      susfs:
        description: "Enable SUSFS (will auto-disable if incompatible)"
        required: true
        default: "On"
        type: choice
        options: [On, Off]
      kpm:
        description: "Enable KPM (if your tree supports it)"
        required: true
        default: "Off"
        type: choice
        options: [On, Off]
      force_lz4_zram:
        description: "Force ZRAM default compressor = LZ4"
        required: true
        default: "On"
        type: choice
        options: [On, Off]
      build_type:
        description: "Build type"
        required: true
        default: "Release"
        type: choice
        options: [Release, Debug]
      clean_build:
        description: "Delete common/out before build"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: op13-gki-${{ github.ref }}-${{ github.event.inputs.root_solution }}-${{ github.event.inputs.susfs }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ github.event.inputs.root_solution }}, SUSFS=${{ github.event.inputs.susfs }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: true
          remove-android: true
          remove-haskell: true

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bash bc bison build-essential ca-certificates ccache curl flex gawk git \
            libelf-dev liblz4-tool libncurses-dev libssl-dev lld llvm \
            python3 rsync unzip xz-utils zip zstd \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo apt-get clean

      - name: Resolve paths & toolchain
        id: paths
        run: |
          set -euo pipefail

          KP="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform"
          COMMON="$KP/common"
          OUT="$COMMON/out"

          echo "kernel_platform=$KP" >> "$GITHUB_OUTPUT"
          echo "common_dir=$COMMON" >> "$GITHUB_OUTPUT"
          echo "out_dir=$OUT" >> "$GITHUB_OUTPUT"

          if [[ ! -d "$COMMON" ]]; then
            echo "::error::Expected kernel tree at: $COMMON"
            echo "Workspace root:"
            ls -la "$GITHUB_WORKSPACE"
            echo "Top-level tree:"
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type d -print | sed 's#^#  #'
            exit 1
          fi

          # Prefer prebuilts clang if present
          CLANG_BIN="$(ls -d "$KP"/prebuilts/clang/host/linux-x86/clang-*/bin 2>/dev/null | head -n1 || true)"
          if [[ -z "$CLANG_BIN" ]]; then
            CLANG_BIN="$(ls -d "$KP"/prebuilts/clang/host/linux-x86/clang-r*/bin 2>/dev/null | head -n1 || true)"
          fi
          if [[ -n "$CLANG_BIN" ]]; then
            echo "Using prebuilts clang: $CLANG_BIN"
            echo "$CLANG_BIN" >> "$GITHUB_PATH"
          else
            echo "No prebuilts clang found; using system clang/lld."
          fi

      - name: Optional clean build
        if: ${{ github.event.inputs.clean_build }}
        run: |
          set -euo pipefail
          rm -rf "${{ steps.paths.outputs.out_dir }}"

      - name: Integrate root solution
        run: |
          set -euo pipefail
          KP="${{ steps.paths.outputs.kernel_platform }}"
          COMMON="${{ steps.paths.outputs.common_dir }}"
          ROOT="${{ github.event.inputs.root_solution }}"

          cd "$KP"

          case "$ROOT" in
            none)
              echo "KSU_DIR=" >> "$GITHUB_ENV"
              ;;
            ksu-next)
              echo "Integrating KernelSU-Next…"
              curl -fsSL "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
              ;;
            wild-ksu)
              echo "Integrating Wild_KSU…"
              curl -fsSL "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s wild
              ;;
            sukisu-ultra)
              echo "Integrating SukiSU-Ultra…"
              curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s sukisu
              ;;
            *)
              echo "::error::Unknown root_solution: $ROOT"
              exit 1
              ;;
          esac

          # Detect KernelSU directory (most setups place it here)
          KSU_DIR=""
          if [[ -d "$COMMON/KernelSU-Next" ]]; then KSU_DIR="$COMMON/KernelSU-Next"; fi
          if [[ -z "$KSU_DIR" && -d "$COMMON/KernelSU" ]]; then KSU_DIR="$COMMON/KernelSU"; fi

          echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"
          echo "Detected KSU_DIR=$KSU_DIR"

      - name: Fix missing lz4armv8.S (if needed)
        run: |
          set -euo pipefail
          COMMON="${{ steps.paths.outputs.common_dir }}"

          # This file is referenced by some trees' Kbuild; missing it causes: "No rule to make target ..."
          TARGET="$COMMON/lib/lz4/lz4armv8/lz4armv8.S"
          if [[ -f "$TARGET" ]]; then
            echo "lz4armv8.S already present."
            exit 0
          fi

          echo "::notice::lz4armv8.S missing; pulling from WildKernels/kernel_patches…"
          rm -rf wk_kernel_patches
          git clone --depth 1 "https://github.com/WildKernels/kernel_patches" wk_kernel_patches

          SRC="wk_kernel_patches/kernels/OnePlus13/zram/lz4armv8.S"
          if [[ -f "$SRC" ]]; then
            mkdir -p "$(dirname "$TARGET")"
            cp -f "$SRC" "$TARGET"
            echo "✅ Installed $TARGET"
          else
            echo "::warning::Cannot find $SRC. Build may fail if your Kbuild requires lz4armv8.S."
          fi

      - name: Apply SUSFS patches (kernel + KernelSU) — guarded
        if: ${{ github.event.inputs.susfs == 'On' }}
        run: |
          set -euo pipefail
          KP="${{ steps.paths.outputs.kernel_platform }}"
          COMMON="${{ steps.paths.outputs.common_dir }}"
          ROOT="${{ github.event.inputs.root_solution }}"

          cd "$KP"
          test -d "$COMMON" || { echo "::error::Target dir not found: $COMMON"; exit 1; }

          apply_patch_dir() {
            local target_dir="$1"
            local patch_file="$2"
            local plevel="${3:-1}"

            if [[ ! -f "$patch_file" ]]; then
              echo "::error::Patch not found: $patch_file"
              return 2
            fi

            pushd "$target_dir" >/dev/null

            # Already applied?
            if patch -p"$plevel" --dry-run -R < "$patch_file" >/dev/null 2>&1; then
              echo "↪️ already applied: $(basename "$patch_file")"
              popd >/dev/null
              return 0
            fi

            echo "🧩 applying: $(basename "$patch_file")  (dir=$(basename "$target_dir"))"
            if patch -p"$plevel" --fuzz=0 < "$patch_file"; then
              echo "✅ applied (strict)"
            else
              echo "::warning::Strict apply failed; retrying with fuzz=3…"
              patch -p"$plevel" --fuzz=3 < "$patch_file"
              echo "✅ applied (fuzz=3)"
            fi

            popd >/dev/null
          }

          # Clone SUSFS patchset (known working URL used in your logs)
          SUSFS_REF="gki-android15-6.6"
          rm -rf susfs4ksu
          git clone --depth 1 --branch "$SUSFS_REF" "https://gitlab.com/simonpunk/susfs4ksu.git" susfs4ksu
          echo "✅ cloned susfs4ksu ($SUSFS_REF) shallow"

          # Kernel-side SUSFS patch
          KERNEL_PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_${SUSFS_REF}.patch"
          apply_patch_dir "$COMMON" "$KERNEL_PATCH" 1

          # Copy any extra files shipped by susfs4ksu (best-effort; safe if paths don't exist)
          rsync -a --ignore-missing-args susfs4ksu/fs/ "$COMMON/fs/" || true
          rsync -a --ignore-missing-args susfs4ksu/include/ "$COMMON/include/" || true

          # KernelSU-side enable patches: try to auto-discover patches that mention KSU_SUSFS
          KSU_DIR="${KSU_DIR:-}"
          if [[ -z "$KSU_DIR" || ! -d "$KSU_DIR" ]]; then
            echo "::warning::No KernelSU directory detected; SUSFS will be disabled."
            echo "SUSFS_EFFECTIVE=Off" >> "$GITHUB_ENV"
            exit 0
          fi

          mapfile -t CANDIDATES < <(grep -RIl "KSU_SUSFS" susfs4ksu | grep -E '\.patch$' || true)
          echo "Found ${#CANDIDATES[@]} candidate KernelSU patches."

          applied_any=0
          for p in "${CANDIDATES[@]}"; do
            # Only try patches that look like they touch KernelSU sources.
            if grep -qE 'kernel/(Kconfig|Makefile|allowlist\.c|apk_sign\.c|core_hook\.c|ksu\.c|ksud\.c|kernel_umount\.c|selinux\.c|sucompat\.c|supercalls\.c)' "$p"; then
              if apply_patch_dir "$KSU_DIR" "$p" 1; then
                applied_any=1
              fi
            fi
          done

          # Verify symbol exists; if not, auto-fallback for ksu-next to Wild_KSU (most compatible)
          if ! grep -R "KSU_SUSFS" -n "$KSU_DIR" >/dev/null 2>&1; then
            if [[ "$ROOT" == "ksu-next" ]]; then
              echo "::warning::KernelSU-Next still lacks KSU_SUSFS; switching to Wild_KSU automatically."
              rm -rf "$COMMON/KernelSU-Next"
              cd "$KP"
              curl -fsSL "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s wild
              KSU_DIR="$COMMON/KernelSU-Next"
              echo "KSU_DIR=$KSU_DIR" >> "$GITHUB_ENV"

              # Re-check
              if ! grep -R "KSU_SUSFS" -n "$KSU_DIR" >/dev/null 2>&1; then
                echo "::warning::Wild_KSU integration completed, but KSU_SUSFS still not detected. Disabling SUSFS to avoid CI failure."
                echo "SUSFS_EFFECTIVE=Off" >> "$GITHUB_ENV"
                exit 0
              fi
            else
              echo "::warning::KSU_SUSFS not detected after patch attempts. Disabling SUSFS to avoid CI failure."
              echo "SUSFS_EFFECTIVE=Off" >> "$GITHUB_ENV"
              exit 0
            fi
          fi

          echo "SUSFS_EFFECTIVE=On" >> "$GITHUB_ENV"
          echo "✅ SUSFS enabled and KernelSU exposes KSU_SUSFS"

      - name: Configure kernel (defconfig + toggles)
        run: |
          set -euo pipefail
          COMMON="${{ steps.paths.outputs.common_dir }}"
          OUT="${{ steps.paths.outputs.out_dir }}"
          ROOT="${{ github.event.inputs.root_solution }}"
          SUSFS_INPUT="${{ github.event.inputs.susfs }}"
          SUSFS_EFFECTIVE="${SUSFS_EFFECTIVE:-$SUSFS_INPUT}"
          KPM="${{ github.event.inputs.kpm }}"
          FORCE_LZ4="${{ github.event.inputs.force_lz4_zram }}"
          BUILD_TYPE="${{ github.event.inputs.build_type }}"

          cd "$COMMON"
          DEFCONFIG="arch/arm64/configs/gki_defconfig"

          # Apply toggles directly in gki_defconfig (safe; deterministic)
          set_cfg() {
            local key="$1"
            local val="$2"
            if grep -qE "^${key}=" "$DEFCONFIG"; then
              sed -i "s/^${key}=.*/${key}=${val}/" "$DEFCONFIG"
            else
              echo "${key}=${val}" >> "$DEFCONFIG"
            fi
          }
          unset_cfg() {
            local key="$1"
            sed -i "/^${key}=y$/d" "$DEFCONFIG"
            sed -i "/^${key}=m$/d" "$DEFCONFIG"
            if ! grep -qE "^# ${key} is not set$" "$DEFCONFIG"; then
              echo "# ${key} is not set" >> "$DEFCONFIG"
            fi
          }

          # Root toggles
          if [[ "$ROOT" == "none" ]]; then
            unset_cfg "CONFIG_KSU"
          else
            set_cfg "CONFIG_KSU" "y"
            # Common sane defaults
            set_cfg "CONFIG_KSU_NONE_HOOK" "y"
            set_cfg "CONFIG_KSU_MANUAL_SU" "y"
          fi

          # KPM (only enable if requested; if symbol doesn't exist, it won't break)
          if [[ "$KPM" == "On" ]]; then
            set_cfg "CONFIG_KPM" "y"
          else
            unset_cfg "CONFIG_KPM"
          fi

          # SUSFS toggle (effective)
          if [[ "$SUSFS_EFFECTIVE" == "On" ]]; then
            set_cfg "CONFIG_KSU_SUSFS" "y"
            set_cfg "CONFIG_KSU_SUSFS_SUS_PATH" "y"
            set_cfg "CONFIG_KSU_SUSFS_SUS_MOUNT" "y"
            set_cfg "CONFIG_KSU_SUSFS_SUS_KSTAT" "y"
            set_cfg "CONFIG_KSU_SUSFS_SPOOF_UNAME" "y"
            set_cfg "CONFIG_KSU_SUSFS_ENABLE_LOG" "y"
            set_cfg "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS" "y"
            set_cfg "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG" "y"
            set_cfg "CONFIG_KSU_SUSFS_OPEN_REDIRECT" "y"
            set_cfg "CONFIG_KSU_SUSFS_SUS_MAP" "y"
          else
            unset_cfg "CONFIG_KSU_SUSFS"
          fi

          # Force ZRAM LZ4 (best-effort; doesn't error if unsupported)
          if [[ "$FORCE_LZ4" == "On" ]]; then
            set_cfg "CONFIG_ZRAM" "y"
            set_cfg "CONFIG_ZRAM_DEF_COMP_LZ4" "y"
            unset_cfg "CONFIG_ZRAM_DEF_COMP_LZO"
            unset_cfg "CONFIG_ZRAM_DEF_COMP_LZ4HC"
          fi

          # Make output dir and generate .config
          mkdir -p "$OUT"
          make O="$OUT" ARCH=arm64 gki_defconfig
          make O="$OUT" ARCH=arm64 olddefconfig

          echo "---- Effective config (KSU/KPM/SUSFS) ----"
          grep -nE "CONFIG_KSU|CONFIG_KPM|CONFIG_ZRAM|CONFIG_KSU_SUSFS" "$OUT/.config" | head -n 80 || true

          # If the tree references lz4armv8.S but it still isn't present, disable ARMv8 accel config if set
          if [[ ! -f "$COMMON/lib/lz4/lz4armv8/lz4armv8.S" ]]; then
            if grep -q "^CONFIG_EROFS_FS_ZIP_LZ4_ARMV8=y" "$OUT/.config" 2>/dev/null; then
              echo "::warning::Disabling CONFIG_EROFS_FS_ZIP_LZ4_ARMV8 because lz4armv8.S is missing."
              sed -i 's/^CONFIG_EROFS_FS_ZIP_LZ4_ARMV8=y/# CONFIG_EROFS_FS_ZIP_LZ4_ARMV8 is not set/' "$OUT/.config"
              make O="$OUT" ARCH=arm64 olddefconfig
            fi
          fi

      - name: Build kernel
        run: |
          set -euo pipefail
          COMMON="${{ steps.paths.outputs.common_dir }}"
          OUT="${{ steps.paths.outputs.out_dir }}"

          cd "$COMMON"

          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          export CCACHE_COMPILERCHECK=content
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          ccache -M 8G || true

          echo "Building… (OUT=$OUT)"
          make O="$OUT" -j"$(nproc)" Image modules dtbs || make O="$OUT" -j"$(nproc)" Image modules || make O="$OUT" -j"$(nproc)" Image

          echo "Build outputs:"
          ls -la "$OUT/arch/arm64/boot" || true

      - name: Package artifacts
        run: |
          set -euo pipefail
          OUT="${{ steps.paths.outputs.out_dir }}"
          DIST="$GITHUB_WORKSPACE/dist"
          rm -rf "$DIST"
          mkdir -p "$DIST"

          # Kernel image
          for f in "$OUT/arch/arm64/boot/Image" "$OUT/arch/arm64/boot/Image.gz" "$OUT/arch/arm64/boot/Image.lz4"; do
            [[ -f "$f" ]] && cp -f "$f" "$DIST/"
          done

          # DTBs / DTBOs (best-effort)
          find "$OUT/arch/arm64/boot" -maxdepth 2 -type f \( -name "*.dtb" -o -name "*.dtbo" \) -exec cp -f {} "$DIST/" \; || true

          # Config + build info
          [[ -f "$OUT/.config" ]] && cp -f "$OUT/.config" "$DIST/config"
          echo "root_solution=${{ github.event.inputs.root_solution }}" > "$DIST/build_meta.txt"
          echo "susfs_effective=${SUSFS_EFFECTIVE:-${{ github.event.inputs.susfs }}}" >> "$DIST/build_meta.txt"
          echo "kpm=${{ github.event.inputs.kpm }}" >> "$DIST/build_meta.txt"
          echo "force_lz4_zram=${{ github.event.inputs.force_lz4_zram }}" >> "$DIST/build_meta.txt"

          (cd "$DIST" && zip -r9 "$GITHUB_WORKSPACE/op13_gki_build.zip" .)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: op13-gki-${{ github.sha }}-${{ github.event.inputs.root_solution }}-susfs-${{ github.event.inputs.susfs }}
          path: |
            op13_gki_build.zip
            dist/**
